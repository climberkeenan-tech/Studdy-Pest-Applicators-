hed to the container; labeling is the label plus all other product information referenced on it and given at purchase","The labeling is only the front panel; the label is everything else","The label is written by EPA; the labeling is written by the manufacturer"],"answer":1,"ref":"p. 32, introduction","why":"Labeling includes the label itself plus all other information referenced on the label and given when you buy the product.","src":"test"},{"id":"c03-s01-t2","kind":"mc","q":"Which of these is NOT given as an example of pesticide labeling?","choices":["A product-use manual","Brochures and leaflets","Safety Data Sheets","A sales receipt"],"answer":3,"ref":"p. 32, introduction","why":"The manual lists a product-use manual, brochures, leaflets, and SDSs.","style":"not","src":"test"},{"id":"c03-s01-t3","kind":"mc","q":"A manufacturer wants to change the wording on a label after the product and label are already registered. What must happen?","choices":["Nothing; registered labels can be changed freely","The state must approve the change","EPA must approve the change","The manufacturer must re-test the product on animals"],"answer":2,"ref":"p. 32, 'EPA Approval of Pesticide Labeling'","why":"After registration, EPA must approve any change to the labeling.","style":"scenario","src":"test"},{"id":"c03-s01-t4","kind":"tf","q":"A pesticide may be sold in the United States while EPA is still reviewing its registration application, as long as the label is approved.","answer":false,"ref":"p. 32, 'EPA Approval of Pesticide Labeling'","why":"Only after EPA has reviewed the labeling and registered the product can it be sold.","src":"test"},{"id":"c03-s01-t5","kind":"short","q":"By law, pesticide users must comply with what?","answer":"All instructions and use directions found on the pesticide product label","accept":["the label directions","everything on the label","label instructions"],"keys":[["label","labeling","labels"],["instructions","directions","everything","all"]],"ref":"p. 32, introduction","why":"By law, users must comply with all instructions and use directions on the label.","src":"test"}]},{"id":"c03-s02","chapter":"Chapter 3 · Pesticide Labeling","title":"Why the label matters and how its data is gathered","pages":[32,33],"body":[{"h":"The label"},{"p":["The label is an important tool for the safe and effective use of pesticides.","Pesticide manufacturers are required by law to put certain information on the label.","Failure to heed and follow label directives can result in a pesticide accident and **legal action against the user**.","**Labels are legal documents** providing directions on how to mix, apply, store, and dispose of pesticide products."]},{"h":"Background of the label"},{"p":["To appreciate the value of the information that appears on a pesticide label, one must consider the time, effort, and money spent to gather it.","This research-based information takes **at least six years** to obtain and costs a chemical company **millions of dollars**.","Manufacturers continually make and screen new compounds for possible pesticide use.","For every new pesticide that successfully meets the standards, **thousands of other compounds** are screened and discarded for various reasons.","Once a promising pesticide is identified, its potential use must be evaluated to determine if it is a worthwhile candidate for the label registration process.","Many carefully controlled tests are conducted to determine the **effectiveness and safety** of each pesticide under a wide range of environmental conditions."]},{"h":"Toxicity and toxicological tests"},{"p":["How poisonous or dangerous is a pesticide to humans, wildlife, and other organisms?","Does the chemical cause any long-term, or **chronic**, effects?","Does it cause any skin, or **dermal**, reactions?","To determine these and other health effects, researchers administer the pesticide at various dosages to test animals, usually **rats and mice**.","Newer methods now coming into use rely on **mathematical models** able to predict the same toxic endpoints without involving animal testing."]}],"figures":[],"questions":[{"id":"c03-s02-t1","kind":"mc","q":"According to the manual, how long does it take to gather the research-based information that appears on a pesticide label?","choices":["At least one year","At least three years","At least six years","At least ten years"],"answer":2,"ref":"p. 32, 'Background of the Label'","why":"The information takes at least six years and costs millions of dollars.","src":"test"},{"id":"c03-s02-t2","kind":"mc","q":"Which test animals are usually used to find the health effects of a pesticide?","choices":["Dogs and cats","Rats and mice","Rabbits and birds","Fish and frogs"],"answer":1,"ref":"p. 32, 'Toxicity and Toxicological Tests'","why":"Researchers usually use rats and mice.","src":"test"},{"id":"c03-s02-t3","kind":"mc","q":"Which of these is NOT something labels give legal directions for, according to 'The Label'?","choices":["How to mix the product","How to apply the product","How to store and dispose of the product","What price to sell the product for"],"answer":3,"ref":"p. 32, 'The Label'","why":"Labels give directions on how to mix, apply, store, and dispose of pesticide products.","style":"not","src":"test"},{"id":"c03-s02-t4","kind":"mc","q":"An applicator ignores the label directions and causes an accident. Based on 'The Label' section, what can result?","choices":["Nothing, because labels are only advice","A pesticide accident and legal action against the user","Only a warning from the manufacturer","Legal action against the manufacturer only"],"answer":1,"ref":"p. 32, 'The Label'","why":"Failure to follow label directives can result in an accident and legal action against the user.","style":"scenario","src":"test"},{"id":"c03-s02-t5","kind":"tf","q":"Newer testing methods use mathematical models to predict toxic endpoints without animal testing.","answer":true,"ref":"pp. 32 to 33, 'Toxicity and Toxicological Tests'","why":"Newer methods rely on mathematical models that predict the same toxic endpoints without animals.","src":"test"}]},{"id":"c03-s03","chapter":"Chapter 3 · Pesticide Labeling","title":"Efficacy, residue tests, and preharvest intervals","pages":[33,33],"body":[{"h":"Efficacy or performance tests"},{"p":["The company must have **performance data** to show that the pesticide controls a particular pest or group of pests on one or more hosts or sites, including plants, animals, soil, and structures.","Data must show that the pesticide, when used for its intended purpose and according to directions, is a useful product.","Information is also needed on crop varieties, soil types, application methods and rates, and a number of required applications.","Tests must show that the pests are controlled, crops or animals are not injured, yield and/or quality has been improved, and the pesticide provides a **measurable benefit**."]},{"h":"Degradation, mobility, and residue tests"},{"p":["A series of studies shows how long it takes for the compound to break down, or **degrade**, into harmless materials under various conditions.","In addition, it is important to know if the pesticide moves through the soil into **groundwater** or if it moves into the plant from treated soil.","**Residue studies** are conducted for each application method on every treated crop or animal.","These tests determine how much, if any, of the pesticide residue or its breakdown products remain on or in the crop or animal at the time of harvest or slaughter.","Pesticide residues on or in food or feed commodities must not exceed the **residue tolerances** established by EPA when the crop or animal, including meat, milk, and eggs, is ready for market or livestock feed."]},{"p":["Although specific tolerances are **not included on product labels**, **preharvest intervals** (days to harvest) and/or **preslaughter intervals** (days to slaughter) are often listed on labels of agricultural pesticides.","These are the **minimum number of days** between the last application of a pesticide and the harvest of crops or the slaughter of livestock.","Intervals are set by EPA to allow time for the pesticide to break down on crops or in livestock.","Adhering to these intervals prevents unacceptable residues on food, feed, or animal products.","If residues exceed the EPA tolerance or are found on commodities that do not have a specified tolerance, the commodity may be **condemned and destroyed**."]},{"h":"Effects on wildlife and the environment"},{"fig":"p34-fish"},{"p":["The pesticide manufacturer must determine the effects of field applications of the pesticide on wildlife and the natural environment.","Any potentially harmful effects that are recognized during these studies must be included in the **environmental impact statement** submitted to EPA."]}],"figures":[{"id":"p34-fish","title":"Potential adverse effects of pesticides to wildlife and the environment must be included in environmental impact statements submitted to EPA.","page":"p. 34","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAIwAXsDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAQIDAAQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAQV1dDSsqOUSSOFiHgKZMU+r+a+tQba3bA2IQbY2wDpzjo3Gh3bz8ejvNJ6A4FPR3nKekPOJ3JyuUQkmnSU5E7uRYNDvk8Rudrq3R5vSdkZzLLzyOiMxRrz49T3vkGxPqJfNaT6GfhmPZTzSdXPORdJgUITGZr3vb+N6T6zfMHV+l3zJPpd80D6RPnJH0PL4iSfWv8otfVP8d6h7viy8wXq87ZdoYdNFxjAYZHAiOhNmwzK3PKCk4pgpVMpUIwpcEAxI4pTlGHrCxfnaYFwKJUkm2NlkVWJHwYDLjuLLvRDucxsDnZNTbNCq6JKibnKmbirWYwXGebFWm4A4OefSlTHXMk1XFFWOZqIFWAJVUnK6EywCGIhKHokNvVWjhkwFSshdmHlbmkliMRiMOA5PMRHZhTiHKw06SGpzsWGNIaEivXjlXqU5h0TIL1k4TVAbAwaZ7k7x3qbFyOONKsxckR4lcxmTSNhSEoCNiBwqj6ZH0gVQYa0vSqu9NNOed7kYdsDhpap5i95jm5fW885OT2PIhUIMrE9pIT3epOOZacCMr1OXegTz7OuJLOo9IPDKgp8uDS d and then sold","It can only be sold as livestock feed"],"answer":1,"ref":"p. 33, 'Degradation, Mobility, and Residue Tests'","why":"If residues exceed the EPA tolerance, the commodity may be condemned and destroyed.","style":"scenario","src":"test"},{"id":"c03-s03-t3","kind":"tf","q":"Specific residue tolerances are printed on product labels.","answer":false,"ref":"p. 33, 'Degradation, Mobility, and Residue Tests'","why":"Tolerances are not included on labels; preharvest and preslaughter intervals often are.","src":"test"},{"id":"c03-s03-t4","kind":"mc","q":"Which of these is NOT something efficacy tests must show?","choices":["The pests are controlled","Crops or animals are not injured","The pesticide provides a measurable benefit","The pesticide is the cheapest product available"],"answer":3,"ref":"p. 33, 'Efficacy or Performance Tests'","why":"Tests must show pest control, no injury, improved yield or quality, and a measurable benefit.","style":"not","src":"test"},{"id":"c03-s03-t5","kind":"mc","q":"Where must the manufacturer report potentially harmful effects on wildlife found in its studies?","choices":["On the front panel of the label","In the environmental impact statement submitted to EPA","In the Safety Data Sheet only","In a letter to the state"],"answer":1,"ref":"p. 33, 'Effects on Wildlife and the Environment'","why":"Harmful effects must be included in the environmental impact statement submitted to EPA.","src":"test"}]},{"id":"c03-s04","chapter":"Chapter 3 · Pesticide Labeling","title":"Registrations: Section 3, special local need, and Section 18","pages":[33,34],"body":[{"h":"Types of pesticide registration"},{"p":["As mentioned in Chapter 2, the **Federal Insecticide, Fungicide, and Rodenticide Act (FIFRA)** has several types of registrations and exemptions that enable pesticides to be used in the United States.","You are responsible for applying only pesticides registered or exempted from registration by EPA and your respective state, territory, or tribe."]},{"h":"Section 3"},{"p":["**Section 3 registrations** are the most common.","Look for the official **EPA registration number** required on the label, except for products that EPA classifies as minimum-risk pesticides, to be sure you are buying an approved and registered product."]},{"h":"Special local need, Section 24(c)"},{"p":["**Special local need (SLN) registrations** are categorized as **Section 24(c)**.","They allow states to **expand or limit** the uses of certain registered pesticides within their jurisdictions.","For instance, some SLNs allow uses of pesticides for crops or sites not listed on the label.","Others limit the uses of certain pesticides to address local concerns.","Manufacturers must provide **supplemental labeling** for each SLN registration.","You must have SLN labeling **in your possession** to use a pesticide for that purpose.","The registration numbers of special local need labeling include the SLN number and code for the state issuing the registration.","These registrations are legal only in the region, state, or local area specified in the labeling.","It is **illegal** to apply a pesticide that has an SLN registration from other states or regions."]},{"h":"Emergency exemptions, Section 18"},{"p":["**Emergency exemptions** under **Section 18** address pest problems for which no pesticides are currently registered.","A Section 18 exemption allows the sale and use of a registered pesticide product for a specific nonregistered purpose during a **specified period**.","EPA can issue an emergency exemption at the request of the state, tribe, or territory regulatory agency for a public health concern or other pest crisis.","There must be **no other feasible pesticide alternative** to the exemption.","Regulations impose strict controls and require **recordkeeping** for all emergency uses.","The state, tribe, or territory pesticide regulatory agency prescribes application rates, safety precautions, and other vital application information.","Applicators must have a **copy of the Section 18 approval on hand** to legally use the product."]}],"figures":[],"questions":[{"id":"c03-s04-t1","kind":"mc","q":"Which type of registration lets a state expand or limit the uses of certain registered pesticides within the state?","choices":["Section 3","Section 18","Section 24(c), special local need","Section 25(b)"],"answer":2,"ref":"p. 33, 'Types of Pesticide Registration'","why":"SLN registrations, Section 24(c), let states expand or limit uses.","src":"test"},{"id":"c03-s04-t2","kind":"mc","q":"An applicator in Pennsylvania finds an SLN label issued by Ohio that allows the exact use they need. Can they use it in Pennsylvania?","choices":["Yes, SLN labels are valid in every state","Yes, if they carry the Ohio labeling with them","No, it is illegal to apply a pesticide under an SLN registration from another state","Only with EPA's verbal approval"],"answer":2,"ref":"p. 34, 'Types of Pesticide Registration'","why":"SLN registrations are legal only in the area specified, and using another state's SLN is illegal.","style":"scenario","src":"test"},{"id":"c03-s04-t3","kind":"mc","q":"Which of these is NOT a requirement for a Section 18 emergency exemption?","choices":["No pesticides are currently registered for the pest problem","There is no other feasible pesticide alternative","The applicator has a copy of the Section 18 approval on hand","The product must be a minimum-risk pesticide"],"answer":3,"ref":"p. 34, 'Types of Pesticide Registration'","why":"Section 18 allows a registered product for a nonregistered purpose; it has nothing to do with minimum-risk status.","style":"not","src":"test"},{"id":"c03-s04-t4","kind":"mc","q":"Who requests a Section 18 emergency exemption from EPA?","choices":["The applicator","The manufacturer","The state, tribe, or territory regulatory agency","The county extension office"],"answer":2,"ref":"p. 34, 'Types of Pesticide Registration'","why":"EPA issues it at the request of the state, tribe, or territory regulatory agency.","src":"test"},{"id":"c03-s04-t5","kind":"tf","q":"Section 3 registrations are the most common type of pesticide registration.","answer":true,"ref":"p. 33, 'Types of Pesticide Registration'","why":"The manual says Section 3 registrations are the most common.","src":"test"}]},{"id":"c03-s05","chapter":"Chapter 3 · Pesticide Labeling","title":"Minimum-risk pesticides, Section 25(b)","pages":[34,34],"body":[{"h":"Minimum-risk pesticides, Section 25(b)"},{"p":["**Minimum-risk pesticides** under **Section 25(b)** are **exempt from registration** provided the products satisfy certain conditions.","Products identified as exempt pose a **minimal risk** to humans and the environment, do not require EPA label approval, and do not undergo review by EPA.","Furthermore, these products have no label requirements for an EPA registration number, an EPA establishment number, any signal word, or any personal protective equipment (PPE)."]},{"p":["To qualify for a Section 25(b) exemption from registration, each of the active ingredients in any such product must be on a list of specified **minimal-risk active ingredients**.","Additionally, any inert ingredients in these products must also be listed as **minimal-risk inert ingredients**."]},{"p":["Minimum-risk pesticides still have certain label requirements imposed by EPA.","Product labels **may not claim to control microorganisms** that pose a threat to human health.","For example, the label may list a pest such as a mosquito or tick, but it must not claim to control any microorganisms that the pest transmits to humans."]},{"p":["Many states do **not permit the sale** of a Section 25(b) product unless it is first **registered in the state**."]}],"figures":[],"questions":[{"id":"c03-s05-r1","src":"review","kind":"mc","q":"Which group of pesticides is exempt from registration because it poses little or no risk to humans and the environment?","choices":["Restricted use.","Minimum risk.","Special local need."],"answer":1,"ref":"p. 34, 'Types of Pesticide Registration'; p. 47, Review question 1","why":"Section 25(b) minimum-risk pesticides are exempt from registration."},{"id":"c03-s05-t1","kind":"mc","q":"A Section 25(b) minimum-risk product label leaves out several items other labels have. Which items is it NOT required to show?","choices":["An EPA registration number only","A signal word only","PPE requirements only","All three: an EPA registration number, a signal word, and PPE requirements"],"answer":3,"ref":"p. 34, 'Types of Pesticide Registration'","why":"Minimum-risk labels need no registration number, establishment number, signal word, or PPE.","style":"not","fixed":true,"src":"test"},{"id":"c03-s05-t2","kind":"mc","q":"A minimum-risk mosquito repellent label lists mosquitoes as a pest. Which claim is it NOT allowed to make?","choices":["It repels mosquitoes","It controls a disease virus that mosquitoes carry to humans","It is for outdoor use","It contains minimal-risk active ingredients"],"answer":1,"ref":"p. 34, 'Types of Pesticide Registration'","why":"Minimum-risk labels may not claim to control microorganisms the pest transmits to humans.","style":"scenario","src":"test"},{"id":"c03-s05-t3","kind":"tf","q":"For a product to qualify under Section 25(b), only its active ingredients need to be on the minimal-risk list; inert ingredients do not matter.","answer":false,"ref":"p. 34, 'Types of Pesticide Registration'","why":"Inert ingredients must also be listed as minimal-risk inert ingredients.","src":"test"},{"id":"c03-s05-t4","kind":"tf","q":"Many states do not permit the sale of a Section 25(b) product unless it is first registered in the state.","answer":true,"ref":"p. 34, 'Types of Pesticide Registration'","why":"The manual states this directly.","src":"test"}]},{"id":"c03-s06","chapter":"Chapter 3 · Pesticide Labeling","title":"When to read the pesticide label","pages":[34,35],"body":[{"h":"When to read the pesticide label"},{"p":["It is your responsibility as the user to read and understand all labeling before **buying, using, storing, or disposing** of a pesticide.","Read the label at each of these times."]},{"h":"Before buying the pesticide"},{"p":["Make sure the product is registered for your intended use.","Confirm that there are no restrictions or other conditions that prohibit using this pesticide at the application site.","Find out what PPE and special application equipment you will need."]},{"h":"Before mixing and applying the pesticide"},{"p":["Determine what precautions to take to prevent exposure to people and nontarget organisms.","Learn what first aid and medical treatments are necessary should an accident occur.","Be certain the product's use is suitable for **weather conditions** at the time of application.","Also, be sure it controls the appropriate **life stage** of your pest."]},{"h":"When storing pesticides"},{"p":["Find out how to store the pesticide properly.","Understand any special precautions to prevent **fire hazards**."]},{"h":"Before disposing of unused pesticides and empty containers"},{"p":["From the label, learn how to prevent environmental contamination and hazards to people.","Check with your state pesticide regulatory agency for any disposal restrictions and requirements.","Find out whether your state has pesticide container recycling and waste disposal programs."]},{"fig":"p35-reader"}],"figures":[{"id":"p35-reader","title":"Always read the label prior to purchasing and using the pesticide.","page":"p. 35","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAFMAV4DASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAQIAAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAcR2zuwjeDDNpMI6EOfOgDEOixzZ0Yc4dGVzp0ZHOnRlc4dKRzh04cw9GHOHShzZ0Yc6dGHOnRhzZ0Yc6dGHNnShyegeRHp5k19bkgmIymUYpCESLmrN ng, understand any special precautions to prevent fire hazards.","src":"test"},{"id":"c03-s06-t5","kind":"short","q":"Name the four times the manual says to read the label.","answer":"Before buying, before mixing and applying, when storing, and before disposing","accept":[],"keys":[["buying","buy","purchasing","purchase"],["mixing","mix","applying","apply","using","use"],["storing","store","storage"],["disposing","dispose","disposal"]],"ref":"pp. 34 to 35, 'When to Read the Pesticide Label'","why":"Read it before buying, before mixing and applying, when storing, and before disposal.","src":"test"}]},{"id":"c03-s07","chapter":"Chapter 3 · Pesticide Labeling","title":"Trade name, ingredients, chemical name, and common name","pages":[35,36],"body":[{"h":"Parts of the label"},{"p":["Some labels are easy to understand; others are complicated.","Each label component is discussed in this section.","Figure 3.1, later in this chapter, is an example of a pesticide label."]},{"h":"Trade, brand, or product name"},{"p":["Every manufacturer has **trade names** for its products.","Most companies register each trade name as a trademark.","Various manufacturers use **different trade names**, even when the products contain the **same active ingredient**.","The **brand name** often indicates the type of formulation and the percentage of active ingredient present.","For example, **Tempo 20WP** is a brand name.","Tempo is the registered trade name, and the formulation is a **wettable powder** containing **20% active ingredient**.","The trade or brand name shows up plainly on the **front panel** of the label and is the one used in advertisements."]},{"h":"Ingredient statement"},{"p":["Every pesticide label must list the active ingredients and the percentage of each active ingredient found in that particular product.","The **active ingredient (a.i.)** is the chemical or chemicals in a pesticide product responsible for its pesticidal activity.","It is the material in a pesticide formulation that actually controls a pest or performs a desired function, for example a repellent or growth regulator.","**Inert ingredients** are usually not named, but the label must show what **percentage** of the total contents they make up.","The ingredient statement must list the official chemical names and/or common names of the active ingredients.","Look at this Tempo insecticide label excerpt as an example."]},{"box":"Tempo 20WP","list":["Active ingredient: β-Cyfluthrin, cyano(4-fluoro-3-phenoxyphenyl)methyl 3-(2,2-dichloroethenyl)-2,2-dimethylcyclopropanecarboxylate, 20%.","Inert ingredients, 80%."]},{"p":["The **chemical name** is the complex name that identifies the chemical components and structure of the pesticide's active ingredient.","This name must be listed in the ingredient statement on the label.","For example, the chemical name of Tempo is the long name in the box above.","Because chemical names of active ingredients are usually complex, many are given a shorter **common name**.","Only those common names **officially accepted by EPA** may be used in the ingredient statement on the pesticide label.","The official common name is usually followed by the chemical name in the list of active ingredients.","The common name for Tempo is **cyfluthrin**."]},{"p":["By purchasing pesticides according to the common or chemical names, you are certain of getting the right active ingredient, no matter what the brand name or formulation.","Remember, **not all pesticides with the same a.i. are labeled for the same uses or rates**."]}],"figures":[],"questions":[{"id":"c03-s07-r2","src":"review","kind":"mc","q":"The active ingredient in Tempo 20WP is listed as β-Cyfluthrin, cyano(4-fluoro-3-phenoxyphenyl)methyl 3-(2,2-dichloroethenyl)-2,2-dimethylcyclopropanecarboxylate. What does the term \"Cyfluthrin\" represent?","choices":["The brand name.","The chemical name.","The common name."],"answer":2,"ref":"p. 35, 'Ingredient Statement'; p. 47, Review question 2","why":"The common name for Tempo is cyfluthrin."},{"id":"c03-s07-r3","src":"review","kind":"mc","q":"Which statement about pesticide label names and ingredients is true?","choices":["Both the active ingredients and inert ingredients must be listed by chemical name.","Various manufacturers use different trade names, even though the products may contain the same active ingredient.","Common names are those officially accepted by the manufacturer."],"answer":1,"ref":"p. 35, 'Trade, Brand, or Product Name'; p. 47, Review question 3","why":"Inerts are usually not named, and common names must be accepted by EPA, not the manufacturer."},{"id":"c03-s07-t1","kind":"mc","q":"In the brand name Tempo 20WP, what does 20WP tell you?","choices":["20 pounds per gallon of wettable product","A wettable powder with 20% active ingredient","20% inert ingredients in a water-based product","The 20th product made by the manufacturer"],"answer":1,"ref":"p. 35, 'Trade, Brand, or Product Name'","why":"The formulation is a wettable powder containing 20% active ingredient.","src":"test"},{"id":"c03-s07-t2","kind":"mc","q":"Two products from different companies have different brand names but the same active ingredient. Which statement is correct?","choices":["They are labeled for exactly the same uses and rates","They may not be labeled for the same uses or rates, so read each label","One of them must be illegal","They must have the same signal word"],"answer":1,"ref":"p. 36, 'Ingredient Statement'","why":"Not all pesticides with the same a.i. are labeled for the same uses or rates.","style":"scenario","src":"test"},{"id":"c03-s07-t3","kind":"mc","q":"Which of these is NOT true about inert ingredients on a label?","choices":["They are usually not named","The label must show their percentage of the total contents","In Tempo 20WP they make up 80%","Each one must be listed by its chemical name"],"answer":3,"ref":"p. 35, 'Ingredient Statement'","why":"Inert ingredients are usually not named; only their percentage must be shown.","style":"not","src":"test"},{"id":"c03-s07-t4","kind":"short","q":"What is the active ingredient?","answer":"The chemical or chemicals in a pesticide product responsible for its pesticidal activity","accept":["the chemical that actually controls the pest","the part that controls the pest"],"keys":[["chemical","chemicals","material","part","ingredient"],["pesticidal activity","controls","control","kills","works","function"]],"ref":"p. 35, 'Ingredient Statement'","why":"The a.i. is the chemical responsible for pesticidal activity, the material that actually controls the pest.","src":"test"}]},{"id":"c03-s08","chapter":"Chapter 3 · Pesticide Labeling","title":"Restricted use, type of pesticide, and other front-panel items","pages":[36,36],"body":[{"h":"Use classification statement"},{"p":["Currently, EPA classifies every pesticide product as either **restricted use** or **unclassified/general use**.","Every product that is federally classified as a restricted-use pesticide must have the following statement at the **top of the front panel** of the pesticide label."]},{"box":"Restricted-use pesticide","p":["For retail sale to and use only by **certified applicators or persons under their direct supervision** and only for those uses covered by the certified applicator's certification."]},{"p":["Pesticides labeled for restricted use demand special attention because there is reason to believe they could harm humans, livestock, wildlife, or the environment **even when used according to label directions**.","The restricted-use statement indicates the **specific hazard** of that pesticide.","For example, a product may be very toxic to humans and wildlife or pose a groundwater hazard.","Persons using these products must be certified applicators or have received special training and have demonstrated a certain level of competence to ensure that they can handle these pesticides properly."]},{"p":["Unclassified pesticides are often called **general-use pesticides**.","Typically, they have a lower toxicity with less potential to harm humans and the environment than restricted-use pesticides.","Anyone can purchase and use them without special permits or restrictions."]},{"h":"Type of pesticide"},{"p":["The type of pesticide is usually listed on the front panel of the pesticide label.","This short statement indicates in general terms what the product controls.","Examples include the following."]},{"list":["Insecticide for control of certain insects on fruits, nuts, and ornamentals.","Herbicide for control of woody brush and broadleaf weeds.","Insecticide for broad-spectrum control of crawling, flying, and wood-infesting insect pests on indoor and outdoor surfaces, as well as pests of trees, landscape ornamentals, and residential and commercial lawns."]},{"h":"Net contents"},{"p":["The pesticide label must show how much product is in the container.","This is expressed as **pounds or ounces for dry formulations** or as **gallons, quarts, or pints for liquids**.","Liquid formulations may also list the **pounds of active ingredient per gallon** of product.","Many labels now also include metric units, such as grams, kilograms, or liters, as part of the contents information."]},{"h":"Name and address of manufacturer"},{"p":["The law requires that the manufacturer or formulator of a pesticide product put its name and address on the label so you know who made or sold the product."]},{"h":"Emergency telephone number"},{"p":["Many pesticide manufacturers list an emergency telephone number on their product labels.","These companies will assist anyone using their products in an emergency, for example a poisoning, spill, or fire."]}],"figures":[],"questions":[{"id":"c03-s08-t1","kind":"mc","q":"Where must the restricted-use statement appear on the label?","choices":["At the top of the front panel","In the directions for use","On the back panel near storage and disposal","Anywhere on the container"],"answer":0,"ref":"p. 36, 'Use Classification Statement'","why":"It must be at the top of the front panel.","src":"test"},{"id":"c03-s08-t2","kind":"mc","q":"A landscaping crew member who is not certified wants to apply a restricted-use pesticide. Under the restricted-use statement, when may they apply it?","choices":["Never, under any circumstances","Only under the direct supervision of a certified applicator, and only for uses covered by that applicator's certification","Any time, if they read the label first","Only if the product has a CAUTION signal word"],"answer":1,"ref":"p. 36, 'Use Classification Statement'","why":"RUPs are for certified applicators or persons under their direct supervision, for uses their certification covers.","style":"scenario","src":"test"},{"id":"c03-s08-t3","kind":"tf","q":"Restricted-use pesticides can harm humans, livestock, wildlife, or the environment even when used according to label directions.","answer":true,"ref":"p. 36, 'Use Classification Statement'","why":"That reason is why they are restricted.","src":"test"},{"id":"c03-s08-t4","kind":"mc","q":"Which of these is NOT a way net contents are expressed on a label?","choices":["Pounds or ounces for dry formulations","Gallons, quarts, or pints for liquids","Pounds of active ingredient per gallon for liquids","Number of acres the container will treat"],"answer":3,"ref":"p. 36, 'Net Contents'","why":"Net contents are given by weight or volume, and liquids may list pounds of a.i. per gallon.","style":"not","src":"test"},{"id":"c03-s08-t5","kind":"mc","q":"Who can purchase and use general-use pesticides?","choices":["Only certified applicators","Only persons under direct supervision","Anyone, without special permits or restrictions","Only licensed dealers"],"answer":2,"ref":"p. 36, 'Use Classification Statement'","why":"Anyone can purchase and use general-use pesticides without special permits.","src":"test"}]},{"id":"c03-s09","chapter":"Chapter 3 · Pesticide Labeling","title":"EPA registration and establishment numbers","pages":[36,37],"body":[{"h":"Registration numbers"},{"p":["**EPA registration numbers**, required on all pesticide labels **except Section 25(b) products**, indicate that the pesticide product has been registered and the label approved by EPA.","Most EPA registration numbers include just **two sets of numbers**, which identify the **manufacturer** and the **specific product**.","Occasionally a **third set** of numbers appears, which gives a **distributor's** identification number on labels of distributor products."]},{"box":"Examples of EPA registration numbers","list":["EPA Reg. No. 3120-280-1492. 3120 identifies the manufacturer, 280 identifies the specific product, and 1492 identifies the distributor.","EPA SLN No. PA-990005. SLN indicates special local need. PA means that the product is registered for use in Pennsylvania. 99 means it was registered in 1999. 0005 means it was the fifth special local need product registered that year in Pennsylvania."]},{"h":"Establishment number"},{"p":["An **EPA establishment number**, for example EPA Est. No. 5840-AZ-1, must be on the pesticide label to identify the **facility that produced the product**.","This is necessary in case a problem arises or the product is found to be **adulterated**, or contaminated, in any way.","The **AZ** in the example indicates the product was manufactured in a specific facility in **Arizona**."]}],"figures":[],"questions":[{"id":"c03-s09-t1","kind":"mc","q":"On EPA Reg. No. 3120-280-1492, what does 1492 identify?","choices":["The manufacturer","The specific product","The distributor","The year of registration"],"answer":2,"ref":"p. 37, box 'Examples of EPA Registration Numbers'","why":"The third set of numbers identifies the distributor.","src":"test"},{"id":"c03-s09-t2","kind":"mc","q":"On EPA SLN No. PA-990005, what does 99 mean?","choices":["It was the 99th SLN product in Pennsylvania","It was registered in 1999","It is valid for 99 days","It is the manufacturer's code"],"answer":1,"ref":"p. 37, box 'Examples of EPA Registration Numbers'","why":"99 means it was registered in 1999; 0005 means fifth SLN that year.","src":"test"},{"id":"c03-s09-t3","kind":"mc","q":"A product is found to be contaminated. Which number on the label tells investigators which facility made it?","choices":["The EPA registration number","The EPA establishment number","The SLN number","The emergency telephone number"],"answer":1,"ref":"p. 37, 'Establishment Number'","why":"The establishment number identifies the facility that produced the product.","style":"scenario","src":"test"},{"id":"c03-s09-t4","kind":"mc","q":"Which type of product does NOT need an EPA registration number on its label?","choices":["Restricted-use pesticides","General-use pesticides","Section 25(b) minimum-risk products","Special local need products"],"answer":2,"ref":"p. 36, 'Registration Numbers'","why":"Registration numbers are required on all labels except Section 25(b) products.","style":"not","src":"test"},{"id":"c03-s09-t5","kind":"tf","q":"Most EPA registration numbers have two sets of numbers, identifying the manufacturer and the specific product.","answer":true,"ref":"p. 36, 'Registration Numbers'","why":"A third set appears only occasionally, for distributor products.","src":"test"}]},{"id":"c03-s10","chapter":"Chapter 3 · Pesticide Labeling","title":"Signal words and symbols","pages":[37,37],"body":[{"h":"Signal words and symbols"},{"p":["Most pesticide labels must include a **signal word**.","This designation indicates the **relative acute toxicity** of the product to humans and animals.","The signal word must appear in **large letters on the front panel** of the pesticide label along with the statement **Keep Out of Reach of Children**.","These are the signal words on pesticide labels."]},{"h":"DANGER, POISON, with skull and crossbones"},{"p":["These words and symbol must appear on all products that are **highly toxic by any route of entry** into the body.","The word **poison must appear in red**.","These products can cause death in very low doses.","**PELIGRO**, the Spanish word for DANGER, must also appear on the label."]},{"h":"DANGER"},{"p":["This word signals that the product is **highly toxic by at least one route of entry**.","Products with this signal word can cause **severe eye damage or skin irritation**."]},{"h":"WARNING"},{"p":["This word signals that the product is **moderately toxic** either orally, dermally, or through inhalation, or causes moderate eye and skin irritation.","**AVISO**, the Spanish word for WARNING, must also appear on the label."]},{"h":"CAUTION"},{"p":["This word signals that the product is **slightly toxic** either orally, dermally, or through inhalation, or causes slight eye and skin irritation.","Although **very low toxicity pesticides are not required to display a signal word**, many manufacturers still include a CAUTION designation on the label of these products."]},{"fig":"p37-signals"},{"p":["A detailed discussion on signal words and toxicity appears in Chapter 5, Pesticide Hazards and First Aid."]}],"figures":[{"id":"p37-signals","title":"Signal words indicate the relative acute toxicity of the product to humans and animals.","page":"p. 37","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEYAYQDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAG29L0pEAmQRYQZIgEyCLFky5nWfnsseph5GuPX1+TUerXlQ9W/JB7CzxjPbHi7q9eeY1V3Tm6tXQRWkyISIg2nUmmAAThI8oThdSEV6Qmc81liIKwKxcrLrYuDTidTn1yiuGpmM2swm+Vc46TOYdVnIfWkcc7UjhHfZwD0Ejz0/Q2HF361V2rjV13Xy+luzkOkwoAG0zzVOnNdMCvTkVzzMOXHQ5OfdiY7tPLOjPntdz5txsMFFdSGZmhZ850Izyl8sF0XKmdWWZpijG4srnWZ5zkSqsDBdqZkr6Tkr63Nx16F8rp7smjRtBwsXQ590wK9LCPmeGNujj9/JDW6U3EUlxVNoRFspNgJoiYlG6vBZGxZI1tjmlGqzNpoApMBxYAAwABlNG0k2X+e6VvQE+jkczq8m6kIrPjDyY0+h856TdBmiUkIbKy hoices":["Indicates the product's relative acute toxicity to humans and animals.","Informs the user what type of PPE to wear.","Tells the user what type of first aid treatment to seek in case of exposure."],"answer":0,"ref":"p. 37, 'Signal Words and Symbols'; p. 47, Review question 4","why":"The signal word indicates relative acute toxicity to humans and animals."},{"id":"c03-s10-t1","kind":"mc","q":"Which signal word goes with a product that is highly toxic by any route of entry and can cause death in very low doses?","choices":["CAUTION","WARNING","DANGER alone","DANGER, POISON, with skull and crossbones"],"answer":3,"ref":"p. 37, 'Signal Words and Symbols'","why":"DANGER, POISON, and the skull and crossbones are for products highly toxic by any route.","src":"test"},{"id":"c03-s10-t2","kind":"mc","q":"A label says DANGER with no skull and crossbones. What does that tell you?","choices":["The product is slightly toxic","The product is highly toxic by at least one route of entry, and may cause severe eye damage or skin irritation","The product is moderately toxic","The product is exempt from registration"],"answer":1,"ref":"p. 37, 'Signal Words and Symbols'","why":"DANGER alone means highly toxic by at least one route, often severe eye or skin effects.","style":"scenario","src":"test"},{"id":"c03-s10-t3","kind":"mc","q":"Which of these is NOT a correct pairing of a Spanish word and English signal word?","choices":["PELIGRO and DANGER","AVISO and WARNING","PELIGRO and CAUTION","Both PELIGRO and AVISO are required to appear on the label with their signal words"],"answer":2,"ref":"p. 37, 'Signal Words and Symbols'","why":"PELIGRO means DANGER; AVISO means WARNING.","style":"not","fixed":true,"src":"test"},{"id":"c03-s10-t4","kind":"tf","q":"Very low toxicity pesticides must display the CAUTION signal word.","answer":false,"ref":"p. 37, 'Signal Words and Symbols'","why":"They are not required to show a signal word, though many manufacturers still use CAUTION.","src":"test"},{"id":"c03-s10-t5","kind":"mc","q":"Which statement must appear with the signal word on the front panel?","choices":["Keep Out of Reach of Children","Restricted-Use Pesticide","Read the Safety Data Sheet","Do not reuse this container"],"answer":0,"ref":"p. 37, 'Signal Words and Symbols'","why":"The signal word appears in large letters with Keep Out of Reach of Children.","src":"test"}]},{"id":"c03-s11","chapter":"Chapter 3 · Pesticide Labeling","title":"Precautionary statements and routes of entry","pages":[37,38],"body":[{"h":"Precautionary statements"},{"p":["All pesticide labels contain statements to help you decide what precautions to take to protect yourself, other people, or animals from pesticide exposure.","Sometimes these statements are listed under the heading **Hazards to Humans and Domestic Animals**.","Precautionary statements may be found in **several sections** of the label."]},{"box":"Precautionary statements, from a sample label","p":["Hazard to humans and domestic animals. WARNING, AVISO.","This product may cause skin sensitization reactions in certain individuals. Causes eye irritation. Do not get in eyes, on skin, or on clothing. Harmful if swallowed, inhaled, or absorbed through skin. Avoid breathing spray mist.","Statement of practical treatment.","If in eyes: Flush with plenty of water. Get medical attention if irritation persists.","If on skin: Wash with plenty of soap and water. Get medical attention if irritation persists.","If swallowed: Do not induce vomiting. Promptly drink a large quantity of milk, egg whites, or gelatin solution. If these are not available, drink large quantities of water. Never give anything by mouth to an unconscious person. Call a physician or Poison Control Center immediately.","If inhaled: Move victim to fresh air.","Be familiar with first aid procedures before using the pesticide."]},{"h":"Routes of entry statements"},{"p":["**Routes of entry statements** indicate which route or routes of entry into the human body are particularly hazardous.","Because many pesticide products are hazardous by more than one route, you should study these statements carefully.","A DANGER signal word followed by **May be fatal if swallowed or inhaled** gives you a far different warning than DANGER followed by **Corrosive, causes eye damage and severe skin burns**.","Routes of entry statements are **not uniform** on all labels; there are many variations.","More than one precaution may appear on a label."]},{"box":"Typical DANGER label statements","list":["Fatal if swallowed.","Poisonous if inhaled.","Extremely hazardous by skin contact, rapidly absorbed through skin.","Corrosive, causes eye damage and severe skin burns."]},{"box":"Typical WARNING label statements","list":["Harmful or fatal if swallowed.","Harmful or fatal if absorbed through the skin.","Harmful or fatal if inhaled.","Causes skin and eye irritation."]},{"box":"Typical CAUTION label statements","list":["Harmful if swallowed.","May be harmful if inhaled.","May irritate eyes, nose, throat, and skin."]}],"figures":[],"questions":[{"id":"c03-s11-r5","src":"review","kind":"mc","q":"The routes of entry statement, \"Extremely hazardous by skin contact, rapidly absorbed through the skin,\" on a label would most likely carry which signal word?","choices":["DANGER.","WARNING.","CAUTION."],"answer":0,"ref":"p. 38, 'Routes of Entry Statements'; p. 47, Review question 5","why":"It is listed among typical DANGER label statements."},{"id":"c03-s11-t1","kind":"mc","q":"What do routes of entry statements tell you?","choices":["Which routes into the human body are particularly hazardous","Which route the pesticide takes through the soil","How to apply the pesticide","How long to wait before reentering a field"],"answer":0,"ref":"p. 37, 'Routes of Entry Statements'","why":"They indicate which routes of entry into the body are particularly hazardous.","src":"test"},{"id":"c03-s11-t2","kind":"mc","q":"A label reads, \"Harmful or fatal if absorbed through the skin.\" Which signal word is this statement typical of?","choices":["DANGER","WARNING","CAUTION","No signal word"],"answer":1,"ref":"p. 38, 'Routes of Entry Statements'","why":"Harmful or fatal statements are typical of WARNING labels.","style":"scenario","src":"test"},{"id":"c03-s11-t3","kind":"mc","q":"Which of these is NOT a typical CAUTION label statement?","choices":["Harmful if swallowed.","May be harmful if inhaled.","May irritate eyes, nose, throat, and skin.","Poisonous if inhaled."],"answer":3,"ref":"p. 38, 'Routes of Entry Statements'","why":"Poisonous if inhaled is a typical DANGER statement.","style":"not","src":"test"},{"id":"c03-s11-t4","kind":"tf","q":"Routes of entry statements are worded the same way on all labels.","answer":false,"ref":"p. 38, 'Routes of Entry Statements'","why":"They are not uniform; there are many variations.","src":"test"}]},{"id":"c03-s12","chapter":"Chapter 3 · Pesticide Labeling","title":"Specific action, PPE, and other precautionary statements","pages":[38,39],"body":[{"h":"Specific action statements"},{"p":["**Specific action statements** usually follow the route of entry statements.","Specific action statements give the **precautions and PPE** necessary to help reduce exposure to the pesticide.","These statements are directly related to the toxicity of the pesticide product, meaning the signal word, and the routes of entry.","DANGER labels typically contain statements such as the following."]},{"list":["Do not breathe vapors or spray mist.","Do not get on skin or clothing.","Do not get in eyes."]},{"p":["Typical WARNING labels often **combine** specific action statements from DANGER and CAUTION labels.","CAUTION labels generally contain specific action statements that are **less alarming** than those on the DANGER label, indicating that the toxicity hazard is not as great.","Examples include the following."]},{"list":["Avoid contact with skin or clothing.","Avoid breathing dust, vapors, or spray mists.","Avoid getting in eyes."]},{"h":"Protective clothing and equipment statements"},{"fig":"p38-ppe"},{"p":["Pesticide labels vary in the type of PPE information they contain.","While some labels carry no such statement at all, other pesticide labels fully describe appropriate personal protective equipment.","Follow all label statements on PPE or, **if absent**, consider the signal word, routes of entry statements, and specific action statements.","Read the basic guidelines described in Chapters 5 and 6."]},{"h":"Other precautionary statements"},{"p":["Labels often list other precautions that should always be followed when handling the product.","These commonsense, self-explanatory statements include the following."]},{"list":["Do not contaminate food or feed.","Remove and wash contaminated clothing before reuse.","Wash thoroughly after handling and before eating or smoking.","Wear clean clothes daily.","Not for use or storage in and around a house.","Do not allow children or domestic animals into the treated area."]}],"figures":[{"id":"p38-ppe","title":"Follow label instructions on the use of protective clothing and equipment.","page":"p. 38","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAFeAakDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwUEBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAAB9OBCxdrDjtDzqWZEohZWzv0MBHsbvE7dbI0oMGSZCu+srGCGAgBNESQRhaipXRSiPS45I9zM5aMTOjpBmmkGYaaM16UTOl3hwK3Ik94BrSwd7Ak7PH+w8gQJIQImIJamV6Q0lJ2xJgACTZWrYEE0DQIYCAFKJFSBMBgEVKIgBMAQAJgAcWNrZmc+8A3qODuYuZ0eS9X5QiAAMRKJ0em8x66pzjJQEAIGmEZIjGyJWAAAJgk0JoEwEwFGSEAIaAAAQMDN5ejmzn2wGtc3B0wko8n6jzJEQPo57xUzrL/ZeS9fRJCgIAAaATQRlErAAGIYCkitTiIEMEMQOLQgABiGxAzIpnGZ9kNXWZfyd0mV5v0vmiKkgCJOE4mn6fA36kwVAAmgAEAEZQIAA0wAGgIpoimhpoaaBNkSSE2EWgbUzAcLJPYpq3G0szUjH836XzKCAEA00ek2M3StYAgBAAgAAK7KhAA0DABCECBNATCsnAGmA on Statements'","why":"They relate to the product's toxicity, meaning the signal word, and the routes of entry.","src":"test"},{"id":"c03-s12-t2","kind":"mc","q":"A label has no PPE statement at all. According to the manual, what should you do?","choices":["Wear no PPE, since none is required","Consider the signal word, routes of entry statements, and specific action statements to choose PPE","Call EPA for a PPE ruling","Use the PPE from any other product's label"],"answer":1,"ref":"p. 38, 'Protective Clothing and Equipment Statements'","why":"If PPE statements are absent, consider the signal word, routes of entry, and specific action statements.","style":"scenario","src":"test"},{"id":"c03-s12-t3","kind":"mc","q":"Which of these is NOT listed as an other precautionary statement?","choices":["Do not contaminate food or feed.","Wear clean clothes daily.","Wash thoroughly after handling and before eating or smoking.","Apply only at night."],"answer":3,"ref":"p. 39, 'Other Precautionary Statements'","why":"Apply only at night is not on the list.","style":"not","src":"test"},{"id":"c03-s12-t4","kind":"tf","q":"Avoid breathing dust, vapors, or spray mists is a typical specific action statement on a CAUTION label.","answer":true,"ref":"p. 38, 'Specific Action Statements'","why":"CAUTION labels use less alarming wording such as avoid breathing.","src":"test"}]},{"id":"c03-s13","chapter":"Chapter 3 · Pesticide Labeling","title":"First aid, environmental hazards, and special toxicity statements","pages":[39,39],"body":[{"h":"First aid statements"},{"p":["**First aid statements**, formerly known as the **Statement of Practical Treatment**, list emergency treatments recommended in case of poisoning or accidental exposure.","Typical statements include the following."]},{"list":["In case of contact with skin, wash immediately with plenty of soap and clean water.","In case of contact with eyes, flush with water for **15 minutes** and get medical attention.","In case of inhalation exposure, remove victim from contaminated area and give artificial respiration, if necessary.","If swallowed, induce vomiting."]},{"p":["**All DANGER labels** and **some** WARNING and CAUTION labels contain a **note to physicians** describing the appropriate medical procedures and antidotes for poisoning emergencies.","Always have the label readily available in case of an emergency."]},{"h":"Environmental hazards"},{"p":["Pesticides can be harmful to the environment.","Look for special warning statements on the label concerning environmental hazards."]},{"h":"Special toxicity statements"},{"p":["The label will say if a particular pesticide is especially hazardous to wildlife.","Examples include the following."]},{"list":["This product is highly toxic to bees.","This product is extremely toxic to fish and aquatic invertebrates.","This product is toxic to birds and other wildlife."]},{"p":["**Special toxicity statements** alert you to the special hazards of a product.","They will help you choose the safest product for a particular job and remind you to take extra precautions."]}],"figures":[],"questions":[{"id":"c03-s13-t1","kind":"mc","q":"What was the old name for first aid statements?","choices":["Note to physician","Statement of Practical Treatment","Hazards to Humans and Domestic Animals","Specific action statement"],"answer":1,"ref":"p. 39, 'First Aid Statements'","why":"First aid statements were formerly known as the Statement of Practical Treatment.","src":"test"},{"id":"c03-s13-t2","kind":"mc","q":"Which labels always contain a note to physicians?","choices":["All CAUTION labels","All WARNING labels","All DANGER labels","Only restricted-use labels"],"answer":2,"ref":"p. 39, 'First Aid Statements'","why":"All DANGER labels and some WARNING and CAUTION labels have a note to physicians.","src":"test"},{"id":"c03-s13-t3","kind":"mc","q":"A coworker gets pesticide in their eyes. Per the typical first aid statement, how long should you flush with water?","choices":["1 minute","5 minutes","15 minutes","1 hour"],"answer":2,"ref":"p. 39, 'First Aid Statements'","why":"Flush with water for 15 minutes and get medical attention.","style":"scenario","src":"test"},{"id":"c03-s13-t4","kind":"mc","q":"Which of these is NOT given as an example of a special toxicity statement?","choices":["This product is highly toxic to bees.","This product is extremely toxic to fish and aquatic invertebrates.","This product is toxic to birds and other wildlife.","This product is corrosive to metal."],"answer":3,"ref":"p. 39, 'Special Toxicity Statements'","why":"Corrosive to metal would be a physical or chemical hazard, not a wildlife toxicity statement.","style":"not","src":"test"},{"id":"c03-s13-t5","kind":"tf","q":"Special toxicity statements can help you choose the safest product for a particular job.","answer":true,"ref":"p. 39, 'Special Toxicity Statements'","why":"They alert you to special hazards and help you choose the safest product.","src":"test"}]},{"id":"c03-s14","chapter":"Chapter 3 · Pesticide Labeling","title":"General environmental statements","pages":[39,40],"body":[{"h":"General environmental statements"},{"p":["**General environmental statements** are reminders to follow certain commonsense procedures to avoid contaminating the environment.","The **absence** of any or all of these statements does **not** mean that you do not need to take adequate precautions.","Sometimes these statements follow a specific toxicity statement and provide practical steps to avoid harming wildlife.","Examples of general environmental statements include the following."]},{"list":["Do not apply when runoff is likely to occur.","Do not apply when weather conditions favor drift from treated areas.","Do not contaminate water by improperly disposing of rinse water and other pesticide wastes.","Do not apply when bees are likely to be in the area.","Do not apply directly to water or to areas where surface water is present or to intertidal areas below the mean high water mark.","The use of this chemical in areas where soils are permeable, particularly where the water table is shallow, may result in groundwater contamination."]},{"box":"Example of an environmental statement: Environmental hazards","p":["This product is toxic to aquatic invertebrates.","Drift and runoff may be hazardous to aquatic organisms in neighboring areas.","Under some conditions, this chemical may also have a high potential for runoff into surface water for several weeks or months after application.","Do not cultivate within **10 feet** of aquatic areas so as to allow growth of vegetative filter strip.","Drift from applications of this pesticide is likely to result in damage to sensitive aquatic invertebrates in water bodies adjacent to treatment area.","For terrestrial uses, do not apply directly to water or to areas where surface water is present or to intertidal areas below the mean high-water mark, except under forest canopy when aerially applied to control forest pests.","Do not contaminate water when disposing of equipment washwaters and rinsate.","Do not apply when weather conditions favor drift or runoff from areas treated.","This pesticide demonstrates the properties and characteristics associated with chemicals detected in groundwater.","The use of this chemical in areas where soils are permeable, particularly where the water table is shallow, may result in groundwater contamination."]}],"figures":[],"questions":[{"id":"c03-s14-t1","kind":"tf","q":"If a label has no general environmental statements, you do not need to take environmental precautions.","answer":false,"ref":"p. 39, 'General Environmental Statements'","why":"The absence of these statements does not mean you can skip adequate precautions.","src":"test"},{"id":"c03-s14-t2","kind":"mc","q":"In the example environmental statement, how close to aquatic areas may you NOT cultivate, to allow a vegetative filter strip to grow?","choices":["Within 5 feet","Within 10 feet","Within 25 feet","Within 66 feet"],"answer":1,"ref":"p. 39, box 'Example of an Environmental Statement'","why":"Do not cultivate within 10 feet of aquatic areas.","src":"test"},{"id":"c03-s14-t3","kind":"mc","q":"The label says use in permeable soils with a shallow water table may cause groundwater contamination. You are treating a site with sandy soil and a high water table. What is the label warning you about?","choices":["Drift onto bees","Groundwater contamination","Phytotoxicity to the crop","Fire hazard"],"answer":1,"ref":"p. 40, 'General Environmental Statements'","why":"Permeable soils and a shallow water table raise the risk of groundwater contamination.","style":"scenario","src":"test"},{"id":"c03-s14-t4","kind":"mc","q":"Which of these is NOT an example of a general environmental statement?","choices":["Do not apply when runoff is likely to occur.","Do not apply when bees are likely to be in the area.","Do not apply when weather conditions favor drift from treated areas.","Store at temperatures above 32°F."],"answer":3,"ref":"p. 40, 'General Environmental Statements'; p. 41, 'Storage and Disposal'","why":"Storage temperature is a storage and disposal statement.","style":"not","src":"test"}]},{"id":"c03-s15","chapter":"Chapter 3 · Pesticide Labeling","title":"Physical or chemical hazards and agricultural use requirements","pages":[40,40],"body":[{"h":"Physical or chemical hazards"},{"p":["The **Physical or Chemical Hazards** section of the label describes possible **fire, explosion, or chemical hazards** of the product.","Examples include the following."]},{"list":["**Flammable**: Do not use, pour, spill, or store near heat or open flame. Do not cut or weld container.","**Corrosive**: Store only in a corrosion-resistant tank."]},{"h":"Agricultural use requirements"},{"p":["The **Agricultural Use Requirements** section is found **only** on the labels of agricultural products covered by the EPA **Worker Protection Standard (WPS)**.","The agricultural use statements link the pesticide product to the WPS regulations found in **40 CFR Part 170**.","Therefore, the user must follow the labeling as well as the WPS requirements.","These requirements are intended to protect agricultural workers and handlers on farms and in forests, nurseries, and greenhouses through training, decontamination, notification, emergency assistance, personal protective equipment, and **restricted-entry intervals (REIs)**."]},{"box":"Example of agricultural use requirements","p":["Use this product only in accordance with its labeling and with the Worker Protection Standard, 40 CFR part 170.","This standard contains requirements for the protection of agricultural workers on farms, forests, nurseries, and greenhouses, and handlers of agricultural pesticides.","It contains requirements for training, decontamination, notification, and emergency assistance.","It also contains specific instructions and exceptions pertaining to the statements on this label about personal protective equipment (PPE) and restricted-entry interval.","The requirements in this box only apply to uses of this product that are covered by the Worker Protection Standard.","Do not enter or allow worker entry into treated areas during the restricted-entry interval (REI) of **12 hours**.","Exception: if the product is applied by **drenching**, the Worker Protection Standard, under certain circumstances, allows workers to enter the treated area if there will be no contact with anything that has been treated.","PPE required for early entry to treated areas that is permitted under the Worker Protection Standard and that involves contact with anything that has been treated, such as plants, soil, or water, includes the following."],"list":["Coveralls.","Waterproof gloves.","Shoes plus socks."]}],"figures":[],"questions":[{"id":"c03-s15-t1","kind":"mc","q":"Where is the Agricultural Use Requirements section found?","choices":["On every pesticide label","Only on labels of agricultural products covered by the Worker Protection Standard","Only on restricted-use labels","Only on the Safety Data Sheet"],"answer":1,"ref":"p. 40, 'Agricultural Use Requirements'","why":"It is found only on labels of agricultural products covered by the WPS.","src":"test"},{"id":"c03-s15-t2","kind":"mc","q":"Which federal regulation contains the Worker Protection Standard?","choices":["40 CFR Part 170","Section 24(c)","Section 25(b)","40 CFR Part 18"],"answer":0,"ref":"p. 40, 'Agricultural Use Requirements'","why":"Agricultural use statements link the product to WPS regulations in 40 CFR Part 170.","src":"test"},{"id":"c03-s15-t3","kind":"mc","q":"A label's Physical or Chemical Hazards section says the product is flammable. Which action does that statement prohibit?","choices":["Storing it in a locked cabinet","Cutting or welding the container","Diluting it with water","Applying it on a windy day"],"answer":1,"ref":"p. 40, 'Physical or Chemical Hazards'","why":"Flammable: do not use near heat or flame, and do not cut or weld the container.","style":"scenario","src":"test"},{"id":"c03-s15-t4","kind":"mc","q":"Which of these is NOT one of the ways WPS requirements protect agricultural workers and handlers?","choices":["Training","Decontamination","Restricted-entry intervals","Crop insurance"],"answer":3,"ref":"p. 40, 'Agricultural Use Requirements'","why":"WPS protects through training, decontamination, notification, emergency assistance, PPE, and REIs.","style":"not","src":"test"},{"id":"c03-s15-t5","kind":"tf","q":"In the example box, the PPE for permitted early entry with contact with treated surfaces is coveralls, waterproof gloves, and shoes plus socks.","answer":true,"ref":"p. 40, box 'Example of Agricultural Use Requirements'","why":"That is the list in the example box.","src":"test"}]},{"id":"c03-s16","chapter":"Chapter 3 · Pesticide Labeling","title":"Restricted-entry intervals and nonagricultural use","pages":[40,41],"body":[{"h":"Restricted-entry intervals"},{"p":["Many pesticide labels covered by the WPS include a statement about a **restricted-entry interval**.","The REI specifies how much time must pass between the pesticide application and the reentry of **unprotected workers** into a treated area.","The REI statement can be found under the heading **Agricultural Use Requirements**.","If no REI or other restricted-entry statement appears on the label, then all persons should wait at least until **sprays have dried or dusts have settled** before reentering a treated area.","If there are multiple REIs on a label, look in the **Directions for Use** section for each crop.","If two or more pesticides are mixed together, you are required to follow the **most restrictive, or longer, REI**."]},{"fig":"p41-wpssign"},{"h":"Nonagricultural use requirements"},{"p":["The **Nonagricultural Use Requirements** section applies to pesticide uses that are **not within the scope of the WPS**.","Examples include the application of pesticides to lawns, golf courses, ornamental plantings, structures **except greenhouses**, aquatic areas, and rights-of-way.","Specific reentry times are **not generally listed** for these uses.","However, the label often cautions people and pets not to enter treated areas until the spray has dried or the dust has settled."]}],"figures":[{"id":"p41-wpssign","title":"Under the federal Worker Protection Standard (WPS), workers must be notified about areas treated with pesticides so they may avoid inadvertent exposures.","page":"p. 41","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAD3AVcDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAIDAQQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAHyJX3cjzWiuUmyVw1Y5REHlp0iasp2mmWi8WFLZrTAtzbJ1TV7ZS6ZSZ2cLnv+h8nbV+pPN9HrdA0ADTANzTxhjV4WF82eaFpSZWdRmR1ilZog5FHla1UopDGVHvzUiyhbDLoSdGkZl21o3w52rGSvX5zH
