<title>Pest Applicator Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 720px reading column. Sticky status bar on top, a fixed reading dock under study cards.
   Verdicts are full-width bands styled like the signal-word panel on a pesticide label. */
:root{
  --paper:#f4f6ef; --card:#ffffff; --ink:#17221b; --muted:#55645a; --line:#d6ddd1;
  --field:#1d5c40; --field-2:#e3eee6; --on-field:#ffffff;
  --hi:#ffdc33; --hi-soft:#fff3b0; --hi-ink:#17221b;
  --ok:#16703d; --ok-bg:#e0f1e5; --bad:#b42318; --bad-bg:#fce6e2; --warn:#8a5800; --warn-bg:#fbefd2;
  --shadow:0 1px 0 rgba(23,34,27,.05),0 10px 24px -16px rgba(23,34,27,.35);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1411; --card:#151e19; --ink:#e5ebe6; --muted:#9bada1; --line:#28352d;
  --field:#6cc195; --field-2:#1a2b21; --on-field:#0c1410;
  --hi:#ffdc33; --hi-soft:#3b3510; --hi-ink:#16140a;
  --ok:#6ad197; --ok-bg:#132e1e; --bad:#ff8c80; --bad-bg:#3a1613; --warn:#f2b64a; --warn-bg:#33270d;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1411; --card:#151e19; --ink:#e5ebe6; --muted:#9bada1; --line:#28352d;
  --field:#6cc195; --field-2:#1a2b21; --on-field:#0c1410;
  --hi:#ffdc33; --hi-soft:#3b3510; --hi-ink:#16140a;
  --ok:#6ad197; --ok-bg:#132e1e; --bad:#ff8c80; --bad-bg:#3a1613; --warn:#f2b64a; --warn-bg:#33270d;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;line-height:.9;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:19px;text-transform:uppercase}
.brand small{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--field)}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--paper)}
.chip svg{width:15px;height:15px;flex:none}
.chip.hot{border-color:var(--hi);background:var(--hi-soft)}
.chip.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.bar-prog{height:4px;background:var(--line)}
.bar-prog i{display:block;height:100%;background:var(--field);transition:width .5s ease}

main{padding-block:20px 120px}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- type */
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--field)}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:800;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px;text-decoration:none}
.btn:hover{border-color:var(--field)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--field);border-color:var(--field);color:var(--on-field)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:60px;font-size:20px;padding:12px 22px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 200px}
.linkish{background:none;border:0;padding:0;color:var(--field);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- home */
.mission{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mission-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px}
.countdown{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.8;color:var(--field);font-variant-numeric:tabular-nums}
.countdown small{display:block;font-size:15px;letter-spacing:.14em;color:var(--muted);margin-top:8px}
.mission-copy{display:flex;flex-direction:column;gap:6px;min-width:0}
.mission-copy h1{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.mission-cta{padding:0 18px 18px;display:flex;flex-direction:column;gap:8px}
.mission-cta .btn{width:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--field);border-radius:99px;transition:width .5s ease}
.meter.yellow i{background:var(--hi)}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--hi);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dots i.today{outline:2px solid var(--field);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.secgroup{display:flex;flex-direction:column;gap:6px}
.secgroup h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.secrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.secrow:hover{border-color:var(--field)}
.secrow .t{font-weight:700;min-width:0}
.secrow .m{font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.pill.pass{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.new{background:var(--paper);color:var(--muted);border-color:var(--line)}
.pill.next{background:var(--hi);color:var(--hi-ink)}
.pill.weak{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.review{background:var(--field-2);color:var(--field);border-color:var(--field)}
.pill.retry{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.weaklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.weaklist li{border-left:4px solid var(--warn);padding:4px 10px;background:var(--paper);border-radius:0 8px 8px 0;font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;color:var(--muted)}

/* ---------- study card (styled like a label panel) */
.label{background:var(--card);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.label-band{background:var(--field);color:var(--on-field);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px}
.label-head{padding:16px 16px 4px;display:flex;flex-direction:column;gap:6px}
.label-head h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.label-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.voicebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-block:1px solid var(--line);margin-top:10px;font-size:14px;background:var(--paper)}
.voicebar label{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.voicebar select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.voicenote{flex-basis:100%;color:var(--muted)}
#reading{padding:16px;font-size:19px;line-height:1.7;display:flex;flex-direction:column;gap:14px}
#reading .rh{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:6px}
#reading ul,#reading ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
#reading ol li::marker{font-family:var(--f-display);font-weight:800;color:var(--field)}
.mbox{background:var(--field-2);border:2px solid var(--field);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.mbox h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--field);line-height:1.25}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery .fig{margin:0}
.gallery .fig figcaption{font-size:15px;line-height:1.45;padding:8px 10px}
.fig-art img{border-radius:6px}
@media (max-width:560px){.fig-art svg{min-width:520px}}
.sent{border-radius:4px;transition:background-color .15s;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:color-mix(in srgb,var(--hi-soft) 55%,transparent)}
.sent.on{background:var(--hi-soft)}
.w{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.on{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 2px var(--hi)}
.term{font-weight:700}
.fig{margin:6px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.fig-art{padding:12px;overflow-x:auto;background:var(--card)}
.fig-art svg,.fig-art img{display:block;width:100%;max-width:100%;height:auto}
.fig figcaption{padding:10px 12px;font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.fig-ref{font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.f-ink{fill:var(--ink)} .f-muted{fill:var(--muted)} .f-on{fill:var(--on-field)}
.f-card{fill:var(--card);stroke:var(--ink);stroke-width:2}
.f-field{fill:var(--field)} .f-hi{fill:var(--hi)} .f-line{fill:var(--line)}
.f-ok{fill:var(--ok)} .f-bad{fill:var(--bad)}
.f-arrow{stroke:var(--ink)} .s-ink{stroke:var(--ink)} .s-field{stroke:var(--field)} .s-muted{stroke:var(--muted)}
.terms{margin:0 16px 16px;border-top:2px solid var(--ink);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.terms h3{font-family:var(--f-display);font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.terms dl{margin:0;display:grid;gap:8px}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
.dock-in{max-width:728px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .spacer{flex:1}
.dock .btn{min-height:50px}
.speaking-dot{width:10px;height:10px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 0 var(--hi);animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}

/* ---------- quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--hi);transition:width .3s ease}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.qtext{font-size:22px;line-height:1.35;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;width:100%;min-height:54px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px}
.choice:hover:not([disabled]){border-color:var(--field)}
.choice .k{font-family:var(--f-mono);font-weight:600;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card)}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.right .k{background:var(--ok);color:var(--card);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice.dim{opacity:.5}
.choice[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .choice{grid-template-columns:1fr;justify-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.short{display:flex;gap:8px;flex-wrap:wrap}
.short input{flex:1 1 220px;min-width:0;min-height:54px;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:19px;background:var(--paper)}
.short input:focus{border-color:var(--field);outline:none}
.typed{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:18px}
.typed.right{border-color:var(--ok);background:var(--ok-bg)}
.typed.wrong{border-color:var(--bad);background:var(--bad-bg)}
.band{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:26px;padding:8px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.band.ok{background:var(--ok);color:var(--card)}
.band.bad{background:var(--bad);color:var(--card)}
.band.wait{background:var(--line);color:var(--ink)}
.band .xp{font-family:var(--f-mono);font-size:16px;letter-spacing:0;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px}
.fb{display:flex;flex-direction:column;gap:8px;font-size:17px}
.fb .ans{font-weight:700}
.fb .src{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.combo{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.combo svg{width:20px;height:20px}
.combo.on{color:var(--warn)}
.hint{font-size:13px;color:var(--muted)}

/* ---------- results */
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.stamp{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;letter-spacing:.08em;text-transform:uppercase;border:5px solid currentColor;border-radius:8px;padding:6px 16px 2px;transform:rotate(-5deg);animation:stamp .5s cubic-bezier(.2,1.5,.4,1)}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
@keyframes stamp{0%{transform:rotate(-5deg) scale(1.8);opacity:0}100%{transform:rotate(-5deg) scale(1);opacity:1}}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.misslist{display:flex;flex-direction:column;gap:10px;width:100%;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.misslist .src{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
@media (min-width:640px){.sumgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sumlist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;max-width:min(92vw,520px);text-align:center;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .countdown{font-size:58px}
  .mission-copy h1{font-size:24px}
  .label-head h1{font-size:28px}
  .qtext{font-size:20px}
  #reading{font-size:18px}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <div class="wrap bar-in">
    <button class="brand" data-act="home" aria-label="Home">Pest Applicator<small>Study</small></button>
    <div class="chips" id="chips"></div>
  </div>
  <div class="bar-prog" aria-hidden="true"><i id="barprog" style="width:0%"></i></div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script id="content" type="application/json">{"manual":{"title":"Pennsylvania Pesticide Applicator Certification Core Manual","state":"Pennsylvania","category":"Core","totalPages":null,"deadline":"2027-01-11","edition":"Second Edition, 2014","publisher":"Penn State Extension, Pesticide Education Program"},"sections":[{"id":"c01-s01","chapter":"Chapter 1 · Pest Management","title":"Chapter goals and early pest disasters","pages":[1,2],"body":[{"box":"Learning objectives","p":["After studying this chapter, you should be able to do the following."],"list":["Define **pest**.","State the four main groups of pests and give an example of each.","Discuss the importance of pest identification in pest control.","List six general pest management methods.","Define **integrated pest management (IPM)**.","List five benefits of using IPM.","Discuss how using one or more control options can improve pest control.","Describe how selectivity and persistence affect chemical controls.","Explain how pest population levels trigger control procedures.","Distinguish between prevention and suppression when developing pest management goals.","Give several reasons why pesticide applications may fail.","Explain the importance of a pesticide's mode of action in managing pesticide resistance.","List two tactics that will minimize the development of pesticide resistance."]},{"fig":"p1-cockroach"},{"h":"Pest problems throughout history"},{"p":["Civilization has been combating insects and other pests throughout history.","Perhaps the most infamous human catastrophe was the **Black Plague** of Europe, when millions of people in the 14th century died from a mysterious scourge.","Centuries later, it was determined that the cause was a **bacterial disease spread by rat fleas**.","When rats, the normal host animals, were unavailable as a food source, the fleas sought other warm-blooded hosts, including humans.","Although the plague is still present in parts of the world today, controlling rats, other rodents, and fleas can greatly reduce disease incidence."]},{"p":["The destruction of Ireland's potato crop by a fungal disease in the 19th century directly affected the population of the United States.","**Late blight** essentially eliminated potatoes, the staple food crop of Ireland.","Potatoes not destroyed in the field rotted in storage during the winter.","Thousands of Irish starved in the resulting famine, and more than a million migrated to the United States.","Late blight continues to be a major problem of potatoes.","Today it is managed through the use of **resistant cultivars, proper sanitation practices, and fungicides**."]}],"figures":[{"id":"p1-cockroach","title":"Pest: Brownbanded cockroach.","page":"p. 1","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGyAVIDASIAAhEBAxEB/8QAGgABAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAAB7mDNsQzuAzxmJsYUykhkgsgtxpYAAAAACykWAAEABWIzmcJMhhchhM8SXMa2cMbRiyGOQAAAAAAAAAAQAhUHP1+T6pklJEAMmIqDLGCwM4ACwAAAAAAAEolElgBhz9/jHsuHqM3F1mYIUksAIsKAAAAQoEoEKgAAqACKDn2Hz3DYzq+k+e6T6vH5ey/UZfN9a+1ODoN4oBZQUjDIsolQsCggAAKgAAA8Lj+p+TTnywwTLs0+meTN2k11jXd3eHnH0nR8n0r9Zj4frS9TGVmDm6eXqEoiiVCwAACUAAAA4PC9mSeH6Xob083yfofHt3edloTBFZTKE26thv6fM3R7PoeHsl+h4eD1l1cWmp0+r5Gg928/TbACFAIKABcSgijmS5ghjp6NR4vD9Dy6nI9PzTgTZWeVRzTPA29fBuPX6PG2S+tOXtPS5+hb8/2el456mfi+pHQxyoCUAAECygDnRmFgsp4urdjXHy92mzHdrwJghcsciUM89OZs7/L2R9N1fN+qvoYXK3l833NRy9HLyR7jj6aylACUQpCgHNKzABTxsd/DWWr1uFObHZDTju7K8rLq0CN5zTbrMsQ29XDtj2vU+Y7V91q22uLtHjZep5507PJ6T0MuKnZr56THtphkAGia+DM9LHx8a9LRzYmWnr9JM9O9L4Gj2fLsnZ5nUdGjrzXxp28dmzn3w0XPWXZryNm3RY9H2Pm+pfonL1WpYassqVBYFiFBAeF0bujM4b205d2ykILp4T0/P5NNa9HTbM+ryNh6XH17JfIx381nfyY9pw3ZiS402XWO72fnOqX6RxdqhQBjkAAAc9jERaWZGPB2eKZ3arRp9DpPH7fSkeBye55tmnv4dldXF0YxzXfz10NPXHBj3clY5a8jLPCnZ6/z2+X6h5vorefPw69H0JQ "style":"not","q":"Which of these is NOT listed as a way late blight of potatoes is managed today?","choices":["Resistant cultivars","Proper sanitation practices","Fungicides","Crop rotation"],"answer":3,"ref":"p. 2, 'Pest Problems Throughout History'","why":"The manual lists resistant cultivars, proper sanitation practices, and fungicides."},{"id":"c01-s01-t3","src":"test","kind":"tf","q":"Ireland's potato famine was caused by an insect pest.","answer":false,"ref":"p. 2, 'Pest Problems Throughout History'","why":"It was late blight, a fungal disease."},{"id":"c01-s01-t4","src":"test","kind":"mc","style":"scenario","q":"A health department wants fewer plague cases in a region where the plague is still present. What does the manual say can greatly reduce disease incidence?","choices":["Controlling rats, other rodents, and fleas","Draining standing water","Planting resistant cultivars","Spraying fungicides"],"answer":0,"ref":"p. 2, 'Pest Problems Throughout History'","why":"Controlling rats, other rodents, and fleas can greatly reduce disease incidence."},{"id":"c01-s01-t5","src":"test","kind":"short","q":"Plague fleas turned to humans when their normal host animals were unavailable. What were those normal host animals?","answer":"rats","accept":["rat","the rats"],"ref":"pp. 1–2, 'Pest Problems Throughout History'","why":"Rats were the normal hosts. Without them, the fleas sought other warm-blooded hosts, including humans."}]},{"id":"c01-s02","chapter":"Chapter 1 · Pest Management","title":"Malaria, beetles, and what a pest is","pages":[2,2],"body":[{"p":["**Malaria** is a disease caused by the transmission of a parasitic microorganism, a **protozoan**, by **mosquitoes** when they feed on humans.","Historians credit malaria with altering the patterns of human history and causing the collapse of some civilizations.","During World War II, 500,000 soldiers were infected in the South Pacific and African theaters, with 60,000 deaths recorded.","In 2010, malaria cases numbered 219 million, with 660,000 people dying from this debilitating disease.","Antimalarial drugs, insecticide applications, environmental modifications, and mosquito (bed) nets have brought great improvements to fighting this difficult-to-control disease."]},{"p":["In the early 21st century, outbreaks of the native **mountain pine beetle** in the western United States and Canada destroyed more than 4 million acres of lodgepole, ponderosa, Scots, and limber pines.","During this same period, the **emerald ash borer** was accidentally introduced from Asia.","It has destroyed millions of ash trees in the midwestern United States.","Preventive insecticidal treatments are being used to manage these two destructive beetles."]},{"p":["These examples illustrate the enormity and complexity of pest problems.","But what is a pest?"]},{"box":"Definition of a pest","p":["A **pest** is an undesirable organism that injures humans, desirable plants and animals, manufactured products, or natural substances."]},{"p":["Many insects, **pathogens**, plants, mollusks, fish, birds, and a variety of mammals compete for our crops and livestock.","Pathogens are disease-causing organisms, such as viruses, bacteria, or fungi.","Plants that are pests are known as **weeds**.","Mollusks are slugs and snails, and the mammals range from mice to deer.","In addition, some pests destroy clothing, furniture, and buildings.","Some reduce the beauty and recreational value of the landscape, and some invade our homes during the winter months.","As the battle between humans and pests continues over time, so will innovative methods of control."]}],"questions":[{"id":"c01-s02-t1","src":"test","kind":"mc","q":"Which is the manual's definition of a pest?","choices":["Any insect found on a crop","An undesirable organism that injures humans, desirable plants and animals, manufactured products, or natural substances","Any organism that is not native to an area","An organism that has become resistant to pesticides"],"answer":1,"ref":"p. 2, 'Pest Problems Throughout History'","why":"That is the manual's definition, word for word."},{"id":"c01-s02-t2","src":"test","kind":"short","q":"Type the definition of a pest.","answer":"An undesirable organism that injures humans, desirable plants and animals, manufactured products, or natural substances.","keys":[["undesirable","unwanted"],["organism","organisms","living thing"],["injures","injure","harms","harm","damages","damage"],["humans","people"],["plants"],["animals"],["products","manufactured"],["natural substances","substances"]],"ref":"p. 2, 'Pest Problems Throughout History'","why":"Know all four things a pest injures: humans, desirable plants and animals, manufactured products, and natural substances."},{"id":"c01-s02-t3","src":"test","kind":"mc","q":"Malaria is caused by which kind of organism, transmitted by mosquitoes?","choices":["A bacterium","A virus","A protozoan, a parasitic microorganism","A fungus"],"answer":2,"ref":"p. 2, 'Pest Problems Throughout History'","why":"Malaria is caused by a parasitic microorganism, a protozoan, spread by mosquitoes when they feed on humans."},{"id":"c01-s02-t4","src":"test","kind":"tf","q":"The emerald ash borer is a native beetle of the western United States.","answer":false,"ref":"p. 2, 'Pest Problems Throughout History'","why":"The emerald ash borer was accidentally introduced from Asia. The native one is the mountain pine beetle."},{"id":"c01-s02-t5","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as having improved the fight against malaria?","choices":["Antimalarial drugs","Insecticide applications","Mosquito (bed) nets","Releasing natural enemies of mosquitoes"],"answer":3,"ref":"p. 2, 'Pest Problems Throughout History'","why":"The manual lists antimalarial drugs, insecticide applications, environmental modifications, and bed nets."}]},{"id":"c01-s03","chapter":"Chapter 1 · Pest Management","title":"Pest control over the years","pages":[2,3],"body":[{"h":"Pest control over the years"},{"p":["For many centuries, the causes of crop failures and human and animal diseases were shrouded in mystery.","The first pest control measures were crude: weeds were pulled, rats were clubbed, and beetles were plucked from foliage."]},{"box":"Other ancient nonchemical control methods","list":["Burning to control weeds, diseases, and insects, in 950 B.C.","Egyptians placing fishnets over beds to prevent mosquito bites, in 440 B.C.","Romans using rat-proof grain storage bins, in 13 B.C."]},{"p":["The first known use of **natural enemies** is credited to **Arabian growers**, in 1000 A.D.","Arab farmers moved colonies of a predaceous ant species from nearby mountains to an oasis to control pest ants that were damaging their date palms."]},{"box":"Early chemical pest control","list":["The earliest use of chemicals as pesticides dates back to **2500 B.C.**, when the **Sumerians** used **sulfur** compounds to control mites and insects.","The **Chinese** used **mercury and arsenic** compounds in 500 B.C. to control body lice.","Early plant-derived insecticides included **hellebore** to control body lice, **nicotine** to control aphids, and **pyrethrins** to control a wide variety of insects."]},{"p":["In France during the late 19th century, a farmer sprayed a mixture of **lime and copper sulfate** on grapevines to deter passers-by from picking the grapes.","The farmer found that the mixture also controlled **downy mildew**, a serious fungal disease of grapes.","Later named **Bordeaux mixture**, it remains a widely used fungicide worldwide."]},{"p":["Until the 1940s, pest control chemicals were derived from plants and inorganic compounds.","During World War II, the synthetic chemical **DDT** saved many Allied soldiers from insect-transmitted diseases.","Synthetic pesticides launched the modern-day chemical industry and a new era in pest control."]},{"box":"Why pesticides became the primary means of solving pest problems","list":["They were effective.","They were relatively inexpensive.","They provided season-long crop protection.","They could be used with fertilizers and other production practices."]},{"p":["Modern pesticides achieved wide acceptance following their successful use in agriculture and for human health."]}],"questions":[{"id":"c01-s03-t1","src":"test","kind":"mc","q":"What is the earliest recorded use of chemicals as pesticides?","choices":["Sumerians using sulfur compounds in 2500 B.C.","Chinese using mercury and arsenic compounds in 500 B.C.","Romans using rat-proof grain bins in 13 B.C.","Egyptians using fishnets in 440 B.C."],"answer":0,"ref":"p. 2, 'Pest Control Over the Years'","why":"The Sumerians used sulfur compounds against mites and insects in 2500 B.C."},{"id":"c01-s03-t2","src":"test","kind":"mc","q":"Bordeaux mixture, still a widely used fungicide, is a mixture of:","choices":["Sulfur and lime","Lime and copper sulfate","Mercury and arsenic","Nicotine and pyrethrins"],"answer":1,"ref":"pp. 2–3, 'Pest Control Over the Years'","why":"A French farmer sprayed lime and copper sulfate on grapevines and found it also controlled downy mildew."},{"id":"c01-s03-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a reason the manual gives for pesticides becoming the primary means of solving pest problems?","choices":["They were effective","They were relatively inexpensive","They provided season-long crop protection","They had no effect on the environment"],"answer":3,"ref":"p. 3, 'Pest Control Over the Years'","why":"The four reasons: effective, relatively inexpensive, season-long protection, and usable with fertilizers and other practices."},{"id":"c01-s03-t4","src":"test","kind":"mc","q":"Which early plant-derived insecticide was used to control aphids?","choices":["Hellebore","Nicotine","Pyrethrins","Sulfur"],"answer":1,"ref":"p. 2, 'Pest Control Over the Years'","why":"Hellebore was for body lice, nicotine for aphids, and pyrethrins for a wide variety of insects."},{"id":"c01-s03-t5","src":"test","kind":"mc","style":"scenario","q":"Long ago, farmers moved colonies of predaceous ants to an oasis to protect date palms from pest ants. What was this the first known use of?","choices":["Chemical control","Natural enemies","Quarantine","Crop rotation"],"answer":1,"ref":"p. 2, 'Pest Control Over the Years'","why":"The first known use of natural enemies is credited to Arabian growers, in 1000 A.D."}]},{"id":"c01-s04","chapter":"Chapter 1 · Pest Management","title":"Resistance, Silent Spring, and biomagnification","pages":[3,4],"body":[{"p":["In recent years, some drawbacks of heavy dependence on pesticides have become increasingly apparent.","**Pesticide resistance** to DDT was documented in **1947**.","Since that time, hundreds of insects have become resistant to one or more pesticides.","Most notable is the **Colorado potato beetle**, which has developed resistance to every major group of insecticides, greatly complicating pest management efforts.","Resistance also has arisen in many weeds and plant pathogens in agricultural production."]},{"p":["In **1962**, **Rachel Carson** graphically illustrated the impact of increasing pesticide use on the environment.","Her book, **Silent Spring**, focused on DDT and other **chlorinated hydrocarbons** because of their long residual activity and persistence in the environment.","Although these characteristics contributed to their effectiveness, chlorinated hydrocarbons also accumulated in the fatty tissue of some animals, especially those higher in the food chain.","This is called **bioaccumulation**.","In certain situations, some organisms accumulated chemical residues in higher concentrations than those found in the food organisms they consumed.","This is called **biomagnification**."]},{"p":["Ecologists refer to a **food chain** as the sequence of animals feeding in the natural environment, where a particular plant, animal, or microorganism is eaten by an animal that is in turn eaten by another animal.","Animals at each level normally consume individuals from the previous level.","Figure 1.1 shows how biomagnification of a pesticide can occur in a food chain."]},{"fig":"fig-1-1"},{"p":["Organisms with pesticides in their tissues are eaten by fish, which are in turn eaten by birds.","The birds at the top of the food chain accumulate the highest concentration of pesticide residues."]},{"p":["Since the publication of Silent Spring, the United States has experienced a level of environmental awareness unequal to any other period in history.","The U.S. **Environmental Protection Agency (EPA)** was created in **1970** by Congress to implement laws passed to protect the environment and the health of humans and other animals.","In **1972**, EPA **banned the use of DDT** in the United States.","Regulatory action has since been taken against many chemicals thought to pose significant environmental and health hazards."]}],"figures":[{"id":"fig-1-1","title":"Figure 1.1: Biomagnification in the food chain","page":"p. 3","explain":["DDT concentration, in parts per million, goes from .000003 in water, to .04 in planktonic algae, .20 in zooplankton, 2.0 in fish, and 20.00 in fish-eating birds.","The figure labels this a concentration increase of 10 million times."],"svg":"<svg viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"Figure 1.1: DDT concentration in parts per million rises from .000003 in water to .04 in planktonic algae, .20 in zooplankton, 2.0 in fish, and 20.00 in fish-eating birds\"><text class=\"f-muted\" x=\"630\" y=\"18\" text-anchor=\"end\" font-size=\"14\" font-family=\"var(--f-mono)\">DDT concentration (parts per million)<\/text><g font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"22\"><rect class=\"f-field\" fill-opacity=\".06\" x=\"100\" y=\"30\" width=\"530\" height=\"70\" rx=\"6\"/><text class=\"f-ink\" x=\"120\" y=\"73\">FISH-EATING BIRDS<\/text><text class=\"f-ink\" x=\"612\" y=\"73\" text-anchor=\"end\" font-family=\"var(--f-mono)\">20.00<\/text><rect class=\"f-field\" fill-opacity=\".13\" x=\"100\" y=\"106\" width=\"530\" height=\"70\" rx=\"6\"/><text class=\"f-ink\" x=\"120\" y=\"149\">FISH<\/text><text class=\"f-ink\" x=\"612\" y=\"149\" text-anchor=\"end\" font-family=\"var(--f-mono)\">2.0<\/text><rect class=\"f-field\" fill-opacity=\".2\" x=\"100\" y=\"182\" width=\"530\" height=\"70\" rx=\"6\"/><text class=\"f-ink\" x=\"120\" y=\"225\">ZOOPLANKTON<\/text><text class=\"f-ink\" x=\"612\" y=\"225\" text-anchor=\"end\" font-family=\"var(--f-mono)\">.20<\/text><rect class=\"f-field\" fill-opacity=\".27\" x=\"100\" y=\"258\" width=\"530\" height=\"70\" rx=\"6\"/><text class=\"f-ink\" x=\"120\" y=\"301\">PLANKTONIC ALGAE<\/text><text class=\"f-ink\" x=\"612\" y=\"301\" text-anchor=\"end\" font-family=\"var(--f-mono)\">.04<\/text><rect class=\"f-field\" fill-opacity=\".34\" x=\"100\" y=\"334\" width=\"530\" height=\"70\" rx=\"6\"/><text class=\"f-ink\" x=\"120\" y=\"377\">WATER<\/text><text class=\"f-ink\" x=\"612\" y=\"377\" text-anchor=\"end\" font-family=\"var(--f-mono)\">.000003<\/text><\/g><path class=\"s-field\" stroke-width=\"7\" fill=\"none\" d=\"M44 404 V56\"/><path class=\"f-field\" d=\"M44 30 L28 60 H60 Z\"/><text class=\"f-ink\" font-size=\"15\" font-weight=\"700\" font-family=\"var(--f-body)\" text-anchor=\"middle\" transform=\"translate(80 217) rotate(-90)\">Concentration increases 10 million times<\/text><\/svg>"}],"questions":[{"id":"c01-s04-t1","src":"test","kind":"mc","q":"What is biomagnification?","choices":["Organisms accumulating chemical residues in higher concentrations than those found in the food organisms they consumed","A pest's ability to tolerate a pesticide that once controlled it","A pesticide breaking down in storage","Spreading a pesticide over a large area"],"answer":0,"ref":"p. 4, 'Pest Control Over the Years'","why":"That is biomagnification. Bioaccumulation is buildup in fatty tissue, especially in animals higher in the food chain."},{"id":"c01-s04-t2","src":"test","kind":"mc","q":"In Figure 1.1, which level has the highest DDT concentration?","choices":["Water","Zooplankton","Fish","Fish-eating birds"],"answer":3,"ref":"p. 3, Figure 1.1","why":"Fish-eating birds are at the top of the food chain, at 20.00 parts per million."},{"id":"c01-s04-t3","src":"test","kind":"mc","q":"In what year did EPA ban the use of DDT in the United States?","choices":["1947","1962","1970","1972"],"answer":3,"ref":"p. 4, 'Pest Control Over the Years'","why":"1947: DDT resistance documented. 1962: Silent Spring. 1970: EPA created. 1972: DDT banned."},{"id":"c01-s04-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT true of DDT and other chlorinated hydrocarbons, according to the manual?","choices":["They have long residual activity","They persist in the environment","They accumulated in the fatty tissue of some animals","They break down within a few hours"],"answer":3,"ref":"pp. 3–4, 'Pest Control Over the Years'","why":"Silent Spring focused on them because of their long residual activity and persistence."},{"id":"c01-s04-t5","src":"test","kind":"tf","q":"The Colorado potato beetle has developed resistance to every major group of insecticides.","answer":true,"ref":"p. 3, 'Pest Control Over the Years'","why":"The manual calls it the most notable example of resistance."}]},{"id":"c01-s05","chapter":"Chapter 1 · Pest Management","title":"The four main groups of pests","pages":[4,4],"body":[{"h":"Pest recognition"},{"p":["There are four main groups of pest organisms: **weeds, invertebrate animals, pathogens, and vertebrate animals**."]},{"box":"The four main groups of pests","ol":["**Weeds**: undesirable plants.","**Invertebrates**: insects, mites, ticks, spiders, snails, and slugs.","**Disease agents or pathogens**: bacteria, viruses, fungi, nematodes (roundworms), mycoplasmas (parasitic microorganisms), and other microorganisms.","**Vertebrates**: birds, reptiles, amphibians, fish, and rodents and other mammals."]},{"gallery":["p4-thistle","p4-wasp","p4-rust","p5-dove"]},{"p":["Never classify an organism as a pest until it is clearly determined to be one.","Be certain any injury or observed damage is actually due to the identified organism and not to some other cause.","Some plants, for example, can be damaged by factors in the environment.","These factors include **weather extremes, air pollutants, road salt, and inadequate or excessive fertilization**.","This damage may be mistaken for that caused by living pests."]}],"figures":[{"id":"p4-thistle","title":"Weed pest: Canada thistle flowers.","page":"p. 4","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEuAYkDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQAAQIFBgf/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAelN3NS1NJ061mM3KLqQlXRJISSEkoupZUuFSrLqQkqF1cKkhclF1ISSFS6JJRJdEkhJIS6hmxRRGC3TFXUkq4ZkslRQZnHVk9Ar5tc9GHhdSTS+0Q9AsNkeaJakOgfnuwwxx1D1TPjC17aePcX0k5TweSrbqWVLokkKksqXRJILS5bh8DUSSkuh8iOtz+T1EDuzGFejR59T0PGFWlqR0C8C6FovMoHdXTJlZEDeau5QUi5Y3rNDfS8/Z7E3iumvoYs1bUkKuQkuiVqA97KudWA3y+fyc5MIV2Oucvqqj0d80685ujp8XrLnFy2mg7haHuqjebyZkJWmB6gYTiMzdkhRFVUKuqogyNw/RwnVY8l017Uzq25ISSB63hQ+W73n5lDW+ig9dTarOYAWu1o5S/c4g1e1hIJWkMQ4lCtOgcwHdAcdgekJVWDHvJnUoIO6MzWSVcJNWHaQ7K6GTIv3eKpJ66c3o23mVbq+dkNySKyQoMHbP55sfUcWK43Y5gAosIwEWzXY47qsDXoa2uI3kGUOq0qEKBoXjBQGn8rzl2sorKsm8aK3Xfoms4lGFlQVV6CiF7XCkexrndHVRB1UV5Q9CkgZRgd4s6zYOlLztaoU53d5IqUekOZY5oJsgxyzMuxtZgRgl2X2uSyrwD6FOX2hnKR6CqD1l+ukc+JVSQqorkyi65nRbXUCc44VZPe8jrcDW0Ex4mdh3iyGw4dImMSmSoBS94MzMQhcd8T02deWr11Tk4INLzohXTXIpBjMN2PZdLGKUMsKdBQldzA1YZypRrIGh3WdFiXITnuc89PwOxwrVjCNMkACzDqDVdgWBy6TJkwDETRs+jEexKWCtcYWJs87jvcwScW65ihuCzGEyaX0FYUWGQ9FAUEYVnYJxPSy8hjfIG9oN2dUYlpXcqrmw6GnuPK+5+ftL3XRuaYbcl4uHlhLbiwJfqJiTirKE7oCqWBWGRQwQMyEUFsbBYQRlckWsaMdPi2uxjiNrygMJKz7DzfpVR828CFumzz6MqGI+jii9Zs+k/OfdeEmi9/ rtebrates, pathogens, and vertebrates","keys":[["weeds","weed","undesirable plants"],["invertebrates","invertebrate","invertebrate animals"],["pathogens","pathogen","disease agents"],["vertebrates","vertebrate","vertebrate animals"]],"ref":"p. 4, 'The Four Main Groups of Pests'","why":"Weeds, invertebrates, pathogens (disease agents), and vertebrates."},{"id":"c01-s05-t2","src":"test","kind":"mc","q":"Nematodes (roundworms) are listed in which group of pests?","choices":["Invertebrates","Disease agents or pathogens","Vertebrates","Weeds"],"answer":1,"ref":"p. 4, 'The Four Main Groups of Pests'","why":"The manual lists nematodes with the disease agents or pathogens, not the invertebrates."},{"id":"c01-s05-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as an invertebrate pest?","choices":["Mites","Ticks","Slugs","Amphibians"],"answer":3,"ref":"p. 4, 'The Four Main Groups of Pests'","why":"Amphibians are vertebrates."},{"id":"c01-s05-t4","src":"test","kind":"mc","style":"scenario","q":"Shrubs along a highway turn brown after winter. You find no insects or disease. What should you consider before calling it a pest problem?","choices":["Damage from road salt, an environmental factor","A new invasive pathogen","A secondary pest outbreak","Pesticide resistance"],"answer":0,"ref":"p. 4, 'Pest Recognition'","why":"Weather extremes, air pollutants, road salt, and fertilization problems can look like pest damage."},{"id":"c01-s05-t5","src":"test","kind":"tf","q":"You should classify an organism as a pest as soon as you find it on a damaged plant.","answer":false,"ref":"p. 4, 'Pest Recognition'","why":"Never classify an organism as a pest until it is clearly determined to be one."}]},{"id":"c01-s06","chapter":"Chapter 1 · Pest Management","title":"Identifying pests","pages":[4,5],"body":[{"p":["The first step in pest management is to **accurately identify the pest**.","Once the pest is identified, applicators can learn about its life cycle, behavior, characteristic damage, factors that favor its development, susceptible life stage or stages, and known control methods.","Misidentification and lack of accurate information could cause **pest control failure**."]},{"h":"Ways to identify pests"},{"p":["To identify an organism, consult reference materials: **identification books, Extension bulletins, field guides, and online identification keys** that contain pictures and biological information.","If you cannot pinpoint a specific plant or animal, take or send the specimen to a **university diagnostic lab** or a **local pest management specialist**.","Collect several specimens, if possible.","Ask the specialist to recommend the best way to collect and send samples."]},{"p":["It may be difficult to identify small insects and most mites, nematodes, and plant pathogens.","Accurate identification requires the use of a **hand lens or microscope, special tests, or careful damage analysis**.","Often the pest's **host**, the animal or plant on which an organism lives, and its **location** are important clues in making a correct identification.","Information on the environmental conditions where you collect pests, and the time of year of collection, also provide clues to the pest's identity."]},{"p":["Pest species have different physical forms depending on the **life cycle stage** or the **time of year**.","Weed seedlings, for example, often do not resemble the mature plant.","Many insect species undergo changes in appearance as they develop from eggs through immature stages to the adult form."]},{"h":"Characteristic damage"},{"p":["Pests may leave signs of their presence or damage that will help you determine what they are.","Birds and rodents often build characteristic nests.","The type of feeding damage and excrement can help you identify many insects.","Burrows, gnaw marks, tracks, trails in the grass, and/or feces are often characteristic of certain mammals.","Weeds may have unique flowers, seeds, or fruits, or unusual growth habits.","Fungi and other pathogens often cause specific types of damage, deformation, or color changes in host tissues."]}],"questions":[{"id":"c01-s06-t1","src":"test","kind":"mc","q":"What is the first step in pest management?","choices":["Choose a pesticide","Accurately identify the pest","Set an action threshold","Monitor the pest"],"answer":1,"ref":"p. 4, 'Pest Recognition'","why":"Identification comes first. Misidentification could cause pest control failure."},{"id":"c01-s06-t2","src":"test","kind":"mc","style":"scenario","q":"You find tiny mites on a crop and cannot tell what they are. What does the manual say to do?","choices":["Spray a broad-spectrum pesticide to be safe","Take or send specimens to a university diagnostic lab or a local pest management specialist","Wait until they become adults","Treat them the same as weeds"],"answer":1,"ref":"p. 4, 'Ways to Identify Pests'","why":"Collect several specimens if possible, and ask the specialist how to collect and send them."},{"id":"c01-s06-t3","src":"test","kind":"mc","q":"In pest identification, what is the pest's host?","choices":["The person who reported the pest","The animal or plant on which an organism lives","A natural enemy that eats the pest","The building where the pest was found"],"answer":1,"ref":"p. 5, 'Ways to Identify Pests'","why":"The host and the location are important clues for a correct identification."},{"id":"c01-s06-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a sign often characteristic of certain mammals?","choices":["Burrows","Gnaw marks","Trails in the grass","Color changes in host tissues"],"answer":3,"ref":"p. 5, 'Characteristic Damage'","why":"Color changes in host tissues point to fungi and other pathogens."},{"id":"c01-s06-t5","src":"test","kind":"short","q":"Name a tool the manual says you may need to identify small insects, mites, nematodes, and plant pathogens.","answer":"A hand lens or microscope","accept":["hand lens","microscope","a microscope","a hand lens","lens"],"ref":"pp. 4–5, 'Ways to Identify Pests'","why":"A hand lens or microscope, special tests, or careful damage analysis."}]},{"id":"c01-s07","chapter":"Chapter 1 · Pest Management","title":"Natural and applied controls","pages":[5,5],"body":[{"h":"Pest management methods"},{"p":["Once a pest problem is identified, you can begin planning how to manage the pest.","Determine what management methods are available and the benefits and limitations of each.","Select methods that are most effective in controlling the pest yet **least harmful to people and the environment**."]},{"p":["**Abiotic factors** are natural control measures within the environment that injure or destroy plants and animals, including pests.","They include climatic factors, such as wind, temperature, sunshine, and rain.","They include air or water pollution.","And they include topographic features, such as rivers, lakes, and mountains, that can affect pest movement.","If such natural controls do not hold pests in check, humans must intervene and apply pest management tactics."]},{"box":"Pest management methods","p":["**Natural controls**.","**Applied controls**, which are:"],"ol":["Biological control.","Chemical control.","Cultural control.","Genetic control.","Mechanical/physical control.","Regulatory control."]},{"fig":"fig-methods"}],"figures":[{"id":"fig-methods","title":"Diagram: pest management methods at a glance","page":"p. 5, redrawn from the box","explain":["Natural controls include abiotic factors.","When natural controls do not hold pests in check, people apply one or more of the six applied controls."],"svg":"<svg viewBox=\"0 0 640 360\" role=\"img\" aria-label=\"Pest management methods split into natural controls, such as abiotic factors, and six applied controls: biological, chemical, cultural, genetic, mechanical or physical, and regulatory\"><g font-family=\"var(--f-display)\" font-weight=\"700\" text-anchor=\"middle\"><rect class=\"f-field\" x=\"160\" y=\"8\" width=\"320\" height=\"44\" rx=\"8\"/><text class=\"f-on\" x=\"320\" y=\"38\" font-size=\"21\">PEST MANAGEMENT METHODS<\/text><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" d=\"M320 52 V70 M130 70 H465 M130 70 V90 M465 70 V90\"/><rect class=\"f-card\" x=\"30\" y=\"90\" width=\"200\" height=\"40\" rx=\"8\"/><text class=\"f-ink\" x=\"130\" y=\"117\" font-size=\"19\">NATURAL CONTROLS<\/text><rect class=\"f-card\" x=\"330\" y=\"90\" width=\"270\" height=\"40\" rx=\"8\"/><text class=\"f-ink\" x=\"465\" y=\"117\" font-size=\"19\">APPLIED CONTROLS<\/text><\/g><g font-family=\"var(--f-body)\" font-size=\"15\" text-anchor=\"middle\"><text class=\"f-ink\" x=\"130\" y=\"162\" font-weight=\"700\">Abiotic factors:<\/text><text class=\"f-muted\" x=\"130\" y=\"184\">wind, temperature,<\/text><text class=\"f-muted\" x=\"130\" y=\"206\">sunshine, rain,<\/text><text class=\"f-muted\" x=\"130\" y=\"228\">air or water pollution,<\/text><text class=\"f-muted\" x=\"130\" y=\"250\">rivers, lakes, mountains<\/text><\/g><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" d=\"M345 130 V330 M345 150 H360 M345 186 H360 M345 222 H360 M345 258 H360 M345 294 H360 M345 330 H360\"/><g font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"17\"><rect class=\"f-card\" x=\"360\" y=\"135\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"156\">1 · BIOLOGICAL<\/text><rect class=\"f-card\" x=\"360\" y=\"171\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"192\">2 · CHEMICAL<\/text><rect class=\"f-card\" x=\"360\" y=\"207\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"228\">3 · CULTURAL<\/text><rect class=\"f-card\" x=\"360\" y=\"243\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"264\">4 · GENETIC<\/text><rect class=\"f-card\" x=\"360\" y=\"279\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"300\">5 · MECHANICAL/PHYSICAL<\/text><rect class=\"f-card\" x=\"360\" y=\"315\" width=\"240\" height=\"30\" rx=\"6\"/><text class=\"f-ink\" x=\"374\" y=\"336\">6 · REGULATORY<\/text><\/g><\/svg>"}],"questions":[{"id":"c01-s07-t1","src":"test","kind":"mc","q":"What are abiotic factors?","choices":["Natural control measures in the environment, such as weather, pollution, and topography, that injure or destroy plants and animals","Natural enemies such as predators and parasites","Government programs that stop the spread of pests","Plant-derived pesticides"],"answer":0,"ref":"p. 5, 'Pest Management Methods'","why":"Abiotic factors are natural controls: climate, air or water pollution, and topographic features."},{"id":"c01-s07-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the six applied pest controls?","choices":["Biological","Cultural","Abiotic","Regulatory"],"answer":2,"ref":"p. 5, 'Pest Management Methods' box","why":"Abiotic factors are natural controls, not applied controls."},{"id":"c01-s07-t3","src":"test","kind":"short","q":"List the six applied pest control methods.","answer":"Biological, chemical, cultural, genetic, mechanical/physical, and regulatory","keys":[["biological"],["chemical"],["cultural"],["genetic"],["mechanical","physical"],["regulatory"]],"ref":"p. 5, 'Pest Management Methods' box","why":"Biological, chemical, cultural, genetic, mechanical/physical, and regulatory."},{"id":"c01-s07-t4","src":"test","kind":"mc","style":"scenario","q":"A mountain range keeps a pest from moving into a valley. What kind of control is that?","choices":["Regulatory control","A natural control, an abiotic factor","Cultural control","Mechanical control"],"answer":1,"ref":"p. 5, 'Pest Management Methods'","why":"Topographic features like rivers, lakes, and mountains are abiotic factors that can affect pest movement."},{"id":"c01-s07-t5","src":"test","kind":"tf","q":"When choosing pest management methods, select those most effective against the pest yet least harmful to people and the environment.","answer":true,"ref":"p. 5, 'Pest Management Methods'","why":"That is the selection rule in the manual."}]},{"id":"c01-s08","chapter":"Chapter 1 · Pest Management","title":"Biological control","pages":[5,6],"body":[{"h":"Biological control"},{"p":["In an undisturbed ecosystem, most organisms have one or more natural enemies or competitors that keep them from developing into large, damaging populations.","When an organism is removed from one ecosystem to another, this natural check-and-balance is disturbed.","The organism can become a pest in the new geographical area, especially when its natural enemies do not accompany it to the new location.","One pest management method involves reuniting the introduced pest with its natural enemies."]},{"p":["**Biological control** is the use of **natural enemies**, which are **predators, parasites, pathogens, and competitors**, to control pests and their damage.","These biological control, or **biocontrol**, agents are being used successfully to manage certain insect, mite, fungal, fish, and weed pests."]},{"p":["Once suitable natural enemies from the native home of an introduced pest are located, extensive testing and evaluation are necessary to ensure that these natural enemies will not become pests themselves in the new environment.","Laws and regulations strictly control the importation of all organisms, including biological control agents, into the United States.","The selected natural enemies are imported, reared, and released.","If successful, these biocontrol agents become established within large areas.","Over time, they will lower target pest populations for long periods with **no further human intervention**."]},{"p":["A second biological control technique is the **mass release** of large numbers of natural enemies into fields, orchards, greenhouses, or other locations to control specific pests.","Because this method usually does not yield long-term results, the natural enemies must be **released periodically**.","For example, **predatory mites** are used to control plant-feeding **spider mites**.","**Parasitic wasps** are used to manage specific pests.","**Praying mantids, lady beetles, and lacewings** are used as **general predators** in a garden or greenhouse.","Nematodes and fungi are being studied as biological control agents for certain weeds and insects."]},{"gallery":["p6-lacewing","p6-ichneumonid"]},{"p":["Another aspect of biological control is to maintain healthy populations of **native natural enemies**.","This could mean planting crops or groundcovers to ensure a diverse plant community of pollen and nectar sources for adult insects.","This method also requires careful selection and use of pesticides that are less toxic to natural enemies.","Additionally, applicators should apply pesticides at **lower-than-label rates**, if recommended and effective, to lessen the impact on natural enemies."]}],"figures":[{"id":"p6-lacewing","title":"Biological control: Lacewing larva.","page":"p. 6","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAF1AbEDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAfQX8zdnVtdiQsiBVAESEMhJISSEBgrRB5kzSdScLMelnkq09gvjFPajxQPbHxEPdTw9h7U+MvPWzzWs7M52tbgRUkiwEEkhBISZ6jbKVL5zYat/P2VsramJWwBJAMrEgIAcSbV4POk9Lg4KJ0slIGIWjA9VtGhQyBW1RBfUSQiwkUOgxWGnbyhHpd/imX3k8b0T0MxbLTJFxZerEw4e5K8VPXQp63L2F6ERJIskiCLyDrcvi5JNuKLZZZVeZoykIgJbWQRgBlJLaiCORLqiS0CrIELAlIPEg4AIYSa8ZPQ9TxLy+4nne1bokhIYc10u06isMlJrH5nO5EmjKDYFsrqOsDdmvhqbaiGKWtn6BiHU5gtisGmELSshgNuHs8kSQDqQAyEikgZQwEBWFgZAMoO13fD2x7ueTi9fdh27vQRudk/mkyTJRn0rjQAYQpYUL6LC2m+iIGAICW6sBHr6nMKyQFbKwvWTdXm0GVnpLa1YMihikALCwgEILa3UWEEkgYIep6GB9a0eZ0VYzjGqmlDVUWWDrJEmpTM5hfTahXCwly1D6c/TF5e7IBI5K5CMHLNK4RVJA6QDMgCHEV4LGQLIxYkAskIIQSQ9vxepxrUKTMdYRM+1TFN sts and their damage."},{"id":"c01-s08-t2","src":"test","kind":"mc","style":"scenario","q":"A greenhouse grower releases predatory mites every few weeks to control spider mites. Why must the releases be repeated?","choices":["Mass release usually does not yield long-term results","The law requires repeated releases","Predatory mites become pests themselves","Spider mites become resistant to predatory mites"],"answer":0,"ref":"p. 6, 'Biological Control'","why":"Because mass release usually does not give long-term results, natural enemies must be released periodically."},{"id":"c01-s08-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a general predator used in a garden or greenhouse?","choices":["Praying mantids","Lady beetles","Lacewings","Spider mites"],"answer":3,"ref":"p. 6, 'Biological Control'","why":"Spider mites are the pest that predatory mites control."},{"id":"c01-s08-t4","src":"test","kind":"tf","q":"Natural enemies brought in for an introduced pest need extensive testing to make sure they will not become pests themselves.","answer":true,"ref":"pp. 5–6, 'Biological Control'","why":"Testing and evaluation make sure they will not become pests in the new environment."},{"id":"c01-s08-t5","src":"test","kind":"mc","q":"How can an applicator help keep native natural enemies healthy?","choices":["Apply pesticides on a fixed schedule","Use pesticides that are less toxic to natural enemies, and lower-than-label rates if recommended and effective","Remove all groundcovers","Use the highest labeled rate to kill pests fast"],"answer":1,"ref":"p. 6, 'Biological Control'","why":"Careful pesticide selection and lower-than-label rates, if recommended and effective, lessen the impact on natural enemies."}]},{"id":"c01-s09","chapter":"Chapter 1 · Pest Management","title":"Chemical control and pesticide types","pages":[6,7],"body":[{"h":"Chemical control"},{"p":["**Chemical control** is the pest management method that involves using **naturally derived and/or synthetic chemicals** to manage pests.","These chemicals are often called pesticides."]},{"box":"Definition of a pesticide","p":["A **pesticide** is any material that is applied to plants, soil, water, harvested crops, structures, clothing and furnishings, or animals to **kill, attract, repel, or regulate or interrupt the growth and mating of pests**, or to **regulate plant growth**."]},{"gallery":["p6-tractor"]},{"p":["Pesticides often play a key role in pest management programs and may often be the only known control method for a given pest.","Major benefits of pesticides are their **effectiveness**, the **speed and ease** of controlling pests, and their **reasonable cost** compared with other control options.","Pesticides include a wide assortment of chemicals with specialized names and functions.","They are often grouped according to the type of pest they control."]},{"box":"Pesticides grouped by the pest they control","list":["**Avicides** control or repel pest birds.","**Bactericides** control bacteria.","**Chemosterilants** sterilize insects or pest vertebrates.","**Defoliants** cause leaves (foliage) to drop from plants.","**Desiccants** promote drying or loss of moisture from plant tissues and insects.","**Disinfectants** (antimicrobials) control microorganisms.","**Fungicides** control fungi.","**Growth regulators** alter the growth or development of a plant or animal.","**Herbicides** control weeds.","**Insecticides** control insects and related arthropods.","**Miticides** (acaricides) control mites.","**Molluscicides** control snails and slugs.","**Nematicides** control nematodes (roundworms).","**Ovicides** destroy eggs.","**Pheromones** attract insects.","**Piscicides** control pest fish.","**Predacides** control predatory vertebrates, for example, coyotes.","**Repellents** repel insects, mites, ticks, pest vertebrates, invertebrates, birds, and mammals.","**Rodenticides** control rodents."]}],"figures":[{"id":"p6-tractor","title":"Chem ted crops, structures, clothing and furnishings, or animals."},{"id":"c01-s09-t3","src":"test","kind":"mc","style":"scenario","q":"Coyotes are killing a rancher's sheep. Which type of pesticide is made to control predatory vertebrates like coyotes?","choices":["Rodenticides","Avicides","Predacides","Piscicides"],"answer":2,"ref":"p. 7, pesticide list","why":"Predacides control predatory vertebrates, for example, coyotes."},{"id":"c01-s09-t4","src":"test","kind":"mc","q":"What are the major benefits of pesticides named in the manual?","choices":["Effectiveness, speed and ease of control, and reasonable cost","No risk to the environment","Permanent control after one application","They never lead to resistance"],"answer":0,"ref":"p. 6, 'Chemical Control'","why":"Effectiveness, speed and ease of controlling pests, and reasonable cost compared with other options."},{"id":"c01-s09-t5","src":"test","kind":"short","q":"What do molluscicides control?","answer":"Snails and slugs","keys":[["snails","snail"],["slugs","slug"]],"ref":"p. 7, pesticide list","why":"Molluscicides control snails and slugs."}]},{"id":"c01-s10","chapter":"Chapter 1 · Pest Management","title":"How pesticides differ","pages":[7,7],"body":[{"p":["Each group of pesticides includes several **classes** or **families**.","For example, the classes of insecticides include the organophosphates, organochlorines, carbamates, pyrethroids, botanicals, insecticidal soaps, and microbials, among others.","The pesticides within a particular class have similar chemical structures or properties, or share a common **mode of action** or **site of action**.","**Mode of action** is how they kill the pest.","**Site of action** is the specific biological system affected within the pest.","The various classes of chemicals work in different ways and present different risks and problems."]},{"h":"Selective and nonselective pesticides"},{"p":["Some chemicals are called **selective pesticides** because they are toxic to some pests but have little or no effect on others.","For example, certain selective herbicides control broadleaf weeds but not grasses, and ovicides kill only the eggs of certain insects and mites.","In contrast, **fumigants are nonselective** and will kill a wide variety of pests: fungi, insects, weeds, nematodes, and other organisms.","**Nonselective herbicides** control any susceptible plant, given a sufficient dose."]},{"h":"Systemic and contact pesticides"},{"p":["Pesticides may move in various ways after they contact a host.","**Systemic pesticides** are absorbed and translocated within a plant or animal.","Systemic herbicides are absorbed through leaves or roots and are then transported within the treated plant.","Similarly, systemic insecticides can be eaten by or injected into livestock to control insect pests.","By contrast, **contact pesticides** are not absorbed by treated plants or animals.","These pesticides must directly touch the pest or a site the pest frequents to be effective."]},{"fig":"fig-1-2"},{"h":"Persistence"},{"p":["Pesticides also vary in their **persistence**, or how long they remain active to control pests.","Some **residual pesticides** control pests for weeks, months, or even years.","Others provide only short-term control, sometimes lasting only a few hours."]}],"figures":[{"id":"fig-1-2","title":"Figure 1.2: Systemic and contact pesticides on treated plants","page":"p. 7","explain":["On the left, a systemic pesticide is absorbed and moves inside the plant.","On the right, a contact pesticide stays on the surface of the plant."],"svg":"<svg viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Figure 1.2: a systemic pesticide moves inside the plant; a contact pesticide stays on the surface of the plant\"><defs><marker id=\"ah-1-2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><g font-family=\"var(--f-display)\" font-wei 440\" cy=\"100\" r=\"3.5\"/><circle cx=\"454\" cy=\"106\" r=\"3.5\"/><circle cx=\"466\" cy=\"116\" r=\"3.5\"/><circle cx=\"414\" cy=\"122\" r=\"3.5\"/><circle cx=\"430\" cy=\"116\" r=\"3.5\"/><circle cx=\"446\" cy=\"120\" r=\"3.5\"/><circle cx=\"432\" cy=\"131\" r=\"3.5\"/><circle cx=\"562\" cy=\"110\" r=\"3.5\"/><circle cx=\"548\" cy=\"102\" r=\"3.5\"/><circle cx=\"534\" cy=\"98\" r=\"3.5\"/><circle cx=\"520\" cy=\"100\" r=\"3.5\"/><circle cx=\"506\" cy=\"106\" r=\"3.5\"/><circle cx=\"494\" cy=\"116\" r=\"3.5\"/><circle cx=\"546\" cy=\"122\" r=\"3.5\"/><circle cx=\"530\" cy=\"116\" r=\"3.5\"/><circle cx=\"514\" cy=\"120\" r=\"3.5\"/><circle cx=\"528\" cy=\"131\" r=\"3.5\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"14\" text-anchor=\"middle\"><text class=\"f-muted\" x=\"160\" y=\"290\">Absorbed and moved within the plant<\/text><text class=\"f-muted\" x=\"480\" y=\"290\">Not absorbed; must touch the pest<\/text><\/g><\/svg>"}],"questions":[{"id":"c01-s10-t1","src":"test","kind":"mc","q":"What is a selective pesticide?","choices":["One that is toxic to some pests but has little or no effect on others","One that kills a wide variety of pests","One that stays active for years","One that must touch the pest directly"],"answer":0,"ref":"p. 7, selective pesticides","why":"Selective pesticides are toxic to some pests but have little or no effect on others."},{"id":"c01-s10-t2","src":"test","kind":"mc","style":"scenario","q":"A rancher controls insect pests on cattle with an insecticide the animals eat or that is injected into them. What kind of insecticide is this?","choices":["Contact insecticide","Systemic insecticide","Fumigant","Ovicide"],"answer":1,"ref":"p. 7, systemic pesticides","why":"Systemic insecticides can be eaten by or injected into livestock to control insect pests."},{"id":"c01-s10-t3","src":"test","kind":"mc","q":"What is the difference between mode of action and site of action?","choices":["Mode of action is how the pesticide kills the pest; site of action is the specific biological system affected within the pest","Mode of action is where it is applied; site of action is how long it lasts","They mean the same thing","Mode of action is the label code; site of action is where the pest lives"],"answer":0,"ref":"p. 7, pesticide classes","why":"Mode of action is how they kill the pest. Site of action is the specific biological system affected."},{"id":"c01-s10-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the insecticide classes named in the manual?","choices":["Organophosphates","Pyrethroids","Insecticidal soaps","Avicides"],"answer":3,"ref":"p. 7, pesticide classes","why":"Avicides are a pesticide group for birds, not a class of insecticides."},{"id":"c01-s10-t5","src":"test","kind":"short","q":"What is a pesticide's persistence?","answer":"How long it remains active to control pests","keys":[["how long","length of time","long"],["active","effective","works","working","control","controls"]],"ref":"p. 7, persistence","why":"Persistence is how long a pesticide remains active to control pests."}]},{"id":"c01-s11","chapter":"Chapter 1 · Pest Management","title":"Cultural control and sanitation","pages":[7,8],"body":[{"h":"Cultural control"},{"p":["**Cultural controls** are practices that reduce pest **establishment, reproduction, dispersal, and survival**.","Cultural practices and **sanitation** are two examples of cultural control."]},{"p":["Many cultural practices affect pest survival.","**Mowing, irrigation, aeration, and fertilization** are all important ways of producing healthy turf and preventing pest buildup and damage.","In agricultural production, **cultivation, selection of crop plant varieties, timing of planting and harvesting, irrigation management and timing, crop rotation, and the use of trap crops** help decrease populations of weeds, microorganisms, insects, mites, and other pests.","**Cultivation** is one of the most important ways to control weeds.","It is also used to manage some insects and other soil-inhabiting pests.","Plows, disks, mowers, cultivators, and bed conditioners destroy weeds or control their growth.","These tools also disrupt soil conditions suitable for the survival of some microorganisms and insects.","Weeds also can be managed by **mulching**, with plastic, straw, shredded bark, or wood chips, and by using **cover crops**."]},{"gallery":["p7-mulch","p8-aquatic"]},{"p":["**Sanitation** involves eliminating the necessities important to a pest's survival, such as **food, water, or shelter**.","In crop production, sanitation includes such practices as removing weeds that harbor pest insects or rodents, eliminating weed plants before they produce seed, destroying diseased plant material or crop residues, and keeping field borders or surrounding areas free of pests and pest breeding sites.","**Animal manure management** is an effective sanitation practice used to prevent or reduce fly problems in poultry and livestock operations.","Mosquitoes can be controlled by **draining standing water**.","Closed garbage containers and frequent garbage pickup eliminate food sources for flies, cockroaches, wasps, and rodents.","Removing soil, trash, and wood debris from around and under buildings reduces termite and fungal rot damage."]}],"figures":[{"id":"p7-mulch","title":"Cultural control: Mulch.","page":"p. 7","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAFcAcoDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAQIDBAAFBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAABBqMkWvE+fhCxEbuO4TK95fnSe1k8qiNEzOA63h3BJ1mPXZom8iR2ZNJLTnABDhoM9KVeO1x0FteEnr94tj1Whe3u7l7u47u47u487yvX8gJBPSpV7PO9DHsNA7o7uQaXnebJv8+PJSfcvd3Uy8Ag2I7H6G6IOZqBzvxSVMomhsoKRejMkOqrwrM6qRweSQmjI6e3f57QexyPb3dy9wJj8X3vBCQT6QjkVhxxXyDZ4+YTOjO6BPBaR4UR2syazWBTM5XHXhKmooY
