 trap particulates and sorbents in cartridges take up vapors."},{"id":"c06-s15-t1","src":"test","kind":"mc","q":"With no other use directions, particulate filters are disposed of after how much cumulative use?","choices":["Two hours","Four hours","Eight hours","One week"],"answer":2,"ref":"p. 98, 'Particulate Filters'","why":"Eight hours of cumulative use, absent other directions."},{"id":"c06-s15-t2","src":"test","kind":"mc","q":"Halfway through a job you notice a faint smell of the pesticide inside your mask with an organic vapor cartridge. What does that mean, and what do you do?","choices":["Normal. Finish the job.","Breakthrough has occurred. Change the cartridges immediately.","The filter is loaded. Tap it clean.","The mask is too tight. Loosen the straps."],"answer":1,"ref":"p. 98, 'Chemical Cartridges or Canisters'","why":"Any taste, smell, or irritation means breakthrough. Change cartridges now.","style":"scenario"},{"id":"c06-s15-t3","src":"test","kind":"mc","q":"Which of these does NOT affect the service life of a chemical cartridge?","choices":["Type and concentration of pesticide","The user's breathing rate","Humidity","The color of the respirator"],"answer":3,"ref":"p. 98, 'Chemical Cartridges or Canisters'","why":"Service life depends on pesticide type and concentration, breathing rate, and humidity.","style":"not"},{"id":"c06-s15-t4","src":"test","kind":"tf","q":"An unopened purifying element is fine to use after its expiration date.","answer":false,"ref":"p. 98, 'Chemical Cartridges or Canisters'","why":"Do not use it after the expiration date, even if never opened."},{"id":"c06-s15-t5","src":"test","kind":"mc","q":"EPA requires replacing particulate filters according to:","choices":["The manufacturer's recommendations or the pesticide labeling, whichever is more frequent","The manufacturer only","Whatever schedule the applicator prefers","The labeling or the manufacturer, whichever is less frequent"],"answer":0,"ref":"p. 98, 'Particulate Filters'","why":"Whichever is more frequent."}]},{"id":"c06-s16","chapter":"Chapter 6 · Personal Protective Equipment","title":"Combination cartridges and NIOSH TC numbers","pages":[97,99],"body":[{"h":"Combination chemical cartridge and particulate filters"},{"p":["The pesticide label may direct you to use both a chemical cartridge or canister and a particulate filter.","You have two options."]},{"list":["A chemical cartridge or canister with a disposable N, R, or P filter using a retaining ring.","A single combination cartridge or canister."]},{"p":["The combination chemical cartridge or canister for **nonpowered** air-purifying respirators will include **N-, R-, or P-rated** filters.","The combination chemical cartridges for **powered** air-purifying respirators will include an **HE** filter.","Follow the same change-out practices listed individually for particulate filters and chemical cartridges.","For example, if you were using a combo chemical cartridge with a P100 filter and detected breakthrough in your mask, you would **change out your cartridges immediately** even though the filter was still useable."]},{"h":"Identifying the respirator type from the pesticide label"},{"p":["The respiratory protection required by the pesticide label is **product- and task-specific**.","The pesticide label will typically cite respiratory protection required using a NIOSH **\"TC\" (Testing and Certification)** designation.","The NIOSH designations correspond to the types of respirators that may be specified by the pesticide label and include: TC-84A, TC-21C, TC-23C, TC-14G, TC-13F, and TC-19C."]},{"box":"NIOSH designations for respirators","list":["**TC-84A:** Filtering facepiece respirators (N, R, or P). APR with particulate filters (N, R, or P). APR with combination chemical cartridge and particulate filter (N, R, or P).","**TC-21C:** Powered air-purifying respirator with particulate filter (HE).","**TC-23C:** APR with chemical cartridges. PAPR with chemical cartridges. PAPR with combination chemical cartridge and particulate filter (HE).","**TC-14G:** Gas mask with or without particulate filter (N, R, or P). Tight-fitting PAPR with gas canister with or without particulate filter (HE).","**TC-13F:** Self-contained breathing apparatus. Supplied-air respirator with a self-contained escape bottle.","**TC-19C:** Supplied-air respirator."]},{"box":"Sample pesticide label language","p":["Wear a NIOSH-approved respirator with an organic vapor (OV) cartridge with any combination N, R, or P filter with NIOSH approval number prefix TC-84A; or a NIOSH-approved powered air-purifying respirator with OV cartridge and combination HE filter with NIOSH approval number prefix TC-23C; or a NIOSH-approved gas mask with an OV canister with NIOSH approval number prefix TC-14G."]}],"questions":[{"id":"c06-s16-t1","src":"test","kind":"mc","q":"What does \"TC\" stand for in a NIOSH designation such as TC-84A?","choices":["Toxic Control","Testing and Certification","Total Coverage","Tight Contact"],"answer":1,"ref":"p. 99, 'Identifying the Respirator Type from the Pesticide Label'","why":"TC means Testing and Certification."},{"id":"c06-s16-t2","src":"test","kind":"mc","q":"Which NIOSH designation is a self-contained breathing apparatus?","choices":["TC-84A","TC-21C","TC-13F","TC-23C"],"answer":2,"ref":"p. 99, 'NIOSH Designations for Respirators'","why":"TC-13F: SCBA, or supplied-air with a self-contained escape bottle."},{"id":"c06-s16-t3","src":"test","kind":"mc","q":"You use a combination cartridge with a P100 filter and taste the pesticide in your mask. The filter looks clean. What do you do?","choices":["Keep working, since the filter is still useable","Change out the cartridges immediately","Swap only the filter","Wait until the end of the day"],"answer":1,"ref":"p. 99, 'Combination Chemical Cartridge and Particulate Filters'","why":"Breakthrough means change the cartridges now, even if the filter is fine.","style":"scenario"},{"id":"c06-s16-t4","src":"test","kind":"mc","q":"A combination cartridge for a powered air-purifying respirator will include which filter?","choices":["N95","R99","HE","P100"],"answer":2,"ref":"p. 99, 'Combination Chemical Cartridge and Particulate Filters'","why":"Powered: HE. Nonpowered: N, R, or P."},{"id":"c06-s16-t5","src":"test","kind":"mc","q":"Which of these is NOT one of the NIOSH designations the manual lists?","choices":["TC-84A","TC-23C","TC-19C","TC-50X"],"answer":3,"ref":"p. 99, 'Identifying the Respirator Type from the Pesticide Label'","why":"Listed: TC-84A, TC-21C, TC-23C, TC-14G, TC-13F, and TC-19C.","style":"not"}]},{"id":"c06-s17","chapter":"Chapter 6 · Personal Protective Equipment","title":"Medical evaluation and fit tests","pages":[99,100],"body":[{"h":"Use tight-fitting respirators properly"},{"p":["Before selecting and using any respirator, get a **medical evaluation** to make sure wearing a respirator does not endanger your health.","Next, read and understand the manufacturer's instructions and NIOSH approval certificate that accompany the respirator and its components.","For full protection, conduct a **fit test** before wearing a tight-fitting particulate-filtering facepiece, half mask, or full-face mask.","When wearing a tight-fitting respirator, nothing must interfere with the seal between the surface of the mask and your face, **including beards and stubble**."]},{"box":"Fit tests","p":["**Fit testing** is a method to select the right size and type of tight-fitting respirator for your face.","Perform a qualitative or quantitative fit test of a given mask type on a user's face to select the best-fitting respirator.","It is important to get a fit test **annually** and **whenever you use a different respirator facepiece**.","Get fit tested again whenever something physically changes that could affect the fit of your respirator (for example, **facial scarring, dental work, cosmetic surgery, or a significant change in body weight**).","A respirator cannot protect you from pesticide exposure if it does not fit your face."]},{"list":["**Qualitative fit test:** a method that uses a **test agent** outside the mask to check for leakage at the seal to the face. Kits for qualitative testing are available and easy to use.","**Quantitative fit test:** a method that uses **instrumentation** to numerically measure leakage into the respirator."]},{"fig":"p99-fittest"}],"figures":[{"id":"p99-fittest","title":"In a quantitative fit test, a particle-counting instrument is used to measure respirator fit.","page":"p. 99","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAFLAS8DASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAEDBAUCBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAbHOUttYykaazA0jNZoGeF50Quqk6uKoFxVGWSsFlV+iZQsmVKI0SnbATEAJd8F+ahf0ALciXjvnGhWnLQxMAAaAGhMKAAaBx1ceTRoxgNA5Iw27nl9ddAaoTY9HK1QEtM4fPOdJlq5aBoGDEAAAAABQnFHn0CAADQADANy15/0Imi2PXx9hEBq58c8HKdgtUQAgAAYIYAAqGmEcqPMPZuyeZPZYhkAAO5FSxcq5kt7EtW7KDdh2sPbQA1aVa3S5ydMtXPXImMQAwQwATVMAABaGTbL2Xp5J57qxPidQXuDK5HR3xKvoQWlbcwd+QE92rQ0c3nLAFqTQJgmAAAAAmAFABxlX6uZfq98SdalmHVh7KVuJFNDIW6mpLpDNKW9h7Ekqa3YMzWyOcsgrWgATEwAEMaAGICh8socdPlhauVftuIOunX7cYmb6XOzM3eq9xoPjvdraefdkt89m7Fh7uDzl1CtABNI6EwTQxMBMAATjSnNOZnFW5VJyt3HHN+e3Kn2oKpWeZyt31UJZouq1UG7z570GBzlsZby3yJpgDEAAwAQ0MUcnJUrWq3PFvmOS2GzBat0Cnc3ZKZNJ0KrDtJlTqzTjaEdbxhegwOcstFomCAAGAIGAIYJoACOG2pIV0ixE7GrUms0ol5ikzC1z2AFOlcpSbQHTSwtzCxLSZaJqEJ0wAAAgikuR0pY6jtMrW6cw+7XW7TlmqFwTDP0KkkkrMhMpkMwUL+dJvD56aWJt42JMAqGHDCmACaKPSOedLqN6o+kUSzSk1lBP006dykXAYV54InAkACGeGQ6ztHOk3TjvppYu3i4kwJWIOXGqli55iSOvydy15JLVvNkzLkNJVYhg4q/peblt36c0OrdExQWK8k4EAAV7FWLdG9VS/PVs70Y2zj5k3CmWr3YrFjuhXLmd3fSjHr5xERhYjq9R1yyk+rBBJcsxWUlU2FXsbrrqOLgKRiYVLdSLcPfJJdztHZ5Gvk5RVNlGbaKS25aN1JaEF9c7RsxkME06YtfWoxNbrWpJVTiLFezbtodT16sxy8W9c1uTXTWYxMKtqsOevYkr6uPsbpmaebLnwWoJOUxZdLHuSaUUcmlirx K2GIirOsLpgqI3DdMQHLuxQUr3YgLGerLITjq/stDc5YAOXqsBqVbB9iImPRMM4NsDKa8UKJG/HjhBUMfaaAB1oggr1QAIEYx9Ut0MucQQ0IgwFXxNSUeo7O0cDHH1P//Z"}],"questions":[{"id":"c06-s17-r6","src":"review","kind":"mc","q":"You should do a qualitative fit test of your respirator:","choices":["Every five years.","Semiannually.","If you have a significant change in weight."],"answer":2,"ref":"p. 99-100, 'Fit Tests'","why":"Refit whenever something physical changes, such as a significant weight change. Routine tests are annual."},{"id":"c06-s17-t1","src":"test","kind":"mc","q":"What should you do before selecting and using any respirator?","choices":["Get a medical evaluation","Buy two of them","Shave your head","Test it with the pesticide"],"answer":0,"ref":"p. 99, 'Use Tight-Fitting Respirators Properly'","why":"First a medical evaluation, then read the instructions and certificate."},{"id":"c06-s17-t2","src":"test","kind":"mc","q":"How often should you get a fit test, at a minimum?","choices":["Annually","Every five years","Only once","Every day"],"answer":0,"ref":"p. 99, 'Fit Tests'","why":"Annually, plus any time you change facepieces or your face changes."},{"id":"c06-s17-t3","src":"test","kind":"mc","q":"Which kind of fit test uses instrumentation to numerically measure leakage?","choices":["Qualitative","Quantitative","Positive-pressure seal check","Negative-pressure seal check"],"answer":1,"ref":"p. 100, 'Fit Tests'","why":"Quantitative uses an instrument. Qualitative uses a test agent outside the mask."},{"id":"c06-s17-t4","src":"test","kind":"mc","q":"Which of these is NOT listed as a reason to get fit tested again?","choices":["Dental work","Facial scarring","Cosmetic surgery","A new pair of boots"],"answer":3,"ref":"p. 99-100, 'Fit Tests'","why":"Retest for physical changes that affect fit: scarring, dental work, surgery, weight.","style":"not"},{"id":"c06-s17-t5","src":"test","kind":"mc","q":"An applicator has two days of stubble and wants to wear a half-mask respirator. What does the manual say?","choices":["Stubble is fine. Only full beards matter.","Nothing must interfere with the seal, including beards and stubble","Use extra strap tension to compensate","Stubble only matters for full-face masks"],"answer":1,"ref":"p. 99, 'Use Tight-Fitting Respirators Properly'","why":"Beards and stubble break the seal.","style":"scenario"}]},{"id":"c06-s18","chapter":"Chapter 6 · Personal Protective Equipment","title":"Seal checks, and when to use a PAPR","pages":[100,100],"body":[{"box":"User seal checks for tight-fitting respirators","p":["Perform either a positive or negative user seal check, **preferably both, every time you put on your mask** to make sure that it is properly seated on your face.","This also ensures that all inhalation and exhalation valves are functioning properly."]},{"list":["**Positive-pressure user seal check:** Cover the **exhalation port** with the palm of your hand and lightly **exhale** into the mask. You will feel air escaping through any gaps in your seal. Readjust the mask until there is no leakage.","**Negative-pressure user seal check:** Cover or seal off the surface or hose where air is **inhaled** and **suck in**. If your mask is properly sealed, it should **collapse on your face** with no signs of leakage in the facepiece or hoses. If you cannot get a seal, readjust the mask until there is no leakage."]},{"fig":"p100-sealcheck"},{"p":["If you cannot get a proper fit with a tight-fitting respirator, you can use a **PAPR with a loose-fitting helmet or hoodlike head covering** that does not have to form a seal on your face.","**PAPRs do not need a fit test, and people with facial hair can use them.**"]},{"p":["Always consult the pesticide label for the appropriate respirator and purifying elements.","If you have any questions about your respirator, consult the manufacturer or use online resources.","Be sure to review the manufacturer approved labels for use limitations of the respirator.","Contact your Cooperative Extension pesticide safety education program or your state, tribal, territorial, or federal safety and health agency for help in selecting the correct respirator and any of its component parts."]}],"figures":[{"id":"p100-sealcheck","title":"Be sure to perform a seal check each time you use your respirator.","page":"p. 100","explain":["The top drawing shows a positive pressure seal check: a palm covering the exhalation port.","The bottom drawing shows a negative pressure seal check: both palms covering the cartridges."],"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAHFAQYDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH1AFoNAAAAAAACYiAGIAVMXLz3IPZZ/EuPbbPnnWPWJxpoAAAYXAWtAAAAAAgCGgAAE8xn8iq8gHCHprIbMh7fTj21FyCJIIkgmBaAAAgAAAJggAAF5X1HhIZ7O88Fd6uoo7WTUZPEeo4Z7C9oEwQAAE2naJoAEAAABAAAAjH432PCj0+fHiNmi5HDlf0yfF9BSaU0CYIAACbC0QIAAAAIE0NAAgww02RnlEFCVhDHo5Um3qefnmejGt6EA0ACC0FQAAIaAAQAhoAHljNyJz5Z39CnX1sZAsfM9nkYzKuy/M7yDrtJoAQxBaNUACAAAAQgAYBx+zx8zCmuee9px7eukyK8bH0suM5upU43z5Jq9V8lHZaNUALU1QmgAKreV1oiCGBTFRF+bLVmYenmtzF2eHv1dmGiBl0V35jBxWQuormRs0YN/SgFtyChNAFZj387owCYZzBJOuTxARIlIKLqrhoCm6m5UOsVubTQmRZ0MO7pUBbaCoADPozivjKAInKlm088gEACCaK7apW2JKKr6LwpmEwKAUaNmbT00CKuApABzejyo6baDNq55ivpv55QEACOm2kJzFACi1Ukr3KoF06zR3yI3C3plAbE1QAQw6ssdCLVPmdHlZld9F+IhiIlYtNW+dYzoSOfbsWrTK3EbJcqu3o38W4NGELSNhxzuh0k1QAZqHdF4Ijzeqkw2Sri+zNmrpmDAvbp4lpuVFsUUdPVWbD25HEv6iM9zZFgAAAFqaoBGa/mdWI+f7+Apr0aDlX9SZx59hHN0akJgNKkvKLCYmNCAAAQAAAXIKE6TB1MWyBAMTAAE0CPPHR4vJeV9KYmI9N2/Ae6qxNUAhoAAEAXAUY9mWHfVaIAGmAAJ1nI8vpriAEBLbWJerynnfZ+M9gdBBSaBoAAIjC4CjndHnRsk0AANAAD5fU4Z5/2/l/WHNo7IYN5WWYZc8837fy/oY3qSpDQCYAQCC5C0hz99cXgCGgaBhWS5lO8587MMS7Hn9idXyPS6UYOlt5NttezFW3Vi2iEQAACGILU1pRVeRaAAANMWPbkIRLilaPPybsMKuedEK7ofQz9XpqWbS9WGnPogACMkCbEATArn7MPQJAxKSE0x5NW ur face."},{"id":"c06-s18-t3","src":"test","kind":"mc","q":"A worker has a full beard and cannot get a seal with a half-mask. What does the manual offer?","choices":["Tighten the straps","A PAPR with a loose-fitting helmet or hoodlike covering, which needs no fit test","Skip the respirator if the label allows goggles","A nuisance dust mask"],"answer":1,"ref":"p. 100, 'User Seal Checks'","why":"Loose-fitting PAPRs need no seal, no fit test, and work with facial hair.","style":"scenario"},{"id":"c06-s18-t4","src":"test","kind":"tf","q":"A seal check is the same thing as a fit test.","answer":false,"ref":"p. 99-100, 'Fit Tests' and 'User Seal Checks'","why":"A fit test picks the right mask (annually). A seal check confirms it is seated each time you put it on."},{"id":"c06-s18-t5","src":"test","kind":"mc","q":"Which statement about a PAPR with a loose-fitting helmet or hood is NOT true?","choices":["It does not have to form a seal on your face","It does not need a fit test","People with facial hair can use it","It must be fit tested annually"],"answer":3,"ref":"p. 100, 'User Seal Checks'","why":"Loose-fitting PAPRs need no fit test.","style":"not"}]},{"id":"c06-s19","chapter":"Chapter 6 · Personal Protective Equipment","title":"Washing work clothes and coveralls","pages":[100,101],"body":[{"h":"Maintaining clothing and personal protective equipment"},{"p":["At the end of each workday, **wash all work clothes and PPE**.","Some items, such as clothes and coveralls, can be washed using a washer and dryer.","Other items, such as gloves, protective suits, goggles, aprons, boots, and eyewear, require **hand washing**.","Wear protective gloves when handling contaminated items.","Rinse and discard disposable items.","Dispose of any nonreusable contaminated item carefully to prevent cross-contamination or contamination of others who might handle the discarded item.","Dispose of heavily contaminated items as **household hazardous waste**."]},{"h":"Woven work clothes and coveralls"},{"p":["Launder fabric coveralls and work clothing **after each day's use**.","Some commonsense guidelines for cleaning pesticide-soiled clothing follow."]},{"ol":["Outdoors, shake any dry material from cuffs and pockets and then hang garments to air them out.","Wash work clothes and coveralls worn when handling pesticides **separately from other laundry**.","Load only a few items into the washing machine so there is plenty of agitation and water for dilution.","Use **hot water** and the **highest water level**.","Prerinse items by using the prewash cycle.","Use **heavy-duty liquid detergent**.","Run the washer on the **longest wash cycle**. Use **two entire machine cycles** for lightly or moderately contaminated items.","Properly handle and discard heavily contaminated clothing.","Line dry laundered items outdoors if possible.","Run **one additional empty cycle** without clothing, using detergent and hot water, before using the washer for your household laundry."]},{"p":["If using a laundry service, notify them the clothing may be contaminated with pesticides.","**Never wash** any garments made of absorbent materials that have been splashed or soaked with **undiluted pesticide** or large quantities of diluted pesticide.","Remember to remove them immediately and dispose of them carefully."]},{"gallery":["p100-wash","p101-dispose"]}],"figures":[{"id":"p100-wash","title":"Wash pesticide-contaminated items separately from other laundry.","page":"p. 100","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAIwAVQDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAgMAAQQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAefUK1+hOuT0dXRJIIX53HiesDy8T04+Zh6aeZs9HXnYehnnoehHz9x3p5+Hoa8/Dv358jvVwodycOjuzg2dy+FVd6cGR3ZwCO5fBGu/OBIeVTrt/R5fak7FXRKtceUBlYi7OxcZYumQVZwGjgFGJVGJUKkqipRu6ILKAu4D tergent:","choices":["After each day's use.","After they get wet with spray.","When they have a strong odor like the pesticide."],"answer":0,"ref":"p. 100, 'Woven Work Clothes and Coveralls'","why":"Launder fabric coveralls and work clothing after each day's use."},{"id":"c06-s19-t1","src":"test","kind":"mc","q":"Which water setting does the manual call for when washing pesticide-soiled clothing?","choices":["Cold water, low level","Warm water, medium level","Hot water, highest water level","Any setting with bleach"],"answer":2,"ref":"p. 101, 'Woven Work Clothes and Coveralls'","why":"Hot water and the highest water level."},{"id":"c06-s19-t2","src":"test","kind":"mc","q":"You just finished washing your spray clothes at home. Before washing the family's laundry, you should:","choices":["Wipe the drum with a towel","Run one additional empty cycle with detergent and hot water","Nothing, the rinse cycle cleaned it","Leave the lid open overnight"],"answer":1,"ref":"p. 101, 'Woven Work Clothes and Coveralls'","why":"One empty hot cycle with detergent clears the washer.","style":"scenario"},{"id":"c06-s19-t3","src":"test","kind":"mc","q":"Which of these is NOT one of the manual's laundering guidelines?","choices":["Shake dry material from cuffs and pockets outdoors","Load only a few items at a time","Line dry outdoors if possible","Wash pesticide clothes with towels to add agitation"],"answer":3,"ref":"p. 100-101, 'Woven Work Clothes and Coveralls'","why":"Pesticide clothes always go separately from other laundry.","style":"not"},{"id":"c06-s19-t4","src":"test","kind":"mc","q":"For lightly or moderately contaminated items, how many machine cycles does the manual call for?","choices":["One","Two entire cycles","Three","Only a prewash"],"answer":1,"ref":"p. 101, 'Woven Work Clothes and Coveralls'","why":"Longest wash cycle, two entire machine cycles."},{"id":"c06-s19-t5","src":"test","kind":"mc","q":"Heavily contaminated items that cannot be reused should be disposed of as:","choices":["Regular trash","Household hazardous waste","Recycling","Compost"],"answer":1,"ref":"p. 100, 'Maintaining Clothing and Personal Protective Equipment'","why":"Heavily contaminated items go out as household hazardous waste."}]},{"id":"c06-s20","chapter":"Chapter 6 · Personal Protective Equipment","title":"Caring for nonwoven garments, boots, gloves, eyewear, and respirators","pages":[101,102],"body":[{"h":"Nonwoven clothing"},{"p":["Coveralls may be either a one-day disposable item or a reusable garment.","For reusables, make sure to check the PPE manufacturer's use limitations and laundering instructions.","Replace these garments regularly and at any sign of wear.","If any PPE cannot be cleaned properly, dispose of it according to applicable federal, state, tribal, and local regulations.","Follow manufacturers' instructions, if any, for the service life of reusable nonwoven garments.","Pay close attention when reusing these items, and be ready to change them whenever you think that the inside surface may be contaminated.","If using disposable garments, **render them unusable and discard**.","If they are heavily contaminated with high-risk pesticides, handle them appropriately and take them to a **household hazardous waste facility**."]},{"h":"Boots and gloves"},{"p":["Be sure to clean boots and gloves, **even if they are worn only briefly**.","Before taking your gloves off, wash them thoroughly.","Wash both the **inside and outside** of boots and gloves once removed.","Inspect these items and discard if there is any sign of wear or if they leak.","Hang or leave to dry.","Gloves are not designed to be reused over and over again. Replace them often to ensure protection of your hands.","Properly cared for, boots should last multiple seasons.","**Sun will degrade rubber materials quickly**, so store gloves and boots out of the sun."]},{"h":"Eyewear and respirators"},{"p":["Most eyewear, respirator bodies, facepieces, and helmets are designed to be cleaned and reused.","These items can last many years if they are good quality and are maintained according to the manufacturer's directions.","**Respirators require more maintenance than most PPE.**","When you have finished using your respirator, remove and properly dispose of any expendable components, such as filters, cartridges, or canisters.","Wash the facepiece according to the respirator manufacturer's directions.","Take care to clean under and around gaskets and valves. Allow to air dry.","Store cleaned respirators, as well as replacement purifying elements, in a **clean, dry place that is not exposed to sunlight or extreme temperatures**.","Make sure the rubber facepiece is not distorted when stored so that it maintains its shape.","**Do not store any protective equipment, including respirators, with or near pesticides or other chemicals.**"]},{"fig":"p102-clean"}],"figures":[{"id":"p102-clean","title":"Clean goggles, face shields, and respirator bodies and facepieces in detergent and hot water.","page":"p. 102","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEzAdcDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAfpQNAAAAEDEQxAAAAAIYgAAAAAQAJoYkURQ00CEMEAgqSRk5mxx4R6a8aD25+d5D6rP5TOT6jH5xHu4+Mz7oZq9SCgAAAAACAQMQAAAACGkDEDAEMEORy8jQ5+Y9JeLjH0EfO4x9Hz/ADmafQnh1HqcPNRrMsOfXMKiAkAQAgEFH3Izd6AKAAAgAAAQwQA0ACRSiTVc0HW/Ozk9NeUj0c+IOrLJRcMObi9XlOKZzjXJQK51HUhRKLhBM1IgYk0AAKkK89T7kDd2AoAgCSjDM6zhyj0jypT0484O2OYjXIkQ2IoIVhDbEmyQCugdT85pz5ZlswvXtPO07Wci6w5a2yJjSDLPfEilRKpEsQwBa57n2gjd3AAIryshYjaB1NgyiSgSYAMQAIATBDgZmF7rprPzozjlmlDHZjpOB0LlDo24djozECYRh1YGNRQwCFoEMQunm6z7Ek3egAMN+U8pjzBphU0XWIbLGToOZHTHLMdRyh0TijZYo1WKNurD2KPHOA1jGcreWlVrjoGHRkcrYGk2aBYnqGWXRkckaSJ0hAyFpJHdx9x9UM3d/O9Hxz1+H0PMORqczOImNXgjoOcNznZtMAIATCWwQ2T6N+nU8PX valves, then air dry","Store it so the rubber facepiece is not distorted","Store it on the shelf in the pesticide storage room so it is handy"],"answer":3,"ref":"p. 102, 'Eyewear and Respirators'","why":"Never store PPE, including respirators, with or near pesticides.","style":"not"},{"id":"c06-s20-t4","src":"test","kind":"mc","q":"Where should cleaned respirators and replacement purifying elements be stored?","choices":["In the truck cab","In a clean, dry place not exposed to sunlight or extreme temperatures","In the pesticide storage room","In a sealed bag with the used cartridges"],"answer":1,"ref":"p. 102, 'Eyewear and Respirators'","why":"Clean, dry, out of sunlight and extreme temperatures."},{"id":"c06-s20-t5","src":"test","kind":"mc","q":"You reuse a nonwoven coverall and suspect the inside surface got contaminated. What does the manual say?","choices":["Turn it inside out and keep using it","Be ready to change it whenever you think the inside may be contaminated","Wash it with household laundry","Keep it until the manufacturer's service life runs out"],"answer":1,"ref":"p. 101, 'Nonwoven Clothing'","why":"Change reusable nonwovens whenever the inside may be contaminated.","style":"scenario"}]},{"id":"c06-s21","chapter":"Chapter 6 · Personal Protective Equipment","title":"Chapter 6 summary","pages":[102,102],"body":[{"h":"Summary"},{"p":["Wearing PPE can reduce the potential for dermal, inhalation, ocular, and oral exposure, thereby lowering the chances of pesticide injury, illness, or poisoning.","Consult the pesticide label for the **minimum PPE required by law**.","In order to appropriately select and wear PPE, you must understand both its **protections and its limitations**.","Then determine what protective equipment you need for the pesticide task at hand.","Personal protective equipment reduces your exposure to pesticides but does not necessarily eliminate it.","Maximize your safety by following certain good work practices when using pesticides."]},{"p":["Contact your Cooperative Extension pesticide safety education program for assistance in the selection, use, and maintenance of PPE for handling pesticides.","Check the \"Agricultural Use Requirements\" box on the label and the WPS requirements for any other statements about PPE use in farms, forests, nurseries, or greenhouses."]},{"box":"Personal hygiene","p":["**Personal hygiene is critical.**","Wash your hands every time you remove your gloves.","Shower at the end of the day."]}],"questions":[{"id":"c06-s21-t1","src":"test","kind":"mc","q":"Where do you find the minimum PPE required by law for a product?","choices":["The pesticide label","The dealer's catalog","The manufacturer's website","Your coworkers"],"answer":0,"ref":"p. 102, 'Summary'","why":"The label sets the legal minimum PPE."},{"id":"c06-s21-t2","src":"test","kind":"mc","q":"The manual's personal hygiene box says to wash your hands:","choices":["Once at the end of the day","Every time you remove your gloves","Only if you feel exposed","Before putting on gloves only"],"answer":1,"ref":"p. 102, 'Summary' box","why":"Wash hands every time gloves come off, and shower at the end of the day."},{"id":"c06-s21-t3","src":"test","kind":"mc","q":"You manage a nursery crew and want help choosing respirators and gloves. Who does the manual tell you to contact?","choices":["The pesticide dealer only","Your Cooperative Extension pesticide safety education program","The EPA hotline","The local fire department"],"answer":1,"ref":"p. 102, 'Summary'","why":"Cooperative Extension pesticide safety education helps with PPE selection, use, and maintenance.","style":"scenario"},{"id":"c06-s21-t4","src":"test","kind":"mc","q":"Which of these is NOT a route of exposure that PPE reduces, according to the summary?","choices":["Dermal","Inhalation","Ocular","Genetic"],"answer":3,"ref":"p. 102, 'Summary'","why":"Dermal, inhalation, ocular, and oral.","style":"not"}]},{"id":"practice","practice":true,"chapter":"Practice card","title":"How this study tool works","pages":null,"photos":[],"body":[{"p":["This card is practice. It is **not** from your manual, and it does not count toward your progress.","Press **Play** to hear it read in a Claude voice.","The **yellow highlight** follows the voice, word by word.","Tap any sentence to start reading from that spot."]},{"h":"How you pass"},{"p":["After each card, you get a quiz, one question at a time.","The manual's own review questions come first.","Then come new questions written like the real test, including scenario questions and **NOT** questions.","You pass a card only at **100 percent**."]},{"h":"How misses work"},{"p":["Every question you miss comes back later in the session.","It comes back again next session.","It stays on your weak list until you get it right **twice in a row**."]},{"h":"How a session runs"},{"list":["Each session starts with a **5-question rapid round** from old cards.","Then you study the next card and take its quiz.","Each session ends with what you mastered, what you are weak on, and what is next."]},{"fig":"loop"}],"figures":[{"id":"loop","title":"Figure: The study loop","photo":null,"svg":"<svg viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"Rapid round, then study card, then quiz, then pass at 100 percent or retake\"><g font-family=\"var(--f-display)\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\"><rect class=\"f-card\" x=\"6\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"71\" y=\"79\">RAPID ROUND<\/text><rect class=\"f-card\" x=\"170\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"235\" y=\"79\">STUDY CARD<\/text><rect class=\"f-card\" x=\"334\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"399\" y=\"79\">QUIZ<\/text><rect class=\"f-ok\" x=\"498\" y=\"18\" width=\"136\" height=\"50\" rx=\"8\"/><text class=\"f-on\" x=\"566\" y=\"50\">100% = PASS<\/text><rect class=\"f-bad\" x=\"498\" y=\"82\" width=\"136\" height=\"50\" rx=\"8\"/><text class=\"f-on\" x=\"566\" y=\"114\">MISS = RETAKE<\/text><\/g><g class=\"f-arrow\" stroke-width=\"3\" fill=\"none\"><path d=\"M138 72h26\"/><path d=\"M302 72h26\"/><path d=\"M466 64l26-20\"/><path d=\"M466 80l26 20\"/><\/g><\/svg>","explain":["The loop is simple: rapid round, study card, quiz.","A perfect quiz passes the card. Any miss means you retake it."]}],"terms":[{"term":"Weak list","def":"Questions you missed that you have not yet answered right twice in a row."},{"term":"Rapid round","def":"Five quick questions from old cards at the start of every session."}],"questions":[{"id":"practice-q1","src":"test","kind":"mc","q":"What score do you need to pass a card?","choices":["80 percent","90 percent","100 percent","70 percent"],"answer":2,"ref":"Practice card, 'How you pass'","why":"Anything under 100 percent is a fail."},{"id":"practice-q2","src":"test","kind":"tf","q":"A missed question leaves your weak list after you answer it right once.","answer":false,"ref":"Practice card, 'How misses work'","why":"You have to get it right twice in a row."},{"id":"practice-q3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT part of a study session?","choices":["A 5-question rapid round from old cards","A quiz after each card","A timed two-hour mock exam","A summary of what you mastered and what is weak"],"answer":2,"ref":"Practice card, 'How a session runs'","why":"Sessions are rapid round, cards, quizzes, and a summary. There is no timed mock exam."},{"id":"practice-q4","src":"test","kind":"short","q":"Type it: how many times in a row must you get a missed question right to clear it?","answer":"twice","accept":["2","two","two times","2 times","twice in a row","two in a row"],"ref":"Practice card, 'How misses work'","why":"Twice in a row clears it."}]}]}</script>
<script>
(() => {
'use strict';

/* ================= content ================= */
const C = JSON.parse(document.getElementById('content').textContent);
const SECTIONS = C.sections || [];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const REAL = SECTIONS.filter(s => !s.practice);
const Q = {};
for (const s of SECTIONS) for (const q of (s.questions || [])) Q[q.id] = Object.assign({ sid: s.id }, q);
const DEADLINE = new Date((C.manual?.deadline || '2027-01-11') + 'T00:00:00');
const DAILY_GOAL = 25;
const RANKS = [[0,'Trainee'],[250,'Apprentice'],[750,'Technician'],[1600,'Field Tech'],[3000,'Lead Applicator'],[5000,'License Ready']];

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => String(s ?? '').replace(/\*\*/g, '');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Number(n || 0).toLocaleString('en-US');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LET = 'ABCDEF';
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const pagesLabel = s => !s.pages ? '' : (s.pages[0] === s.pages[1] || s.pages.length === 1 ? 'p. ' + s.pages[0] : 'pp. ' + s.pages[0] + '–' + s.pages[1]);

const ICON = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};

/* ================= profile + storage ================= */
const LS_KEY = 'pas-profile-v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function blank() { return { v: 1, updatedAt: 0, xp: 0, bestCombo: 0, days: {}, passed: {}, attempts: {}, q: {}, sessions: [], settings: { voice: 'buttery', rate: 1, sound: true } }; }
function normalize(p) {
  const b = blank();
  if (!p || typeof p !== 'object') return b;
  for (const k of Object.keys(b)) if (p[k] === undefined || p[k] === null) p[k] = b[k];
  p.settings = Object.assign(b.settings, p.settings || {});
  if (!Array.isArray(p.sessions)) p.sessions = [];
  return p;
}
let P = normalize(lsGet(LS_KEY));
let profRef = null, sync = 'local', dirty = false, saving = false, saveT = null;

function save() {
  P.updatedAt = Date.now();
  lsSet(LS_KEY, P);
  dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(flush, 700);
}
async function flush() {
  if (!profRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await profRef.set(JSON.parse(JSON.stringify(P))); sync = 'synced'; }
  catch (e) { dirty = true; sync = e && e.code === 'quota_exceeded' ? 'full' : 'error'; }
  saving = false;
  renderFoot();
  if (dirty && sync === 'synced') saveT = setTimeout(flush, 700);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

async function initDb() {
  if (!window.claude || !claude.use) return;
  sync = 'loading'; renderFoot();
  let slow = setTimeout(() => { if (sync === 'loading') { sync = 'slow'; renderFoot(); } }, 10000);
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(slow); sync = 'local'; renderFoot(); return; }

function deviceSpeak(from) {

  const end = Reader.lines.length;
  for (let i = from; i < end; i++) {
    const L = Reader.lines[i];

    ${body}
    ${fb}
    ${!R && !cur.grading && q.kind !== 'short' ? `<span class="hint">${q.kind === 'mc' ? 'Keys A to ' + LET[q.choices.length - 1] + ' work too.' : 'Keys T and F work too.'}</span>` : ''}
  </section>
  <div class="row"><button class="btn small" data-act="quit-quiz">${ICON.back} Leave quiz</button></div>
</div>`;
}

/* ----- results */
function missList(ids) {
  return `<ul class="misslist">${ids.map(id => {
    const q = Q[id]; const a = q.kind === 'mc' ? q.choices[q.answer] : q.kind === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
    return `<li><span>${md(q.q)}</span><b>Answer: ${md(a)}</b><span class="src">${esc(q.ref || '')}</span></li>`;
  }).join('')}</ul>`;
}
function viewResult() {
  const r = S.result; if (!r) return viewHome();
  const nx = nextSection();
  const s = r.sid ? SEC[r.sid] : null;
  const nextBtn = nx ? `<button class="btn primary big" data-act="next-section">Next card: ${esc(nx.title)} ${ICON.arrow}</button>` : (openMisses().length ? `<button class="btn primary big" data-act="drill">Drill weak spots ${ICON.arrow}</button>` : '');
  const endBtn = S.sess ? '<button class="btn" data-act="end-session">End session and see summary</button>' : '<button class="btn" data-act="home">Home</button>';
  if (r.mode === 'section') {
    const pass = r.score === 100;
    return `<div class="view"><section class="result">
      <span class="eyebrow">${esc(s ? s.title : 'Card quiz')}</span>
      <div class="stamp ${pass ? 'ok' : 'bad'}">${pass ? 'Passed' : 'Failed'}</div>
      <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
      <p>${pass ? (r.firstPass ? 'Perfect. Card passed. +50 XP.' : 'Perfect again.') : `You missed ${r.total - r.right}. You need 100% to pass. Study the misses, then retake it.`}</p>
      ${r.missed.length ? missList(r.missed) : ''}
      <div class="row" style="width:100%">
        ${pass ? '' : `<button class="btn primary big grow" data-act="quiz" data-sid="${esc(r.sid)}">Retake quiz</button><button class="btn" data-act="open" data-sid="${esc(r.sid)}">Reread the card</button>`}
      </div>
      ${pass ? nextBtn : (nx && nx.id !== r.sid ? `<button class="btn" data-act="next-section">Move on for now (stays failed)</button>` : '')}
      ${endBtn}
    </section></div>`;
  }
  const label = r.mode === 'rapid' ? 'Rapid round' : 'Weak-spot drill';
  return `<div class="view"><section class="result">
    <span class="eyebrow">${label}</span>
    <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
    <p>${r.score === 100 ? 'Clean sweep.' + (r.bonus ? ' +' + r.bonus + ' XP bonus.' : '') : 'Missed ' + (r.total - r.right) + '. Those stay on your weak list until you get each right twice in a row.'}</p>
    ${r.missed.length ? missList(r.missed) : ''}
    ${nextBtn || ''}
    ${endBtn}
  </section></div>`;
}
function viewSummary() {
  const x = S.summary; if (!x) return viewHome();
  const mins = Math.max(1, Math.round(((x.end || Date.now()) - x.start) / 60000));
  const weak = openMisses();
  const failedNow = (x.failed || []).filter(id => !P.passed[id]);
  const nx = nextSection();
  const li = arr => arr.length ? `<ul class="sumlist">${arr.join('')}</ul>` : '<p class="muted">Nothing.</p>';
  return `<div class="view"><section class="result">
    <span class="eyebrow">Session summary · ${mins} min</span>
    <h1 class="display" style="font-size:40px">${x.a ? (pct(x.c, x.a) >= 90 ? 'Strong session.' : pct(x.c, x.a) >= 70 ? 'Decent. Not good enough yet.' : 'Rough session. Fix the misses.') : 'No questions answered.'}</h1>
    <div class="sumgrid">
      <div class="stat"><span class="lbl">Answered</span><b>${x.a}</b></div>
      <div class="stat"><span class="lbl">Accuracy</span><b>${x.a ? pct(x.c, x.a) + '%' : '—'}</b></div>
      <div class="stat"><span class="lbl">XP earned</span><b>+${fmt(x.xp)}</b></div>
      <div class="stat"><span class="lbl">Best streak</span><b>${x.best}</b></div>
    </div>
    <div class="panel" style="width:100%"><h2>Mastered</h2>${li([...(x.passed || []).map(id => SEC[id] ? `<li>Passed card: <b>${esc(SEC[id].title)}</b></li>` : ''), ...(x.cleared || []).filter(isReal).map(id => `<li>Cleared: ${md(Q[id].q)}</li>`)].filter(Boolean))}</div>
    <div class="panel" style="width:100%"><h2>Weak on</h2>${li([...failedNow.map(id => SEC[id] ? `<li>Card not passed: <b>${esc(SEC[id].title)}</b></li>` : ''), ...weak.slice(0, 10).map(id => `<li>${md(Q[id].q)} <span class="muted">(${esc(Q[id].ref || '')})</span></li>`)].filter(Boolean))}${weak.length > 10 ? `<p class="muted">Plus ${weak.length - 10} more on your weak list.</p>` : ''}</div>
    <div class="panel" style="width:100%"><h2>Next</h2><p>${nx ? `Card: <b>${esc(nx.title)}</b> (${esc(pagesLabel(nx))}).` : REAL.length ? 'Every loaded card is passed. Send Claude the next pages of your manual.' : 'Send Claude photos of your first manual pages.'}${weak.length ? ` Your next session opens with a rapid round that hits your ${weak.length} weak question${weak.length === 1 ? '' : 's'} first.` : ''}</p></div>
    <button class="btn primary" data-act="home">Back to home</button>
  </section></div>`;
}

/* ================= toast ================= */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ================= events ================= */
const ACT = {
  home: () => go('home'),
  'start-session': () => startSession(),
  continue: () => { if (S.quiz) go('quiz'); else goNext(); },
  'end-session': () => endSession(),
  open: b => openSection(b.dataset.sid),
  quiz: b => { const s = SEC[b.dataset.sid]; if (s) startQuiz('section', s.id, sectionQuizIds(s)); },
  pick: b => pick(parseInt(b.dataset.k, 10)),
  tf: b => pick(b.dataset.v === 'true'),
  next: () => nextQ(),
  'quit-quiz': () => { S.quiz = null; go('home'); },
  'next-section': () => goNext(),
  drill: () => startQuiz('drill', null, openMisses().slice(0, 15)),
  play: () => playToggle(),
  stop: () => Reader.stop(),
  sound: () => { P.settings.sound = !P.settings.sound; save(); renderFoot(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { ACT[b.dataset.act] && ACT[b.dataset.act](b, e); return; }
  const sent = e.target.closest('#reading .sent');
  if (sent && (Reader.mode === 'claude' || Reader.mode === 'device')) play(parseInt(sent.dataset.i, 10));
});
document.addEventListener('submit', e => { if (e.target.matches('[data-form="short"]')) { e.preventDefault(); submitShort(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'sel-voice') { P.settings.voice = e.target.value; save(); if (Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur); }
  if (e.target.id === 'sel-rate') {
    P.settings.rate = parseFloat(e.target.value) || 1; save();
    if (Reader.mode === 'claude' && Reader.t && Reader.t.setRate) { try { const r = Reader.t.setRate(P.settings.rate); if (r && r.catch) r.catch(() => {}); } catch (x) {} }
    if (Reader.mode === 'device' && Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur);
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (S.view === 'quiz' && S.quiz) {
    const cur = S.quiz.cur, q = Q[cur.id];
    if (!cur.result && !cur.grading) {
      const k = e.key.toLowerCase();
      if (q.kind === 'mc') {
        let pos = LET.toLowerCase().indexOf(k); if (pos < 0 && /^[1-6]$/.test(k)) pos = parseInt(k, 10) - 1;
        if (pos >= 0 && pos < cur.order.length) { e.preventDefault(); pick(cur.order[pos]); }
      } else if (q.kind === 'tf') { if (k === 't') pick(true); if (k === 'f') pick(false); }
    } else if (cur.result && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  } else if (S.view === 'study' && e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); playToggle(); }
});

/* ================= boot (with hot reload state) ================= */
function snapshotState() { return { view: S.view, sid: S.sid, quiz: S.quiz, result: S.result, summary: S.summary, combo: S.combo }; }
function start(data) {
  try {
    if (data && data.view) {
      const okQuiz = !data.quiz || data.quiz.items.every(it => Q[it.id]);
      if (okQuiz && (!data.sid || SEC[data.sid])) { Object.assign(S, { view: data.view, sid: data.sid, quiz: data.quiz, result: data.result, summary: data.summary, combo: data.combo || 0 }); if (S.view === 'quiz' && !S.quiz) S.view = 'home'; }
    }
  } catch (e) { S.view = 'home'; }
  render();
  initDb();
}
try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === 'function') h.snapshot(snapshotState); } catch (e) {}
let started = false;
const startOnce = data => { if (started) return; started = true; start(data); };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(startOnce); } catch (e) {} setTimeout(() => startOnce({}), 1500); }
else startOnce((hot && hot.data) || {});
})();
</script>
