ation. Where should it be kept?","choices":["With your calling list","In the pesticide storage area","At your attorney's office","In the glove box of the truck only"],"answer":0,"ref":"p. 136, 'Prepare a fill-in form'","why":"Keep the form with your calling list."}]},{"id":"c09-s03","chapter":"Chapter 9 · Emergency or Incident Response","title":"Maps, inventory, training, and the plan's backbone","pages":[136,137],"body":[{"h":"Prepare maps"},{"p":["Prepare a **facility map** that shows a layout of all chemical storage buildings and bulk storage tanks.","It also shows access roads; main shutoffs for electricity, water, and gas; perimeter fencing or gates; and fuel storage tanks.","It shows the location of fire alarms, fire extinguishers and other firefighting equipment, and protective clothing.","It also shows drainage ditches, wells, and surface flow of water."]},{"p":["Prepare an **area map** that shows your facility in relation to the surrounding area.","Provide emergency response agencies with an **updated copy** of the facility map and area map **whenever changes are made**."]},{"fig":"fig-9-1"},{"h":"Keep, maintain, and train"},{"list":["Keep a **product inventory** of chemicals stored at the facility. Let your emergency response plan reflect **peak seasonal storage** of pesticides, fertilizers, and fuel.","Keep copies of pesticide labels and Safety Data Sheets, or SDSs, **away from the storage area**.","Maintain in good working order the emergency equipment and supplies needed to respond to fires and spills.","Train all employees how to execute the response plan **each year**."]},{"p":["Do you know where your emergency equipment is?"]},{"h":"The backbone of the plan"},{"p":["The **backbone** of any emergency response plan is a description of the **sequence of actions to take in a crisis**.","Prepare step-by-step procedures on how to respond to various emergencies: fires, spills, ammonia leaks, tornadoes, hurricanes, and transportation accidents, among others.","Specify **in writing** every activity from sounding the alarm to interacting with local emergency response agencies.","Once internal emergency procedures have been established, ask your local response agencies, for example, fire, police, and emergency planning committee, if they have anything to add to your plan.","Offer them a copy of your plan for their files."]},{"fig":"p137-plan"}],"figures":[{"id":"fig-9-1","title":"Figure 9.1: Include a facility map as part of the emergency response plan.","page":"p. 137","explain":["This is a simplified redraw of the sample map. The key on the right matches the manual's Key to Facilities.","It marks buildings, bulk bins, tanks, dikes, drains, the well, fences, vehicle access, and the stream along the property edge, so responders know where hazards and water are."],"svg":"<svg viewBox=\"0 0 900 520\" role=\"img\" aria-label=\"Figure 9.1, simplified redraw: a facility map showing bulk bins, bag house, warehouse with chemical storage, offices, showroom, loading dock, parking, straw shed, dikes, tanks, drains, a well, fences, vehicle access, and a stream along the bottom edge, with a key to facilities\"><defs><marker id=\"ah-9-1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path class=\"f-muted\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><path class=\"s-ink\" stroke-width=\"1.5\" fill=\"none\" d=\"M30 25 V455 M30 25 C40 75 90 85 600 150 V455\"/><path class=\"f-field\" fill-opacity=\".18\" d=\"M25 462 H612 V492 H25 Z\"/><path class=\"s-field\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" fill=\"none\" d=\"M25 477 H612\"/><circle class=\"f-card s-ink\" stroke-width=\"1.5\" cx=\"55\" cy=\"477\" r=\"9\"/><text class=\"f-ink\" x=\"55\" y=\"480.5\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"var(--f-body)\">S<\/text><circle class=\"f-card s-ink\" stroke-width=\"1.5\" cx=\"130\" cy=\"477\" r=\"9\"/><text class=\"f-ink\" x=\"130\" y=\" "q":"Employees need to be trained on executing the response plan only once, when they are hired.","answer":false,"ref":"p. 136, guidelines","why":"Train all employees how to execute the response plan each year."},{"id":"c09-s03-t5","src":"test","kind":"mc","q":"When should you give emergency response agencies an updated copy of your facility map and area map?","choices":["Whenever changes are made","Once every five years","Only after an emergency","Only when they ask"],"answer":0,"ref":"p. 136, 'Area map'","why":"Provide an updated copy whenever changes are made."}]},{"id":"c09-s04","chapter":"Chapter 9 · Emergency or Incident Response","title":"Fires: precautions and what to do","pages":[137,138],"body":[{"h":"Fires"},{"p":["Pesticide products vary significantly in their flammability.","However, **any pesticide product involved in a fire is dangerous** to responders working at the scene because of **smoke and fumes**.","**Even after the fire has been extinguished**, pesticide residue in the debris, soil, and runoff may be dangerous."]},{"h":"Precautions to reduce fire hazards"},{"p":["Chapter 8, Transportation, Storage, and Security, discussed where to locate a pesticide storage facility and the proper design and components of a secure facility.","Follow these guidelines to help you prepare for, and respond to, a fire in the storage area."]},{"list":["Store combustible pesticides **away from heating sources**.","Install a **fire-detection system**.","Train employees to use a fire extinguisher."]},{"gallery":["p137-sprinkler","p137-sign"]},{"h":"When a fire occurs"},{"p":["**Prompt action** is essential when a fire occurs.","Coordinate all details on managing a fire with local emergency response officials.","Take the following actions."]},{"list":["Make sure employees evacuating the premises go to a **designated rendezvous point** where everyone can be accounted for.","Notify the fire department.","Provide emergency response teams with **SDSs, labels, the emergency w","kind":"mc","q":"In addition to an emergency response plan, which of the following will further reduce the risk of a pesticide fire?","choices":["Store pesticides close to a heat source to prevent freezing.","Keep a fire-detection system in the storage area.","Post the storage area with a warning sign."],"answer":1,"fixed":true,"ref":"p. 141, Review question 3 (answer: p. 137, 'Precautions to Reduce Fire Hazards')","why":"A fire-detection system is one of the listed precautions. Store combustible pesticides away from heat."},{"id":"c09-s04-r4","src":"review","kind":"mc","q":"Which is a recommended action to take in the event of a pesticide fire?","choices":["Construct berms to contain contaminated runoff water.","Enter the storage facility and remove as much pesticide as possible.","Try to extinguish the fire before calling 911."],"answer":0,"fixed":true,"ref":"p. 141, Review question 4 (answer: p. 138, fire actions)","why":"Contain contaminated runoff water and leaking pesticide onsite by building berms."},{"id":"c09-s04-t1","src":"test","kind":"tf","q":"Once a pesticide fire is put out, the debris, soil, and runoff are no longer dangerous.","answer":false,"ref":"p. 137, 'Fires'","why":"Pesticide residue in debris, soil, and runoff may be dangerous even after the fire is out."},{"id":"c09-s04-t2","src":"test","kind":"mc","style":"scenario","q":"Your storage building is on fire and the crew has run outside. What should you make sure they do first?","choices":["Go to a designated rendezvous point where everyone can be accounted for","Go back in for the SDS binder","Spray water on the pesticide shelves","Move their vehicles to block the road"],"answer":0,"ref":"p. 138, fire actions","why":"Evacuating employees go to a designated rendezvous point to be accounted for."},{"id":"c09-s04-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT something the manual says to give emergency response teams at a fire?","choices":["SDSs","Labels","The emergency plan and a site map","Your sales records"],"answer":3,"ref":"p. 138, fire actions","why":"Give them SDSs, labels, the emergency plan, and a site map."},{"id":"c09-s04-t4","src":"test","kind":"mc","q":"Whose instructions do you follow at the scene of a pesticide fire?","choices":["The onsite incident commander","The pesticide manufacturer","Your insurance agent","The state pesticide inspector"],"answer":0,"ref":"p. 138, fire actions","why":"Follow the instructions given by the onsite incident commander."},{"id":"c09-s04-t5","src":"test","kind":"short","q":"Why is any pesticide product involved in a fire dangerous to responders at the scene?","answer":"smoke and fumes","keys":[["smoke","fumes","toxic fumes","fume"]],"ref":"p. 137, 'Fires'","why":"Any pesticide in a fire is dangerous to responders because of smoke and fumes."}]},{"id":"c09-s05","chapter":"Chapter 9 · Emergency or Incident Response","title":"Spills: the three Cs, control and contain","pages":[138,139],"body":[{"h":"Pesticide spills"},{"p":["A **spill** is an accidental release of **any amount** of pesticide, small or large.","Spills on public highways, such as when a tank on a truck overturns, usually have major consequences.","Failure to respond quickly and appropriately to such mishaps could seriously endanger public health and environmental quality.","In the event of any pesticide spill, remember the **three Cs**: **CONTROL** the spill, **CONTAIN** it, and **CLEAN** it up."]},{"box":"The Three Cs","ol":["Control.","Contain.","Clean up the spill."]},{"fig":"p138-spill"},{"h":"Control the spill"},{"p":["**Act immediately** to control the spilled product.","Always put on the appropriate **personal protective equipment**, or **PPE**, **before** responding to a spill.","Place **small, leaking containers into larger ones**.","If a larger container, such as a drum, is leaking, try to **plug the leak**. Then, transfer the contents to another container.","To stop leaks from pressurized systems, such as sprayers, **turn off the pump**.","**Never leave the site unattended.**"]},{"fig":"p138-ppe"},{"h":"Contain the spill"},{"p":["Do all you can to keep the spill from spreading or getting worse.","**Prevent the material from entering surface water.**","Using a **shovel**, you can quickly **berm off an area** to keep the spilled pesticide out of drains and waterways.","A spill that is contained on the surface is much easier to clean than one that has entered a body of water."]},{"fig":"p139-tube"}],"figures":[{"id":"p138-spill","title":"Clean up all spills immediately.","page":"p. 138","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGCAeQDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAHuAbomCBiB0ijiSdvkYpYmerXnyzQnGkAKyNw89kSDkxX0aTaulk1anV1jjUdXkw7XUkADNOtk7c/QWrJ0+Wehx5d9kNZprRo8+7e8ZNW6xKsZsDEbQxS2Bg3iqsmGtNcgAAZDTxcN+M5btHMjp08xHRoU1wq2CJjIySJxUQc7iWyrPb28F0KhszWD4vW40WRhuTPPvrVo8/6bOcjU98Yub6Co4+260j0+Zu0trthq+Z6FPYxmzR5++3sEZ9KgYJlY9HKll0CoOqMwiPz0aOBpuxnEdWJldeoFTjW+/PvKKbsxUiSRhbIoexmSVyK43hWFRNwsNHP6HPt3bOZsPQjj1rhgUcrqU87M6kuUGm7nEduvnzrdz4440djjaqK9ESntYOdJ6w5HV62RE1cctRHPN4bU/P8AJDma8uM9OqeVbsuixOd07LbcNukKaL6CyjTzYRCSb1Ky3MtmQm5XmE6Oc51VtUkdmX0dcvH3eWuZ1TT1ikddYp6QwargEw4mDVHnKI96dec0XdE5dHfrqrHugUc3q0xj1SzSekl570HSskasSQY/P3bvPnn3dF2wlZIonYiEExOGcujz7Y1wuyVVA3xZo47rrcxI1W4bDbnImKjRmkN+Kw0nP31nhfmX1c6b+lTCoDCTgjzlmPZznZv51m2DrcnoxodctWRXIWXXQRqnVIYetx8vSS8/39mBq86+L4RxoiTswWF1+XEdbJzrC+rbAqzSzydafO0W49OOcliaJCY2mKQLXRpyJYSgVbcmotqs0W9S2u3pY1UYzoaOVTJ22LV8jv5fU5y5kaezPTW5c8Njy6DRKyvVs5u/mxLn7qcwt6PNTtnHN2yyujkup59kSvqRqtcKv56qjdTv6Fc22+Nc54FlAqvTVTZWOUWNpq5RkJSqHm34EhdCRrprlb6C+i/pUmqbUSacTxfc4XpOcirs1XbufKtGehE6xQKSLc2qNWUas5ujLm1UajMoVHSxcqliN2Wq46NXRrqjVMC/Dnrr5MTOVEqxNDzhpllK1ukNLgFjhNSFmYgSSFCkO6hHc6nK6vSoIatk back to the shop","Call the manufacturer"],"answer":0,"ref":"p. 139, 'Control the Spill'","why":"To stop leaks from pressurized systems such as sprayers, turn off the pump."},{"id":"c09-s05-t3","src":"test","kind":"tf","q":"Only a large release of pesticide counts as a spill.","answer":false,"ref":"p. 138, 'Pesticide Spills'","why":"A spill is an accidental release of any amount of pesticide, small or large."},{"id":"c09-s05-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a correct step to control a spill?","choices":["Place small, leaking containers into larger ones","Try to plug a leaking drum, then transfer the contents","Leave the site briefly to get help","Put on PPE before responding"],"answer":2,"ref":"pp. 138–139, 'Control the Spill'","why":"Never leave the site unattended."},{"id":"c09-s05-t5","src":"test","kind":"mc","q":"What tool does the manual say you can use to quickly berm off an area around a spill?","choices":["A shovel","A broom","A hose","A dustpan"],"answer":0,"ref":"p. 139, 'Contain the Spill'","why":"Using a shovel, you can quickly berm off an area."}]},{"id":"c09-s06","chapter":"Chapter 9 · Emergency or Incident Response","title":"Spills into water, reporting, and cleanup","pages":[139,140],"body":[{"h":"If the spill reaches water"},{"p":["If the spilled pesticide does contaminate a stream, pond, or other waterway, **immediately contact** the state, tribe, or territory regulatory agencies responsible for streams and fisheries and for pesticides.","**Do not delay** notifying the authorities.","They need time to alert downstream users who draw surface water for drinking, prevent accidental poisoning of livestock, evacuate people using the water for recreational purposes such as swimming and fishing, and avoid contamination of irrigated crops.","Call the **manufacturer's emergency number on the SDS** to find out what steps you or the emergency response coordinator should take to lessen the dangers of water contamination."]},{"h":"Report the spill"},{"p":["**Call 911** to report the spill and be ready to respond to the authorities arriving at the scene.","Be sure to have the **product label and SDS** available for emergency responders.","After the spill has been contained, follow your emergency plan.","In some cases, the applicator will call the emergency responder, who will then call the proper authorities."]},{"box":"For emergency response information call","p":["**CHEMTREC**: 1-800-424-9300."]},{"h":"Clean up the spill"},{"p":["The last step at the spill site is to clean up the spilled product.","Sweep up any absorbent materials and other contaminated items and **place them in a drum**.","If the spill occurred on **concrete or asphalt**, you will have to **neutralize the surface**.","Follow the instructions on the SDS or contact the manufacturer, whose number is listed on the data sheet."]},{"fig":"p140-absorbent"},{"p":["The state, tribe, or territory regulatory agency involved with pesticide spills will tell you what to do when the spill occurs on **soil**.","For example, they may require that the **top 2 to 3 inches of soil** be excavated, removed, and replaced with clean soil."]},{"h":"Keep records"},{"p":["**Keep records** of your activities and conversations with regulatory authorities, emergency responders, news media, and the public when dealing with a pesticide spill.","**Photographs** help document any related damage as well as steps you have taken to clean up the spilled product."]}],"figures":[{"id":"p140-absorbent","title":"Use an absorbent material to help clean up a spill.","page":"p. 140","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEqAjADASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAG0F7aEWMQAKmgGAAAAAmAAAAAAU48 ason to have an emergency response plan is to reduce economic losses.","The first person to contact in an emergency is an attorney.","It is important to make a detailed report of what took place before, during, and after the incident."],"answer":2,"fixed":true,"ref":"p. 141, Review question 1 (answer: p. 140, keep records; p. 136, coordinator fills out reports)","why":"Keep records of your activities and conversations, and photographs help document the damage and your cleanup."},{"id":"c09-s06-t1","src":"test","kind":"short","q":"What is the phone number for CHEMTREC?","answer":"1-800-424-9300","accept":["800-424-9300","18004249300","8004249300","1 800 424 9300"],"ref":"p. 139, box 'For emergency response information call'","why":"CHEMTREC is 1-800-424-9300."},{"id":"c09-s06-t2","src":"test","kind":"mc","style":"scenario","q":"A spill soaks into the soil at a mixing site. The regulatory agency may require you to excavate and replace how much soil?","choices":["The top 2 to 3 inches","The top 6 to 8 inches","The top 1 foot","None, soil spills break down on their own"],"answer":0,"ref":"pp. 139–140, 'Clean up the Spill'","why":"They may require the top 2 to 3 inches of soil be excavated, removed, and replaced."},{"id":"c09-s06-t3","src":"test","kind":"mc","q":"A pesticide spilled on concrete has been swept up. What else must be done to the surface?","choices":["Neutralize it","Hose it down into the drain","Paint over it","Nothing more"],"answer":0,"ref":"p. 139, 'Clean up the Spill'","why":"On concrete or asphalt you have to neutralize the surface, following the SDS or manufacturer."},{"id":"c09-s06-t4","src":"test","kind":"mc","style":"not","q":"Authorities need time after a waterway is contaminated. Which of these is NOT a reason the manual gives?","choices":["To alert downstream users who draw surface water for drinking","To prevent accidental poisoning of livestock","To evacuate people swimming and fishing","To decide how much to fine you"],"answer":3,"ref":"p. 139, waterway contamination","why":"Fines are not among the listed reasons."},{"id":"c09-s06-t5","src":"test","kind":"tf","q":"If a spill reaches a stream, you should finish cleanup before notifying the state agencies.","answer":false,"ref":"p. 139, waterway contamination","why":"Immediately contact the agencies, and do not delay notifying the authorities."},{"id":"c09-s06-t6","src":"test","kind":"mc","q":"Where do you put swept-up absorbent material and other contaminated items?","choices":["In a drum","In the regular trash","Back in the original pesticide container","In a burn pile"],"answer":0,"ref":"p. 139, 'Clean up the Spill'","why":"Sweep up absorbent and contaminated items and place them in a drum."}]},{"id":"c09-s07","chapter":"Chapter 9 · Emergency or Incident Response","title":"The NFPA hazard diamond","pages":[138,139],"body":[{"h":"National Fire Protection Association"},{"p":["A hazardous rating system used to assist emergency response personnel is the **NFPA Hazard Identification System**.","This system uses a **diamond-shaped** warning symbol.","The **top, left, and right** boxes refer to **flammability, health, and instability** hazards, respectively, and each contains a number from **0 to 4**.","The **bottom** box is used for **special hazards**; the most common of these is a **warning against the use of water**."]},{"fig":"fig-9-nfpa"},{"box":"Health Hazard: Blue Section","list":["4: Severe hazard.","3: Serious hazard.","2: Moderate hazard.","1: Slight hazard.","0: Minimal hazard."]},{"box":"Flammability Hazard: Red Section","list":["4: Flammable gases, volatile liquids, pyrophoric materials.","3: Ignites at ambient temperatures.","2: Ignites when moderately heated.","1: Must be preheated to burn.","0: Will not burn."]},{"box":"Special Hazard: White Section","list":["OX: Oxidizer.","W with a line through it: Avoid use of water."]},{"box":"Instability Hazard: Yellow Section","list":["4: Capable of detonation or explosive decomposition at ambient tempe Ignites at ambient temperatures","Is a pyrophoric material"],"answer":0,"ref":"p. 139, 'Flammability Hazard: Red Section'","why":"A 0 means it will not burn."},{"id":"c09-s07-t4","src":"test","kind":"tf","q":"On the NFPA diamond, a 4 means the least hazardous and a 0 the most hazardous.","answer":false,"ref":"p. 139, NFPA box","why":"It is the reverse. 4 is the most severe and 0 is minimal."},{"id":"c09-s07-t5","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the NFPA diamond's colored sections?","choices":["Blue for health","Red for flammability","Yellow for instability","Green for environmental hazard"],"answer":3,"ref":"p. 139, NFPA box","why":"The sections are blue, red, yellow, and white. There is no green section."},{"id":"c09-s07-t6","src":"test","kind":"short","q":"On the NFPA diamond, what do the letters OX in the white section mean?","answer":"oxidizer","accept":["an oxidizer","oxidiser","oxidizing"],"ref":"p. 139, 'Special Hazard: White Section'","why":"OX means oxidizer."}]},{"id":"c09-s08","chapter":"Chapter 9 · Emergency or Incident Response","title":"Preventing spills, the spill kit, and chapter summary","pages":[140,140],"body":[{"h":"Prevent spills"},{"p":["A key to reducing the likelihood of any spill is to **properly maintain your application equipment and transport vehicles**.","Leaks and drips from **cracked hoses or loose hose clamps** clearly indicate problems.","**Defensive driving techniques** and **refraining from cellphone use while driving** are two important habits that can prevent vehicle accidents that might result in a spill."]},{"p":["Keep a **spill cleanup kit** in **each pesticide transport vehicle** and at the site where pesticides are **mixed, loaded, and stored**.","Store your spill kit items in a **plastic container** and keep them clean and in working order.","Include the following items in a spill response kit."]},{"list":["Telephone numbers for emergency assistance.","PPE designed for use with pesticides.","Absorbent materials, such as **spill pillows, absorbent clay, and cat litter**.","A **shovel, broom, and dustpan**.","**Heavy-duty detergent**."]},{"fig":"p140-supplies"},{"h":"Summary"},{"p":["Prepare for a pesticide emergency.","Make sure the plan includes designating an emergency response coordinator, maintaining a list of emergency response agencies, preparing a map of the facility, and keeping a product inventory.","Be sure all employees at the facility are familiar with the emergency response plan and know what to do in a crisis.","Take precautions to reduce the chance of pesticide fires.","The best way to manage pesticide spills is to **prevent them from happening**.","It is your responsibility as a pesticide applicator to do everything possible to avoid spills and adhere to a few basic guidelines when handling spills and leaks.","Accidents happen. Be prepared so that they will not become catastrophes."]}],"figures":[{"id":"p140-supplies","title":"Keep emergency supplies and a shovel on hand.","page":"p. 140","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAIwAbADASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAQIAAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAG+SelJCZOR0PO8Z1W4wzO6eEbe+/nYekbzRr07+Vh6xvJCvYHx7V60eVY9TPMW16KefsO5OM1dcctq6UwWLsGV60CuypIaEgDIBgDUkhDASCBkAZJTyTmhEOTwuzxeEgKwRIFkg5ECIBoIGCARgB0cMEDFg0WI0AGiQc1wtfOxosxiui/Jh2X4ei3stwutpqbmaK3Pw+eewPllPVnyNleuEmrDJHn+R1OZwyAwUEwUtBYbjPNZMgvrFjgQmAhIsYiBwLLGKZdCg3QqLws04jWzLp0Vyq9maK9mTaDqc7obV9LndHdTynsfJ5nS5+nHlWCJPdAjtqESPM4tVXnlMIoyQMlol4gYwDRdDOpgqWOUvrurnN01MLMTPGEAGAYkQORXMqW0A6HPvFYdmPdD7smvoXo8/o6s8p6ny2ZNSPhKraD2AM60Bq48pVbXwysU2xpA6M+kCMhZZReAw1n16baV8FJsowyNGZ5GyrVkqskRIIAgkYKWpDSkQRgsLqzaq03K3Q3Rwb92nzfoeDiNYl2C5NeQ9lJOtObTijzsE4ZFVyKoU02jNYXrYBWkLdct3Rg086S3Lqx5RgRgGOnzujy6YSRGSBV ed hoses or loose clamps clearly indicate problems."},{"id":"c09-s08-t4","src":"test","kind":"tf","q":"A spill cleanup kit is only needed at the storage site, not in transport vehicles.","answer":false,"ref":"p. 140, 'Prevent Spills'","why":"Keep a kit in each transport vehicle and where pesticides are mixed, loaded, and stored."},{"id":"c09-s08-t5","src":"test","kind":"short","q":"Name two driving habits the manual says can prevent vehicle accidents that might result in a spill.","answer":"defensive driving and not using a cellphone while driving","keys":[["defensive"],["cellphone","cell phone","phone"]],"ref":"p. 140, 'Prevent Spills'","why":"Defensive driving and refraining from cellphone use while driving."},{"id":"c09-s08-t6","src":"test","kind":"mc","q":"What kind of container should spill kit items be stored in?","choices":["A plastic container","A metal drum","A cardboard box","A paper bag"],"answer":0,"ref":"p. 140, 'Prevent Spills'","why":"Store your spill kit items in a plastic container."}]},{"id":"practice","practice":true,"chapter":"Practice card","title":"How this study tool works","pages":null,"photos":[],"body":[{"p":["This card is practice. It is **not** from your manual, and it does not count toward your progress.","Press **Play** to hear it read in a Claude voice.","The **yellow highlight** follows the voice, word by word.","Tap any sentence to start reading from that spot."]},{"h":"How you pass"},{"p":["After each card, you get a quiz, one question at a time.","The manual's own review questions come first.","Then come new questions written like the real test, including scenario questions and **NOT** questions.","You pass a card only at **100 percent**."]},{"h":"How misses work"},{"p":["Every question you miss comes back later in the session.","It comes back again next session.","It stays on your weak list until you get it right **twice in a row**."]},{"h":"How a session runs"},{"list":["Each session starts with a **5-question rapid round** from stion leaves your weak list after you answer it right once.","answer":false,"ref":"Practice card, 'How misses work'","why":"You have to get it right twice in a row."},{"id":"practice-q3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT part of a study session?","choices":["A 5-question rapid round from old cards","A quiz after each card","A timed two-hour mock exam","A summary of what you mastered and what is weak"],"answer":2,"ref":"Practice card, 'How a session runs'","why":"Sessions are rapid round, cards, quizzes, and a summary. There is no timed mock exam."},{"id":"practice-q4","src":"test","kind":"short","q":"Type it: how many times in a row must you get a missed question right to clear it?","answer":"twice","accept":["2","two","two times","2 times","twice in a row","two in a row"],"ref":"Practice card, 'How misses work'","why":"Twice in a row clears it."}]}]}</script>
<script>
(() => {
'use strict';

/* ================= content ================= */
const C = JSON.parse(document.getElementById('content').textContent);
const SECTIONS = C.sections || [];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const REAL = SECTIONS.filter(s => !s.practice);
const Q = {};
for (const s of SECTIONS) for (const q of (s.questions || [])) Q[q.id] = Object.assign({ sid: s.id }, q);
const DEADLINE = new Date((C.manual?.deadline || '2027-01-11') + 'T00:00:00');
const DAILY_GOAL = 25;
const RANKS = [[0,'Trainee'],[250,'Apprentice'],[750,'Technician'],[1600,'Field Tech'],[3000,'Lead Applicator'],[5000,'License Ready']];

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => String(s ?? '').replace(/\*\*/g, '');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Number(n || 0).toLocaleString('en-US');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LET = 'ABCDEF';
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const pagesLabel = s => !s.pages ? '' : (s.pages[0] === s.pages[1] || s.pages.length === 1 ? 'p. ' + s.pages[0] : 'pp. ' + s.pages[0] + '–' + s.pages[1]);

const ICON = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};

/* ================= profile + storage ================= */
const LS_KEY = 'pas-profile-v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function blank() { return { v: 1, updatedAt: 0, xp: 0, bestCombo: 0, days: {}, passed: {}, attempts: {}, q: {}, sessions: [], settings: { voice: 'buttery', rate: 1, sound: true } }; }
function normalize(p) {
  const b = blank();
  if (!p || typeof p !== 'object') return b;
  for (const k of Object.keys(b)) if (p[k] === undefined || p[k] === null) p[k] = b[k];
  p.settings = Object.assign(b.settings, p.settings || {});
  if (!Array.isArray(p.sessions)) p.sessions = [];
  return p;
}
let P = normalize(lsGet(LS_KEY));
let profRef = null, sync = 'local', dirty = false, saving = false, saveT = null;

function save() {
  P.updatedAt = Date.now();
  lsSet(LS_KEY, P);
  dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(flush, 700);
}
async function flush() {
  if (!profRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await profRef.set(JSON.parse(JSON.stringify(P))); sync = 'synced'; }
  catch (e) { dirty = true; sync = e && e.code === 'quota_exceeded' ? 'full' : 'error'; }
  saving = false;
  renderFoot();
  if (dirty && sync === 'synced') saveT = setTimeout(flush, 700);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

async function initDb() {
  if (!window.claude || !claude.use) return;
  sync = 'loading'; renderFoot();
  let slow = setTimeout(() => { if (sync === 'loading') { sync = 'slow'; renderFoot(); } }, 10000);
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(slow); sync = 'local'; renderFoot(); return; }
    profRef = db.doc('data/users/' + id + '/profile');
    const snap = await profRef.get();
    clearTimeout(slow);
    if (snap.exists) {
      const remote = normalize(JSON.parse(JSON.stringify(snap.data())));
      if ((remote.updatedAt || 0) >= (P.updatedAt || 0)) { P = remote; lsSet(LS_KEY, P); resumeSession(); }
      else { dirty = true; }
    } else if (P.updatedAt) { dirty = true; }
    sync = 'synced';
    if (dirty) flush();
    if (S.view === 'home') render(); else { renderChips(); renderFoot(); }
  } catch (e) { clearTimeout(slow); sync = 'error'; renderFoot(); }
}

/* ================= derived stats ================= */
const qs = id => P.q[id] || (P.q[id] = { seen: 0, right: 0, wrong: 0, run: 0, open: false, last: 0 });
const today = () => P.days[dayKey()] || (P.days[dayKey()] = { a: 0, c: 0, xp: 0 });
function dayStreak() {
  let n = 0; const d = new Date();
  if (!(P.days[dayKey(d)] && P.days[dayKey(d)].a)) d.setDate(d.getDate() - 1);
  while (P.days[dayKey(d)] && P.days[dayKey(d)].a) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const isReal = qid => Q[qid] && SEC[Q[qid].sid] && !SEC[Q[qid].sid].practice;
const openMisses = () => Object.keys(P.q).filter(id => P.q[id].open && isReal(id)).sort((a, b) => (P.q[a].last || 0) - (P.q[b].last || 0));
function rank(xp = P.xp) {
  let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k;
  const next = RANKS[i + 1];
  return { name: RANKS[i][1], next: next ? next[1] : null, frac: next ? (xp - RANKS[i][0]) / (next[0] - RANKS[i][0]) : 1, need: next ? next[0] - xp : 0 };
}
function daysLeft() { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.max(0, Math.round((DEADLINE - t) / 864e5)); }
function secStatus(s) {
  if (P.passed[s.id]) return 'pass';
  if (P.attempts[s.id] && P.attempts[s.id].n) return 'fail';
  return 'new';
}
const nextSection = () => REAL.find(s => !P.passed[s.id]) || null;
function manualProgress() {
  const total = C.manual && C.manual.totalPages;
  const passedN = REAL.filter(s => P.passed[s.id]).length;

/* ----- study card */
function sentence(t, i) {
  let out = '';
  for (const seg of String(t).split(/(\*\*[^*]+\*\*)/)) {
    if (!seg) continue;
    const bold = seg.startsWith('**') && seg.endsWith('**');
    const txt = bold ? seg.slice(2, -2) : seg;
    for (const p of txt.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { out += ' '; continue; }
      out += `<span class="w${bold ? ' term' : ''}">${esc(p)}</span>`;
    }
  }
  return `<span class="sent" data-i="${i}">${out.trim()}</span>`;
}
function figureHtml(s, f, next) {
  if (!f) return '';
  const art = f.svg ? f.svg : f.img ? `<img src="${esc(f.img)}" alt="${esc(f.alt || plain(f.title))}" loading="lazy">` : '';
  const ref = f.page ? 'Manual, ' + f.page : f.photo ? 'In your manual: ' + f.photo : '';
  return `<figure class="fig">${art ? `<div class="fig-art">${art}</div>` : ''}<figcaption>${sentence(f.title + (/[.!?:]$/.test(f.title) ? '' : '.'), next())}${ref ? `<span class="fig-ref">${esc(ref)}</span>` : ''}${(f.explain || []).length ? `<p>${f.explain.map(x => sentence(x, next())).join(' ')}</p>` : ''}</figcaption></figure>`;
}
const findFig = (s, id) => (s.figures || []).find(f => f.id === id);
function blockHtml(s, b, next) {
  const ul = arr => `<ul>${arr.map(t => `<li>${sentence(t, next())}</li>`).join('')}</ul>`;
  const ol = arr => `<ol>${arr.map(t => `<li>${sentence(t, next())}</li>`).join('')}</ol>`;
  const para = arr => `<p>${arr.map(t => sentence(t, next())).join(' ')}</p>`;
  if (b.h) return `<h3 class="rh">${sentence(b.h, next())}</h3>`;
  if (b.box !== undefined) {
    let inner = `<h4>${sentence(b.box, next())}</h4>`;
    if (b.p) inner += para(b.p);
    if (b.list) inner += ul(b.list);
    if (b.ol) inner += ol(b.ol);
    return `<aside class="mbox">${inner}</aside>`;
  }
  if (b.p) return para(b.p);
  if (b.list) return ul(b.list);
  if (b.ol) return ol(b.ol);
  if (b.fig) return figureHtml(s, findFig(s, b.fig), next);
  if (b.gallery) return `<div class="gallery">${b.gallery.map(id => figureHtml(s, findFig(s, id), next)).join('')}</div>`;
  return '';
}

    </section></div>`;
  }
  const label = r.mode === 'rapid' ? 'Rapid round' : 'Weak-spot drill';
  return `<div class="view"><section class="result">
    <span class="eyebrow">${label}</span>
    <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
    <p>${r.score === 100 ? 'Clean sweep.' + (r.bonus ? ' +' + r.bonus + ' XP bonus.' : '') : 'Missed ' + (r.total - r.right) + '. Those stay on your weak list until you get each right twice in a row.'}</p>
    ${r.missed.length ? missList(r.missed) : ''}
    ${nextBtn || ''}
    ${endBtn}
  </section></div>`;
}
function viewSummary() {
  const x = S.summary; if (!x) return viewHome();
  const mins = Math.max(1, Math.round(((x.end || Date.now()) - x.start) / 60000));
  const weak = openMisses();
  const failedNow = (x.failed || []).filter(id => !P.passed[id]);
  const nx = nextSection();
  const li = arr => arr.length ? `<ul class="sumlist">${arr.join('')}</ul>` : '<p class="muted">Nothing.</p>';
  return `<div class="view"><section class="result">
    <span class="eyebrow">Session summary · ${mins} min</span>
    <h1 class="display" style="font-size:40px">${x.a ? (pct(x.c, x.a) >= 90 ? 'Strong session.' : pct(x.c, x.a) >= 70 ? 'Decent. Not good enough yet.' : 'Rough session. Fix the misses.') : 'No questions answered.'}</h1>
    <div class="sumgrid">
      <div class="stat"><span class="lbl">Answered</span><b>${x.a}</b></div>
      <div class="stat"><span class="lbl">Accuracy</span><b>${x.a ? pct(x.c, x.a) + '%' : '—'}</b></div>
      <div class="stat"><span class="lbl">XP earned</span><b>+${fmt(x.xp)}</b></div>
      <div class="stat"><span class="lbl">Best streak</span><b>${x.best}</b></div>
    </div>
    <div class="panel" style="width:100%"><h2>Mastered</h2>${li([...(x.passed || []).map(id => SEC[id] ? `<li>Passed card: <b>${esc(SEC[id].title)}</b></li>` : ''), ...(x.cleared || []).filter(isReal).map(id => `<li>Cleared: ${md(Q[id].q)}</li>`)].filter(Boolean))}</div>
    <div class="panel" style="width:100%"><h2>Weak on</h2>${li([...failedNow.map(id => SEC[id] ? `<li>Card not passed: <b>${esc(SEC[id].title)}</b></li>` : ''), ...weak.slice(0, 10).map(id => `<li>${md(Q[id].q)} <span class="muted">(${esc(Q[id].ref || '')})</span></li>`)].filter(Boolean))}${weak.length > 10 ? `<p class="muted">Plus ${weak.length - 10} more on your weak list.</p>` : ''}</div>
    <div class="panel" style="width:100%"><h2>Next</h2><p>${nx ? `Card: <b>${esc(nx.title)}</b> (${esc(pagesLabel(nx))}).` : REAL.length ? 'Every loaded card is passed. Send Claude the next pages of your manual.' : 'Send Claude photos of your first manual pages.'}${weak.length ? ` Your next session opens with a rapid round that hits your ${weak.length} weak question${weak.length === 1 ? '' : 's'} first.` : ''}</p></div>
    <button class="btn primary" data-act="home">Back to home</button>
  </section></div>`;
}

/* ================= toast ================= */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ================= events ================= */
const ACT = {
  home: () => go('home'),
  'start-session': () => startSession(),
  continue: () => { if (S.quiz) go('quiz'); else goNext(); },
  'end-session': () => endSession(),
  open: b => openSection(b.dataset.sid),
  quiz: b => { const s = SEC[b.dataset.sid]; if (s) startQuiz('section', s.id, sectionQuizIds(s)); },
  pick: b => pick(parseInt(b.dataset.k, 10)),
  tf: b => pick(b.dataset.v === 'true'),
  next: () => nextQ(),
  'quit-quiz': () => { S.quiz = null; go('home'); },
  'next-section': () => goNext(),
  drill: () => startQuiz('drill', null, openMisses().slice(0, 15)),
  play: () => playToggle(),
  stop: () => Reader.stop(),
  sound: () => { P.settings.sound = !P.settings.sound; save(); renderFoot(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { ACT[b.dataset.act] && ACT[b.dataset.act](b, e); return; }
  const sent = e.target.closest('#reading .sent');
  if (sent && (Reader.mode === 'claude' || Reader.mode === 'device')) play(parseInt(sent.dataset.i, 10));
});
document.addEventListener('submit', e => { if (e.target.matches('[data-form="short"]')) { e.preventDefault(); submitShort(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'sel-voice') { P.settings.voice = e.target.value; save(); if (Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur); }
  if (e.target.id === 'sel-rate') {
    P.settings.rate = parseFloat(e.target.value) || 1; save();
    if (Reader.mode === 'claude' && Reader.t && Reader.t.setRate) { try { const r = Reader.t.setRate(P.settings.rate); if (r && r.catch) r.catch(() => {}); } catch (x) {} }
    if (Reader.mode === 'device' && Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur);
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (S.view === 'quiz' && S.quiz) {
    const cur = S.quiz.cur, q = Q[cur.id];
    if (!cur.result && !cur.grading) {
      const k = e.key.toLowerCase();
      if (q.kind === 'mc') {
        let pos = LET.toLowerCase().indexOf(k); if (pos < 0 && /^[1-6]$/.test(k)) pos = parseInt(k, 10) - 1;
        if (pos >= 0 && pos < cur.order.length) { e.preventDefault(); pick(cur.order[pos]); }
      } else if (q.kind === 'tf') { if (k === 't') pick(true); if (k === 'f') pick(false); }
    } else if (cur.result && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  } else if (S.view === 'study' && e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); playToggle(); }
});

/* ================= boot (with hot reload state) ================= */
function snapshotState() { return { view: S.view, sid: S.sid, quiz: S.quiz, result: S.result, summary: S.summary, combo: S.combo }; }
function start(data) {
  try {
    if (data && data.view) {
      const okQuiz = !data.quiz || data.quiz.items.every(it => Q[it.id]);
      if (okQuiz && (!data.sid || SEC[data.sid])) { Object.assign(S, { view: data.view, sid: data.sid, quiz: data.quiz, result: data.result, summary: data.summary, combo: data.combo || 0 }); if (S.view === 'quiz' && !S.quiz) S.view = 'home'; }
    }
  } catch (e) { S.view = 'home'; }
  render();
  initDb();
}
try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === 'function') h.snapshot(snapshotState); } catch (e) {}
let started = false;
const startOnce = data => { if (started) return; started = true; start(data); };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(startOnce); } catch (e) {} setTimeout(() => startOnce({}), 1500); }
else startOnce((hot && hot.data) || {});
})();
</script>
