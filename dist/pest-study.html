"They use naturally derived and/or synthesized chemicals to control pests.","They involve the release of parasites and predators found in foreign countries."],"answer":0,"ref":"Review question 5, p. 17. Answer in the text: p. 7, 'Cultural Control'","why":"B describes chemical control and C describes biological control."},{"id":"c01-s11-t1","src":"test","kind":"mc","q":"Cultural controls are practices that:","choices":["Reduce pest establishment, reproduction, dispersal, and survival","Use natural enemies to control pests","Use laws to stop pest movement","Use chemicals to kill pests"],"answer":0,"ref":"p. 7, 'Cultural Control'","why":"Cultural controls reduce pest establishment, reproduction, dispersal, and survival."},{"id":"c01-s11-t2","src":"test","kind":"mc","style":"scenario","q":"A poultry operation has a fly problem. Which sanitation practice does the manual name for this?","choices":["Animal manure management","Crop rotation","Deer fences","Releasing parasitic wasps"],"answer":0,"ref":"p. 8, sanitation","why":"Animal manure management prevents or reduces fly problems in poultry and livestock operations."},{"id":"c01-s11-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a cultural control practice named in the manual?","choices":["Crop rotation","Timing of planting and harvesting","Trap crops","Quarantine"],"answer":3,"ref":"p. 7, 'Cultural Control'","why":"Quarantine is regulatory control."},{"id":"c01-s11-t4","src":"test","kind":"short","q":"What does the manual call one of the most important ways to control weeds?","answer":"Cultivation","accept":["cultivating"],"ref":"p. 7, 'Cultural Control'","why":"Cultivation is one of the most important ways to control weeds."},{"id":"c01-s11-t5","src":"test","kind":"mc","style":"scenario","q":"A homeowner has termite and fungal rot damage. Which sanitation step does the manual say reduces this?","choices":["Removing soil, trash, and wood debris from around and under buildings","Draining standing water","Installing bright lights","Using closed garbage containers"],"answer":0,"ref":"p. 8, sanitation","why":"Removing soil, trash, and wood debris from around and under buildings reduces termite and fungal rot damage."}]},{"id":"c01-s12","chapter":"Chapter 1 · Pest Management","title":"Genetic control","pages":[8,8],"body":[{"h":"Genetic control"},{"p":["Sometimes plants and animals can be **bred or selected to resist** specific pest problems.","For example, certain livestock breeds are selected for physical characteristics that prevent attack by some pests or provide physiological resistance to disease or parasitic organisms.","Certain plant varieties are naturally resistant to insects, pathogens, or nematodes.","Many plants actually repel various types of pests, and some contain toxic substances.","Plant resistance to insect pests can sometimes be achieved by transferring genetic material from certain insect-destroying microorganisms to hybrid seed.","Genetic control has been widely used in the past and may be an effective tool in the future, especially when combined with new gene manipulation techniques."]},{"box":"Examples of genetic control","list":["**Bacillus thuringiensis (Bt)** corn and potatoes.","Herbicide-resistant corn, for example, Roundup Ready corn and Liberty Link corn.","Herbicide-resistant cotton, for example, Roundup Ready cotton.","Herbicide-resistant soybean, for example, Roundup Ready soybean."]},{"p":["The plant is **genetically modified** through molecular techniques to add a small amount of genetic material from other organisms.","The incorporated genetic traits provide **protection from pests**, **tolerance to herbicides**, or an **improvement in quality**.","For example, **Bt crops produce a protein that kills caterpillars**."]}],"questions":[{"id":"c01-s12-r1","src":"review","kind":"mc","q":"Making use of plant varieties that are naturally resistant to insect feeding is an example of which type of pest management method?","choices":["Biological.","Genetic.","Regulatory."],"answer":1,"ref":"Review question 2, p. 17. Answer in the text: p. 8, 'Genetic Control'","why":"Plant varieties naturally resistant to insects, pathogens, or nematodes are genetic control."},{"id":"c01-s12-t1","src":"test","kind":"mc","q":"Bt corn is an example of which kind of pest control?","choices":["Biological control","Genetic control","Chemical control","Cultural control"],"answer":1,"ref":"p. 8, 'Genetic Control'","why":"The manual lists Bt corn and potatoes as examples of genetic control."},{"id":"c01-s12-t2","src":"test","kind":"mc","q":"What does the protein produced by Bt crops do?","choices":["Kills caterpillars","Kills weeds","Repels birds","Helps the crop tolerate herbicides"],"answer":0,"ref":"p. 8, 'Genetic Control'","why":"Bt crops produce a protein that kills caterpillars."},{"id":"c01-s12-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT an example of genetic control in the manual?","choices":["Roundup Ready soybean","Liberty Link corn","Bt potatoes","Bordeaux mixture"],"answer":3,"ref":"p. 8, 'Genetic Control'","why":"Bordeaux mixture is a fungicide, which is chemical control."},{"id":"c01-s12-t4","src":"test","kind":"tf","q":"Certain livestock breeds are selected for physical characteristics that prevent attack by some pests.","answer":true,"ref":"p. 8, 'Genetic Control'","why":"Some breeds are selected to prevent attack or to resist disease or parasitic organisms."},{"id":"c01-s12-t5","src":"test","kind":"mc","style":"scenario","q":"A seed company transfers genetic material from an insect-destroying microorganism into hybrid seed so the crop resists insect pests. What kind of control is this?","choices":["Genetic control","Biological control","Mass release","Sanitation"],"answer":0,"ref":"p. 8, 'Genetic Control'","why":"Building pest resistance into the plant itself is genetic control."}]},{"id":"c01-s13","chapter":"Chapter 1 · Pest Management","title":"Mechanical and physical control","pages":[8,9],"body":[{"h":"Mechanical/physical control"},{"p":["Mechanical and physical controls can **kill a pest directly** or **make its environment unsuitable**.","**Rodent traps** are examples of mechanical control.","Several types of traps are commonly used.","Some kill animals that come across them; others snare animals that are then relocated or destroyed.","Traps can be mechanical devices or sticky surfaces, some with **pheromones** incorporated to increase trapping efficiency."]},{"gallery":["p8-sticky"]},{"p":["**Physical controls** include mulches for weed management, steam soil sterilization for disease control, deer fences, screens to keep insects out, and cloth mesh to exclude birds from fruit trees.","Another example is **sealing cracks, crevices, and other small openings** in buildings to exclude insects, rodents, bats, birds, and squirrels.","A **band of sticky material** painted around tree trunks prevents crawling insects from reaching the tree's leaves."]},{"p":["Pests living in enclosed areas may sometimes be suppressed by altering physical and environmental conditions, such as **water, air movement, temperature, light, and humidity**.","**Refrigeration**, for example, protects stored food products, furs, and other items from insect pests.","Lowered temperatures kill the insects, cause them to stop feeding, and prevent egg hatch or development.","Installing **bright lights in attics** sometimes discourages bats from roosting there.","**Lowering the humidity** of stored grains and other food products reduces damage from molds and some insects.","**Increasing air movement in greenhouses** often helps to prevent fungal diseases from developing on plants."]}],"figures":[{"id":"p8-sticky","title":"Mechanical control: Sticky trap.","page":"p. 8","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3N  p. 17. Answer in the text: p. 8, 'Mechanical/Physical Control'","why":"Fences, screens, mesh, and sealed openings that keep pests out are mechanical/physical controls."},{"id":"c01-s13-r2","src":"review","kind":"mc","q":"Sealing cracks and crevices and small openings in buildings is an example of which type of pest management method?","choices":["Physical.","Genetic.","Biological."],"answer":0,"ref":"Review question 4, p. 17. Answer in the text: p. 8, 'Mechanical/Physical Control'","why":"Sealing cracks, crevices, and small openings to exclude pests is a physical control."},{"id":"c01-s13-t1","src":"test","kind":"mc","q":"Rodent traps are an example of:","choices":["Mechanical control","Biological control","Regulatory control","Genetic control"],"answer":0,"ref":"p. 8, 'Mechanical/Physical Control'","why":"The manual names rodent traps as examples of mechanical control."},{"id":"c01-s13-t2","src":"test","kind":"mc","style":"scenario","q":"Bats are roosting in an attic. Which physical control does the manual say sometimes discourages them?","choices":["Installing bright lights in the attic","Lowering the humidity","Refrigeration","Releasing predators"],"answer":0,"ref":"p. 9, 'Mechanical/Physical Control'","why":"Installing bright lights in attics sometimes discourages bats from roosting there."},{"id":"c01-s13-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a physical control listed in the manual?","choices":["Deer fences","Steam soil sterilization","Cloth mesh over fruit trees","Crop rotation"],"answer":3,"ref":"p. 8, 'Mechanical/Physical Control'","why":"Crop rotation is a cultural control."},{"id":"c01-s13-t4","src":"test","kind":"tf","q":"Increasing air movement in greenhouses often helps prevent fungal diseases from developing on plants.","answer":true,"ref":"p. 9, 'Mechanical/Physical Control'","why":"Altering air movement is one of the physical and environmental conditions you can change."},{"id":"c01-s13-t5","src":"test","kind":"short","q":"Refrigeration protects stored products from insects. Name one thing lowered temperatures do to the insects.","answer":"Kill them","accept":["kill","kills them","kill the insects","stop feeding","make them stop feeding","cause them to stop feeding","prevent egg hatch","prevent egg hatch or development","prevent development","stops egg hatch"],"ref":"p. 9, 'Mechanical/Physical Control'","why":"Lowered temperatures kill the insects, stop their feeding, and prevent egg hatch or development."}]},{"id":"c01-s14","chapter":"Chapter 1 · Pest Management","title":"Regulatory control","pages":[9,9],"body":[{"h":"Regulatory control"},{"p":["Some pest problems cannot be controlled successfully at a local level or by individuals.","These problems are caused by pests that seriously endanger **public health** or are likely to cause **widespread damage** to agricultural crops or animals, forests, or ornamental plants.","**Quarantine** or **eradication** programs directed by governmental agencies according to federal and state laws target the introduction and spread of such pests."]},{"p":["**Quarantine** is a pest control process designed to **prevent entry of certain pests into pest-free areas**.","Some states maintain inspection stations at all major entry points to intercept pests or materials that might harbor pests.","Regulatory agencies monitor airports and ocean ports.","Quarantine also prevents movement of designated pests **within a state**.","Identified items being shipped from a quarantine area must be treated to destroy pests before shipment.","Nursery stock, plant cuttings, seed shipments, and budding and grafting material are also regulated to prevent the spread of pests."]},{"gallery":["p9-usda"]},{"p":["**Eradication** is the **elimination of a pest from a designated area**.","Often, these pests are under quarantine restrictions.","When eradication is required, the geographical extent of pest infestation is determined and control measures are taken to eliminate this pest from the defined area.","Procedures may include an **area-wide spraying program, releasing sterile insects, and intensive monitoring** for pests within and around the borders of the infested area."]},{"p":["Government agencies are authorized to destroy weeds and plants that cause fire hazards, harbor harmful pathogens or animals, or are noxious to people or livestock in and around agricultural areas.","Similar authority applies to diseased or infected livestock or poultry, and to weeds and nuisance plants in residential, commercial, and industrial areas.","**Mosquito abatement** is an important pest control function undertaken to protect public health.","Mosquito abatement laws allow state agencies to **drain or treat standing water** that provides breeding sites for mosquitoes."]}],"figures":[{"id":"p9-usda","title":"Regulatory control: USDA inspections.","page":"p. 9","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGCAjADASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQGBf/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAAB9FZfCxOnOXZ0xzwdCudR0Z4Mz3F4lR75zlJ1JzEzonzjOjXNs6M5xnRrm4nSnNWHQHhzPYPHge2eFSdEc7I6A57OdUuWDqTlkdUcsHUPlkdScojqjlrDpFzjOjXOo6Nc6HRLnQ6E50OhOeDoTng6A58OgOfD3zwA9+/mfWPR5rpeZHKq03RsqFK65fP2U1J6NGWwrw7MRbq8+w1TssMsPQylZFE4sKdWaw1a8FhpyUYzTnjILIVG/JXYVyECaJjQJoqAoupvgaYQnAYAAAAAAAAAA0AIezFrPf5npuaFMD0adFBqujauVWBjz+jlTHTdkJW1eqSb1qoWxM+ffE8udtKIdZJRiVwIkrc4ao0gxMtjK4zAEhglJFSYR0Z7xikEZxEMAABAxAJokERgxRmiOzJqOg5vpObCUZnp5tmRfQnCwVdtZix7KExZ7qat05YHrUYd8R3yyHpmlL5+HZ5CNVImoKpwAbiDQ4LKpFujPYehcbrfKydAHMx6ag5w9jy0puqvhEkOMkJpgARGCGCJARYMECbFoouOh5vpObI2QkWyyXnsX+BeexXXauCq2pPOqurIEo0NEXTz3Hp156C3LECLVDQDTATAAJRC6dEo2e7zXsHoJFpOuY65i+Zk9wTnF7nlyZ0MQAJoBghgmAgQ2mAArqbTpOa6XmyLQR05thUpohdBGh52ZlZEhTpoIEmRkTL6pRM6shQmgAAAABghgA0yXpeZqjo2Fo0DTSxABoKfP9YT {"id":"c01-s14-t1","src":"test","kind":"mc","q":"What is quarantine?","choices":["A pest control process designed to prevent entry of certain pests into pest-free areas","The elimination of a pest from a designated area","Killing pests with refrigeration","Breeding plants to resist pests"],"answer":0,"ref":"p. 9, 'Regulatory Control'","why":"Quarantine keeps certain pests out of pest-free areas, and also stops their movement within a state."},{"id":"c01-s14-t2","src":"test","kind":"mc","q":"What is eradication?","choices":["The elimination of a pest from a designated area","Reducing pests below the economic injury level","Preventing pests from entering an area","Releasing natural enemies"],"answer":0,"ref":"p. 9, 'Regulatory Control'","why":"Eradication is the elimination of a pest from a designated area."},{"id":"c01-s14-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a possible eradication procedure?","choices":["An area-wide spraying program","Releasing sterile insects","Intensive monitoring in and around the infested area","Planting trap crops"],"answer":3,"ref":"p. 9, 'Regulatory Control'","why":"Trap crops are a cultural control."},{"id":"c01-s14-t4","src":"test","kind":"mc","style":"scenario","q":"A nursery wants to ship plant cuttings out of a quarantine area. What must happen first?","choices":["The items must be treated to destroy pests before shipment","Nothing; quarantine only applies at state borders","The items must be destroyed","The nursery must release sterile insects"],"answer":0,"ref":"p. 9, 'Regulatory Control'","why":"Identified items shipped from a quarantine area must be treated to destroy pests before shipment."},{"id":"c01-s14-t5","src":"test","kind":"tf","q":"Mosquito abatement laws allow state agencies to drain or treat standing water that provides breeding sites for mosquitoes.","answer":true,"ref":"p. 9, 'Regulatory Control'","why":"Mosquito abatement is done to protect public health."}]},{"id":"c01-s15","chapter":"Chapter 1 · Pest Management","title":"What IPM is","pages":[9,10],"body":[{"h":"Integrated pest management (IPM)"},{"p":["Pesticide use is a significant factor in food and fiber production, forestry, turf and landscape maintenance, and public health.","In recent years, pest management has shifted from relying heavily on pesticides to using an integrated approach based on **pest assessment, decision-making, and evaluation**.","This pest management approach has benefited pest managers and the environment, decreased pesticide use, and reduced the occurrence of pesticide resistance in pest populations."]},{"p":["**Integrated pest management** is a balanced, tactical approach to pest control.","It defines ways to **anticipate pest outbreaks and prevent pest damage**.","IPM is a pest management strategy that uses a wide range of pest control methods, for example, cultural, biological, mechanical, and chemical, or tactics such as **sanitation and exclusion**.","The goal of this strategy is to prevent pests from reaching damaging levels with the **least risk to the environment**.","Such pest management programs enable the specialist to make intelligent, **site-specific** decisions about control."]},{"box":"Integrated pest management (IPM)","p":["A pest management strategy that utilizes a wide range of pest control methods or tactics.","The goal of this strategy is to prevent pests from reaching **economically or aesthetically damaging levels** with the least risk to the environment."]},{"box":"Why practice IPM?","ol":["IPM helps to keep a balanced ecosystem.","Pesticides can be ineffective.","IPM can save money.","IPM promotes a healthy environment.","IPM maintains a good public image."]}],"questions":[{"id":"c01-s15-t1","src":"test","kind":"mc","q":"What is the goal of IPM?","choices":["Prevent pests from reaching economically or aesthetically damaging levels with the least risk to the environment","Eliminate every pest from a site","Use pesticides on a regular schedule","Rely on one control method"],"answer":0,"ref":"p. 10, 'Integrated Pest Management (IPM)' box","why":"That is the goal stated in the IPM definition box."},{"id":"c01-s15-t2","src":"test","kind":"short","q":"Define integrated pest management (IPM).","answer":"A pest management strategy that utilizes a wide range of pest control methods or tactics to prevent pests from reaching economically or aesthetically damaging levels with the least risk to the environment.","keys":[["strategy","approach"],["wide range","range","many","variety","multiple"],["methods","method","tactics","tactic"],["prevent","prevents","keep","stop"],["damaging","damage"],["least risk","lowest risk","minimal risk","less risk","least harm"],["environment","environmental"]],"ref":"p. 10, 'Integrated Pest Management (IPM)' box","why":"A strategy using a wide range of methods or tactics to prevent damaging pest levels with the least risk to the environment."},{"id":"c01-s15-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the five reasons to practice IPM?","choices":["IPM helps keep a balanced ecosystem","IPM can save money","IPM maintains a good public image","IPM guarantees pests will never return"],"answer":3,"ref":"p. 10, 'Why Practice IPM?' box","why":"The five: balanced ecosystem, pesticides can be ineffective, saves money, healthy environment, good public image."},{"id":"c01-s15-t4","src":"test","kind":"tf","q":"In recent years, pest management has shifted toward relying more heavily on pesticides.","answer":false,"ref":"p. 9, 'Integrated Pest Management (IPM)'","why":"It shifted away from heavy reliance on pesticides, toward an integrated approach."},{"id":"c01-s15-t5","src":"test","kind":"mc","style":"scenario","q":"A school wants a pest program based on pest assessment, decision-making, and evaluation, using sanitation and exclusion along with other methods. What approach is this?","choices":["Integrated pest management (IPM)","Eradication","Quarantine","Chemical control"],"answer":0,"ref":"pp. 9–10, 'Integrated Pest Management (IPM)'","why":"IPM is an integrated approach based on pest assessment, decision-making, and evaluation."}]},{"id":"c01-s16","chapter":"Chapter 1 · Pest Management","title":"Why practice IPM","pages":[10,10],"body":[{"h":"Why practice IPM?"},{"p":["**IPM helps preserve a balanced ecosystem.**","Every ecosystem, made up of living things and their nonliving environment, has a balance: the actions of one kind of organism usually affect other species.","Introducing chemicals into the ecosystem can change this balance, destroying certain species and allowing other species, sometimes other pests, to dominate.","Unfortunately, pesticides can kill **beneficial insects** that consume pests, leaving few natural pest control mechanisms."]},{"p":["**Pesticides can be ineffective.**","Chemical pesticides do not always work.","Many common weeds, insects, and disease-causing fungi have developed a resistance to pesticides.","Furthermore, pests may survive if the chemical **does not reach them, is washed off, or is applied improperly**."]},{"p":["**IPM can save money.**","A good IPM program can prevent crop loss and landscape or structural damage caused by pests.","IPM may also avoid the cost of purchasing unnecessary pesticides.","Moreover, IPM can reduce the costs of treating chronic conditions such as **asthma** by controlling disease triggers."]},{"p":["**IPM promotes a healthy environment.**","Using IPM strategies helps reduce environmental injury.","Using fewer pesticides lowers the risk that persistent chemicals may harm living creatures and contaminate **groundwater**.","It also lessens the need to dispose of containers and unused pesticides."]},{"p":["**IPM helps maintain a good public image.**","IPM is a well-known strategy that is requested in many areas of society.","IPM is used to grow food, manage turf and ornamentals, protect homes and businesses, manage school grounds, and safeguard the health of humans, pets, and livestock."]}],"questions":[{"id":"c01-s16-t1","src":"test","kind":"mc","q":"How can pesticides upset a balanced ecosystem?","choices":["They can kill beneficial insects that consume pests, leaving few natural pest control mechanisms","They always increase the number of natural enemies","They only affect the target pest","They make weeds grow more slowly"],"answer":0,"ref":"p. 10, 'Why Practice IPM?'","why":"Chemicals can destroy certain species and let others, sometimes other pests, dominate."},{"id":"c01-s16-t2","src":"test","kind":"mc","style":"scenario","q":"An apartment manager says IPM costs too much. According to the manual, how can IPM save money?","choices":["By preventing damage, avoiding unnecessary pesticide purchases, and reducing costs of treating conditions like asthma","By always using the cheapest pesticide","By spraying on a schedule","By skipping monitoring"],"answer":0,"ref":"p. 10, 'Why Practice IPM?'","why":"IPM prevents loss and damage, avoids unnecessary pesticides, and controls asthma triggers."},{"id":"c01-s16-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a reason the manual gives for why pesticides can be ineffective?","choices":["Pests have developed resistance","The chemical does not reach the pest","The chemical is washed off","The pesticide was applied correctly at the right time"],"answer":3,"ref":"p. 10, 'Why Practice IPM?'","why":"Pests survive when the chemical does not reach them, is washed off, or is applied improperly."},{"id":"c01-s16-t4","src":"test","kind":"tf","q":"Using fewer pesticides lowers the risk that persistent chemicals contaminate groundwater.","answer":true,"ref":"p. 10, 'Why Practice IPM?'","why":"That is part of how IPM promotes a healthy environment."},{"id":"c01-s16-t5","src":"test","kind":"short","q":"Name the five reasons to practice IPM.","answer":"It keeps a balanced ecosystem, pesticides can be ineffective, it saves money, it promotes a healthy environment, and it maintains a good public image.","keys":[["balanced ecosystem","balanced","balance","ecosystem"],["ineffective","not effective","do not work","don't work","doesn't work"],["save money","saves money","money","cost","costs"],["healthy environment","environment"],["public image","image","good image"]],"ref":"p. 10, 'Why Practice IPM?' box","why":"Balanced ecosystem, pesticides can be ineffective, saves money, healthy environment, good public image."}]},{"id":"c01-s17","chapter":"Chapter 1 · Pest Management","title":"IPM step 1: identify the pest","pages":[10,11],"body":[{"h":"Components of IPM"},{"p":["The components of an IPM approach can be grouped into the following five steps."]},{"box":"Components of IPM","ol":["Identify the pest and understand its biology.","Monitor the pest to be managed.","Develop the pest management goal.","Implement the IPM program.","Record and evaluate results."]},{"h":"1. Identify the pest and understand its biology"},{"p":["The first step in any pest management program is to identify the pest, whether you are dealing with an insect, weed, plant disease, or vertebrate animal.","Once you have identified the pest, you can determine its significance and the need for control.","Some pests have little impact on a plant, animal, or structure and do not require control.","Others warrant immediate control because they cause serious damage or present a significant threat to human health or public safety."]},{"p":["**Key pests** may cause major damage on a regular basis unless they are controlled.","Many weeds, for example, are key pests because they compete with crop or ornamental plants for resources and require regular control efforts to prevent or reduce damage.","Cockroaches and rodents are also examples of key pests because their waste and body coverings, shed cockroach skins and rodent hairs, can trigger **asthma** in some people."]},{"p":["**Secondary pests** become a problem when a key pest is controlled or absent.","For example, some weed species become pests only after key weeds, which are normally more successful in competing for resources, are controlled.","Certain species of fleas, ticks, and blood-feeding bugs attack people only when their natural hosts, such as pet dogs or cats, are no longer present."]},{"p":["**Occasional pests** become troublesome only once in a while because of their life cycles, environmental influences, or as a result of human activities.","For instance, ants may become occasional pests when sanitation practices change, providing them with food that previously did not exist.","They also may move into buildings after a rainfall or other event destroys an outdoor food source."]}],"questions":[{"id":"c01-s17-t1","src":"test","kind":"mc","q":"A pest that may cause major damage on a regular basis unless it is controlled is called a:","choices":["Key pest","Secondary pest","Occasional pest","Quarantine pest"],"answer":0,"ref":"p. 11, step 1 'Identify the pest'","why":"Key pests cause major damage on a regular basis unless controlled."},{"id":"c01-s17-t2","src":"test","kind":"mc","style":"scenario","q":"After a family gives away their dog, fleas in the house start biting the people. What kind of pest are these fleas?","choices":["Secondary pests","Key pests","Occasional pests","Beneficial insects"],"answer":0,"ref":"p. 11, step 1 'Identify the pest'","why":"Some fleas attack people only when their natural hosts, such as pet dogs or cats, are no longer present."},{"id":"c01-s17-t3","src":"test","kind":"mc","style":"scenario","q":"Heavy rain destroys an outdoor food source, and ants move into a building. What kind of pest are the ants?","choices":["Occasional pests","Key pests","Secondary pests","Quarantine pests"],"answer":0,"ref":"p. 11, step 1 'Identify the pest'","why":"Occasional pests become troublesome only once in a while, as when ants move in after rainfall."},{"id":"c01-s17-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the five components of IPM?","choices":["Identify the pest and understand its biology","Monitor the pest","Spray on a regular calendar schedule","Record and evaluate results"],"answer":2,"ref":"pp. 10–11, 'Components of IPM'","why":"The five: identify, monitor, develop the goal, implement, record and evaluate."},{"id":"c01-s17-t5","src":"test","kind":"short","q":"List the five components of IPM, in order.","answer":"Identify the pest, monitor the pest, develop the pest management goal, implement the IPM program, and record and evaluate results.","keys":[["identify","identification","identifying"],["monitor","monitoring"],["goal","goals"],["implement","implementation","implementing"],["record","evaluate","evaluation","recording"]],"ref":"p. 11, 'Components of IPM' box","why":"Identify, monitor, develop the goal, implement, record and evaluate."}]},{"id":"c01-s18","chapter":"Chapter 1 · Pest Management","title":"IPM step 2: monitoring, ET and EIL","pages":[11,11],"body":[{"h":"2. Monitor the target pest"},{"p":["The key to a successful IPM program is **regular monitoring**.","This involves measuring pest populations and/or the resulting damage or losses.","Monitoring procedures vary with the pest and the situation.","Carefully looking at plants or animals over time, called **scouting**, and **trapping** are often used to monitor insects and their activity.","**Weather and temperature data** are particularly helpful in following a pest's life cycle or in predicting how long it takes a certain pest to develop.","Models exist for specific insects and plant diseases that predict the need for and timing of pesticide applications."]},{"gallery":["p11-inspect"]},{"h":"Pest population thresholds"},{"p":["Agricultural or ornamental producers must understand the concept of economic thresholds.","The presence of a pest does not always cause a loss in quality or quantity of a product.","To justify the cost of control, pest populations must be large enough to cause significant damage.","The **economic threshold (ET)** is the pest population density, the number of pests per unit area, at which control measures are needed to prevent the pest from reaching the economic injury level.","The **economic injury level (EIL)** is the pest population density that causes losses equal to the cost of control measures.","To justify using a control method, it is necessary to **set the ET below the EIL**.","Otherwise, producers lose money: first from the damage caused by the pest, and then by the cost of the control method.","Setting the ET below the EIL triggers the appropriate control method before pests reach the EIL."]},{"fig":"fig-1-3"}],"figures":[{"id":"p11-inspect","title":"Inspecting a plant for pests.","page":"p. 11","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGnAUIDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAgMAAQQFBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAAB3zz94d+efh6Cees9Bfnoegnn4egnnrPQTz8PQTz0PQzz0PQTz0PRV56HoZ56HoL89R6G/O0einnYeirz1noK4EO/fn4d/PyAFGlpUkXXKtmSRZJAoNlyoXUhdSEkhJISXsMU6Y1grUuESQksSSQurhVFRUuqlXDnuQ8uPkpXIlXUJJC7Ei6llSQkkJLol0Rodns21WCt54aHJB8Za24wYcAsoBLgEMSqKjk7cG+u5MElCXEGFCqOiioiQrAhWBZ2LF9CdeJhupjKVyuvzjPtWiG3ms0QbLqUXYkUJgSpCrkOJvwb6qVJejJaVCoqXYJSg4JFXULlQKm8kSAMRnpvI9Ne4uMrEG8Tm3tzwoDWXUol1AhuFSoXUo4u/n76kqS9KFSVLouhEK09Uzv1SlZt2Iw7uJujreb9FwxRuQg0xJNmAD02jyGlfTDyttLy9XmgVAhtgRLoS7Gy6uHD2ZNVFKi9IkFI0RAh31gWQKMaALM0Dz+vFpk7XK6eNV4mIRioRmNpiJUNW7P2V51EolVZCCBjULurLsbOPozPpskXVVVM2SN50H2NtrNJQrKLC0nD0Zdqbk6cS4qNCEzKVbTwugaERvofNegXXzelZxbMCqMSWNlwRGUujnvRop0uSwipkPR87qW1VgUsliRtUNSzEc3qcvtpoy6aXlZOpisyRgFVDK0Ohi7nB7xvYhko8vtcwSFqBiKTWebSsIoclo3WyFJUPzbmeyQhaxZAAslwpDED+Z0eMD6Pz/pEVYtXFl6OcwK6Ypg328QnaheP6HgdtNTMrF1Iaw8+DkijukhDBo2oQwLt6cZJcm7D3WWiB2rDUBnU9EZQqA8vTns2dvBvlS0SBUSB1Awu7ELNoUcbq8zqo1wGpsS0xc7scamAupCakjVnuLkq6rtRclwem4HeQCx reak even, it is necessary to set the economic threshold below the economic injury level","page":"p. 11","explain":["The pest population rises over time.","The time to treat is when the population reaches the economic threshold, the dashed line, which sits below the economic injury level.","The treated population falls before it reaches the economic injury level. The untreated population climbs past it."],"svg":"<svg viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"Figure 1.3: the pest population rises over time; treatment starts at the economic threshold, which is set below the economic injury level, so the treated population falls before reaching the injury level while the untreated population passes it\"><defs><marker id=\"ah-1-3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><path class=\"s-ink\" stroke-width=\"2.5\" fill=\"none\" d=\"M70 24 V290 H626\"/><text class=\"f-ink\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\" text-anchor=\"middle\" transform=\"translate(40 158) rotate(-90)\">NUMBER OF PESTS<\/text><text class=\"f-ink\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\" x=\"348\" y=\"324\" text-anchor=\"middle\">TIME<\/text><path class=\"s-ink\" stroke-width=\"2.5\" fill=\"none\" d=\"M70 120 H626\"/><path class=\"s-muted\" stroke-width=\"2.5\" stroke-dasharray=\"9 7\" fill=\"none\" d=\"M70 160 H626\"/><path class=\"s-field\" stroke-width=\"4\" fill=\"none\" d=\"M80 272 C120 252 160 242 200 256 C240 270 272 262 300 212 C318 180 330 152 346 124 C372 88 452 54 566 42\"/><path class=\"s-ink\" stroke-width=\"3\" stroke-dasharray=\"7 6\" fill=\"none\" d=\"M326 162 C338 146 352 146 366 162 C392 194 414 240 448 270\"/><g font-family=\"var(--f-body)\" font-size=\"15\"><text class=\"f-ink\" x=\"620\" y=\"111\" text-anchor=\"end\" font-weight=\"700\">Economic injury level<\/text><text class=\"f-muted\" x=\"620\" y=\"182\" text-anchor=\"end\" font-weight=\"700\">Economic threshold<\/text><text class=\"f-ink\" x=\"540\" y=\"34\" text-anchor=\"end\">Untreated<\/text><text class=\"f-ink\" x=\"416\" y=\"214\" transform=\"rotate(58 416 214)\">Treated<\/text><text class=\"f-ink\" x=\"296\" y=\"56\" text-anchor=\"middle\">Time to treat<\/text><text class=\"f-ink\" x=\"118\" y=\"232\">Pest population<\/text><\/g><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah-1-3)\" d=\"M310 62 L326 150\"/><\/svg>"}],"questions":[{"id":"c01-s18-t1","src":"test","kind":"mc","q":"The economic injury level (EIL) is the pest population density that:","choices":["Causes losses equal to the cost of control measures","Triggers control before damage occurs","Is set by state law","Means zero pests are tolerated"],"answer":0,"ref":"p. 11, 'Pest Population Thresholds'","why":"The EIL is the pest density where losses equal the cost of control."},{"id":"c01-s18-t2","src":"test","kind":"mc","q":"Where must the economic threshold (ET) be set?","choices":["Below the EIL","Above the EIL","Equal to the EIL","At zero"],"answer":0,"ref":"p. 11, 'Pest Population Thresholds' and Figure 1.3","why":"Setting the ET below the EIL triggers control before pests reach the EIL."},{"id":"c01-s18-t3","src":"test","kind":"mc","style":"scenario","q":"A soybean grower waits to spray until the pest population reaches the economic injury level. What happens, according to the manual?","choices":["The grower loses money, first from pest damage and then from the cost of control","The grower saves money by waiting","The pests become resistant","Nothing; that is the correct timing"],"answer":0,"ref":"p. 11, 'Pest Population Thresholds'","why":"If the ET is not below the EIL, producers lose money from the damage and then from the control cost."},{"id":"c01-s18-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT described as part of monitoring pests?","choices":["Scouting","Trapping","Weather and temperature data","Treating on a calendar schedule"],"answer":3,"ref":"p. 11, 'Monitor the target pest'","why":"Scouting, trapping, and weather and temperature data are monitoring tools."},{"id":"c01-s18-t5","src":"test","kind":"short","q":"What is the economic threshold (ET)?","answer":"The pest population density at which control measures are needed to prevent the pest from reaching the economic injury level.","keys":[["population","number","density","pests"],["control"],["prevent","before","keep","stop"],["economic injury level","eil","injury level"]],"ref":"p. 11, 'Pest Population Thresholds'","why":"The ET is the pest density at which you act so the pest does not reach the EIL."}]},{"id":"c01-s19","chapter":"Chapter 1 · Pest Management","title":"Action thresholds","pages":[11,12],"body":[{"p":["For pest managers not directly involved in commodity production, the concept of an **action threshold** is more appropriate.","An action threshold is the pest level at which some type of pest management action must be taken.","This is a **predetermined pest level that is deemed unacceptable**.","Often the action threshold is expressed as the number of pests per unit area.","Below this level, IPM practitioners do not use any control measures, though they should continue to monitor the situation and do sanitation inspections as needed.","Once a pest is at or above the action threshold, you should implement appropriate IPM strategies."]},{"p":["In some situations, the action threshold for a pest may be **zero**, meaning no presence of the pest is tolerated.","Examples include pests capable of transmitting a human pathogen, for example, mosquitoes and the **West Nile virus**, or of creating a public health emergency, for example, cockroaches or rodents.","In an urban landscape, action thresholds consider not only the economic value of the landscape but also its **ecological and aesthetic roles**.","A higher action threshold would be set for insect damage when no harm is done to the plant, for example, leaf galls on a shade tree, compared to a wood-borer that may destroy the tree, which has an action threshold of zero."]},{"p":["Action thresholds may vary **by pest**, for example, a stinging insect in a classroom versus a foraging ant.","They may vary **by site**, for example, a storage room versus a school infirmary.","And they may vary **by season**, for example, pests present daily versus two weeks of a year.","Establishing action thresholds for a new IPM program will require a practical approach.","First, establish an **arbitrary action threshold** for the major pests you encounter.","Then, **revise the action levels up or down** as you gain understanding of a specific pest management setting."]}],"questions":[{"id":"c01-s19-r1","src":"review","kind":"mc","q":"Which statement about action thresholds is **true**?","choices":["The IPM technician needs to implement control measures below the action threshold level.","The action threshold for a pest may be set at a zero pest population density.","In an urban landscape, action thresholds are usually more related to economics than aesthetics."],"answer":1,"ref":"Review question 9, p. 18. Answer in the text: pp. 11–12, 'Pest Population Thresholds'","why":"A threshold can be zero. Below the threshold no controls are used, and urban thresholds weigh ecological and aesthetic roles too."},{"id":"c01-s19-t1","src":"test","kind":"mc","q":"What is an action threshold?","choices":["The pest level at which some type of pest management action must be taken","The cost of a pesticide","The date pesticides must be applied","The level at which pests become resistant"],"answer":0,"ref":"p. 11, 'Pest Population Thresholds'","why":"It is a predetermined pest level deemed unacceptable."},{"id":"c01-s19-t2","src":"test","kind":"mc","style":"scenario","q":"Mosquitoes that can carry West Nile virus are found near a school. What action threshold does the manual describe for pests like this?","choices":["Zero: no presence of the pest is tolerated","Very high, because mosquitoes are common","The same as for leaf galls on a shade tree","No threshold; just keep monitoring"],"answer":0,"ref":"p. 11, 'Pest Population Thresholds'","why":"Pests that can transmit a human pathogen can have an action threshold of zero."},{"id":"c01-s19-t3","src":"test","kind":"mc","style":"scenario","q":"Leaf galls are on a shade tree but do no harm to it. Compared with a wood-borer that may destroy the tree, the action threshold for the galls should be:","choices":["Higher","Lower","Zero","The same"],"answer":0,"ref":"p. 12, 'Pest Population Thresholds'","why":"No harm to the plant means a higher threshold. The wood-borer's threshold is zero."},{"id":"c01-s19-t4","src":"test","kind":"mc","style":"not","q":"Action thresholds may vary by all of these EXCEPT:","choices":["The pest","The site","The season","The brand of pesticide on hand"],"answer":3,"ref":"p. 12, 'Pest Population Thresholds'","why":"Thresholds vary by pest, by site, and by season."},{"id":"c01-s19-t5","src":"test","kind":"tf","q":"For a new IPM program, the manual says to first set an arbitrary action threshold for major pests, then revise it up or down as you learn.","answer":true,"ref":"p. 12, 'Pest Population Thresholds'","why":"Establishing thresholds takes a practical approach: start arbitrary, then adjust."}]},{"id":"c01-s20","chapter":"Chapter 1 · Pest Management","title":"IPM step 3: the goal, and prevention","pages":[12,12],"body":[{"h":"3. Develop the pest management goal"},{"p":["The goal of IPM programs is to keep pest damage at **economically or aesthetically acceptable levels**.","**Prevention** and **suppression** techniques are often combined in an effective IPM program.","Eradication is sometimes, though rarely, the goal.","The strategy for a sound IPM program is to coordinate the use of multiple tactics into a single integrated system.","Pesticides are just one control method.","**Nonchemical methods** may provide longer and more permanent pest control. **Consider these first** when developing a pest management strategy.","Evaluate the costs, benefits, and liabilities of each tactic."]},{"h":"Prevention"},{"p":["There are economically and environmentally sound ways to prevent loss or damage from pests.","Such techniques include planting **weed- and disease-free seed** and growing varieties of plants **resistant** to diseases or insects.","Other choices are using cultural controls to prevent weedy plants from seeding, and choosing planting and harvesting times that lessen pest problems.","Sanitation methods often reduce pest buildup.","Other preventive methods involve **excluding pests** from the target area or host, and using practices that conserve natural enemies.","Making sure that plants, poultry, or livestock receive adequate water and nutrients often reduces stress and susceptibility to diseases or pests."]},{"p":["Pesticides are sometimes used for pest prevention.","For instance, growers treat some crops and landscapes with **preplant or preemergence herbicides** because they know that weed seeds are already present.","If plant pathogens have already infected susceptible plants, economic damage usually cannot be prevented.","For this reason, **fungicides are normally applied before infection occurs**, whenever environmental conditions favor infection.","Likewise, pesticides may be applied to **structural lumber before construction** to protect it from wood-destroying insects and fungi."]}],"questions":[{"id":"c01-s20-r1","src":"review","kind":"mc","q":"Which statement about pest management strategies in IPM is **true**?","choices":["The goal is to prevent pests from reaching damaging levels.","Eradication is never the goal of an IPM program.","Nonchemical methods are short-term solutions to control pests."],"answer":0,"ref":"Review question 7, p. 17. Answer in the text: p. 10, IPM goal, and p. 12, 'Develop the pest management goal'","why":"Eradication is sometimes, though rarely, the goal, and nonchemical methods may give longer, more permanent control."},{"id":"c01-s20-t1","src":"test","kind":"mc","q":"What does the manual say to consider FIRST when developing a pest management strategy?","choices":["Nonchemical methods","The strongest pesticide available","Eradication","Fumigation"],"answer":0,"ref":"p. 12, 'Develop the pest management goal'","why":"Nonchemical methods may provide longer and more permanent control, so consider them first."},{"id":"c01-s20-t2","src":"test","kind":"mc","style":"scenario","q":"A field gets a fungal disease almost every wet spring. When does the manual say fungicides are normally applied?","choices":["Before infection occurs, whenever environmental conditions favor infection","Only after the disease is widespread","At harvest","Never, because fungicides cannot prevent disease"],"answer":0,"ref":"p. 12, 'Prevention'","why":"Once pathogens infect susceptible plants, economic damage usually cannot be prevented."},{"id":"c01-s20-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a preventive technique?","choices":["Planting weed- and disease-free seed","Growing resistant varieties","Excluding pests from the target area or host","Releasing sterile insects over an infested region"],"answer":3,"ref":"p. 12, 'Prevention'","why":"Releasing sterile insects is an eradication procedure."},{"id":"c01-s20-t4","src":"test","kind":"tf","q":"Preemergence herbicides are an example of using pesticides for prevention.","answer":true,"ref":"p. 12, 'Prevention'","why":"Growers use preplant or preemergence herbicides because they know weed seeds are already present."},{"id":"c01-s20-t5","src":"test","kind":"mc","q":"What is the goal of IPM programs, according to step 3?","choices":["Keep pest damage at economically or aesthetically acceptable levels","Eliminate all pests","Use as many pesticides as possible","Treat on a fixed schedule"],"answer":0,"ref":"p. 12, 'Develop the pest management goal'","why":"The goal is to keep damage at economically or aesthetically acceptable levels."}]},{"id":"c01-s21","chapter":"Chapter 1 · Pest Management","title":"Suppression, eradication, and IPM steps 4 and 5","pages":[12,13],"body":[{"h":"Suppression"},{"p":["Suppressive pest control methods aim to **reduce pest population levels**.","These methods usually do not eliminate all pests but reduce their populations to a tolerable level or to a point **below the EIL**.","Suppression sometimes lowers pest populations so that natural enemies can maintain control.","**Suppression is the goal of most pesticide applications.**","Other techniques, such as cultivation, mowing weeds, and releasing biological control agents, are also used to suppress pest populations."]},{"h":"Eradication"},{"p":["Eradication efforts are effective in **buildings or other small, confined spaces** where, once the pest is eliminated, it can be excluded.","For example, eliminating cockroaches, rats, and mice from **commercial food establishments** requires eradication.","Over larger areas, however, eradication is very expensive and often has limited success.","Regulatory eradication programs are usually directed at **exotic or introduced pests** posing an area-wide public health or economic threat."]},{"h":"4. Implement the integrated pest management program"},{"p":["Once you have selected appropriate methods and have set predetermined thresholds, you can initiate the IPM program.","IPM programs are specific to each situation and can be adjusted as you learn more about the pest and the site.","Observe all local, state, and federal regulations regarding the methods chosen."]},{"h":"5. Record and evaluate results"},{"p":["It is extremely important to **record and evaluate the results** of each pest management effort.","Some control methods, especially **nonchemical ones, are slow to yield measurable results**.","Other methods may be ineffective or even damage the target crop, animal, treated surface, or natural enemy.","Objectively evaluate how well your strategies work so that you will be better prepared if you must control a specific pest again."]}],"questions":[{"id":"c01-s21-r1","src":"review","kind":"mc","q":"Which would be considered a preventive pest management strategy?","choices":["Planting weed- and disease-free seed on an athletic field.","Releasing natural enemies to help reduce pest populations.","Removing a pest that is a public health concern from an area."],"answer":0,"ref":"Review question 8, p. 17. Answer in the text: p. 12, 'Prevention'","why":"Clean seed is prevention. Releasing natural enemies suppresses, and removing a pest from an area is eradication."},{"id":"c01-s21-t1","src":"test","kind":"mc","q":"What is the goal of most pesticide applications?","choices":["Suppression","Eradication","Prevention","Quarantine"],"answer":0,"ref":"p. 12, 'Suppression'","why":"Suppression is the goal of most pesticide applications."},{"id":"c01-s21-t2","src":"test","kind":"mc","style":"scenario","q":"A restaurant has cockroaches, rats, and mice. What goal does the manual say this situation requires?","choices":["Eradication","Suppression","Prevention only","Raising the action threshold"],"answer":0,"ref":"p. 12, 'Eradication'","why":"Eliminating cockroaches, rats, and mice from commercial food establishments requires eradication."},{"id":"c01-s21-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT true about eradication?","choices":["It is effective in buildings and small, confined spaces","Over large areas it is very expensive and often has limited success","Regulatory eradication targets exotic or introduced pests","It is the goal of most pesticide applications"],"answer":3,"ref":"p. 12, 'Suppression' and 'Eradication'","why":"Suppression, not eradication, is the goal of most pesticide applications."},{"id":"c01-s21-t4","src":"test","kind":"tf","q":"Some control methods, especially nonchemical ones, are slow to yield measurable results.","answer":true,"ref":"p. 13, 'Record and evaluate results'","why":"That is one reason recording and evaluating results matters."},{"id":"c01-s21-t5","src":"test","kind":"short","q":"Suppression reduces pest populations to a tolerable level or to a point below what?","answer":"The economic injury level","accept":["EIL","economic injury level","the EIL","economic injury"],"ref":"p. 12, 'Suppression'","why":"Suppression lowers populations to a tolerable level or below the EIL."}]},{"id":"c01-s22","chapter":"Chapter 1 · Pest Management","title":"Why pesticide applications fail","pages":[13,14],"body":[{"h":"Effectiveness of pest management programs"},{"p":["As noted earlier, pesticides represent only one tool in the IPM toolbox.","When combined with other control methods, they can help create an effective treatment plan to reduce pest populations.","However, pesticides might not control the pests as expected. A good pest manager needs to find out why."]},{"h":"Why pesticide applications fail"},{"p":["**Pest identification.** Sometimes a pesticide application fails because the pest was not identified correctly.","Being able to accurately identify pests requires patience and practice.","For example, knowing the difference between a **caterpillar and a sawfly** will result in success or failure when using **Bacillus thuringiensis**.","Bt is effective on caterpillars but not on sawflies.","Even nonchemical tactics may fail if the pest and susceptible life stages are not accurately identified."]},{"p":["**Dosage.** Make sure that you have applied the correct pesticide at the correct dosage, according to label instructions."]},{"p":["**Correct use.** Some herbicides are formulated to kill grasses, others for broadleaf weeds, and still others can kill both types of weeds.","Always read the pesticide label to see if the target pest is listed."]},{"p":["**Application timing.** Other applications fail because the pesticide was not applied at the correct time.","The pest may not have been in the area during the application, or it may have been in a life cycle stage where it was not susceptible to the pesticide.","**Insects are usually more vulnerable when they are immature**, and **weeds are most easily controlled before they flower and go to seed**.","Also, remember that current pests may be part of a new infestation that developed long after the chemical was applied."]},{"p":["**Application equipment.** Concealed pests, under leaves or bark, in the soil, or within stems or fruits, are difficult to reach.","This means that knowing the best type of application equipment to use is very important.","For example, use an **air-blast sprayer** for pests hiding under apple tree leaves, but a **granular applicator** during planting operations for soil-dwelling agronomic pests."]},{"p":["**Environmental conditions.** In general, do not apply pesticides just before a **rainstorm**.","The pesticide may be washed off the target plants and away from the application site.","Temperature extremes and windy conditions can move pesticides away from the target pests and site."]},{"p":["**Pesticide degradation.** Pesticides may degrade when stored.","Under some conditions, pesticides can change into a form that is ineffective, due to the age of the product or the pesticide storage conditions.","For example, **granular pesticides stored in wet or very humid conditions** will draw moisture.","This may cause **clumping and possible deactivation** of the pesticide."]}],"questions":[{"id":"c01-s22-t1","src":"test","kind":"mc","style":"scenario","q":"A grower sprays Bacillus thuringiensis (Bt) on larvae that turn out to be sawflies, and nothing dies. Why did it fail?","choices":["The pest was misidentified; Bt works on caterpillars but not sawflies","The dosage was too high","Bt only works on weeds","Bt works only on adult insects"],"answer":0,"ref":"p. 13, 'Why Pesticide Applications Fail'","why":"Knowing a caterpillar from a sawfly decides success or failure with Bt."},{"id":"c01-s22-t2","src":"test","kind":"mc","q":"When are insects usually most vulnerable to pesticides?","choices":["When they are immature","When they are adults","Only as eggs","During the winter"],"answer":0,"ref":"p. 13, application timing","why":"Insects are usually more vulnerable when they are immature."},{"id":"c01-s22-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the reasons the manual gives for pesticide application failure?","choices":["Pest identification","Application timing","Pesticide degradation","Following an IPM program"],"answer":3,"ref":"pp. 13–14, 'Why Pesticide Applications Fail'","why":"The reasons: identification, dosage, correct use, timing, equipment, environmental conditions, degradation."},{"id":"c01-s22-t4","src":"test","kind":"mc","style":"scenario","q":"Pests are hiding under apple tree leaves. Which equipment does the manual recommend?","choices":["An air-blast sprayer","A granular applicator","A sticky band","A bait station"],"answer":0,"ref":"p. 13, application equipment","why":"Air-blast sprayer for pests under apple leaves; granular applicator for soil-dwelling pests at planting."},{"id":"c01-s22-t5","src":"test","kind":"short","q":"Granular pesticides stored in wet or very humid conditions draw moisture. What can this cause?","answer":"Clumping and possible deactivation of the pesticide","keys":[["clumping","clump","clumps","clumped"],["deactivation","deactivated","deactivate","ineffective","stop working","stops working"]],"ref":"p. 14, pesticide degradation","why":"Moisture can cause clumping and possible deactivation."}]},{"id":"c01-s23","chapter":"Chapter 1 · Pest Management","title":"How pesticide resistance develops","pages":[14,14],"body":[{"h":"Pesticide resistance"},{"p":["**Pesticide resistance** is the ability of a pest to tolerate a pesticide that once controlled it.","Resistance develops when intensive pesticide use kills the **susceptible individuals** in a population but leaves the **resistant ones to reproduce**.","Initially, **higher labeled rates and more frequent applications** are needed to control resistant pests.","Eventually the pesticide will have **little or no effect** on the pest population as the resistant population grows."]},{"fig":"fig-1-4"},{"p":["Resistance may develop to a single insecticide, fungicide, herbicide, or rodenticide.","More often, however, pest populations become resistant to **chemically related pesticides in a class of compounds**.","It is also possible for a pest to develop resistance to pesticides in two or more classes of compounds with different modes of action."]},{"p":["Continual use of pesticides from the **same chemical class**, such as all growth regulator herbicides or all pyrethroid insecticides, increases the likelihood that resistance will develop in a pest population.","**Frequent applications** and **greater persistence** of the chemical further increase the chances of pesticide resistance.","Finally, resistance can spread through a pest population much more rapidly in pests that have **many generations per year and many offspring per generation**, such as many insects, mites, fungi, and rodents."]}],"figures":[{"id":"fig-1-4","title":"Figure 1.4: Pesticide resistance","page":"p. 14","explain":["Panel 1: Some individuals in a pest population have genetic traits that allow them to survive pesticide application.","Panel 2: A proportion of the survivor's offspring inherit the resistance traits. At the next spraying these resistant individuals will survive.","Panel 3: If pesticides are applied frequently, the pest population will soon consist mostly of resistant individuals."],"svg":"<svg viewBox=\"0 0 640 336\" role=\"img\" aria-label=\"Figure 1.4: pesticide resistance builds over repeated sprays until the population is mostly resistant individuals\"><rect class=\"f-card\" x=\"6\" y=\"6\" width=\"204\" height=\"290\" rx=\"8\"/><text class=\"f-field\" x=\"20\" y=\"38\" font-family=\"var(--f-display)\" font-weight=\"800\" font-size=\"26\">1<\/text><text class=\"f-ink\" x=\"44\" y=\"31\" font-family=\"var(--f-body)\" font-size=\"14\" font-weight=\"700\">Some individuals<\/text><text class=\"f-ink\" x=\"44\" y=\"50\" font-family=\"var(--f-body)\" font-size=\"14\" font-weight=\"700\">survive the spray<\/text><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L20 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L42 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L64 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L86 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L108 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L130 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L152 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L174 182\"/><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" fill=\"none\" d=\"M108 74 L196 182\"/><rect class=\"f-ink\" x=\"99\" y=\"62\" width=\"18\" height=\"12\" rx=\"2\"/><g transform=\"rotate(12 26 208)\"><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"26\" cy=\"208\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"37\" cy=\"208\" r=\"3.5\"/><\/g><g transform=\"rotate(-20 57 204)\"><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"57\" cy=\"204\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"68\" cy=\"204\" r=\"3.5\"/><\/g><g transform=\"rotate(-16 82 207)\"><ellipse class=\"f-field s-field\" fill-opa tate(29 571 233)\"><ellipse class=\"f-ink\" cx=\"571\" cy=\"233\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"582\" cy=\"233\" r=\"3.5\"/><\/g><g transform=\"rotate(30 597 240)\"><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"597\" cy=\"240\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"608\" cy=\"240\" r=\"3.5\"/><\/g><path class=\"s-ink\" stroke-width=\"1.5\" fill=\"none\" d=\"M597 231 L532 132\"/><text class=\"f-ink\" x=\"532\" y=\"126\" text-anchor=\"middle\" font-family=\"var(--f-body)\" font-size=\"13\" font-weight=\"700\">susceptible individual<\/text><g transform=\"rotate(-35 613 239)\"><ellipse class=\"f-ink\" cx=\"613\" cy=\"239\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"624\" cy=\"239\" r=\"3.5\"/><\/g><g transform=\"rotate(-29 454 264)\"><ellipse class=\"f-ink\" cx=\"454\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"465\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(-40 478 267)\"><ellipse class=\"f-ink\" cx=\"478\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"489\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-0 505 268)\"><ellipse class=\"f-ink\" cx=\"505\" cy=\"268\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"516\" cy=\"268\" r=\"3.5\"/><\/g><g transform=\"rotate(38 532 264)\"><ellipse class=\"f-ink\" cx=\"532\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"543\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(12 556 267)\"><ellipse class=\"f-ink\" cx=\"556\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"567\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-21 582 270)\"><ellipse class=\"f-ink\" cx=\"582\" cy=\"270\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"593\" cy=\"270\" r=\"3.5\"/><\/g><g transform=\"rotate(32 614 269)\"><ellipse class=\"f-ink\" cx=\"614\" cy=\"269\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"625\" cy=\"269\" r=\"3.5\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"14\"><ellipse class=\"f-ink\" cx=\"200\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"211\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"222\" y=\"323\">Resistant<\/text><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"340\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"351\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"362\" y=\"323\">Susceptible<\/text><\/g><\/svg>"}],"questions":[{"id":"c01-s23-r1","src":"review","kind":"mc","q":"Which would increase the likelihood of pesticide resistance?","choices":["An insect that has one generation per year.","Continual use of pesticides from the same chemical class.","Applying a pesticide that has little or no residual effect."],"answer":1,"ref":"Review question 10, p. 18. Answer in the text: p. 14, 'Pesticide Resistance'","why":"Many generations and greater persistence raise the chances, so A and C lower them."},{"id":"c01-s23-t1","src":"test","kind":"mc","q":"What is pesticide resistance?","choices":["The ability of a pest to tolerate a pesticide that once controlled it","A pesticide that lasts a long time","A crop that tolerates herbicides","The time it takes a pesticide to break down"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Resistance is a pest's ability to tolerate a pesticide that once controlled it."},{"id":"c01-s23-t2","src":"test","kind":"mc","style":"not","q":"Which of these does NOT increase the chances of pesticide resistance?","choices":["Continual use of pesticides from the same chemical class","Frequent applications","Greater persistence of the chemical","Pests that have few generations per year and few offspring"],"answer":3,"ref":"p. 14, 'Pesticide Resistance'","why":"Many generations and many offspring speed resistance up. Few does not."},{"id":"c01-s23-t3","src":"test","kind":"mc","style":"scenario","q":"A turf manager uses only pyrethroid insecticides, year after year. What does the manual say this does?","choices":["Increases the likelihood that resistance will develop","Prevents resistance because pyrethroids are a single class","Has no effect on resistance","Makes the pests more susceptible"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Continual use of one chemical class, such as all pyrethroids, increases the likelihood of resistance."},{"id":"c01-s23-t4","src":"test","kind":"tf","q":"Resistance spreads much more rapidly in pests with many generations per year and many offspring per generation.","answer":true,"ref":"p. 14, 'Pesticide Resistance'","why":"Many insects, mites, fungi, and rodents fit this description."},{"id":"c01-s23-t5","src":"test","kind":"mc","q":"In the early stages of resistance, what happens?","choices":["Higher labeled rates and more frequent applications are needed to control the pests","The pesticide stops working completely right away","The pests die faster than before","Natural enemies take over"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"First it takes higher rates and more applications; eventually the pesticide has little or no effect."}]},{"id":"c01-s24","chapter":"Chapter 1 · Pest Management","title":"Delaying pesticide resistance","pages":[14,15],"body":[{"p":["Several pest management tactics help **prevent or delay** the occurrence of pesticide resistance.","One approach is the use of **new or altered pesticides**.","Using new compounds with **different modes of action** will lessen the likelihood of resistance developing in a population.","Most pesticides have a **code number at the top of the label** indicating the mode of action, for example, **Group 4A Insecticides, Neonicotinoids**, or **Group 2 Herbicides, ALS Inhibitors**.","Unfortunately, new replacement products are often quite complex, difficult to synthesize, and very costly to develop.","Moreover, they have very specific modes of action, which can rapidly lead to the development of resistant pest populations even after limited use in the field.","No longer can we expect to respond to pesticide resistance by merely substituting one pesticide for another."]},{"p":["**Changing pesticide use patterns** is an important step in preventing resistance.","When **dosages are reduced**, fewer pests are killed, so the pressure to develop resistant pest populations is decreased.","**Applying pesticides over limited areas** reduces the proportion of the total pest population exposed to the chemical.","The result is a large pool of individuals still susceptible to the pesticide.","This tactic tends to delay the development of a resistant population because pesticide-susceptible individuals continue to interbreed with resistant ones, thus **diluting the resistance** in the population.","Also, **treating alternate generations** of pests with pesticides that have different modes of action decreases the selection pressure for resistance."]},{"p":["Managing pesticide resistance is a critical aspect of integrated pest management.","Monitor pest populations carefully and **treat only when necessary instead of on a schedule**.","Good pesticide **application records** are another important part of resistance management.","Pesticides are more effectively managed when **treatment history** is known.","Resistance must be **detected when it is at a very low level**.","It should then be controlled by using all available pest management techniques to extend the useful life of our current pesticides."]}],"questions":[{"id":"c01-s24-t1","src":"test","kind":"mc","q":"Where do most pesticides show a code number for the mode of action?","choices":["At the top of the label","In the storage section","In the first aid section","On the container cap"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Examples: Group 4A Insecticides, Neonicotinoids, or Group 2 Herbicides, ALS Inhibitors."},{"id":"c01-s24-t2","src":"test","kind":"mc","style":"scenario","q":"A grower wants to slow resistance. Which plan follows the manual?","choices":["Treat alternate generations with pesticides that have different modes of action","Use the same pesticide at higher rates every week","Treat the whole area on a fixed schedule","Switch to a new product with the same mode of action"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"Treating alternate generations with different modes of action decreases selection pressure."},{"id":"c01-s24-t3","src":"test","kind":"mc","style":"not","q":"Which of these does NOT help delay resistance, according to the manual?","choices":["Reducing dosages","Applying pesticides over limited areas","Treating only when necessary","Treating on a calendar schedule"],"answer":3,"ref":"pp. 14–15, 'Pesticide Resistance'","why":"Treat only when necessary instead of on a schedule."},{"id":"c01-s24-t4","src":"test","kind":"mc","q":"Why does applying pesticides over limited areas delay resistance?","choices":["Susceptible individuals keep interbreeding with resistant ones, diluting the resistance","It kills every pest in the area","It makes pests resistant faster","It lowers the cost of pesticides"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"A large pool of susceptible pests remains, and they dilute the resistance."},{"id":"c01-s24-t5","src":"test","kind":"short","q":"Using mode of action, what is one way to lessen the chance of resistance?","answer":"Use pesticides with different modes of action","keys":[["different","rotate","rotating","alternate","alternating","change","changing","switch","switching"],["mode of action","modes of action","moa","mode","modes"]],"ref":"p. 14, 'Pesticide Resistance'","why":"New compounds with different modes of action lessen the likelihood of resistance."}]},{"id":"c01-s25","chapter":"Chapter 1 · Pest Management","title":"Chapter 1 summary","pages":[15,15],"body":[{"h":"Summary"},{"p":["A successful pest management program begins with the **proper identification** of the pest.","Choosing the appropriate pest control method depends on recognizing and understanding the pest, its **life cycle, habits, and habitat**.","Integrated pest management programs attempt to balance the need for pest control with the desire to protect the environment from pesticide contamination.","**Monitoring** is critical to knowing where pests are located, when to act against growing pest populations, and what type of control measures to use.","Evaluation and recording results help to determine how well the IPM program is working and whether there are any harmful human or environmental effects."]},{"p":["Minimizing pesticide resistance is critical for sustaining the effectiveness of pest management programs.","Using a variety of tools and techniques will help prevent or delay the occurrence of pesticide resistance.","If the pest has not been properly identified, **even nonchemical control tactics will fail**.","It is your responsibility to consider the effects of pest control actions on the **entire treatment site**, whether an outdoor area or inside a structure.","Use good judgment, especially when pesticides are part of the control strategy, to avoid harmful effects to other living organisms and the environment."]}],"questions":[{"id":"c01-s25-t1","src":"test","kind":"mc","q":"According to the chapter summary, a successful pest management program begins with:","choices":["Proper identification of the pest","Choosing a pesticide","Eradication","Setting the economic injury level"],"answer":0,"ref":"p. 15, 'Summary'","why":"Everything else depends on knowing what the pest is."},{"id":"c01-s25-t2","src":"test","kind":"tf","q":"If a pest has not been properly identified, nonchemical control tactics will still work.","answer":false,"ref":"p. 15, 'Summary'","why":"Without proper identification, even nonchemical control tactics will fail."},{"id":"c01-s25-t3","src":"test","kind":"mc","style":"not","q":"Monitoring helps you know all of these EXCEPT:","choices":["Where pests are located","When to act against growing pest populations","What type of control measures to use","Which pesticide brand is cheapest"],"answer":3,"ref":"p. 15, 'Summary'","why":"Monitoring tells you where pests are, when to act, and what control to use."},{"id":"c01-s25-t4","src":"test","kind":"mc","style":"scenario","q":"You are treating a building for pests. Whose responsibility is it to consider the effects of the treatment on the entire treatment site?","choices":["Yours, as the applicator","Only the building owner's","The pesticide manufacturer's","EPA's"],"answer":0,"ref":"p. 15, 'Summary'","why":"It is your responsibility, outdoors or inside a structure."}]},{"id":"c03-s01","chapter":"Chapter 3 · Pesticide Labeling","title":"Chapter goals, the label, and EPA approval","pages":[31,32],"body":[{"box":"Learning objectives","p":["After studying this chapter, you should be able to do the following."],"list":["Distinguish between the various types of pesticide registrations.","Explain when to read the pesticide label.","State who may use a pesticide.","Accurately identify the common, chemical, and brand or trade name of a pesticide.","Determine the percentage of active ingredient or ingredients in a formulation.","Interpret the meaning of label signal words, symbols, and their relative hazard levels.","Identify these types of statements on a pesticide label: precautionary; first aid; personal protective equipment; environmental, physical, or chemical hazards; mixing, loading, storage, and disposal; and restricted entry and reentry.","Describe how to interpret other documents and online resources referenced on the label.","Distinguish between advisory and mandatory statements on a label.","Discuss how to use information on a Safety Data Sheet."]},{"fig":"p31-jug"},{"h":"Label and labeling"},{"p":["The **pesticide label** is the main method of communication between a pesticide manufacturer and pesticide users.","The information printed on and attached to the pesticide container is the label.","**By law, pesticide users are required to comply with all instructions and use directions found on the pesticide product label.**","**Labeling** includes the label itself plus all other information about the product referenced on the label and given when you buy the product.","For example, the labeling may include information that accompanies the product in the form of a comprehensive product-use manual, brochures, leaflets, and/or **Safety Data Sheets (SDSs)**.","Pesticide labeling includes instructions on how to use the product safely and correctly."]},{"h":"EPA approval of pesticide labeling"},{"fig":"p32-shelf"},{"p":["As discussed in Chapter 2, Federal Pesticide Laws and Regulations, no pesticide may be sold in the United States until the **Environmental Protection Agency (EPA)** has reviewed the manufacturer's application for registration.","EPA must determine that the use of the product does not present an **unreasonable risk** to humans, wildlife, or the environment.","As part of the registration process, EPA must approve all language that the manufacturer, or **registrant**, proposes to include in the product labeling.","Exceptions to the registration requirement are covered under a specific exemption, explained later in this chapter under Types of Pesticide Registration.","Only after EPA has reviewed the labeling and registered the product can a pesticide product be sold for use.","If the manufacturer wants to change the information on the labeling after the product and labeling are registered, **EPA must approve the change**."]}],"figures":[{"id":"p31-jug","title":"A pesticide container with its label.","page":"p. 31","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAIwAdkDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAE
