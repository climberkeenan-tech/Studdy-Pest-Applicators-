<svg viewBox="0 0 960 360" role="img" aria-label="Three shapes from page 164. A rectangle 1,320 feet long by 120 feet wide: area is length times width, 158,400 square feet, 3.6 acres. A triangle with a base of 325 feet and a height of 150 feet: area is base times height divided by 2, 24,375 square feet, 0.6 acre. A circle with a 90 foot diameter and 45 foot radius: area is 3.14 times radius squared, 6,358.5 square feet, 0.15 acre.">
  <defs>
    <marker id="ah-11-area" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-ink" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>
  <g font-family="var(--f-body)">
    <!-- rectangle -->
    <text class="f-ink" x="160" y="26" text-anchor="middle" font-size="19" font-weight="700" font-family="var(--f-display)">Rectangle</text>
    <rect class="f-field" fill-opacity=".35" x="40" y="60" width="210" height="130"/>
    <path class="s-ink" stroke-width="2" fill="none" marker-start="url(#ah-11-area)" marker-end="url(#ah-11-area)" d="M40 206 H250"/>
    <text class="f-ink" x="145" y="228" text-anchor="middle" font-size="15" font-weight="700">LENGTH 1,320 ft.</text>
    <path class="s-ink" stroke-width="2" fill="none" marker-start="url(#ah-11-area)" marker-end="url(#ah-11-area)" d="M266 60 V190"/>
    <text class="f-ink" font-size="15" font-weight="700" text-anchor="middle" transform="translate(290 125) rotate(-90)">WIDTH 120 ft.</text>
    <text class="f-ink" x="160" y="268" text-anchor="middle" font-size="16" font-family="var(--f-mono)">length × width</text>
    <text class="f-ink" x="160" y="296" text-anchor="middle" font-size="16" font-family="var(--f-mono)">= 158,400 sq. ft.</text>
    <text class="f-ink" x="160" y="324" text-anchor="middle" font-size="16" font-weight="700" font-family="var(--f-mono)">= 3.6 A</text>

    <!-- triangle -->
    <text class="f-ink" x="480" y="26" text-anchor="middle" font-size="19" font-weight="700" font-family="var(--f-display)">Triangle</text>
    <path class="f-field" fill-opacity=".35" d="M470 52 L580 190 L360 190 Z"/>
    <path class="s-ink" stroke-width="2" fill="none" marker-start="url(#ah-11-area)" marker-end="url(#ah-11-area)" d="M470 56 V186"/>
    <text class="f-ink" font-size="15" font-weight="700" text-anchor="middle" transform="translate(458 140) rotate(-90)">HEIGHT 150 ft.</text>
    <path class="s-ink" stroke-width="2" fill="none" marker-start="url(#ah-11-area)" marker-end="url(#ah-11-area)" d="M360 206 H580"/>
    <text class="f-ink" x="470" y="228" text-anchor="middle" font-size="15" font-weight="700">BASE 325 feet</text>
    <text class="f-ink" x="480" y="268" text-anchor="middle" font-size="16" font-family="var(--f-mono)">(base × height) ÷ 2</text>
    <text class="f-ink" x="480" y="296" text-anchor="middle" font-size="16" font-family="var(--f-mono)">= 24,375 sq. ft.</text>
    <text class="f-ink" x="480" y="324" text-anchor="middle" font-size="16" font-weight="700" font-family="var(--f-mono)">= 0.6 A</text>

    <!-- circle -->
    <text class="f-ink" x="800" y="26" text-anchor="middle" font-size="19" font-weight="700" font-family="var(--f-display)">Circle</text>
    <circle class="f-field" fill-opacity=".35" cx="800" cy="125" r="80"/>
    <path class="s-ink" stroke-width="2" fill="none" marker-start="url(#ah-11-area)" marker-end="url(#ah-11-area)" d="M722 112 H878"/>
    <text class="f-ink" x="800" y="100" text-anchor="middle" font-size="15" font-weight="700">DIAMETER 90 feet</text>
    <path class="s-ink" stroke-width="2" fill="none" marker-end="url(#ah-11-area)" d="M800 150 H878"/>
    <circle class="f-ink" cx="800" cy="150" r="4"/>
    <text class="f-ink" x="839" y="174" text-anchor="middle" font-size="15" font-weight="700">RADIUS 45 ft.</text>
    <text class="f-ink" x="800" y="240" text-anchor="middle" font-size="16" font-family="var(--f-mono)">3.14 × r²</text>
    <text class="f-ink" x="800" y="268" text-anchor="middle" font-size="16" font-family="var(--f-mono)">3.14 × 45²</text>
    <text class="f-ink" x="800" y="296" text-anchor="middle" font-size="16" font-family="var(--f-mono)">= 6,358.5 sq. ft.</text>
    <text class="f-ink" x="800" y="324" text-anchor="middle" font-size="16" font-weight="700" font-family="var(--f-mono)">= 0.15 A</text>
  </g>
  <text class="f-muted" x="480" y="354" text-anchor="middle" font-size="14" font-family="var(--f-mono)">1 acre (A) = 43,560 sq. ft.</text>
</svg>
