\"160\">pesticide<\/text><text class=\"f-ink\" x=\"270\" y=\"160\">soil<\/text><path class=\"s-muted\" stroke-width=\"1\" d=\"M10 190 H650 M10 215 H650 M10 240 H650\"/><text class=\"f-ink\" x=\"250\" y=\"210\">aquifer<\/text><rect class=\"f-muted\" x=\"410\" y=\"96\" width=\"44\" height=\"24\" rx=\"4\" transform=\"rotate(-12 432 108)\"/><g class=\"f-field\"><circle cx=\"450\" cy=\"140\" r=\"5\"/><circle cx=\"462\" cy=\"165\" r=\"5\"/><circle cx=\"446\" cy=\"190\" r=\"5\"/><circle cx=\"470\" cy=\"215\" r=\"5\"/><circle cx=\"456\" cy=\"240\" r=\"5\"/><\/g><text class=\"f-ink\" x=\"350\" y=\"160\">pesticide<\/text><path class=\"s-ink\" stroke-width=\"3\" d=\"M500 70 V250\"/><text class=\"f-ink\" x=\"490\" y=\"62\">well<\/text><path class=\"f-field\" fill-opacity=\".8\" d=\"M570 120 q20 18 40 0 Z\"/><text class=\"f-ink\" x=\"560\" y=\"104\">sink hole<\/text><text class=\"f-ink\" x=\"140\" y=\"292\" text-anchor=\"middle\">Non-point-source Pollution<\/text><text class=\"f-ink\" x=\"500\" y=\"292\" text-anchor=\"middle\">Point-source Pollution<\/text><\/g><\/svg>"}],"questions":[{"id":"c07-s10-t1","src":"test","kind":"mc","q":"Who is legally responsible for damages resulting from the off-target movement of pesticides?","choices":["The applicator","The pesticide manufacturer","The EPA","The neighboring property owner"],"answer":0,"ref":"p. 111, 'Applicator Responsibility'","why":"As an applicator, you are legally responsible for damages from off-target movement."},{"id":"c07-s10-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT an example of point-source pollution?","choices":["Pesticides moving into streams after broadcast applications to large fields","A pesticide spill entering a storm sewer","Back-siphoning of pesticides into water supplies","Repeated spilling at a mixing and loading site"],"answer":0,"ref":"p. 112, 'Sources of Water Contamination'","why":"Broadcast applications to large fields are the manual's example of nonpoint-source pollution."},{"id":"c07-s10-t3","src":"test","kind":"mc","style":"scenario","q":"Groundwater testing finds a pesticide plume traced to a farm's equipment wash area, where rinse water has been dumped on the same spot for years. What type of pollution is this?","choices":["Point-source pollution","Nonpoint-source pollution","Vapor drift","Photodegradation"],"answer":0,"ref":"p. 112, 'Sources of Water Contamination'","why":"It comes from a specific, identifiable location: careless spilling of wash water at a cleanup site."},{"id":"c07-s10-t4","src":"test","kind":"tf","q":"A good drift management program relies on one main drift-reducing technique.","answer":false,"ref":"p. 112, 'Applicator Responsibility'","why":"It includes a combination of all drift-reducing techniques available for the application."},{"id":"c07-s10-t5","src":"test","kind":"short","q":"What type of pollution comes from a widespread area rather than a specific location?","answer":"nonpoint-source pollution","accept":["nonpoint source","non-point-source","nonpoint"],"keys":[["nonpoint","non-point","non point"]],"ref":"p. 112, 'Sources of Water Contamination'","why":"Nonpoint-source pollution comes from a widespread area."}]},{"id":"c07-s11","chapter":"Chapter 7 · Pesticides in the Environment","title":"Pesticide contamination of surface water","pages":[112,113],"body":[{"h":"Pesticide contamination of surface water"},{"p":["Surface water is often a **source of drinking water**.","Therefore, pesticide contamination of surface water, such as ditches, streams, rivers, ponds, and lakes, is a **health concern**.","Pesticides that move in runoff water or with eroded sediment may contaminate plants and animals located downslope and reach sources of surface water."]},{"p":["Factors affecting runoff and erosion rates include **slope**, **vegetative cover**, **soil characteristics**, **volume and rate of water moving downslope**, **temperature**, and **rainfall amount and intensity**.","These factors influence how much water runs off and how much moves into the soil, called **infiltration**.","In urban areas, runoff may occur on hard surfaces when **granules are left on sidewalks and streets**."]},{"p":["Runoff is a potential problem for most outdoor application sites.","In areas treated with any type of pesticide, it is critical that runoff does not carry the pesticide into water sources or other vulnerable areas.","Generally, runoff risk is **greatest** when **heavy rains immediately follow** pesticide applications, or when the ground is **saturated or frozen**.","Although surface waters are most likely to be contaminated by runoff, groundwater may also be affected when surface streams connect with shallow groundwater."]}],"questions":[{"id":"c07-s11-t1","src":"test","kind":"mc","style":"scenario","q":"An applicator treats a field on a Tuesday. Which forecast creates the greatest runoff risk?","choices":["Heavy rain starting an hour after the application","Light breeze and sun for three days","Cool, dry weather all week","A light shower a week later"],"answer":0,"ref":"p. 113, runoff paragraph","why":"Runoff risk is greatest when heavy rains immediately follow an application."},{"id":"c07-s11-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a factor affecting runoff and erosion rates?","choices":["Pesticide color","Slope","Vegetative cover","Rainfall amount and intensity"],"answer":0,"ref":"p. 112, 'Pesticide Contamination of Surface Water'","why":"Factors are slope, vegetative cover, soil characteristics, water volume and rate, temperature, and rainfall."},{"id":"c07-s11-t3","src":"test","kind":"short","q":"What is the term for water moving into the soil rather than running off?","answer":"infiltration","accept":["infiltrate"],"ref":"p. 112, 'Pesticide Contamination of Surface Water'","why":"Movement of water into the soil is called infiltration."},{"id":"c07-s11-t4","src":"test","kind":"tf","q":"Runoff risk is lower when the ground is frozen, because frozen soil holds pesticides in place.","answer":false,"ref":"p. 113, runoff paragraph","why":"Runoff risk is greatest when the ground is saturated or frozen."},{"id":"c07-s11-t5","src":"test","kind":"mc","q":"In urban areas, what does the manual say can cause runoff from hard surfaces?","choices":["Granules left on sidewalks and streets","Applying pesticides indoors","Using low-pressure nozzles","Closing windows and vents"],"answer":0,"ref":"p. 112, 'Pesticide Contamination of Surface Water'","why":"Runoff may occur on hard surfaces when granules are left on sidewalks and streets."}]},{"id":"c07-s12","chapter":"Chapter 7 · Pesticides in the Environment","title":"Groundwater and leaching","pages":[113,114],"body":[{"h":"Pesticide contamination of groundwater"},{"p":["Groundwater provides **70 percent** of the water used for public and private water supplies, irrigation, and industry.","Like surface water, groundwater must be protected from contamination.","Once groundwater is contaminated, correcting the problem is **difficult or even impossible**.","Groundwater is found underground in cracks in the bedrock and in the spaces between soil particles, gravel, and rocks.","It is the source of water for **wells and springs**."]},{"p":["The layer of soil, sand, gravel, or fractured bedrock in which all available spaces are filled with water is the **saturated zone**.","The boundary between the saturated zone and the overlying unsaturated rock and soil is known as the **water table**.","The overall geologic formation from which groundwater can be drawn is called an **aquifer**. See Figure 7.6."]},{"fig":"fig-7-6"},{"h":"Leaching"},{"p":["Some pesticides reach groundwater by moving through the soil in a process called **leaching**.","A pesticide that leaches into groundwater must move down through the soil in water, and resist binding to soil particles and breaking down into nontoxic compounds.","Pesticides that have **high solubility**, **low adsorption**, and/or are **persistent** are more likely to leach.","They typically have a label statement describing these concerns.","A pesticide that adsorbs or binds itself strongly to soil particles will not leach as easily.","Besides the characteristics of the pesticide, soil properties and environmental conditions also affect whether and to what extent a pesticide will leach."]}],"figures":[{"id":"fig-7-6","title":"Figure 7.6: Where groundwater occurs.","page":"p. 114","explain":["Below the surface is the unsaturated zone. The water table marks the top of the saturated zone, or aquifer, here in gravel above fractured bedrock.","A well draws from the aquifer, and groundwater connects to surface water."],"svg":"<svg viewBox=\"0 0 660 300\" role=\"img\" aria-label=\"Figure 7.6: Where groundwater occurs. Under the surface is an unsaturated zone, then the water table, then the saturated zone or aquifer in gravel, above fractured bedrock. A well reaches down into the aquifer, and groundwater connects to surface water\"><defs><marker id=\"a76\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><g font-family=\"var(--f-body)\" font-size=\"15\" font-weight=\"700\"><path class=\"f-muted\" d=\"M70 50 L95 30 L120 50 V70 H70 Z\"/><g class=\"f-field\"><path d=\"M200 70 l14 -40 l14 40 Z M250 70 l14 -44 l14 44 Z M330 70 l14 -40 l14 40 Z M400 70 l14 -36 l14 36 Z\"/><\/g><path class=\"f-field\" fill-opacity=\".15\" d=\"M10 70 H500 L560 100 H650 V290 H10 Z\"/><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" d=\"M10 70 H500 L560 100 H650\"/><path class=\"f-field\" fill-opacity=\".7\" d=\"M560 100 H650 V112 H580 Z\"/><text class=\"f-ink\" x=\"648\" y=\"92\" text-anchor=\"end\">Surface water<\/text><text class=\"f-ink\" x=\"160\" y=\"98\">Unsaturated zone<\/text><path class=\"s-ink\" stroke-width=\"2\" stroke-dasharray=\"7 4\" d=\"M10 112 H650\"/><text class=\"f-ink\" x=\"420\" y=\"108\" font-size=\"13\">Water table<\/text><rect class=\"f-field\" fill-opacity=\".35\" x=\"10\" y=\"112\" width=\"640\" height=\"50\"/><g class=\"f-muted\" fill-opacity=\".7\"><circle cx=\"40\" cy=\"130\" r=\"5\"/><circle cx=\"80\" cy=\"150\" r=\"4\"/><circle cx=\"560\" cy=\"130\" r=\"5\"/><circle cx=\"610\" cy=\"148\" r=\"4\"/><circle cx=\"450\" cy=\"150\" r=\"4\"/><\/g><text class=\"f-ink\" x=\"190\" y=\"143\">Saturated zone (aquifer)<\/text><text class=\"f-ink\" x=\"300\" y=\"180\" font-size=\"13\">Gravel<\/text><rect class=\"f-muted\" fill-opacity=\".35\" x=\"10\" y=\"162\" width=\"640\" height=\"128\"/><g class=\"s-ink\" stroke-width=\"1\" fill=\"none\"><path d=\"M40 162 L90 290 M120 162 L170 290 M200 162 L250 290 M280 162 L330 290 M360 162 L410 290 M440 162 L490 290 M520 162 L570 290 M600 162 L650 270 M10 210 H650 M10 250 H650\"/><\/g><text class=\"f-ink\" x=\"100\" y=\"200\">Fractured bedrock<\/text><path class=\"s-ink\" stroke-width=\"2\" marker-start=\"url(#a76)\" marker-end=\"url(#a76)\" d=\"M200 270 H460\"/><rect class=\"f-card\" x=\"275\" y=\"258\" width=\"110\" height=\"24\" rx=\"4\" style=\"stroke:none\"/><text class=\"f-ink\" x=\"330\" y=\"276\" text-anchor=\"middle\">Groundwater<\/text><path class=\"s-ink\" stroke-width=\"4\" d=\"M40 40 V170\"/><text class=\"f-ink\" x=\"26\" y=\"32\">Well<\/text><\/g><\/svg>"}],"questions":[{"id":"c07-s12-t1","src":"test","kind":"mc","q":"Groundwater provides what percentage of the water used for public and private water supplies, irrigation, and industry?","choices":["70 percent","50 percent","30 percent","90 percent"],"answer":0,"ref":"p. 113, 'Pesticide Contamination of Groundwater'","why":"Groundwater provides 70 percent of that water."},{"id":"c07-s12-t2","src":"test","kind":"short","q":"What is the boundary between the saturated zone and the overlying unsaturated rock and soil called?","answer":"water table","accept":["the water table"],"ref":"p. 113, 'Pesticide Contamination of Groundwater'","why":"That boundary is the water table."},{"id":"c07-s12-t3","src":"test","kind":"mc","q":"What is the overall geologic formation from which groundwater can be drawn?","choices":["An aquifer","The water table","A sinkhole","The root zone"],"answer":0,"ref":"p. 113, 'Pesticide Contamination of Groundwater'","why":"The overall geologic formation from which groundwater can be drawn is an aquifer."},{"id":"c07-s12-t4","src":"test","kind":"mc","style":"scenario","q":"You must choose between four insecticides near a shallow well. Which one is most likely to leach?","choices":["High solubility, low adsorption, persistent","Low solubility, high adsorption, short half-life","Low solubility, high adsorption, persistent","High adsorption, breaks down in hours"],"answer":0,"ref":"p. 113, 'Leaching'","why":"High solubility, low adsorption, and persistence make leaching more likely."},{"id":"c07-s12-t5","src":"test","kind":"tf","q":"Once groundwater is contaminated, the problem is usually easy to correct.","answer":false,"ref":"p. 113, 'Pesticide Contamination of Groundwater'","why":"Correcting it is difficult or even impossible."},{"id":"c07-s12-t6","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a place the manual says groundwater is found?","choices":["Only in underground lakes and rivers","In cracks in the bedrock","In spaces between soil particles","In spaces between gravel and rocks"],"answer":0,"ref":"p. 113, 'Pesticide Contamination of Groundwater'","why":"It is found in bedrock cracks and in spaces between soil particles, gravel, and rocks."}]},{"id":"c07-s13","chapter":"Chapter 7 · Pesticides in the Environment","title":"Soil properties that affect leaching","pages":[113,115],"body":[{"h":"Soil properties"},{"p":["**Four** soil properties affect a pesticide's potential for leaching: **texture and structure**, **organic matter**, **depth to groundwater**, and **geology**."]},{"h":"Texture and structure"},{"p":["**Soil texture** is the relative proportions of sand, silt, and clay-sized particles.","Percolating water moves **faster in sandy soils**.","Sand also has **fewer binding sites** available for the adsorption of dissolved chemicals than do clay or silt soils.","Though sandy soils are more prone to pesticide movement, leaching may also occur in clay or silt soils.","**Soil structure** is the shape or arrangement of soil particles. It plays a big role in determining the size and shape of the pores through which water moves.","Small amounts of pesticides may also move through soil cracks, worm holes, and root channels. These features are called **macropores**."]},{"fig":"fig-p114-soil"},{"h":"Organic matter"},{"p":["Organic matter consists of decaying plant material.","The **higher** the soil organic matter content, the **greater** the ability of the soil to hold both water and adsorbed pesticides.","Pesticides held in the **root zone** are less likely to leach into groundwater and may be taken up by plants."]},{"h":"Depth to groundwater"},{"p":["Areas with a **shallow water table** have a greater chance for groundwater contamination, because less soil is available to act as a filter.","There are fewer opportunities for pesticide degradation or adsorption.","When using pesticides in areas where the groundwater is close to the surface, choose a product with a **low leaching potential**.","Take extra precautions during mixing, application, and cleanup."]},{"h":"Geology"},{"p":["The **permeability** of the geologic layers lying between the surface of the soil and the groundwater is also an important factor.","Highly permeable materials, such as **gravel deposits**, allow water and dissolved pesticides to move freely downward to groundwater.","**Layers of clay**, which are much less permeable, can inhibit and slow the downward movement of water."]},{"fig":"tab-7-2"}],"figures":[{"id":"fig-p114-soil","title":"Sandy soil has large pores. Clay soil has small pores.","page":"p. 114","explain":["Pesticide moves easily through the large pores between sand grains, and more slowly through the small pores between flat clay particles."],"svg":"<svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"Sandy soil has large pores; clay soil has small pores. Pesticide moves between soil particles\"><g font-family=\"var(--f-body)\" font-size=\"15\" font-weight=\"700\"><g class=\"s-field\" stroke-width=\"3\" fill=\"none\"><path d=\"M150 100 V30 M150 60 l-20 -14 M150 45 l20 -14\"/><path d=\"M470 100 V30 M470 60 l-20 -14 M470 45 l20 -14\"/><\/g><rect class=\"f-card\" x=\"60\" y=\"100\" width=\"180\" height=\"100\"/><g class=\"f-muted\"><circle cx=\"90\" cy=\"130\" r=\"18\"/><circle cx=\"145\" cy=\"125\" r=\"20\"/><circle cx=\"205\" cy=\"132\" r=\"18\"/><circle cx=\"110\" cy=\"176\" r=\"18\"/><circle cx=\"175\" cy=\"176\" r=\"20\"/><\/g><g class=\"f-field\"><circle cx=\"118\" cy=\"150\" r=\"5\"/><circle cx=\"178\" cy=\"150\" r=\"5\"/><circle cx=\"140\" cy=\"190\" r=\"4\"/><\/g><rect class=\"f-card\" x=\"380\" y=\"100\" width=\"180\" height=\"100\"/><g class=\"f-muted\"><rect x=\"388\" y=\"108\" width=\"40\" height=\"10\"/><rect x=\"434\" y=\"110\" width=\"44\" height=\"10\"/><rect x=\"484\" y=\"108\" width=\"68\" height=\"10\"/><rect x=\"390\" y=\"124\" width=\"60\" height=\"10\"/><rect x=\"456\" y=\"124\" width=\"50\" height=\"10\"/><rect x=\"512\" y=\"126\" width=\"40\" height=\"10\"/><rect x=\"388\" y=\"140\" width=\"34\" height=\"10\"/><rect x=\"428\" y=\"142\" width=\"64\" height=\"10\"/><rect x=\"498\" y=\"140\" width=\"54\" height=\"10\"/><rect x=\"392\" y=\"158\" width=\"56\" height=\"10\"/><rect x=\"454\" y=\"158\" width=\"44\" height=\"10\"/><rect x=\"504\" y=\"160\" width=\"48\" height=\"10\"/><rect x=\"388\" y=\"176\" width=\"44\" height=\"10\"/><rect x=\"438\" y=\"176\" width=\"60\" height=\"10\"/><rect x=\"504\" y=\"178\" width=\"48\" height=\"10\"/><\/g><text class=\"f-ink\" x=\"250\" y=\"140\">pesticide<\/text><text class=\"f-ink\" x=\"250\" y=\"170\">soil particle<\/text><text class=\"f-ink\" x=\"150\" y=\"228\" text-anchor=\"middle\">sandy soil (large pores)<\/text><text class=\"f-ink\" x=\"470\" y=\"228\" text-anchor=\"middle\">clay soil (small pores)<\/text><\/g><\/svg>"},{"id":"tab-7-2","title":"Table 7.2: Soil Properties.","page":"p. 114","explain":["Coarse sand: low organic content, meaning faster water flow and little adsorption of pesticides, and high permeability, meaning fast flow.","Smooth clay or silt: high organic content, meaning higher water retention and greater adsorption of pesticides, and low permeability, meaning slow flow."],"svg":"<svg viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"Table 7.2 Soil Properties: coarse sand has low organic content and high permeability (fast flow); smooth clay and silt have high organic content and low permeability (slow flow)\"><g font-family=\"var(--f-body)\" class=\"f-ink\"><rect class=\"f-field\" x=\"10\" y=\"10\" width=\"620\" height=\"40\" rx=\"4\"/><text class=\"f-on\" x=\"320\" y=\"37\" text-anchor=\"middle\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"19\">Table 7.2 Soil Properties<\/text><rect class=\"f-line\" x=\"10\" y=\"50\" width=\"620\" height=\"90\"/><g font-weight=\"700\" font-size=\"16\"><text x=\"100\" y=\"76\" text-anchor=\"middle\">TEXTURE<\/text><text x=\"320\" y=\"76\" text-anchor=\"middle\">ORGANIC CONTENT<\/text><text x=\"535\" y=\"76\" text-anchor=\"middle\">PERMEABILITY<\/text><\/g><g font-size=\"13\"><text x=\"100\" y=\"98\" text-anchor=\"middle\">(affects movement<\/text><text x=\"100\" y=\"116\" text-anchor=\"middle\">of water particles)<\/text><text x=\"320\" y=\"98\" text-anchor=\"middle\">(measures volume of water<\/text><text x=\"320\" y=\"116\" text-anchor=\"middle\">and soil's ability<\/text><text x=\"320\" y=\"134\" text-anchor=\"middle\">to adsorb pesticides)<\/text><text x=\"535\" y=\"98\" text-anchor=\"middle\">(measures speed of<\/text><text x=\"535\" y=\"116\" text-anchor=\"middle\">water's downward<\/text><text x=\"535\" y=\"134\" text-anchor=\"middle\">movement)<\/text><\/g><g font-size=\"14\"><text x=\"100\" y=\"196\" text-anchor=\"middle\">coarse<\/text><text x=\"100\" y=\"216\" text-anchor=\"middle\">(sand)<\/text><text x=\"200\" y=\"180\" font-weight=\"700\">low organic content =<\/text><text x=\"200\" y=\"200\">faster water flow and<\/text><text x=\"200\" y=\"220\">little adsorption of pesticides<\/text><path class=\"f-card\" d=\"M452 170 h16 v30 h10 l-18 26 l-18 -26 h10 Z\" style=\"stroke-width:1.5\"/><text x=\"490\" y=\"190\" font-weight=\"700\">high permeability<\/text><text x=\"490\" y=\"210\">(fast flow)<\/text><text x=\"100\" y=\"286\" text-anchor=\"middle\">smooth<\/text><text x=\"100\" y=\"306\" text-anchor=\"middle\">(clay, silt)<\/text><text x=\"200\" y=\"270\" font-weight=\"700\">high organic content =<\/text><text x=\"200\" y=\"290\">higher water retention and<\/text><text x=\"200\" y=\"310\">greater adsorption of pesticides<\/text><path class=\"f-ink\" d=\"M452 262 h16 v30 h10 l-18 26 l-18 -26 h10 Z\"/><text x=\"490\" y=\"280\" font-weight=\"700\">low permeability<\/text><text x=\"490\" y=\"300\">(slow flow)<\/text><\/g><path class=\"s-ink\" stroke-width=\"1.5\" fill=\"none\" d=\"M10 50 H630 V325 H10 Z M190 50 V325 M440 50 V325 M10 140 H630 M10 235 H630\"/><\/g><\/svg>"}],"questions":[{"id":"c07-s13-t1","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the four soil properties that affect a pesticide's leaching potential?","choices":["Soil color","Texture and structure","Organic matter","Depth to groundwater"],"answer":0,"ref":"p. 113, 'Soil Properties'","why":"The four are texture and structure, organic matter, depth to groundwater, and geology."},{"id":"c07-s13-t2","src":"test","kind":"mc","q":"What are soil cracks, worm holes, and root channels called?","ref":"p. 114, 'Texture and Structure'","why":"These features are called macropores.","choices":["Macropores","Micropores","Aquifers","Binding sites"],"answer":0},{"id":"c07-s13-t3","src":"test","kind":"mc","style":"scenario","q":"A golf course has sandy soil and a shallow water table. Which product choice does the manual point to?","choices":["A product with a low leaching potential","The most water-soluble product","The most persistent product","Any product, as long as it is applied at midday"],"answer":0,"ref":"p. 114, 'Depth to Groundwater'","why":"Where groundwater is close to the surface, choose a product with a low leaching potential."},{"id":"c07-s13-t4","src":"test","kind":"mc","q":"According to Table 7.2, a coarse, sandy soil has:","choices":["Low organic content and high permeability","High organic content and low permeability","High organic content and high permeability","Low organic content and low permeability"],"answer":0,"ref":"p. 114, Table 7.2","why":"Coarse sand: low organic content, faster flow, little adsorption, high permeability."},{"id":"c07-s13-t5","src":"test","kind":"tf","q":"Leaching can occur only in sandy soils, never in clay or silt soils.","answer":false,"ref":"p. 113, 'Texture and Structure'","why":"Sandy soils are more prone, but leaching may also occur in clay or silt soils."},{"id":"c07-s13-t6","src":"test","kind":"mc","q":"Which geologic material can inhibit and slow the downward movement of water?","choices":["Layers of clay","Gravel deposits","Sand","Fractured bedrock"],"answer":0,"ref":"p. 115, 'Geology'","why":"Layers of clay are much less permeable and can slow downward water movement."}]},{"id":"c07-s14","chapter":"Chapter 7 · Pesticides in the Environment","title":"Preventing water contamination: label statements, BMPs, IPM","pages":[115,115],"body":[{"h":"Preventing surface water and groundwater contamination"},{"p":["To help prevent surface water and groundwater contamination, **EPA requires all pesticide products labeled for outdoor uses** to include the following environmental hazard statement on the label."]},{"box":"Required environmental hazard statement","p":["\"Do not apply directly to water, or to areas where surface water is present, or to intertidal areas below the mean high water mark. Do not contaminate water supplies when cleaning equipment or disposing of equipment wash waters.\""]},{"p":["Pesticides that could contaminate groundwater must bear **groundwater warning statements** on their labels.","When such statements appear on product labels, choose pesticides appropriate for use in sandy soils, or where extra precautions are needed to reduce the risk of water contamination."]},{"p":["You can minimize the risk of point-source or nonpoint-source contamination by following **best management practices**, or **BMPs**.","BMPs are effective, commonsense procedures that emphasize proper **mixing, loading, application, and disposal** of pesticides.","Following BMPs reduces the chance that pesticides will harm the environment."]},{"h":"Use integrated pest management principles"},{"p":["Apply pesticides **only when and where necessary**, and only in amounts adequate to control pests.","Use **nonchemical control methods** whenever possible.","When using pesticides:"]},{"list":["Determine the type of pest, the density of the pest population, and the proper control method.","If a pesticide is necessary, choose the **least toxic product** that will do the job.","**Calibrate** pesticide application equipment regularly.","Use **spot treatments or band applications**, if possible, to reduce pesticide use."]}],"questions":[{"id":"c07-s14-t1","src":"test","kind":"mc","q":"Which pesticide products must carry the statement \"Do not apply directly to water, or to areas where surface water is present...\"?","choices":["All pesticide products labeled for outdoor uses","Only restricted-use products","Only herbicides","Only products used near wells"],"answer":0,"ref":"p. 115, 'Preventing Surface Water and Groundwater Contamination'","why":"EPA requires it on all pesticide products labeled for outdoor uses."},{"id":"c07-s14-t2","src":"test","kind":"short","q":"What does BMPs stand for?","answer":"best management practices","accept":["best management practice"],"keys":[["best"],["management"],["practice","practices"]],"ref":"p. 115, 'Preventing Surface Water and Groundwater Contamination'","why":"BMPs are best management practices."},{"id":"c07-s14-t3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT an IPM step the manual lists for using pesticides?","choices":["Choose the most toxic product to be sure the pest dies","Determine the type of pest, its density, and the proper control method","Calibrate application equipment regularly","Use spot treatments or band applications, if possible"],"answer":0,"ref":"p. 115, 'Use Integrated Pest Management Principles'","why":"If a pesticide is necessary, choose the least toxic product that will do the job."},{"id":"c07-s14-t4","src":"test","kind":"mc","style":"scenario","q":"Weeds are only in a few patches along a fence line. Which approach fits the manual's IPM guidance?","choices":["Spot treat the patches","Broadcast the whole field to be safe","Double the label rate on the patches","Apply to the whole field twice"],"answer":0,"ref":"p. 115, 'Use Integrated Pest Management Principles'","why":"Use spot treatments or band applications, if possible, to reduce pesticide use."},{"id":"c07-s14-t5","src":"test","kind":"tf","q":"BMPs are commonsense procedures that emphasize proper mixing, loading, application, and disposal of pesticides.","answer":true,"ref":"p. 115, 'Preventing Surface Water and Groundwater Contamination'","why":"That is the manual's description of BMPs."}]},{"id":"c07-s15","chapter":"Chapter 7 · Pesticides in the Environment","title":"Vulnerable areas, mixing sites, and wells","pages":[115,116],"body":[{"h":"Identify vulnerable areas"},{"p":["The presence of **sandy soil, sinkholes, wells, streams, ponds, and shallow groundwater** increases the chance of groundwater contamination.","**Never** dispose of empty pesticide containers in sinkholes, or dump or rinse sprayers into or near sinkholes. See Chapter 10, Planning the Pesticide Application.","Also take care to avoid contaminating drainage ditches and other potential sources of runoff to streams and waterways.","**Never** clean tanks or intentionally discharge water from a tank of any vehicle into a **street**, along a **road**, or into a **storm drain**."]},{"h":"Do not mix and load near water"},{"p":["Mix and load as far as possible, **at least 50 feet**, from wells, lakes, streams, rivers, and storm drains.","When possible, do so **at the application site**.","Consider using a **sealed permanent or portable mixing and loading pad** to prevent seepage into soil."]},{"h":"Keep pesticides away from wells"},{"p":["**Do not store or mix pesticides around wells.**","Poorly constructed, or improperly capped or abandoned wells, may allow surface water containing pesticides and other contaminants **direct entry into groundwater**.","Note that wells are sometimes located in or near treated fields and other application sites."]}],"questions":[{"id":"c07-s15-t1","src":"test","kind":"mc","q":"How far, at least, should you mix and load from wells, lakes, streams, rivers, and storm drains?","choices":["50 feet","10 feet","25 feet","100 feet"],"answer":0,"ref":"p. 115, 'Do Not Mix and Load Near Water'","why":"Mix and load as far as possible, at least 50 feet, from those sites."},{"id":"c07-s15-t2","src":"test","kind":"mc","style":"scenario","q":"A crew finishes a job and wants to drain leftover water from the spray tank. The nearest spot is a storm drain at the curb. What does the manual say?","choices":["Never discharge tank water into a storm drain, street, or along a road","It is fine if the water looks clear","It is fine if the tank was triple-rinsed","Only do it at night"],"answer":0,"ref":"p. 115, 'Identify Vulnerable Areas'","why":"Never clean tanks or intentionally discharge tank water into a street, along a road, or into a storm drain."},{"id":"c07-s15-t3","src":"test","kind":"mc","style":"not","q":"Which of these does NOT increase the chance of groundwater contamination, according to the manual?","choices":["Thick layers of clay","Sandy soil","Sinkholes","Shallow groundwater"],"answer":0,"ref":"p. 115, 'Identify Vulnerable Areas' and 'Geology'","why":"Sandy soil, sinkholes, wells, streams, ponds, and shallow groundwater raise the risk; clay slows downward water movement."},{"id":"c07-s15-t4","src":"test","kind":"tf","q":"An improperly capped or abandoned well can let surface water carrying pesticides go directly into groundwater.","answer":true,"ref":"pp. 115 to 116, 'Keep Pesticides Away from Wells'","why":"Such wells may allow direct entry into groundwater."},{"id":"c07-s15-t5","src":"test","kind":"short","q":"What can you use at a mixing site to prevent seepage into the soil?","answer":"a sealed mixing and loading pad","accept":["mixing pad","loading pad","sealed pad","mixing and loading pad"],"keys":[["pad"]],"ref":"p. 115, 'Do Not Mix and Load Near Water'","why":"Consider a sealed permanent or portable mixing and loading pad."}]},{"id":"c07-s16","chapter":"Chapter 7 · Pesticides in the Environment","title":"Back-siphoning and land use","pages":[116,116],"body":[{"h":"Avoid back-siphoning"},{"p":["**Back-siphoning** is the reverse flow of liquids into a fill hose.","It sucks tank contents, including pesticides, back into the water supply.","Back-siphoning starts with a **reduction in water pressure** and can draw very large quantities of pesticide directly into the water source.","This happens when the end of the water hose is allowed to extend **below the surface of the spray mixture** when filling a spray tank.","The simplest way to prevent backflow is to maintain an **air gap** between the discharge end of the water supply line and the pesticide solution in the spray tank.","An air gap prevents contamination of the hose and keeps pesticides from back-siphoning into the water source if a drop or loss of water pressure occurs.","Keep the air gap at least **twice the diameter of the discharge pipe**.","Another method to prevent back-siphoning is to use a **backflow prevention device or check valve**. See Chapter 10."]},{"gallery":["p116-airgap","p116-checkvalve"]},{"h":"Improve land use and application methods"},{"p":["**Terraces** and **conservation tillage** practices can reduce water runoff and soil erosion.","Ideally, growers should leave as much **plant residue** as possible on the soil surface to lessen erosion.","Where conservation tillage is not possible, decrease runoff potential by **incorporating a low concentration** of the pesticide into the soil.","In ornamental plantings, consider using **mulches** to reduce water runoff and soil erosion.","**Grass buffer strips** are very effective in reducing pesticide runoff because they trap sediment containing pesticides and slow runoff water. This allows more runoff water to infiltrate the soil.","Leaving untreated grass strips next to streams, ponds, and other sensitive areas can trap much of the pesticide running off of treated areas."]}],"figures":[{"id":"p116-airgap","title":"Maintain an air gap between the discharge end of the water supply line and the spray tank to prevent backflow of pesticides.","page":"p. 116","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/wgALCAEEAZkBAREA/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACAwQFBgf/2gAIAQEAAAAB7/guSIe6SVteMJzyCgWmZQBGxap02hFBJF1tQV5hb9h8+4skyTysrRQvc4ppSQkmjgNzVxqAkcS1RiMqTQq1hc0/XvO+RDjG6QJsbXPewApRySCO3qYFeeUBiBCMUaNphvz+v+Zc3Epo2SPBESmDCk6Nkxjn2MGGaRCIOLU1SxQp23e2Oa9g8t5oGeOOVzXEApIsJbowUdvJt56e1zGtnMQRsOzwtSSz695PzpUzWKRwa1zXOe2Iy6nbNxOfqdPy9dxTWNc4tf2HUR+VQDoY5fW/IsZCeNkrowAUXyMjEnSar5afJyRVkJY4UH3tjrtGsuP5Bl6a/wCseO5oM4To2MJAlkZE17u4u5VaniumqNM6iV3sencmUrHJ8ZCtW76r49SKmaS0wKVNKdGyW5tTw1481hjanrZ7LTaQ1lGS55vzw09D1Lyau5JpBLFIkWvTDq9AXupcayW3HDr9RtAOrTRcxV7arx3IC7t+j+W1ikSkU4JFBI27kEENaN7rvdZHT1orxby1DZp9Q+LH80ba6DvfNoE .","answer":true,"ref":"p. 116, 'Improve Land Use and Application Methods'","why":"They trap sediment, slow the water, and let more of it infiltrate."},{"id":"c07-s16-t5","src":"test","kind":"short","q":"What is the reverse flow of liquids into a fill hose, which sucks tank contents back into the water supply, called?","answer":"back-siphoning","accept":["backsiphoning","back siphoning","backflow","back-siphonage","back siphon","backsiphon","back-siphon"],"ref":"p. 116, 'Avoid Back-siphoning'","why":"That reverse flow is back-siphoning."}]},{"id":"c07-s17","chapter":"Chapter 7 · Pesticides in the Environment","title":"Weather timing, product choice, safe handling","pages":[116,116],"body":[{"h":"Time pesticide applications according to the weather forecast"},{"p":["Pesticides are most susceptible to runoff from heavy rains or irrigation during the **first several hours after application**.","Do not apply to **saturated or frozen ground**.","To avoid overspraying an area and causing drift, check the pesticide label for application precautions or restrictions during windy conditions.","**Wind speed, temperature, and humidity** all affect the off-target movement of pesticides."]},{"h":"Select products wisely"},{"p":["Whenever possible, use pesticides that are **less likely to leach**. Read labels for such warnings."]},{"h":"Handle pesticides safely"},{"p":["Follow these guidelines to prevent surface water or groundwater contamination."]},{"list":["Immediately contain and control pesticide spills.","Check application equipment regularly for leaks or damage.","Mix and load pesticides away from water sources.","After the pesticide application is complete, follow label directions for proper equipment cleanup and container disposal.","After applying granular pesticides, **sweep or blow any granules** from sidewalks, driveways, or patios **onto the treatment area**."]},{"p":["Whenever possible, **clean sprayers at the application site**, at a safe distance from wells, ponds, streams, and storm drains.","**Spray the rinsate on the treated area**, or on another site listed on the pesticide label, or **use it in the next tank mix**.","Be sure **not to exceed label rates**."]}],"questions":[{"id":"c07-s17-t1","src":"test","kind":"mc","style":"scenario","q":"After a granular lawn treatment, granules are scattered on the driveway. What should the applicator do?","choices":["Sweep or blow them onto the treatment area","Hose them into the street","Leave them; rain will wash them away","Sweep them into the storm drain"],"answer":0,"ref":"p. 116, 'Handle Pesticides Safely'","why":"Sweep or blow granules from sidewalks, driveways, or patios onto the treatment area."},{"id":"c07-s17-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT an acceptable use of sprayer rinsate, according to the manual?","choices":["Pour it down a storm drain","Spray it on the treated area","Spray it on another site listed on the label","Use it in the next tank mix"],"answer":0,"ref":"p. 116, 'Handle Pesticides Safely'","why":"Spray rinsate on the treated area or a labeled site, or use it in the next tank mix, without exceeding label rates."},{"id":"c07-s17-t3","src":"test","kind":"mc","q":"When are pesticides most susceptible to runoff from heavy rain or irrigation?","choices":["During the first several hours after application","Several weeks after application","Only before application","Only in winter"],"answer":0,"ref":"p. 116, 'Time Pesticide Applications According to the Weather Forecast'","why":"They are most susceptible during the first several hours after application."},{"id":"c07-s17-t4","src":"test","kind":"tf","q":"When you put rinsate into the next tank mix, you can go over the label rate, because rinsate is diluted.","answer":false,"ref":"p. 116, 'Handle Pesticides Safely'","why":"Be sure not to exceed label rates."},{"id":"c07-s17-t5","src":"test","kind":"mc","q":"Where does the manual say to clean sprayers whenever possible?","choices":["At the application site, at a safe distance from wells, ponds, streams, and storm drains","At a car wash","Next to the nearest stream for easy water access","In the shop sink"],"answer":0,"ref":"p. 116, 'Handle Pesticides Safely'","why":"Clean sprayers at the application site, a safe distance from water and storm drains."}]},{"id":"c07-s18","chapter":"Chapter 7 · Pesticides in the Environment","title":"Sensitive areas","pages":[117,117],"body":[{"h":"Preventing harmful effects on sensitive areas and nontarget organisms"},{"p":["To avoid harming the environment, you must be aware of sensitive areas, nontarget plants and animals, especially **endangered species**, and damaging effects on habitat."]},{"h":"Sensitive areas"},{"p":["In addition to water sources, **sensitive areas** include sites where living things could easily be injured by a pesticide.","Outdoor sensitive areas include:"]},{"list":["School grounds, playgrounds, and recreational areas.","Habitats of endangered species.","Apiaries, which are honey bee sites, wildlife refuges, and parks.","Areas where domestic animals and livestock are kept.","Ornamental plantings, public gardens, and sensitive food or feed crops."]},{"p":["Indoor sensitive areas include places where:"]},{"list":["People live, work, shop, or are cared for, such as hospitals and daycare centers.","Food or feed is processed, prepared, stored, or served.","Domestic or confined animals live, eat, or are otherwise cared for.","Ornamental or other sensitive plants are grown or maintained, such as in malls and buildings."]},{"gallery":["p117-apiary","p117-wildlife","p117-playground"]},{"p":["Sometimes pesticides must be **deliberately applied to a sensitive area** to control a regulated pest, such as mosquito abatement or gypsy moth forest treatments.","**Only well-trained applicators** should perform these applications.","At other times, the sensitive area may be part of a larger target site. Whenever possible, take special precautions to avoid treating the sensitive area.","Leaving an **untreated buffer zone** around a sensitive area is a practical way to avoid contaminating it.","In still other instances, the sensitive area may be near a site used for mixing and loading, storage, disposal, or equipment washing. Be very careful to avoid contaminating the sensitive area.","Check the label for statements that alert you to special restrictions around sensitive areas."]}],"figures":[{"id":"p117-apiary","title":"Sensitive area: apiary.","page":"p. 117","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/wgALCAEVAXUBAREA/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAECAwQFBgf/2gAIAQEAAAAB71BQRQRUp5GZl51WNIlS5DJLpauprX3ICKAC16mkigAJkYOBlwwsHCsGyOdAiyz6nR9LogAAsFTQFBCDmuYx6rFVqksStB6NBFB9joOt31UAWKvacBByvI0I4kBBQHIKDUAAC3tdvugCsrW1ROa4rJrvGuYog8HNRVIwQFAEtdd3NkFbXslTg+YqCgqAArhGuAREEUAQJNn0nVBIJcfz3EaDkBFAVAFc5oMQBQQAND0vfCvi+eZQ5UVEEUVBFRVUZORtQFXpLGBQR0sGh6fuEPj+WrnI0QQFQBQegkrUYAejdQR+ZYOpFQTU9W0YfDFcI1AAARRRXDZNWvntDX6/ZlsQ8bxduzkh1PqEfhqORgoAAgqgKX+/1LfIcAW/RdhxHWzOLovpoTemdB4eiAoCKICigL0HV3WXanlDdWp0OnYVLvMc1aznMN/1HxJgKBOQAAChJ2u3aRq+a5mvSfKO7HgETTyHIlj1HyUFEWXtaXImlGUgUHSy6EtmePlrkUrX7+ZlyrbxVBvp3mCgD55qkJbk7TkMxUf0N7FZLHVpys0b1Ah9A4jd6PhG5KtE9G8735Yuft9ikvLZUrNDpedx9Hc7K3zeJQolRqS9XTk1cLrKPXrV81xVRyd1kxTV4Z9ZlYoZ7WXo6fpu8i89i1asVWg3u8yvqkXQ74Jn+UxIh2hWU0MmzQXKtPWFZ9buXNdTyc3LqsbP6HymUSdP0ThCTz/jkDsEWZrMfch0OWjk08+5p9sgiqlOtnzZ+Lt70taxJO9Afj+TtDqsR2pFRj6Cpp4NNLDet091oqthx6dyHCjz++1nxo2VWTSV/Mq7qfQcsiLK26osNy5R6ibRtKVM7Phz4mSx2e+tuStG1H6Q3lefiTY4oFHM0rTc/V6DD24KZUS3avamBz9VH6nfTuUbXzK/Svbm5cWJscEoqOTWfZ5mbTr7lyppV7d58hBy1Kqiafe23iLQ5nWXncyV9jqeQhgjzkXdyb2UwJJn9Wy7ZkdC7Lq06MZZ9A00WHFwK+lUx3y9F1PCXouXqCq2eBRWIk3ZzTWXrHQo1IaSEnYa1bPzY4LuNYfa6zZ8RfevLYlwM57VHNVG+kWc6v0jK9Xmlt48DkOttZObUZesozd693iCdX2EaHnFEVHIgO9GSvQj6xtWKnmYdeyqSu2s+GV6Lq9Zos8jzrmvDSipqqCIItrvoXVGZ3dw1auVy9Se3JLbtZr7lVun1Gs5PN8zNa0HoCIiqafewlUxk67mMKKki2oHXJl3qEGl ","choices":["A gravel parking lot","School grounds and playgrounds","Apiaries","Areas where livestock are kept"],"answer":0,"ref":"p. 117, 'Sensitive Areas'","why":"The list includes schools, playgrounds, endangered species habitats, apiaries, refuges, parks, livestock areas, and ornamental or sensitive crops."},{"id":"c07-s18-t2","src":"test","kind":"mc","q":"What is an apiary?","choices":["A honey bee site","A wildlife refuge","A bird nesting area","A fish hatchery"],"answer":0,"ref":"p. 117, 'Sensitive Areas'","why":"The manual defines apiaries as honey bee sites."},{"id":"c07-s18-t3","src":"test","kind":"mc","style":"scenario","q":"A park you are treating includes a small public garden in the middle. What practical step does the manual suggest?","choices":["Leave an untreated buffer zone around the garden","Treat the garden at double rate to protect it","Treat it the same as the rest of the park","Spray it only at noon"],"answer":0,"ref":"p. 117, 'Sensitive Areas'","why":"An untreated buffer zone around a sensitive area is a practical way to avoid contaminating it."},{"id":"c07-s18-t4","src":"test","kind":"tf","q":"Mosquito abatement and gypsy moth forest treatments are examples of deliberate applications to sensitive areas, which only well-trained applicators should perform.","answer":true,"ref":"p. 117, 'Sensitive Areas'","why":"These control regulated pests, and only well-trained applicators should do them."},{"id":"c07-s18-t5","src":"test","kind":"mc","q":"Which of these is an indoor sensitive area named in the manual?","choices":["A daycare center","A storage shed for lawn mowers","An empty warehouse","A parking garage"],"answer":0,"ref":"p. 117, 'Sensitive Areas'","why":"Indoor sensitive areas include places where people are cared for, such as hospitals and daycare centers."}]},{"id":"c07-s19","chapter":"Chapter 7 · Pesticides in the Environment","title":"Nontarget organisms and nontarget plants","pages":[117,117],"body":[{"h":"Pesticide effects on nontarget organisms"},{"p":["Pesticides may affect nontarget organisms **directly**, causing immediate injury.","Or they may produce **long-term consequences** through environmental pollution.","Pesticides may build up in the bodies of animals or in the soil.","For example, if you use the **same mixing and loading site or equipment cleaning site over a long period**, pesticides are likely to accumulate in the soil.","When this occurs, plants and animals that come into contact with the soil may be harmed.","The following sections discuss the effects of pesticides on nontarget plants; bees and other beneficial insects; and fish, wildlife, and livestock."]},{"h":"Nontarget plants"},{"p":["Nearly all pesticides can cause plant injury, called **phytotoxicity**, due to chemical exposure.","This is particularly likely if applied at **too high a rate**, at the **wrong time**, or under **unfavorable environmental conditions**.","Phytotoxicity can occur on **any part** of a plant: roots, stems, leaves, flowers, or fruits.","**Most phytotoxic injury is due to herbicides.**","Although damage to crops or other nearby plants is **primarily caused by drift**, it may sometimes be a consequence of surface runoff and root uptake."]},{"fig":"p117-plants"}],"figures":[{"id":"p117-plants","title":"Avoid pesticide effects on non-target plants.","page":"p. 117","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/wgALCAE0AZoBAREA/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQBAgUABgf/2gAIAQEAAAAB9No26e7p6IiawjnprKAHSGDstuPvmFEyTu7u6Ynpx/Izt+lnu7otMCzcTKx1hBDNx9HW65WTau1r60MR3dPd3d2Z4zvTbvd3dFlfO+bygKVrMySpGmF1pDaunm6pmN702hHd093d2f4m3r9C1enlPLebQVaMESkyw9MMh6S3OEnnN2/D7V9ZsdE93dyPiO95e/QPyfmlSmJbhpZ3pEmGKrOSU3VtVDz/ALNWgB3T2vavz3d3LeC73hL9j+GQHeTRcgUk94avAqRlnQZpSY8j7VVkeWhNGvXeutPdw/n0fQOt5PxeecLHMX6+cEDk1KoLjkdPcLBvOequKwsQNGT6/wBBanuj5130DvFYma1aajNdrEETOeOtZbqvLsXGaR5jlmKNopw0Vk/0TWiZ+c1974nPtw6Wpk6wFRD1/O+xpao  Plants'","why":"Plant injury from chemical exposure is phytotoxicity."},{"id":"c07-s19-t2","src":"test","kind":"mc","q":"Which type of pesticide causes most phytotoxic injury?","choices":["Herbicides","Insecticides","Fungicides","Rodenticides"],"answer":0,"ref":"p. 117, 'Nontarget Plants'","why":"Most phytotoxic injury is due to herbicides."},{"id":"c07-s19-t3","src":"test","kind":"mc","style":"scenario","q":"A company has used the same corner of its yard to mix, load, and rinse equipment for ten years. Grass there has died, and a dog that digs there got sick. What does the manual say is the likely cause?","choices":["Pesticides accumulated in the soil from repeated use of the same site","Photodegradation of the pesticides","Vapor drift from distant fields","Normal soil microorganisms"],"answer":0,"ref":"p. 117, 'Pesticide Effects on Nontarget Organisms'","why":"Using the same mixing, loading, or cleaning site for a long time lets pesticides accumulate in the soil."},{"id":"c07-s19-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a condition the manual names as making phytotoxicity more likely?","choices":["Applying at the label rate under good conditions","Applying at too high a rate","Applying at the wrong time","Applying under unfavorable environmental conditions"],"answer":0,"ref":"p. 117, 'Nontarget Plants'","why":"Phytotoxicity is more likely at too high a rate, the wrong time, or under unfavorable conditions."},{"id":"c07-s19-t5","src":"test","kind":"tf","q":"Damage to crops or other nearby plants is primarily caused by drift.","answer":true,"ref":"p. 117, 'Nontarget Plants'","why":"Drift is the primary cause, though runoff and root uptake can also cause it."}]},{"id":"c07-s20","chapter":"Chapter 7 · Pesticides in the Environment","title":"Bees and other beneficial insects","pages":[118,118],"body":[{"h":"Bees and other beneficial insects"},{"p":["Besides making honey and beeswax, bees **pollinate** many fruit, nut, seed, vegetable, and field crops.","You must be aware of bee activity when planning pesticide applications.","There has been increasing concern about the decline of bee colonies and the role pesticides may play.","Preventing bee loss is the **joint responsibility** of the **applicator, the grower, and the beekeeper**.","Bees may travel as far as **3 miles** from their hive to find blooming flowers.","Before applying pesticides labeled as toxic to bees, **notify beekeepers** in the area so they can protect or move their bee colonies.","Some states have laws requiring notification and registries for beekeepers."]},{"fig":"p118-beeicon"},{"p":["Bees and other insect pollinators may be exposed to pesticides through different routes, including:"]},{"ol":["Direct contact during foliar applications.","Contact with residues on plant surfaces after applications.","Drift from the application into the hive entrance.","Ingestion of residues in nectar, pollen, or guttation water, which is dew, when the pesticide is applied as a seed treatment, soil or tree injection, or foliar application."]},{"p":["**Insecticides** are generally toxic to bees, but some are more hazardous than others.","**Herbicides** are unlikely to harm bees directly.","**Fungicides** do not appear to affect adult bees but may affect **larval development**.","**Tank mixing insecticides and fungicides** may create a mixture that is **more toxic** to bees than either product used alone."]},{"p":["Minimize bee kills from insecticide poisoning by following a few basic principles."]},{"list":["Pay careful attention to pesticide labels. For each application site, look for the **bee hazard icon** in the **\"Directions for Use\"** section for specific use restrictions and instructions to protect bees and other pollinators.","**Do not apply insecticides to crops in bloom.**","Apply insecticides in the **evening or at night** when bees are not foraging.","Early morning application may protect honey bees, but **wild bees forage at or before dawn**.","Do not apply insecticides when **weeds or other plants around the treatment site are in bloom**.","Do not allow the pesticide to drift onto attractive habitat, natural areas, or beehives.","Choose the **least hazardous** insecticide, formulation, and application method."]},{"fig":"p118-bee"},{"p":["Pesticides can harm **other beneficial insects** in addition to bees.","These beneficials may be valuable allies in keeping pest populations below damaging levels.","A pesticide application often harms the beneficial insect population **as much as the target pest**.","So do not spray when beneficial insects are in the target area unless it is unavoidable.","Alternatively, choose a product that does not harm beneficials."]}],"figures":[{"id":"p118-beeicon","title":"Bee hazard icon on labels indicate use restrictions.","page":"p. 118","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/wgALCAEUAUMBAREA/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBQYDBAf/2gAIAQEAAAAB3HGEkCjGTSYDcK2zYMTBCYAusWDTlzgAA3yyNTYbTqIAAUkm02wlKQockAzyYy10+Urt5NAwEwTQxyjKZIOXNEulVkNRcEctU7vqDBAwEMYdGOL5wCWcotpY84Ec5n976GAmmAAxE5xikmccnHZeiEEBQZjeesBMEDBoHNRBrw4+01M4ggToslvfaCbQmAMbCLaostqLtOQ2EB02L3vuAYCG25zIRTWXy2it7ORIHNqMVWYXb2rBoQ25zYoLhj/N7rDyeG00bCXVCjArsHtLmLYgJvpJIK7E3GoddwjW1Wnu+jZEXJrx4DWXzEAT6SAKTIay7CHl4+Ty13n1F4AnCEV5cDpdKkgOvRhzzFHtrGHHlynDjw8njqfRqJ+XtaLy+iZy+f3mokkHok3xxUNp6Oecn0UOPGn8cudj5WP3eCvs9735+DF2+skRfom6/D2+umQyXun46ul4nfkHXtY11d5w2UeHr0WL9eyaXd1GN1t/IDy4yPDxeR8+cHCPTtOsh7pez6B7ZHPEvcNmboNvZMbIVXzby2VtawrKXzLyRXp8vQs/BrtuxLGebddK/A7m4TckoY7LcbjnOt5+SdlwRx5R7+72TstmhmO8G87VOH3Nq2koYLKwivfLxc3a+jwrs+Xg3Fvcw7on4cXdaWbrcHs7xII4THrpYeKw3EMpWer0dfXR2nL2auxAVJldbdyTK/Ba+9H5s/Tc156G2+nezz/P/bd4LZ2+exWk57vuOGXqtp7kpg/DgdToTjW8KPP1mo3vsj4vl2knZ6fn5vnOvr9L7I+bIS2PeKPRzEePBaHSvjWfPK2ws+/svOWGsoe+1sqyi8u0sOfLH3enkOT9EYQUfPg7n14/z9fTKLT8/gt0RQvHZaHx020uEm5HpSjCJwwnS9r+HGKU+lHyuV19q8kYT5Pae5ATnLoRF r":0,"ref":"p. 118, 'Bees and Other Beneficial Insects'","why":"It is the joint responsibility of the applicator, the grower, and the beekeeper."},{"id":"c07-s20-t3","src":"test","kind":"mc","style":"scenario","q":"A grower wants to tank mix an insecticide with a fungicide on an orchard near hives. What does the manual warn?","choices":["The mixture may be more toxic to bees than either product alone","Fungicides cancel out insecticide toxicity","The mix is safe because fungicides do not affect bees at all","Tank mixes are always less toxic"],"answer":0,"ref":"p. 118, 'Bees and Other Beneficial Insects'","why":"Tank mixing insecticides and fungicides may create a mixture more toxic to bees than either alone."},{"id":"c07-s20-t4","src":"test","kind":"mc","q":"Where on the label should you look for the bee hazard icon?","choices":["The \"Directions for Use\" section","The signal word","The first aid statement","The ingredient statement"],"answer":0,"ref":"p. 118, bee protection principles","why":"Look for the bee hazard icon in the Directions for Use section for each application site."},{"id":"c07-s20-t5","src":"test","kind":"mc","style":"scenario","q":"An applicator needs to spray an insecticide on a field near hives, and wild bees are known to be active nearby. Which timing best follows the manual?","choices":["Evening or at night, when bees are not foraging","Right at dawn","Midday, when bees are in the hive","Whenever the crop is in full bloom"],"answer":0,"ref":"p. 118, bee protection principles","why":"Apply in the evening or at night; early morning may protect honey bees, but wild bees forage at or before dawn."},{"id":"c07-s20-t6","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the manual's principles for minimizing bee kills?","choices":["Spray crops while they are in bloom so bees carry the insecticide to pests","Do not apply insecticides to crops in bloom","Do not apply when weeds around the site are in bloom","Choose the least hazardous insecticide, formulation, and method"],"answer":0,"ref":"p. 118, bee protection principles","why":"Do not apply insecticides to crops in bloom."}]},{"id":"c07-s21","chapter":"Chapter 7 · Pesticides in the Environment","title":"Fish, wildlife, and livestock","pages":[118,119],"body":[{"h":"Fish, wildlife, and livestock"},{"p":["Pesticides can harm all kinds of animals.","Most injuries occur from the direct effects of **acute poisoning**.","**Fish kills** often result from water pollution by a pesticide.","**Insecticides** are the most likely cause, especially when **small ponds or streams** are under conditions of **low water flow or volume**."]},{"p":["**Bird kills** resulting from pesticide exposure may happen in a number of ways.","Birds may ingest pesticide granules, baits, or treated seeds; be exposed directly to sprays; consume treated crops or drink contaminated water; or feed on pesticide-contaminated insects and other prey.","**Granular or pelleted formulations** are a particular concern because birds and other animals often **mistake them for food**.","Liquid formulations may be safer when birds and other wildlife are in or near the treated area.","Remove pet dishes from spray areas.","Place baits properly so they are inaccessible to pets, birds, and other wildlife."]},{"p":["Animals may also be harmed when they eat plants or animals carrying pesticide residues.","Predatory birds or mammals feeding on animals killed by pesticides are a special concern.","Pesticide residues remaining on or in the bodies of the dead animal may harm predators. This is called **secondary poisoning**.","Check the pesticide label for statements about secondary poisoning."]},{"p":["The less obvious effects resulting from **long-term exposure** to pesticides are a major concern.","For example, certain pesticides have been banned because of fish and bird kills and the **reproductive failures** of several bird species.","The most important source of **livestock** pesticide poisoning has been through **contaminated feed, forage, and drinking water**.","Contamination often occurs as a result of improper or careless transportation, storage, handling, application, or disposal of pesticides."]}],"questions":[{"id":"c07-s21-t1","src":"test","kind":"short","q":"A hawk eats a mouse that was killed by a rodenticide, and the hawk is harmed. What is this called?","answer":"secondary poisoning","accept":["secondary"],"keys":[["secondary"]],"ref":"p. 119, 'Fish, Wildlife, and Livestock'","why":"Harm to predators from residues in a dead animal is called secondary poisoning."},{"id":"c07-s21-t2","src":"test","kind":"mc","q":"Which type of pesticide is the most likely cause of fish kills?","choices":["Insecticides","Herbicides","Fungicides","Disinfectants"],"answer":0,"ref":"p. 118, 'Fish, Wildlife, and Livestock'","why":"Insecticides are the most likely cause, especially in small ponds or streams with low flow."},{"id":"c07-s21-t3","src":"test","kind":"mc","style":"scenario","q":"Wild turkeys are feeding in a field you need to treat. The product comes as granules and as a liquid. Which does the manual suggest may be safer?","choices":["The liquid formulation","The granular formulation","Either; they are equally safe","Granules spread more heavily"],"answer":0,"ref":"p. 118, 'Fish, Wildlife, and Livestock'","why":"Birds often mistake granules for food; liquids may be safer when birds are in or near the area."},{"id":"c07-s21-t4","src":"test","kind":"mc","q":"What has been the most important source of livestock pesticide poisoning?","choices":["Contaminated feed, forage, and drinking water","Vapor drift from neighboring fields","Direct spraying of animals","Secondary poisoning"],"answer":0,"ref":"p. 119, 'Fish, Wildlife, and Livestock'","why":"The most important source has been contaminated feed, forage, and drinking water."},{"id":"c07-s21-t5","src":"test","kind":"mc","style":"not","q":"Which of these is NOT a way the manual says birds can be exposed to pesticides?","choices":["Absorbing pesticides through their eggs from the air","Eating granules, baits, or treated seeds","Drinking contaminated water","Feeding on pesticide-contaminated insects and prey"],"answer":0,"ref":"p. 118, 'Fish, Wildlife, and Livestock'","why":"The manual lists ingesting granules, baits, or seeds; direct spray; treated crops or water; and contaminated prey."}]},{"id":"c07-s22","chapter":"Chapter 7 · Pesticides in the Environment","title":"Protecting endangered species","pages":[119,119],"body":[{"h":"Protecting endangered species"},{"p":["Certain plants and animals have been identified as endangered or threatened species. Be very careful not to harm these populations.","Because all living things are part of a complex, delicately balanced network, removing a single species may set off a **chain reaction** that affects many other species.","The full significance of extinction is not always readily apparent, and the long-term effects are often difficult to predict.","An **endangered species** is one on the **brink of extinction** throughout all or a significant part of its range.","A **threatened species** is one **likely to become endangered**.","The reasons for a species' decline are usually complex, and thus recovery is difficult.","A major problem for most wildlife is the **destruction of habitat**, usually the result of industrial, agricultural, residential, or recreational development."]},{"p":["**Each state** is responsible for implementing the federal **Endangered Species Protection Program** in cooperation with **EPA**, to protect endangered and threatened species from the harmful effects of pesticides.","Under this program, pesticide products that might harm an endangered species carry a label statement instructing applicators to consult a **county bulletin** to determine if they must take any special precautionary measures when using the product.","**EPA develops these bulletins**, which identify precautionary measures required in each county where one or more pesticides could affect an endangered or threatened species.","Precautionary measures may include **buffer strips, reduced application rates, and timing restrictions**.","Or an applicator might be **prohibited** from using the pesticide within the identified habitat altogether.","Check with your state, tribe, or territory department of agriculture; local Extension Service; or the EPA website, www.epa.gov, to find out the status of available county bulletins."]},{"gallery":["p119-falcon","p119-bulletin"]}],"figures":[{"id":"p119-falcon","title":"Pesticides can be harmful to all kinds of animals.","page":"p. 119","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/wgALCAG1AYkBAREA/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/2gAIAQEAAAAB9BUGqEZQjUoQqQZAWAwQoFjQVKGhEQCvf+mPwXYKFdxOLnYlLLpb9UStCOdhzqoKkqVVWw2QaoL9X7vb5L0EqrDBx+XiSA6Oj2ttIRjx5MaVLGpUlVKtrCulrL1Xut3kfQ1IHO4fISC6FvT6201Lw4MmNIAFSXVVVUzS21KXfqPddHxnpgteHk8fKEsV3t6eoxSnn5MiwCqs6ERlU7Y4kZkX6j3XS8L3wTlwczNUMlrotOtlQMmfGkRkIrBY1Jo7AgnIkfT+56nz3sqzc7AiGclAumndverLjyDJCOCsKj+5WbIa86/T+66nzntZOfgzjLO5SQI7G9D4nHiqGVwACpOp0+SWWtmnP0fddX5t2ebzs4SxGCtcNlym6KrHkoyZBUmrl9/MtKS0aB2+57HzXo4OeA3BWoKqGR0s9N1mTGmwFLzjZT1XPDnUJju6Pte38w24cskAFrEdfQ30rLy6MrESI7FSULuT1WBXOpREXb9t3vlBrXdiCQnS9Psro8vJjyY9vHGS5VUlYrqX6vk5s4r2pd0/b9/5FcGrWkNPSHZ6d+tfJ8xxtHuOJ54ZcoQWIDK1ev8AMpUuDoLqe09F8iGpVLCve8LP7bXcXl875s+z5i3iI1VCI1J6s+FlqyFZ9n2fpfkYjQhQDqxN7votWjDwvNbeK9Gounm6bsL+IoL9F1eTxVUI6GqLoex9R8kEKARCDl7N+02BXC8h6nwzOiGzu+h8T6Hbk4eRKyLJWV7EVtWPR9j6r5KkV1VVNnC6uj1fZXx+Z5zo8JvU6e/H7j51zh16co54QZmOzrPUqdD2XqflGQAqoXRd5x/a7e7mdHz2Xl5C9d6PrF5Lx+Jj62Y9GRyWjk0MQ4D3+y9R8o59iMue4xeLZ69fPyh1JyMWj6F2dY+Y+dhIehi2Y9ucXTIw0v2ey9T8r5koJd/SeT4ff39nkuf1Op1+Txce32fqL894XmxjmhR6cLNK8BFM9dX2nqPmHJlDJf03wXG6XoEc3lbuhtLg8uen94vyPmMtnRUTmBeZ5MzqjtPtPUfMePcqS+5yeZu6Tgxaen0OPh5Ktn0BHjMAWTlxoa8wlvqYSJWn2nqvmvFl3Vw9/n9/RXTiavLjGeo7/G8jklOlMpWsj estrictions, or prohibition in the habitat."},{"id":"c07-s22-t5","src":"test","kind":"tf","q":"According to the manual, a major problem for most wildlife is the destruction of habitat.","answer":true,"ref":"p. 119, 'Protecting Endangered Species'","why":"Habitat destruction, usually from development, is a major problem for most wildlife."}]},{"id":"c07-s23","chapter":"Chapter 7 · Pesticides in the Environment","title":"Chapter 7 summary","pages":[120,120],"body":[{"h":"Summary"},{"p":["An important part of using pesticides legally and responsibly is considering where the pesticide may end up once it leaves the container, and whether it might harm or damage nontarget sites, plants, or animals.","By applying pesticides **at the right time, in the right place, and with the proper application technique**, you can greatly reduce, or even prevent, drift, runoff, and leaching.","Pesticides that enter groundwater and surface water are hazardous to aquatic organisms, plants, and wildlife.","Therefore, you should implement **best management practices** to prevent runoff and leaching of pesticides.","**Sensitive areas** include places such as schools, playgrounds, endangered species' habitats, and ornamental plantings.","**Nontarget organisms** include plants, bees and other beneficial insects, fish, wildlife, and livestock.","Because of the greater risk of injury to people, plants, and animals, you must know when and how to properly apply pesticides in or near such areas.","Always check the label for statements on endangered and threatened species. You may need to consult a **county bulletin** that details the procedures for protecting them.","It is your responsibility not only to follow label directions, but also to use the best management practices that present the **least risk to the environment** while achieving effective pest control."]},{"fig":"p120-manatee"}],"figures":[{"id":"p120-manatee","title":"Endangered species need to be protected from pesticides.","page":"p. 1 /* ================= grading typed answers ================= */
const NEG = /\b(not|no|never|isn'?t|don'?t|doesn'?t|cannot|can'?t|without)\b/;
const norm = s => plain(s).toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9%.'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }

}
// Typo tolerant, but "vertebrates" never passes for "invertebrates", nor "selective" for "nonselective".
function close(a, b) {

  const L = Math.max(a.length, b.length);

}

    for (let i = 0; i + len <= a.length; i++) {

      if (close(w, target)) return true;
    }
  }

}

  const t = norm(text); if (!t) return false;
  const acc = [q.answer, ...(q.accept || [])].filter(x => x !== undefined && x !== null && x !== '').map(String);
  if (acc.some(a => norm(a) === t)) return true;
  const negTrap = NEG.test(t) && !acc.some(a => NEG.test(norm(a)));
  if (negTrap) return false;
  // With required points, every point must be there; whole-answer fuzziness would let list answers slide.
  if (q.keys && q.keys.length) return q.keys.every(g => [].concat(g).some(alt => phraseIn(alt, text)));

}

function collectPlain(s) {

  for (const b of s.body || []) {
    if (b.h) out.push(plain(b.h));
    if (b.box !== undefined) out.push(plain(b.box) + ':');
    if (b.p) out.push(b.p.map(plain).join(' '));
    if (b.list) out.push(b.list.map(plain).join(' '));

      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.13, now + t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);

  d.innerHTML = `<div class="dock-in">
    <button class="btn primary" data-act="play" ${can ? '' : 'disabled'} aria-label="${label}">${icon} ${label}</button>
    ${st !== 'idle' ? `<button class="btn" data-act="stop" aria-label="Stop reading">${ICON.stop} Stop</button>` : ''}
    ${st === 'speaking' ? '<span class="speaking-dot" aria-hidden="true"></span>' : ''}
    <span class="spacer"></span>
    <button class="btn${Reader.done ? ' hi' : ''}" id="dock-quiz" data-act="quiz" data-sid="${esc(S.sid)}">Quiz ${ICON.arrow}</button>
  </div>`;
}
function removeDock() { const d = $('#dock'); if (d) d.remove(); }

/* ----- quiz */
function viewQuiz() {
  const quiz = S.quiz; if (!quiz) return viewHome();
  const cur = quiz.cur, q = Q[cur.id], s = SEC[q.sid];
  const title = quiz.mode === 'rapid' ? 'Rapid round' : quiz.mode === 'drill' ? 'Weak-spot drill' : 'Card quiz';
  const done = quiz.i + (cur.result ? 1 : 0);
  const tags = [];
  if (q.src === 'review') tags.push('<span class="pill review">Manual review question</span>');
  else tags.push('<span class="pill new">Test-style</span>');
  if (q.style === 'scenario') tags.push('<span class="pill new">Scenario</span>');
  if (q.style === 'not') tags.push('<span class="pill new">NOT question</span>');
  if (cur.retry) tags.push('<span class="pill retry">Missed earlier</span>');
  else if (P.q[cur.id] && P.q[cur.id].open && isReal(cur.id)) tags.push('<span class="pill weak">Weak spot</span>');
  let body = '';
  const R = cur.result;
  if (q.kind === 'mc') {
    body = `<div class="choices">${cur.order.map((k, pos) => {
      let cls = 'choice';
      if (R) { if (k === q.answer) cls += ' right'; else if (k === cur.picked) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-act="pick" data-k="${k}" ${R ? 'disabled' : ''}><span class="k">${LET[pos]}</span><span>${md(q.choices[k])}</span></button>`;
    }).join('')}</div>`;
  } else if (q.kind === 'tf') {
    body = `<div class="tf">${[true, false].map(v => {
      let cls = 'choice';
      if (R) { if (v === q.answer) cls += ' right'; else if (v === cur.picked) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-act="tf" data-v="${v}" ${R ? 'disabled' : ''}>${v ? 'True' : 'False'}</button>`;
    }).join('')}</div>`;
  } else {
    body = R || cur.grading
      ? `<div class="typed ${R ? (R.ok ? 'right' : 'wrong') : ''}">${esc(cur.typed)}</div>`
      : `<form class="short" data-form="short" autocomplete="off"><input id="short-in" type="text" placeholder="Type your answer" aria-label="Your answer" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn primary" type="submit">Check</button></form>`;
  }
  let fb = '';
  if (cur.grading) fb = `<div class="band wait">Checking…</div><p class="hint">Claude is reading your answer. Spelling does not count.</p>`;
  else if (R) {
    const correctText = q.kind === 'mc' ? `${LET[cur.order.indexOf(q.answer)]}. ${q.choices[q.answer]}` : q.kind === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
    fb = `<div class="band ${R.ok ? 'ok' : 'bad'}"><span>${R.ok ? 'Right' : 'Wrong'}</span>${R.gain ? `<span class="xp">+${R.gain} XP</span>` : ''}</div>
    <div class="fb">
      ${R.ok ? '' : `<p class="ans">Correct answer: ${md(correctText)}</p>`}
      ${R.why2 ? `<p>${esc(R.why2)}</p>` : ''}
      ${q.why ? `<p>${md(q.why)}</p>` : ''}
      <p class="src">Source: ${esc(q.ref || 'not given')}${s && s.pages && !s.practice ? ' · ' + esc(pagesLabel(s)) : ''}</p>
      ${!R.ok && R.broke >= 3 ? `<p><b>Streak broken at ${R.broke}.</b></p>` : ''}
      ${!R.ok && !R.practice ? '<p class="hint">This one comes back later. Get it right twice in a row to clear it.</p>' : ''}
      ${R.by === 'match' && q.kind === 'short' && !R.ok ? '<p class="hint">Graded by matching key words because Claude grading is not available in this view.</p>' : ''}
    </div>
    <button class="btn primary big" data-act="next" id="btn-next">${quiz.i + 1 >= quiz.items.length ? 'See results' : 'Next'} ${ICON.arrow}</button>
    <span class="hint">Press Enter for next.</span>`;
  }
  return `<div class="view">
  <div class="qhead"><span class="eyebrow">${esc(title)}${quiz.sid && SEC[quiz.sid] ? ' · ' + esc(SEC[quiz.sid].title) : ''}</span><span class="row" style="gap:12px"><span class="combo${S.combo >= 3 ? ' on' : ''}">${ICON.flame}${S.combo}</span><span class="mono">${Math.min(quiz.i + 1, quiz.items.length)} / ${quiz.items.length}</span></span></div>
  <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="${quiz.items.length}" aria-valuenow="${done}"><i style="width:${pct(done, quiz.items.length)}%"></i></div>
  <section class="qcard">
    <div class="row" style="gap:6px">${tags.join('')}</div>
    <h2 class="qtext">${md(q.q)}</h2>
    ${body}
    ${fb}
    ${!R && !cur.grading && q.kind !== 'short' ? `<span class="hint">${q.kind === 'mc' ? 'Keys A to ' + LET[q.choices.length - 1] + ' work too.' : 'Keys T and F work too.'}</span>` : ''}
  </section>
  <div class="row"><button class="btn small" data-act="quit-quiz">${ICON.back} Leave quiz</button></div>
</div>`;
}

/* ----- results */
function missList(ids) {
  return `<ul class="misslist">${ids.map(id => {
    const q = Q[id]; const a = q.kind === 'mc' ? q.choices[q.answer] : q.kind === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
    return `<li><span>${md(q.q)}</span><b>Answer: ${md(a)}</b><span class="src">${esc(q.ref || '')}</span></li>`;
  }).join('')}</ul>`;
}
function viewResult() {
  const r = S.result; if (!r) return viewHome();
  const nx = nextSection();
  const s = r.sid ? SEC[r.sid] : null;
  const nextBtn = nx ? `<button class="btn primary big" data-act="next-section">Next card: ${esc(nx.title)} ${ICON.arrow}</button>` : (openMisses().length ? `<button class="btn primary big" data-act="drill">Drill weak spots ${ICON.arrow}</button>` : '');
  const endBtn = S.sess ? '<button class="btn" data-act="end-session">End session and see summary</button>' : '<button class="btn" data-act="home">Home</button>';
  if (r.mode === 'section') {
    const pass = r.score === 100;
    return `<div class="view"><section class="result">
      <span class="eyebrow">${esc(s ? s.title : 'Card quiz')}</span>
      <div class="stamp ${pass ? 'ok' : 'bad'}">${pass ? 'Passed' : 'Failed'}</div>
      <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
      <p>${pass ? (r.firstPass ? 'Perfect. Card passed. +50 XP.' : 'Perfect again.') : `You missed ${r.total - r.right}. You need 100% to pass. Study the misses, then retake it.`}</p>
      ${r.missed.length ? missList(r.missed) : ''}
      <div class="row" style="width:100%">
        ${pass ? '' : `<button class="btn primary big grow" data-act="quiz" data-sid="${esc(r.sid)}">Retake quiz</button><button class="btn" data-act="open" data-sid="${esc(r.sid)}">Reread the card</button>`}
      </div>
      ${pass ? nextBtn : (nx && nx.id !== r.sid ? `<button class="btn" data-act="next-section">Move on for now (stays failed)</button>` : '')}
      ${endBtn}
    </section></div>`;
  }
  const label = r.mode === 'rapid' ? 'Rapid round' : 'Weak-spot drill';
  return `<div class="view"><section class="result">
    <span class="eyebrow">${label}</span>
    <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
    <p>${r.score === 100 ? 'Clean sweep.' + (r.bonus ? ' +' + r.bonus + ' XP bonus.' : '') : 'Missed ' + (r.total - r.right) + '. Those stay on your weak list until you get each right twice in a row.'}</p>
    ${r.missed.length ? missList(r.missed) : ''}
    ${nextBtn || ''}
    ${endBtn}
  </section></div>`;
}
function viewSummary() {
  const x = S.summary; if (!x) return viewHome();
  const mins = Math.max(1, Math.round(((x.end || Date.now()) - x.start) / 60000));
  const weak = openMisses();
  const failedNow = (x.failed || []).filter(id => !P.passed[id]);
  const nx = nextSection();
  const li = arr => arr.length ? `<ul class="sumlist">${arr.join('')}</ul>` : '<p class="muted">Nothing.</p>';
  return `<div class="view"><section class="result">
    <span class="eyebrow">Session summary · ${mins} min</span>
    <h1 class="display" style="font-size:40px">${x.a ? (pct(x.c, x.a) >= 90 ? 'Strong session.' : pct(x.c, x.a) >= 70 ? 'Decent. Not good enough yet.' : 'Rough session. Fix the misses.') : 'No questions answered.'}</h1>
    <div class="sumgrid">
      <div class="stat"><span class="lbl">Answered</span><b>${x.a}</b></div>
      <div class="stat"><span class="lbl">Accuracy</span><b>${x.a ? pct(x.c, x.a) + '%' : '—'}</b></div>
      <div class="stat"><span class="lbl">XP earned</span><b>+${fmt(x.xp)}</b></div>
      <div class="stat"><span class="lbl">Best streak</span><b>${x.best}</b></div>
    </div>
    <div class="panel" style="width:100%"><h2>Mastered</h2>${li([...(x.passed || []).map(id => SEC[id] ? `<li>Passed card: <b>${esc(SEC[id].title)}</b></li>` : ''), ...(x.cleared || []).filter(isReal).map(id => `<li>Cleared: ${md(Q[id].q)}</li>`)].filter(Boolean))}</div>
    <div class="panel" style="width:100%"><h2>Weak on</h2>${li([...failedNow.map(id => SEC[id] ? `<li>Card not passed: <b>${esc(SEC[id].title)}</b></li>` : ''), ...weak.slice(0, 10).map(id => `<li>${md(Q[id].q)} <span class="muted">(${esc(Q[id].ref || '')})</span></li>`)].filter(Boolean))}${weak.length > 10 ? `<p class="muted">Plus ${weak.length - 10} more on your weak list.</p>` : ''}</div>
    <div class="panel" style="width:100%"><h2>Next</h2><p>${nx ? `Card: <b>${esc(nx.title)}</b> (${esc(pagesLabel(nx))}).` : REAL.length ? 'Every loaded card is passed. Send Claude the next pages of your manual.' : 'Send Claude photos of your first manual pages.'}${weak.length ? ` Your next session opens with a rapid round that hits your ${weak.length} weak question${weak.length === 1 ? '' : 's'} first.` : ''}</p></div>
    <button class="btn primary" data-act="home">Back to home</button>
  </section></div>`;
}

/* ================= toast ================= */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ================= events ================= */
const ACT = {
  home: () => go('home'),
  'start-session': () => startSession(),
  continue: () => { if (S.quiz) go('quiz'); else goNext(); },
  'end-session': () => endSession(),
  open: b => openSection(b.dataset.sid),
  quiz: b => { const s = SEC[b.dataset.sid]; if (s) startQuiz('section', s.id, sectionQuizIds(s)); },
  pick: b => pick(parseInt(b.dataset.k, 10)),
  tf: b => pick(b.dataset.v === 'true'),
  next: () => nextQ(),
  'quit-quiz': () => { S.quiz = null; go('home'); },
  'next-section': () => goNext(),
  drill: () => startQuiz('drill', null, openMisses().slice(0, 15)),
  play: () => playToggle(),
  stop: () => Reader.stop(),
  sound: () => { P.settings.sound = !P.settings.sound; save(); renderFoot(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { ACT[b.dataset.act] && ACT[b.dataset.act](b, e); return; }
  const sent = e.target.closest('#reading .sent');
  if (sent && (Reader.mode === 'claude' || Reader.mode === 'device')) play(parseInt(sent.dataset.i, 10));
});
document.addEventListener('submit', e => { if (e.target.matches('[data-form="short"]')) { e.preventDefault(); submitShort(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'sel-voice') { P.settings.voice = e.target.value; save(); if (Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur); }
  if (e.target.id === 'sel-rate') {
    P.settings.rate = parseFloat(e.target.value) || 1; save();
    if (Reader.mode === 'claude' && Reader.t && Reader.t.setRate) { try { const r = Reader.t.setRate(P.settings.rate); if (r && r.catch) r.catch(() => {}); } catch (x) {} }
    if (Reader.mode === 'device' && Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur);
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (S.view === 'quiz' && S.quiz) {
    const cur = S.quiz.cur, q = Q[cur.id];
    if (!cur.result && !cur.grading) {
      const k = e.key.toLowerCase();
      if (q.kind === 'mc') {
        let pos = LET.toLowerCase().indexOf(k); if (pos < 0 && /^[1-6]$/.test(k)) pos = parseInt(k, 10) - 1;
        if (pos >= 0 && pos < cur.order.length) { e.preventDefault(); pick(cur.order[pos]); }
      } else if (q.kind === 'tf') { if (k === 't') pick(true); if (k === 'f') pick(false); }
    } else if (cur.result && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  } else if (S.view === 'study' && e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); playToggle(); }
});

/* ================= boot (with hot reload state) ================= */
function snapshotState() { return { view: S.view, sid: S.sid, quiz: S.quiz, result: S.result, summary: S.summary, combo: S.combo }; }
function start(data) {
  try {
    if (data && data.view) {
      const okQuiz = !data.quiz || data.quiz.items.every(it => Q[it.id]);
      if (okQuiz && (!data.sid || SEC[data.sid])) { Object.assign(S, { view: data.view, sid: data.sid, quiz: data.quiz, result: data.result, summary: data.summary, combo: data.combo || 0 }); if (S.view === 'quiz' && !S.quiz) S.view = 'home'; }
    }
  } catch (e) { S.view = 'home'; }
  render();
  initDb();
}
try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === 'function') h.snapshot(snapshotState); } catch (e) {}
let started = false;
const startOnce = data => { if (started) return; started = true; start(data); };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(startOnce); } catch (e) {} setTimeout(() => startOnce({}), 1500); }
else startOnce((hot && hot.data) || {});
})();
</script>
