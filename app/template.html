<title>Pest Applicator Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 720px reading column. Sticky status bar on top, a fixed reading dock under study cards.
   Verdicts are full-width bands styled like the signal-word panel on a pesticide label. */
:root{
  --paper:#f4f6ef; --card:#ffffff; --ink:#17221b; --muted:#55645a; --line:#d6ddd1;
  --field:#1d5c40; --field-2:#e3eee6; --on-field:#ffffff;
  --hi:#ffdc33; --hi-soft:#fff3b0; --hi-ink:#17221b;
  --ok:#16703d; --ok-bg:#e0f1e5; --bad:#b42318; --bad-bg:#fce6e2; --warn:#8a5800; --warn-bg:#fbefd2;
  --shadow:0 1px 0 rgba(23,34,27,.05),0 10px 24px -16px rgba(23,34,27,.35);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1411; --card:#151e19; --ink:#e5ebe6; --muted:#9bada1; --line:#28352d;
  --field:#6cc195; --field-2:#1a2b21; --on-field:#0c1410;
  --hi:#ffdc33; --hi-soft:#3b3510; --hi-ink:#16140a;
  --ok:#6ad197; --ok-bg:#132e1e; --bad:#ff8c80; --bad-bg:#3a1613; --warn:#f2b64a; --warn-bg:#33270d;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1411; --card:#151e19; --ink:#e5ebe6; --muted:#9bada1; --line:#28352d;
  --field:#6cc195; --field-2:#1a2b21; --on-field:#0c1410;
  --hi:#ffdc33; --hi-soft:#3b3510; --hi-ink:#16140a;
  --ok:#6ad197; --ok-bg:#132e1e; --bad:#ff8c80; --bad-bg:#3a1613; --warn:#f2b64a; --warn-bg:#33270d;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;line-height:.9;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:19px;text-transform:uppercase}
.brand small{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--field)}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--paper)}
.chip svg{width:15px;height:15px;flex:none}
.chip.hot{border-color:var(--hi);background:var(--hi-soft)}
.chip.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.bar-prog{height:4px;background:var(--line)}
.bar-prog i{display:block;height:100%;background:var(--field);transition:width .5s ease}

main{padding-block:20px 120px}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- type */
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--field)}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:800;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px;text-decoration:none}
.btn:hover{border-color:var(--field)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--field);border-color:var(--field);color:var(--on-field)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:60px;font-size:20px;padding:12px 22px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 200px}
.linkish{background:none;border:0;padding:0;color:var(--field);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- home */
.mission{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mission-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px}
.countdown{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.8;color:var(--field);font-variant-numeric:tabular-nums}
.countdown small{display:block;font-size:15px;letter-spacing:.14em;color:var(--muted);margin-top:8px}
.mission-copy{display:flex;flex-direction:column;gap:6px;min-width:0}
.mission-copy h1{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.mission-cta{padding:0 18px 18px;display:flex;flex-direction:column;gap:8px}
.mission-cta .btn{width:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--field);border-radius:99px;transition:width .5s ease}
.meter.yellow i{background:var(--hi)}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--hi);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dots i.today{outline:2px solid var(--field);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.secgroup{display:flex;flex-direction:column;gap:6px}
.secgroup h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chap{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chap+.chap{margin-top:-4px}
.chap summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px}
.chap summary::-webkit-details-marker{display:none}
.chap summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--field);border-bottom:2.5px solid var(--field);transform:rotate(-45deg);transition:transform .15s;justify-self:center}
.chap[open] summary::before{transform:rotate(45deg)}
.chap-t{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;min-width:0}
.chap-n{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chap-n .mono{font-size:14px;font-weight:600}
.chap summary .meter{grid-column:2 / -1;height:6px}
.chap[open] summary{border-bottom:1px solid var(--line)}
.chap .secgroup{padding:10px}
.secrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.secrow:hover{border-color:var(--field)}
.secrow .t{font-weight:700;min-width:0}
.secrow .m{font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.pill.pass{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.new{background:var(--paper);color:var(--muted);border-color:var(--line)}
.pill.next{background:var(--hi);color:var(--hi-ink)}
.pill.weak{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.review{background:var(--field-2);color:var(--field);border-color:var(--field)}
.pill.retry{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.read{background:var(--field-2);color:var(--field);border-color:var(--field)}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.weaklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.weaklist li{border-left:4px solid var(--warn);padding:4px 10px;background:var(--paper);border-radius:0 8px 8px 0;font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;color:var(--muted)}

/* ---------- study card (styled like a label panel) */
.label{background:var(--card);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.label-band{background:var(--field);color:var(--on-field);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px}
.label-head{padding:16px 16px 4px;display:flex;flex-direction:column;gap:6px}
.label-head h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.label-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.voicebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-block:1px solid var(--line);margin-top:10px;font-size:14px;background:var(--paper)}
.voicebar label{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.voicebar select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.voicebar .tick{font-weight:400;gap:8px;min-height:32px}
.voicebar .tick input{width:20px;height:20px;accent-color:var(--field);flex:none;margin:0}
.voicenote{flex-basis:100%;color:var(--muted)}
#reading{padding:16px;font-size:19px;line-height:1.7;display:flex;flex-direction:column;gap:14px}
#reading .rh{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:6px}
#reading ul,#reading ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
#reading ol li::marker{font-family:var(--f-display);font-weight:800;color:var(--field)}
.mbox{background:var(--field-2);border:2px solid var(--field);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.mbox h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--field);line-height:1.25}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery .fig{margin:0}
.gallery .fig figcaption{font-size:15px;line-height:1.45;padding:8px 10px}
.fig-art img{border-radius:6px}
@media (max-width:560px){.fig-art svg{min-width:520px}}
.sent{border-radius:4px;transition:background-color .15s;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:color-mix(in srgb,var(--hi-soft) 55%,transparent)}
.sent.on{background:var(--hi-soft)}
.w{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.on{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 2px var(--hi)}
.term{font-weight:700}
.fig{margin:6px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.fig-art{padding:12px;overflow-x:auto;background:var(--card)}
.fig-art svg,.fig-art img{display:block;width:100%;max-width:100%;height:auto}
.fig figcaption{padding:10px 12px;font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.fig-ref{font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.f-ink{fill:var(--ink)} .f-muted{fill:var(--muted)} .f-on{fill:var(--on-field)}
.f-card{fill:var(--card);stroke:var(--ink);stroke-width:2}
.f-field{fill:var(--field)} .f-hi{fill:var(--hi)} .f-line{fill:var(--line)}
.f-ok{fill:var(--ok)} .f-bad{fill:var(--bad)}
.f-arrow{stroke:var(--ink)} .s-ink{stroke:var(--ink)} .s-field{stroke:var(--field)} .s-muted{stroke:var(--muted)}
.terms{margin:0 16px 16px;border-top:2px solid var(--ink);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.terms h3{font-family:var(--f-display);font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.terms dl{margin:0;display:grid;gap:8px}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
.dock-in{max-width:728px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .spacer{flex:1}
.dock .btn{min-height:50px}
.dock-time{font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
@media (max-width:480px){.dock .btn{padding-inline:12px}.dock-stop span{display:none}}
@media (max-width:339px){.dock-time{display:none}}
.speaking-dot{width:10px;height:10px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 0 var(--hi);animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}

/* ---------- quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--hi);transition:width .3s ease}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.qtext{font-size:22px;line-height:1.35;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;width:100%;min-height:54px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px}
.choice:hover:not([disabled]){border-color:var(--field)}
.choice .k{font-family:var(--f-mono);font-weight:600;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card)}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.right .k{background:var(--ok);color:var(--card);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice.dim{opacity:.5}
.choice[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .choice{grid-template-columns:1fr;justify-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.short{display:flex;gap:8px;flex-wrap:wrap}
.short input{flex:1 1 220px;min-width:0;min-height:54px;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:19px;background:var(--paper)}
.short input:focus{border-color:var(--field);outline:none}
.typed{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:18px}
.typed.right{border-color:var(--ok);background:var(--ok-bg)}
.typed.wrong{border-color:var(--bad);background:var(--bad-bg)}
.band{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:26px;padding:8px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.band.ok{background:var(--ok);color:var(--card)}
.band.bad{background:var(--bad);color:var(--card)}
.band.wait{background:var(--line);color:var(--ink)}
.band .xp{font-family:var(--f-mono);font-size:16px;letter-spacing:0;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px}
.fb{display:flex;flex-direction:column;gap:8px;font-size:17px}
.fb .ans{font-weight:700}
.fb .src{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.combo{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.combo svg{width:20px;height:20px}
.combo.on{color:var(--warn)}
.hint{font-size:13px;color:var(--muted)}

/* ---------- results */
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.stamp{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;letter-spacing:.08em;text-transform:uppercase;border:5px solid currentColor;border-radius:8px;padding:6px 16px 2px;transform:rotate(-5deg);animation:stamp .5s cubic-bezier(.2,1.5,.4,1)}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
@keyframes stamp{0%{transform:rotate(-5deg) scale(1.8);opacity:0}100%{transform:rotate(-5deg) scale(1);opacity:1}}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.misslist{display:flex;flex-direction:column;gap:10px;width:100%;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.misslist .src{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
@media (min-width:640px){.sumgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sumlist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;max-width:min(92vw,520px);text-align:center;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .countdown{font-size:58px}
  .mission-copy h1{font-size:24px}
  .label-head h1{font-size:28px}
  .qtext{font-size:20px}
  #reading{font-size:18px}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

      <h1>${esc(s.title)}</h1>
      <div class="label-meta">
        ${s.pages ? `<span class="mono">${esc(pagesLabel(s))}</span>` : ''}
        ${s.photos && s.photos.length ? `<span>From ${esc(s.photos.join(', '))}</span>` : ''}
        <span>About ${Math.max(1, Math.round(words / 150))} min read</span>
        <span>${(s.questions || []).length} questions</span>
        ${st === 'pass' ? '<span class="pill pass">Passed</span>' : st === 'fail' ? '<span class="pill fail">Failed last try</span>' : st && P.read[s.id] ? '<span class="pill read">Listened · quiz not passed</span>' : ''}
      </div>
    </div>
    <div class="voicebar" id="voicebar"></div>
    <div id="reading">${body}</div>
    ${(s.terms || []).length ? `<div class="terms"><h3>Key terms</h3><dl>${s.terms.map(t => `<div><dt>${md(t.term)}</dt><dd>${md(t.def)}</dd></div>`).join('')}</dl></div>` : ''}
  </article>
  <button class="btn primary big" data-act="quiz" data-sid="${esc(s.id)}">Quiz me on this card ${ICON.arrow}</button>
</div>`;
}
function renderVoiceBar() {
  const vb = $('#voicebar'); if (!vb) return;
  const fid = vb.contains(document.activeElement) ? document.activeElement.id : '';
  const eng = (Reader.state !== 'idle' && Reader.engine) || pickEngine(S.sid), pref = P.settings.engine || 'auto';
  const opts = [['auto', 'Best available']];
  if (narr(S.sid)) opts.push(['rec', 'Recorded voice']);
  if (Reader.tts === 'ready') opts.push(['claude', 'Claude voice']);
  if (Reader.tts !== 'off' && 'speechSynthesis' in window) opts.push(['device', 'This device’s voice']);
  const sel = opts.some(o => o[0] === pref) ? pref : 'auto';
  vb.innerHTML = `<label for="sel-engine">Voice <select id="sel-engine">${opts.map(([v, l]) => `<option value="${v}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    ${eng === 'claude' ? `<label for="sel-voice">Style <select id="sel-voice">${Reader.voices.map(v => `<option value="${esc(v)}"${v === P.settings.voice ? ' selected' : ''}>${esc(v[0].toUpperCase() + v.slice(1))}</option>`).join('')}</select></label>` : ''}
    <label for="sel-rate">Speed ${rateSelect()}</label>
    <label class="tick" for="chk-auto"><input type="checkbox" id="chk-auto"${P.settings.autoplay !== false ? ' checked' : ''}> Read to me when a card opens</label>
    <label class="tick" for="chk-chain"><input type="checkbox" id="chk-chain"${P.settings.chain ? ' checked' : ''}> Keep going to the next card</label>
    <span class="voicenote" id="voicenote"></span>`;
  if (fid) { const f = document.getElementById(fid); if (f) f.focus({ preventScroll: true }); }
  renderVoiceNote();
}
function rateSelect() { return `<select id="sel-rate">${[0.8, 0.9, 1, 1.15, 1.3].map(r => `<option value="${r}"${r === P.settings.rate ? ' selected' : ''}>${r}×</option>`).join('')}</select>`; }
function renderVoiceNote() {
  const n = $('#voicenote'); if (!n) return;
  if (Reader.note) { n.textContent = Reader.note; n.style.color = 'var(--warn)'; return; }
  n.style.color = '';
  const eng = (Reader.state !== 'idle' && Reader.engine) || pickEngine(S.sid), bad = recBad(S.sid) ? Rec.bad[S.sid] : '';
  n.textContent = eng === 'rec' ? 'Recorded voice. Tap any sentence to hear it from there.'
    : eng === 'claude' ? 'Claude voice. Tap any sentence to hear it from there.'
    : eng === 'device' ? (bad ? 'The recorded voice could not load (' + bad + '), so Play uses this device’s voice.' + (bad === DIFFER ? '' : ' Open the card again to try the recording.')
      : narr(S.sid) ? 'Play uses this device’s voice.'
      : 'This card has no recording yet and the Claude voice is not offered in this browser or app, so Play uses this device’s voice.')
    : Reader.tts === 'pending' ? 'Loading the voice…'
    : Reader.tts === 'off' ? offNote()
    : 'Reading aloud is not available in this browser.';
}
function renderDock() {
  if (S.view !== 'study') return;
  let d = $('#dock');
  if (!d) { d = document.createElement('div'); d.className = 'dock'; d.id = 'dock'; document.body.appendChild(d); }
  const can = !!pickEngine(S.sid) || Reader.tts === 'pending';
  const st = Reader.state;
  const fa = d.contains(document.activeElement) ? document.activeElement.dataset.act : '';
  const label = st === 'idle' ? 'Play' : st === 'paused' ? 'Resume' : 'Pause';
  const icon = st === 'speaking' ? ICON.pause : ICON.play;
  d.innerHTML = `<div class="dock-in">
    <button class="btn primary" data-act="play" ${can || st !== 'idle' ? '' : 'disabled'} aria-label="${label}">${icon} ${label}</button>
    ${st !== 'idle' ? `<button class="btn dock-stop" data-act="stop" aria-label="Stop reading">${ICON.stop}<span> Stop</span></button>` : ''}
    ${st === 'speaking' && Reader.engine !== 'rec' ? '<span class="speaking-dot" aria-hidden="true"></span>' : ''}
    ${st !== 'idle' && Reader.engine === 'rec' ? `<span class="mono dock-time" id="dock-time">${esc(Rec.shown)}</span>` : ''}
    <span class="spacer"></span>
    <button class="btn${Reader.done ? ' hi' : ''}" id="dock-quiz" data-act="quiz" data-sid="${esc(S.sid)}">Quiz ${ICON.arrow}</button>
  </div>`;
  if (fa) { const f = d.querySelector('[data-act="' + fa + '"]'); if (f) f.focus({ preventScroll: true }); }
}
function removeDock() { const d = $('#dock'); if (d) d.remove(); }

/* ----- quiz */
function viewQuiz() {
  const quiz = S.quiz; if (!quiz) return viewHome();
  const cur = quiz.cur, q = Q[cur.id], s = SEC[q.sid];
  const title = quiz.mode === 'rapid' ? 'Rapid round' : quiz.mode === 'drill' ? 'Weak-spot drill' : 'Card quiz';
  const done = quiz.i + (cur.result ? 1 : 0);
  const tags = [];
  if (q.src === 'review') tags.push('<span class="pill review">Manual review question</span>');
  else tags.push('<span class="pill new">Test-style</span>');
  if (q.style === 'scenario') tags.push('<span class="pill new">Scenario</span>');
  if (q.style === 'not') tags.push('<span class="pill new">NOT question</span>');
  if (cur.retry) tags.push('<span class="pill retry">Missed earlier</span>');
  else if (P.q[cur.id] && P.q[cur.id].open && isReal(cur.id)) tags.push('<span class="pill weak">Weak spot</span>');
  let body = '';
  const R = cur.result;
  if (q.kind === 'mc') {
    body = `<div class="choices">${cur.order.map((k, pos) => {
      let cls = 'choice';
      if (R) { if (k === q.answer) cls += ' right'; else if (k === cur.picked) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-act="pick" data-k="${k}" ${R ? 'disabled' : ''}><span class="k">${LET[pos]}</span><span>${md(q.choices[k])}</span></button>`;
    }).join('')}</div>`;
  } else if (q.kind === 'tf') {
    body = `<div class="tf">${[true, false].map(v => {
      let cls = 'choice';
      if (R) { if (v === q.answer) cls += ' right'; else if (v === cur.picked) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-act="tf" data-v="${v}" ${R ? 'disabled' : ''}>${v ? 'True' : 'False'}</button>`;
    }).join('')}</div>`;
  } else {
    body = R || cur.grading
      ? `<div class="typed ${R ? (R.ok ? 'right' : 'wrong') : ''}">${esc(cur.typed)}</div>`
      : `<form class="short" data-form="short" autocomplete="off"><input id="short-in" type="text" placeholder="Type your answer" aria-label="Your answer" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn primary" type="submit">Check</button></form>`;
  }
  let fb = '';
  if (cur.grading) fb = `<div class="band wait">Checking…</div><p class="hint">Claude is reading your answer. Spelling does not count.</p>`;
  else if (R) {
    const correctText = q.kind === 'mc' ? `${LET[cur.order.indexOf(q.answer)]}. ${q.choices[q.answer]}` : q.kind === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
    fb = `<div class="band ${R.ok ? 'ok' : 'bad'}"><span>${R.ok ? 'Right' : 'Wrong'}</span>${R.practice ? '<span class="xp">Practice · not counted</span>' : R.gain ? `<span class="xp">+${R.gain} XP</span>` : ''}</div>
    <div class="fb">
      ${R.ok ? '' : `<p class="ans">Correct answer: ${md(correctText)}</p>`}
      ${R.why2 ? `<p>${esc(R.why2)}</p>` : ''}
      ${q.why ? `<p>${md(q.why)}</p>` : ''}
      <p class="src">Source: ${esc(q.ref || 'not given')}${s && s.pages && !s.practice ? ' · ' + esc(pagesLabel(s)) : ''}</p>
      ${!R.ok && R.broke >= 3 ? `<p><b>Streak broken at ${R.broke}.</b></p>` : ''}
      ${!R.ok && !R.practice ? '<p class="hint">This one comes back later. Get it right twice in a row to clear it.</p>' : ''}
      ${R.by === 'match' && q.kind === 'short' && !R.ok ? '<p class="hint">Graded by matching key words because Claude grading is not available in this view.</p>' : ''}
    </div>
    <button class="btn primary big" data-act="next" id="btn-next">${quiz.i + 1 >= quiz.items.length ? 'See results' : 'Next'} ${ICON.arrow}</button>
    <span class="hint">Press Enter for next.</span>`;
  }
  return `<div class="view">
  <div class="qhead"><span class="eyebrow">${esc(title)}${quiz.sid && SEC[quiz.sid] ? ' · ' + esc(SEC[quiz.sid].title) : ''}</span><span class="row" style="gap:12px"><span class="combo${S.combo >= 3 ? ' on' : ''}">${ICON.flame}${S.combo}</span><span class="mono">${Math.min(quiz.i + 1, quiz.items.length)} / ${quiz.items.length}</span></span></div>
  <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="${quiz.items.length}" aria-valuenow="${done}"><i style="width:${pct(done, quiz.items.length)}%"></i></div>
  <section class="qcard">
    <div class="row" style="gap:6px">${tags.join('')}</div>
    <h2 class="qtext">${md(q.q)}</h2>
    ${body}
    ${fb}
    ${!R && !cur.grading && q.kind !== 'short' ? `<span class="hint">${q.kind === 'mc' ? 'Keys A to ' + LET[q.choices.length - 1] + ' work too.' : 'Keys T and F work too.'}</span>` : ''}
  </section>
  <div class="row"><button class="btn small" data-act="quit-quiz">${ICON.back} Leave quiz</button></div>
</div>`;
}

/* ----- results */
function missList(ids) {
  return `<ul class="misslist">${ids.map(id => {
    const q = Q[id]; const a = q.kind === 'mc' ? q.choices[q.answer] : q.kind === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
    return `<li><span>${md(q.q)}</span><b>Answer: ${md(a)}</b><span class="src">${esc(q.ref || '')}</span></li>`;
  }).join('')}</ul>`;
}
function viewResult() {
  const r = S.result; if (!r) return viewHome();
  const nx = nextSection();
  const s = r.sid ? SEC[r.sid] : null;
  const nextBtn = nx ? `<button class="btn primary big" data-act="next-section">Next card: ${esc(nx.title)} ${ICON.arrow}</button>` : (openMisses().length ? `<button class="btn primary big" data-act="drill">Drill weak spots ${ICON.arrow}</button>` : '');
  const endBtn = S.sess ? '<button class="btn" data-act="end-session">End session and see summary</button>' : '<button class="btn" data-act="home">Home</button>';
  if (r.mode === 'section') {
    const pass = r.score === 100;
    return `<div class="view"><section class="result">
      <span class="eyebrow">${esc(s ? s.title : 'Card quiz')}</span>
      <div class="stamp ${pass ? 'ok' : 'bad'}">${pass ? 'Passed' : 'Failed'}</div>
      <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
      <p>${pass ? (r.firstPass ? 'Perfect. Card passed. +50 XP.' : 'Perfect again.') : `You missed ${r.total - r.right}. You need 100% to pass. Study the misses, then retake it.`}</p>
      ${r.missed.length ? missList(r.missed) : ''}
      <div class="row" style="width:100%">
        ${pass ? '' : `<button class="btn primary big grow" data-act="quiz" data-sid="${esc(r.sid)}">Retake quiz</button><button class="btn" data-act="open" data-sid="${esc(r.sid)}">Reread the card</button>`}
      </div>
      ${s && s.practice ? '<p class="hint" id="practice-note">This was the practice card. Nothing on it counts toward progress, XP or your day streak.</p>' : `<p class="hint" id="saved-line">${esc(syncText())}</p>`}
      ${pass ? nextBtn : (nx && nx.id !== r.sid ? `<button class="btn" data-act="next-section">Move on for now (stays failed)</button>` : '')}
      ${endBtn}
    </section></div>`;
  }
  const label = r.mode === 'rapid' ? 'Rapid round' : 'Weak-spot drill';
  return `<div class="view"><section class="result">
    <span class="eyebrow">${label}</span>
    <div class="bigscore">${r.right} / ${r.total} · ${r.score}%</div>
    <p>${r.score === 100 ? 'Clean sweep.' + (r.bonus ? ' +' + r.bonus + ' XP bonus.' : '') : 'Missed ' + (r.total - r.right) + '. Those stay on your weak list until you get each right twice in a row.'}</p>
    ${r.missed.length ? missList(r.missed) : ''}
    <p class="hint" id="saved-line">${esc(syncText())}</p>
    ${nextBtn || ''}
    ${endBtn}
  </section></div>`;
}
function viewSummary() {
  const x = S.summary; if (!x) return viewHome();
  const mins = Math.max(1, Math.round(((x.end || Date.now()) - x.start) / 60000));
  const weak = openMisses();
  const failedNow = (x.failed || []).filter(id => !P.passed[id]);
  const rapidWeak = rapidPool().slice(0, 5).filter(id => P.q[id] && P.q[id].open).length;      // the weak questions the next rapid round will really ask: startSession() takes the first 5 of this pool
  const nx = nextSection();
  const li = arr => arr.length ? `<ul class="sumlist">${arr.join('')}</ul>` : '<p class="muted">Nothing.</p>';
  return `<div class="view"><section class="result">
    <span class="eyebrow">Session summary · ${mins} min</span>
    <h1 class="display" style="font-size:40px">${x.a ? (pct(x.c, x.a) >= 90 ? 'Strong session.' : pct(x.c, x.a) >= 70 ? 'Decent. Not good enough yet.' : 'Rough session. Fix the misses.') : 'No questions answered.'}</h1>
    <div class="sumgrid">
      <div class="stat"><span class="lbl">Answered</span><b>${x.a}</b></div>
      <div class="stat"><span class="lbl">Accuracy</span><b>${x.a ? pct(x.c, x.a) + '%' : '—'}</b></div>
      <div class="stat"><span class="lbl">XP earned</span><b>+${fmt(x.xp)}</b></div>
      <div class="stat"><span class="lbl">Best streak</span><b>${x.best}</b></div>
    </div>
    <div class="panel" style="width:100%"><h2>Mastered</h2>${li([...(x.passed || []).map(id => SEC[id] ? `<li>Passed card: <b>${esc(SEC[id].title)}</b></li>` : ''), ...(x.cleared || []).filter(isReal).map(id => `<li>Cleared: ${md(Q[id].q)}</li>`)].filter(Boolean))}</div>
    <div class="panel" style="width:100%"><h2>Weak on</h2>${li([...failedNow.map(id => SEC[id] ? `<li>Card not passed: <b>${esc(SEC[id].title)}</b></li>` : ''), ...weak.slice(0, 10).map(id => `<li>${md(Q[id].q)} <span class="muted">(${esc(Q[id].ref || '')})</span></li>`)].filter(Boolean))}${weak.length > 10 ? `<p class="muted">Plus ${weak.length - 10} more on your weak list.</p>` : ''}</div>
    <div class="panel" style="width:100%"><h2>Next</h2><p>${nx ? `Card: <b>${esc(nx.title)}</b> (${esc(pagesLabel(nx))}).` : REAL.length ? 'Every loaded card is passed. Send Claude the next pages of your manual.' : 'Send Claude photos of your first manual pages.'}${rapidWeak ? ` Your next session opens with a rapid round that hits ${rapidWeak < weak.length ? rapidWeak + ' of your ' + weak.length + ' weak questions' : 'your ' + rapidWeak + ' weak question' + (rapidWeak === 1 ? '' : 's')} first.` : ''}</p></div>
    <p class="hint" id="saved-line">${esc(syncText())}</p>
    <button class="btn primary" data-act="home">Back to home</button>
  </section></div>`;
}

/* ================= toast ================= */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ================= events ================= */
const ACT = {
  home: () => go('home'),
  'start-session': () => startSession(),
  continue: () => { if (S.quiz) go('quiz'); else goNext(); },
  'end-session': () => endSession(),
  open: b => openSection(b.dataset.sid),
  quiz: b => { const s = SEC[b.dataset.sid]; if (s) startQuiz('section', s.id, sectionQuizIds(s)); },
  pick: b => pick(parseInt(b.dataset.k, 10)),
  tf: b => pick(b.dataset.v === 'true'),
  next: () => nextQ(),
  'quit-quiz': () => { S.quiz = null; go('home'); },
  'next-section': () => goNext(),
  drill: () => startQuiz('drill', null, openMisses().slice(0, 15)),
  play: () => playToggle(),
  stop: () => Reader.stop(),
  sound: () => { P.settings.sound = !P.settings.sound; saveSettings(); renderFoot(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { ACT[b.dataset.act] && ACT[b.dataset.act](b, e); return; }
  const sent = e.target.closest('#reading .sent');
  if (sent && S.view === 'study') play(parseInt(sent.dataset.i, 10));
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d || !d.matches || !d.matches('details.chap')) return;
  chapOpen[d.dataset.ch] = d.open; lsSet(OPEN_KEY, chapOpen);
}, true);
document.addEventListener('submit', e => { if (e.target.matches('[data-form="short"]')) { e.preventDefault(); submitShort(); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'sel-engine') {
    P.settings.engine = e.target.value; saveSettings();
    if (e.target.value === 'rec') recRetry(S.sid);
    const at = Reader.state !== 'idle' ? Math.max(0, Reader.cur) : -1;
    Reader.note = '';
    if (at >= 0) play(at);
    renderVoiceBar(); renderDock();
  }
  if (id === 'sel-voice') { P.settings.voice = e.target.value; saveSettings(); if (Reader.engine === 'claude' && Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur); }
  if (id === 'sel-rate') {
    P.settings.rate = parseFloat(e.target.value) || 1; saveSettings();
    if (Reader.t && Reader.t.setRate) { try { const r = Reader.t.setRate(P.settings.rate); if (r && r.catch) r.catch(() => {}); } catch (x) {} }
    if (Reader.engine === 'device' && Reader.state !== 'idle' && Reader.cur >= 0) play(Reader.cur);
    if (Reader.engine === 'rec') Rec.setRate();
  }
  if (id === 'chk-auto') { P.settings.autoplay = e.target.checked; saveSettings(); }
  if (id === 'chk-chain') { P.settings.chain = e.target.checked; saveSettings(); if (Reader.state === 'idle') { renderVoiceBar(); renderDock(); } }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (S.view === 'quiz' && S.quiz) {
    const cur = S.quiz.cur, q = Q[cur.id];
    if (!cur.result && !cur.grading) {
      const k = e.key.toLowerCase();
      if (q.kind === 'mc') {
        let pos = LET.toLowerCase().indexOf(k); if (pos < 0 && /^[1-6]$/.test(k)) pos = parseInt(k, 10) - 1;
        if (pos >= 0 && pos < cur.order.length) { e.preventDefault(); pick(cur.order[pos]); }
      } else if (q.kind === 'tf') { if (k === 't') pick(true); if (k === 'f') pick(false); }
    } else if (cur.result && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  } else if (S.view === 'study' && e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); playToggle(); }
});

/* ================= boot (with hot reload state) ================= */
function snapshotState() { return { view: S.view, sid: S.sid, quiz: S.quiz, result: S.result, summary: S.summary, combo: S.combo }; }
function start(data) {
  try {
    if (data && data.view) {
      const okQuiz = !data.quiz || data.quiz.items.every(it => Q[it.id]);
      if (okQuiz && (!data.sid || SEC[data.sid])) { Object.assign(S, { view: data.view, sid: data.sid, quiz: data.quiz, result: data.result, summary: data.summary, combo: data.combo || 0 }); if (S.view === 'quiz' && !S.quiz) S.view = 'home'; if (S.quiz && S.quiz.cur) S.quiz.cur.grading = false; }
    }
  } catch (e) { S.view = 'home'; }
  render();
  initDb();
}
try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === 'function') h.snapshot(snapshotState); } catch (e) {}
let started = false;
const startOnce = data => { if (started) return; started = true; start(data); };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(startOnce); } catch (e) {} setTimeout(() => startOnce({}), 1500); }
else startOnce((hot && hot.data) || {});
})();
</script>
