tate(29 571 233)\"><ellipse class=\"f-ink\" cx=\"571\" cy=\"233\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"582\" cy=\"233\" r=\"3.5\"/><\/g><g transform=\"rotate(30 597 240)\"><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"597\" cy=\"240\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"608\" cy=\"240\" r=\"3.5\"/><\/g><path class=\"s-ink\" stroke-width=\"1.5\" fill=\"none\" d=\"M597 231 L532 132\"/><text class=\"f-ink\" x=\"532\" y=\"126\" text-anchor=\"middle\" font-family=\"var(--f-body)\" font-size=\"13\" font-weight=\"700\">susceptible individual<\/text><g transform=\"rotate(-35 613 239)\"><ellipse class=\"f-ink\" cx=\"613\" cy=\"239\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"624\" cy=\"239\" r=\"3.5\"/><\/g><g transform=\"rotate(-29 454 264)\"><ellipse class=\"f-ink\" cx=\"454\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"465\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(-40 478 267)\"><ellipse class=\"f-ink\" cx=\"478\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"489\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-0 505 268)\"><ellipse class=\"f-ink\" cx=\"505\" cy=\"268\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"516\" cy=\"268\" r=\"3.5\"/><\/g><g transform=\"rotate(38 532 264)\"><ellipse class=\"f-ink\" cx=\"532\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"543\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(12 556 267)\"><ellipse class=\"f-ink\" cx=\"556\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"567\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-21 582 270)\"><ellipse class=\"f-ink\" cx=\"582\" cy=\"270\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"593\" cy=\"270\" r=\"3.5\"/><\/g><g transform=\"rotate(32 614 269)\"><ellipse class=\"f-ink\" cx=\"614\" cy=\"269\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"625\" cy=\"269\" r=\"3.5\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"14\"><ellipse class=\"f-ink\" cx=\"200\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"211\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"222\" y=\"323\">Resistant<\/text><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"340\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"351\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"362\" y=\"323\">Susceptible<\/text><\/g><\/svg>"}],"questions":[{"id":"c01-s23-r1","src":"review","kind":"mc","q":"Which would increase the likelihood of pesticide resistance?","choices":["An insect that has one generation per year.","Continual use of pesticides from the same chemical class.","Applying a pesticide that has little or no residual effect."],"answer":1,"ref":"Review question 10, p. 18. Answer in the text: p. 14, 'Pesticide Resistance'","why":"Many generations and greater persistence raise the chances, so A and C lower them."},{"id":"c01-s23-t1","src":"test","kind":"mc","q":"What is pesticide resistance?","choices":["The ability of a pest to tolerate a pesticide that once controlled it","A pesticide that lasts a long time","A crop that tolerates herbicides","The time it takes a pesticide to break down"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Resistance is a pest's ability to tolerate a pesticide that once controlled it."},{"id":"c01-s23-t2","src":"test","kind":"mc","style":"not","q":"Which of these does NOT increase the chances of pesticide resistance?","choices":["Continual use of pesticides from the same chemical class","Frequent applications","Greater persistence of the chemical","Pests that have few generations per year and few offspring"],"answer":3,"ref":"p. 14, 'Pesticide Resistance'","why":"Many generations and many offspring speed resistance up. Few does not."},{"id":"c01-s23-t3","src":"test","kind":"mc","style":"scenario","q":"A turf manager uses only pyrethroid insecticides, year after year. What does the manual say this does?","choices":["Increases the likelihood that resistance will develop","Prevents resistance because pyrethroids are a single class","Has no effect on resistance","Makes the pests more susceptible"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Continual use of one chemical class, such as all pyrethroids, increases the likelihood of resistance."},{"id":"c01-s23-t4","src":"test","kind":"tf","q":"Resistance spreads much more rapidly in pests with many generations per year and many offspring per generation.","answer":true,"ref":"p. 14, 'Pesticide Resistance'","why":"Many insects, mites, fungi, and rodents fit this description."},{"id":"c01-s23-t5","src":"test","kind":"mc","q":"In the early stages of resistance, what happens?","choices":["Higher labeled rates and more frequent applications are needed to control the pests","The pesticide stops working completely right away","The pests die faster than before","Natural enemies take over"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"First it takes higher rates and more applications; eventually the pesticide has little or no effect."}]},{"id":"c01-s24","chapter":"Chapter 1 · Pest Management","title":"Delaying pesticide resistance","pages":[14,15],"body":[{"p":["Several pest management tactics help **prevent or delay** the occurrence of pesticide resistance.","One approach is the use of **new or altered pesticides**.","Using new compounds with **different modes of action** will lessen the likelihood of resistance developing in a population.","Most pesticides have a **code number at the top of the label** indicating the mode of action, for example, **Group 4A Insecticides, Neonicotinoids**, or **Group 2 Herbicides, ALS Inhibitors**.","Unfortunately, new replacement products are often quite complex, difficult to synthesize, and very costly to develop.","Moreover, they have very specific modes of action, which can rapidly lead to the development of resistant pest populations even after limited use in the field.","No longer can we expect to respond to pesticide resistance by merely substituting one pesticide for another."]},{"p":["**Changing pesticide use patterns** is an important step in preventing resistance.","When **dosages are reduced**, fewer pests are killed, so the pressure to develop resistant pest populations is decreased.","**Applying pesticides over limited areas** reduces the proportion of the total pest population exposed to the chemical.","The result is a large pool of individuals still susceptible to the pesticide.","This tactic tends to delay the development of a resistant population because pesticide-susceptible individuals continue to interbreed with resistant ones, thus **diluting the resistance** in the population.","Also, **treating alternate generations** of pests with pesticides that have different modes of action decreases the selection pressure for resistance."]},{"p":["Managing pesticide resistance is a critical aspect of integrated pest management.","Monitor pest populations carefully and **treat only when necessary instead of on a schedule**.","Good pesticide **application records** are another important part of resistance management.","Pesticides are more effectively managed when **treatment history** is known.","Resistance must be **detected when it is at a very low level**.","It should then be controlled by using all available pest management techniques to extend the useful life of our current pesticides."]}],"questions":[{"id":"c01-s24-t1","src":"test","kind":"mc","q":"Where do most pesticides show a code number for the mode of action?","choices":["At the top of the label","In the storage section","In the first aid section","On the container cap"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Examples: Group 4A Insecticides, Neonicotinoids, or Group 2 Herbicides, ALS Inhibitors."},{"id":"c01-s24-t2","src":"test","kind":"mc","style":"scenario","q":"A grower wants to slow resistance. Which plan follows the manual?","choices":["Treat alternate generations with pesticides that have different modes of action","Use the same pesticide at higher rates every week","Treat the whole area on a fixed schedule","Switch to a new product with the same mode of action"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"Treating alternate generations with different modes of action decreases selection pressure."},{"id":"c01-s24-t3","src":"test","kind":"mc","style":"not","q":"Which of these does NOT help delay resistance, according to the manual?","choices":["Reducing dosages","Applying pesticides over limited areas","Treating only when necessary","Treating on a calendar schedule"],"answer":3,"ref":"pp. 14–15, 'Pesticide Resistance'","why":"Treat only when necessary instead of on a schedule."},{"id":"c01-s24-t4","src":"test","kind":"mc","q":"Why does applying pesticides over limited areas delay resistance?","choices":["Susceptible individuals keep interbreeding with resistant ones, diluting the resistance","It kills every pest in the area","It makes pests resistant faster","It lowers the cost of pesticides"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"A large pool of susceptible pests remains, and they dilute the resistance."},{"id":"c01-s24-t5","src":"test","kind":"short","q":"Using mode of action, what is one way to lessen the chance of resistance?","answer":"Use pesticides with different modes of action","keys":[["different","rotate","rotating","alternate","alternating","change","changing","switch","switching"],["mode of action","modes of action","moa","mode","modes"]],"ref":"p. 14, 'Pesticide Resistance'","why":"New compounds with different modes of action lessen the likelihood of resistance."}]},{"id":"c01-s25","chapter":"Chapter 1 · Pest Management","title":"Chapter 1 summary","pages":[15,15],"body":[{"h":"Summary"},{"p":["A successful pest management program begins with the **proper identification** of the pest.","Choosing the appropriate pest control method depends on recognizing and understanding the pest, its **life cycle, habits, and habitat**.","Integrated pest management programs attempt to balance the need for pest control with the desire to protect the environment from pesticide contamination.","**Monitoring** is critical to knowing where pests are located, when to act against growing pest populations, and what type of control measures to use.","Evaluation and recording results help to determine how well the IPM program is working and whether there are any harmful human or environmental effects."]},{"p":["Minimizing pesticide resistance is critical for sustaining the effectiveness of pest management programs.","Using a variety of tools and techniques will help prevent or delay the occurrence of pesticide resistance.","If the pest has not been properly identified, **even nonchemical control tactics will fail**.","It is your responsibility to consider the effects of pest control actions on the **entire treatment site**, whether an outdoor area or inside a structure.","Use good judgment, especially when pesticides are part of the control strategy, to avoid harmful effects to other living organisms and the environment."]}],"questions":[{"id":"c01-s25-t1","src":"test","kind":"mc","q":"According to the chapter summary, a successful pest management program begins with:","choices":["Proper identification of the pest","Choosing a pesticide","Eradication","Setting the economic injury level"],"answer":0,"ref":"p. 15, 'Summary'","why":"Everything else depends on knowing what the pest is."},{"id":"c01-s25-t2","src":"test","kind":"tf","q":"If a pest has not been properly identified, nonchemical control tactics will still work.","answer":false,"ref":"p. 15, 'Summary'","why":"Without proper identification, even nonchemical control tactics will fail."},{"id":"c01-s25-t3","src":"test","kind":"mc","style":"not","q":"Monitoring helps you know all of these EXCEPT:","choices":["Where pests are located","When to act against growing pest populations","What type of control measures to use","Which pesticide brand is cheapest"],"answer":3,"ref":"p. 15, 'Summary'","why":"Monitoring tells you where pests are, when to act, and what control to use."},{"id":"c01-s25-t4","src":"test","kind":"mc","style":"scenario","q":"You are treating a building for pests. Whose responsibility is it to consider the effects of the treatment on the entire treatment site?","choices":["Yours, as the applicator","Only the building owner's","The pesticide manufacturer's","EPA's"],"answer":0,"ref":"p. 15, 'Summary'","why":"It is your responsibility, outdoors or inside a structure."}]},{"id":"c07-s01","chapter":"Chapter 7 · Pesticides in the Environment","title":"Chapter goals and what the environment is","pages":[105,105],"body":[{"box":"Learning objectives","p":["After studying this chapter, you should be able to do the following."],"list":["Describe how pesticide applications can affect the environment.","Explain how to prevent pesticide drift, runoff, and movement to nontarget areas.","Identify sensitive areas that could be harmed by pesticides.","Discuss how to prevent pesticide residue accumulation associated with mixing, loading, and equipment washing.","State when to adjust or delay an application to minimize environmental impact and maximize effectiveness."]},{"p":["Applicators and the public share concerns about how pesticides may harm the environment.","Initially, **hazards to humans** were the primary reason the U.S. Environmental Protection Agency (**EPA**) decided to classify a pesticide as a **restricted-use** product.","Now, more and more pesticide labels list **environmental effects** as reasons for restriction. For example, contamination of groundwater, or toxicity to birds or aquatic organisms.","To register new pesticides, EPA requires manufacturers to submit **extensive environmental tests**.","The agency also reviews environmental effects when **reevaluating existing pesticide registrations**."]},{"h":"The environment"},{"p":["The **environment** comprises everything that is around us.","It includes not only the natural elements that the word \"environment\" usually brings to mind, but also **people**, the **manufactured parts** of our world, and the **indoor areas** in which we live and work.","The environment is air, soil, water, plants, animals, houses, restaurants, office buildings, factories, and all that they contain.","Anyone who uses a pesticide, indoors or outdoors, in a city or on a farm, must consider how that pesticide affects the environment.","Applicators must ask **three questions**."]},{"ol":["Where will the pesticide go after it leaves its container or application equipment?","What effects could this pesticide have on those nontarget sites it may reach?","What can I do to minimize harmful effects?"]}],"questions":[{"id":"c07-s01-t1","src":"test","kind":"mc","q":"What was initially the primary reason EPA classified a pesticide as restricted-use?","choices":["Hazards to humans","Contamination of groundwater","Toxicity to birds","Toxicity to aquatic organisms"],"answer":0,"ref":"p. 105, chapter introduction","why":"Initially, hazards to humans were the primary reason; environmental effects are listed more and more now."},{"id":"c07-s01-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT part of the environment, as the manual defines it?","choices":["Office buildings and factories","People","Indoor areas where we live and work","None of the above; all of these are part of it"],"answer":3,"fixed":true,"ref":"p. 105, 'The Environment'","why":"The environment comprises everything around us, including people, manufactured parts, and indoor areas."},{"id":"c07-s01-t3","src":"test","kind":"tf","q":"A pest control operator who only treats indoor spaces in a city does not need to consider how a pesticide affects the environment.","answer":false,"ref":"p. 105, 'The Environment'","why":"Anyone who uses a pesticide, indoors or outdoors, in a city or on a farm, must consider it."},{"id":"c07-s01-t4","src":"test","kind":"mc","style":"scenario","q":"Before a lawn treatment, an applicator asks, \"Where will this pesticide go after it leaves my sprayer?\" Which question from the manual's list of three should come next?","choices":["What effects could this pesticide have on those nontarget sites it may reach?","How much does the pesticide cost per acre?","Is the pesticide a restricted-use product?","Which formulation mixes fastest?"],"answer":0,"ref":"p. 105, 'The Environment'","why":"The three questions are: where will it go, what effects could it have on nontarget sites, and what can I do to minimize harmful effects."},{"id":"c07-s01-t5","src":"test","kind":"mc","q":"What does EPA require manufacturers to submit to register a new pesticide, according to this chapter?","choices":["Extensive environmental tests","A list of applicators who will use it","A county bulletin","Proof of state registration only"],"answer":0,"ref":"p. 105, chapter introduction","why":"To register new pesticides, EPA requires manufacturers to submit extensive environmental tests."}]},{"id":"c07-s02","chapter":"Chapter 7 · Pesticides in the Environment","title":"Solubility, adsorption, and persistence","pages":[106,106],"body":[{"h":"Pesticide characteristics"},{"p":["To understand how pesticides move in the environment, you must first understand certain physical and chemical characteristics of pesticides, and how they determine a pesticide's interaction with the environment.","These characteristics are **solubility**, **adsorption**, **persistence**, and **volatility**."]},{"h":"Solubility"},{"p":["**Solubility** is a measure of the ability of a pesticide to dissolve in a solvent, usually **water**.","Pesticides that are highly soluble in water dissolve easily.","These products are **more likely** than less-soluble pesticides to move with water in **surface runoff** or **through the soil**."]},{"h":"Adsorption"},{"p":["**Adsorption** is the process whereby a pesticide **binds to soil particles**.","Adsorption occurs because of an attraction between the chemical and soil particles.","Typically, **oil-soluble** pesticides are more attracted than water-soluble pesticides to **clay particles and organic matter** in soil.","Also, pesticide molecules with a **positive charge** are tightly adsorbed to **negatively charged** soil particles.","A pesticide that adsorbs to soil particles is **less likely** than one that does not adsorb tightly to soil to move from the spray site."]},{"h":"Persistence"},{"p":["**Persistence** is the ability of a pesticide to remain present and active in its original form for an extended period before breaking down.","A chemical's persistence is described in terms of its **half-life**: a comparative measure of the time needed for the chemical to break down, or degrade.","**The longer the half-life, the more persistent the pesticide.**","The pesticide that remains in the environment after an application or spill is called **residue**.","Sometimes residue is **desirable** because it provides long-term pest control and reduces the need for repeated applications.","However, some persistent pesticides can harm sensitive plants or animals, including humans.","Therefore, it is especially important to prevent persistent pesticides from moving offsite through improper handling, application, drift, leaching, or runoff."]},{"p":["Besides presenting a hazard to persons and nontarget animals entering a treated area, the application of persistent pesticides may produce **illegal residues on rotational food or feed crops**.","To protect consumers, there are **legal limits** on how much residue may remain on products sold for food or feed.","Check the label for statements about the persistence of the pesticide and for **replanting restrictions**.","The rate of pesticide breakdown relates to the persistence of the pesticide."]}],"questions":[{"id":"c07-s02-t1","src":"test","kind":"mc","style":"not","q":"Which of these is NOT one of the four pesticide characteristics the manual says determine how a pesticide interacts with the environment?","choices":["Solubility","Adsorption","Toxicity","Volatility"],"answer":2,"ref":"p. 106, 'Pesticide Characteristics'","why":"The four are solubility, adsorption, persistence, and volatility."},{"id":"c07-s02-t2","src":"test","kind":"mc","style":"scenario","q":"Two herbicides are equal in every way except that Product A is highly water-soluble and Product B is not. Which is more likely to move in surface runoff or through the soil?","choices":["Product A","Product B","Both equally","Neither; solubility does not affect movement"],"answer":0,"ref":"p. 106, 'Solubility'","why":"Highly water-soluble pesticides are more likely to move with water in runoff or through the soil."},{"id":"c07-s02-t3","src":"test","kind":"tf","q":"Typically, water-soluble pesticides are more attracted than oil-soluble pesticides to clay particles and organic matter in soil.","answer":false,"ref":"p. 106, 'Adsorption'","why":"It is the reverse: oil-soluble pesticides are typically more attracted to clay and organic matter."},{"id":"c07-s02-t4","src":"test","kind":"mc","q":"A pesticide with a longer half-life is:","choices":["More persistent","Less persistent","More water-soluble","More volatile"],"answer":0,"ref":"p. 106, 'Persistence'","why":"The longer the half-life, the more persistent the pesticide."},{"id":"c07-s02-t5","src":"test","kind":"mc","style":"scenario","q":"A grower used a persistent herbicide on a field and plans to plant a different food crop there next season. What should the grower check on the label?","choices":["Replanting restrictions and persistence statements","The bee hazard icon","The droplet size category","The groundwater percentage"],"answer":0,"ref":"p. 106, 'Persistence'","why":"Persistent pesticides may leave illegal residues on rotational crops, so check persistence statements and replanting restrictions."},{"id":"c07-s02-t6","src":"test","kind":"mc","style":"not","q":"The manual says it is especially important to prevent persistent pesticides from moving offsite through several routes. Which of these is NOT one it lists?","choices":["Drift","Leaching","Runoff","Photodegradation"],"answer":3,"ref":"p. 106, 'Persistence'","why":"The routes listed are improper handling, application, drift, leaching, or runoff; photodegradation is breakdown, not movement."}]},{"id":"c07-s03","chapter":"Chapter 7 · Pesticides in the Environment","title":"Pesticide breakdown and volatility","pages":[106,107],"body":[{"h":"Pesticide breakdown"},{"p":["Several processes break down pesticide compounds into simpler and often less toxic chemicals.","Some pesticides break down very rapidly, in a matter of **days or even hours**.","Others linger in the environment for **a year or more**.","Pesticides are broken down, or degraded, by the following processes. See Figure 7.1."]},{"list":["**Chemical degradation**: the breakdown of chemicals that does not involve living organisms, usually by a **chemical reaction with water**.","**Microbial action**: the breakdown of chemicals by **soil microorganisms**, such as fungi or bacteria.","**Photodegradation**: the breakdown of chemicals in reaction to **sunlight**."]},{"fig":"fig-7-1"},{"p":["**Water and temperature** both affect the breakdown of pesticides.","**Warm, wet** conditions can **increase** the speed of pesticide breakdown.","**Cool, dry** conditions **slow down** the degradation process."]},{"h":"Volatility"},{"p":["**Volatility** is the tendency of a pesticide to turn into a **gas or vapor**.","Some pesticides are more volatile than others.","The chance of volatilization **increases as temperatures and wind increase**.","Volatility is also more likely under conditions of **low relative humidity**, because evaporation increases in drier conditions."]}],"figures":[{"id":"fig-7-1","title":"Figure 7.1: Breakdown of pesticides in the environment.","page":"p. 106","explain":["Sunlight breaks pesticides down by photodegradation.","Water breaks them down by chemical degradation, both above ground and in the soil.","In the soil, microorganisms break them down by microbial degradation."],"svg":"<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Figure 7.1: Breakdown of pesticides in the environment. Sunlight causes photodegradation, water causes chemical degradation above and in the soil, and soil microorganisms cause microbial degradation\"><defs><marker id=\"a71\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><circle class=\"f-hi\" cx=\"70\" cy=\"62\" r=\"34\"/><g class=\"s-ink\" stroke-width=\"2\"><path d=\"M70 14 V4 M70 110 V120 M22 62 H12 M118 62 H128 M36 28 L29 21 M104 28 L111 21 M36 96 L29 103 M104 96 L111 103\"/><\/g><text class=\"f-ink\" x=\"140\" y=\"44\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"20\">Photodegradation<\/text><text class=\"f-muted\" x=\"140\" y=\"66\" font-family=\"var(--f-body)\" font-size=\"14\">breakdown by sunlight<\/text><path class=\"s-ink\" stroke-width=\"2\" stroke-dasharray=\"6 5\" fill=\"none\" marker-end=\"url(#a71)\" d=\"M100 90 L200 205\"/><path class=\"f-muted\" d=\"M380 52 q-40 0 -40 -24 q0 -24 40 -22 q14 -18 46 -10 q30 -10 50 10 q34 0 34 22 q0 24 -40 24 Z\" fill-opacity=\".55\"/><g class=\"s-field\" stroke-width=\"2.5\" stroke-dasharray=\"4 6\"><path d=\"M372 66 V120 M404 66 V128 M436 66 V120 M468 66 V128\"/><\/g><text class=\"f-ink\" x=\"500\" y=\"84\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\">Chemical<\/text><text class=\"f-ink\" x=\"500\" y=\"106\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\">degradation<\/text><text class=\"f-muted\" x=\"500\" y=\"126\" font-family=\"var(--f-body)\" font-size=\"13\">reaction with water<\/text><g class=\"s-field\" stroke-width=\"3\" fill=\"none\"><path d=\"M220 210 V140 M220 175 l-18 -14 M220 160 l18 -14 M220 190 l-16 -8\"/><path d=\"M440 210 V140 M440 175 l-18 -14 M440 160 l18 -14 M440 190 l16 -8\"/><\/g><rect class=\"f-field\" fill-opacity=\".35\" x=\"10\" y=\"210\" width=\"620\" height=\"90\"/><rect class=\"f-field\" fill-opacity=\".6\" x=\"10\" y=\"300\" width=\"620\" height=\"90\"/><circle class=\"f-card\" cx=\"140\" cy=\"290\" r=\"40\"/><g class=\"f-ink\"><circle cx=\"128\" cy=\"282\" r=\"5\"/><circle cx=\"146\" cy=\"296\" r=\"4\"/><circle cx=\"152\" cy=\"278\" r=\"4\"/><circle cx=\"130\" cy=\"302\" r=\"3\"/><\/g><text class=\"f-ink\" x=\"196\" y=\"296\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\">Microbial degradation<\/text><text class=\"f-ink\" x=\"196\" y=\"316\" font-family=\"var(--f-body)\" font-size=\"13\">soil microorganisms (fungi, bacteria)<\/text><circle class=\"f-card\" cx=\"590\" cy=\"350\" r=\"30\"/><circle class=\"f-field\" cx=\"582\" cy=\"340\" r=\"7\"/><circle class=\"f-field\" cx=\"600\" cy=\"360\" r=\"7\"/><path class=\"s-ink\" stroke-width=\"2\" marker-end=\"url(#a71)\" d=\"M586 346 L596 354\"/><text class=\"f-on\" x=\"250\" y=\"372\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\">Chemical degradation (in soil)<\/text><\/svg>"}],"questions":[{"id":"c07-s03-t1","src":"test","kind":"mc","q":"Which breakdown process involves soil microorganisms such as fungi or bacteria?","choices":["Microbial action","Chemical degradation","Photodegradation","Volatilization"],"answer":0,"ref":"p. 107, 'Pesticide Breakdown'","why":"Microbial action is breakdown by soil microorganisms such as fungi or bacteria."},{"id":"c07-s03-t2","src":"test","kind":"short","q":"What is the breakdown of chemicals in reaction to sunlight called?","answer":"photodegradation","accept":["photo degradation","photodecomposition"],"ref":"p. 107, 'Pesticide Breakdown'","why":"Photodegradation is breakdown in reaction to sunlight."},{"id":"c07-s03-t3","src":"test","kind":"mc","style":"scenario","q":"The same pesticide is applied in two places. Site A is warm and wet. Site B is cool and dry. Where will the pesticide most likely break down faster?","choices":["Site A","Site B","Equally fast at both sites","It cannot break down at either site"],"answer":0,"ref":"p. 107, 'Pesticide Breakdown'","why":"Warm, wet conditions can increase breakdown speed; cool, dry conditions slow it."},{"id":"c07-s03-t4","src":"test","kind":"mc","style":"not","q":"Which of these conditions does NOT make volatilization more likely?","choices":["Higher temperatures","More wind","Low relative humidity","High relative humidity"],"answer":3,"ref":"p. 107, 'Volatility'","why":"Volatility rises with temperature and wind and is more likely under low relative humidity."},{"id":"c07-s03-t5","src":"test","kind":"tf","q":"Chemical degradation is breakdown that does not involve living organisms, usually by a chemical reaction with water.","answer":true,"ref":"p. 107, 'Pesticide Breakdown'","why":"That is the manual's definition of chemical degradation."}]},{"id":"c07-s04","chapter":"Chapter 7 · Pesticides in the Environment","title":"How pesticides move: air and water","pages":[107,108],"body":[{"h":"How pesticides move in the environment"},{"p":["Pesticides may move from the targeted application site in several ways: **in air**, **in water**, **attached to soil particles**, and **on or in objects**. See Figure 7.2."]},{"fig":"fig-7-2"},{"h":"Movement in air"},{"p":["Pesticide movement away from the application site by wind or air currents is called **drift**.","People who mix, load, and apply pesticides outdoors are usually aware of how easily pesticides may drift offsite.","Those who handle pesticides indoors may not realize how readily some pesticides move offsite in the air currents created by **ventilation systems** and by **forced-air heating and cooling systems**.","Pesticides may travel offsite as spray droplets, vapors, dusts or solid particles, and even on blowing soil particles."]},{"h":"Movement in water"},{"p":["Most pesticide movement in water is either by surface movement off the treated site, called **runoff**, or by downward movement through the soil, called **leaching**.","Runoff and leaching may occur when:"]},{"list":["Too much pesticide is applied or spilled onto a surface.","Too much rainwater or irrigation water moves pesticide through the soil offsite or into groundwater.","Highly water-soluble or persistent pesticides are used."]},{"p":["Runoff water in an outdoor environment may move into drainage systems, streams, ponds, or other surface water, where the pesticides can travel great distances.","Pesticides that leach downward through the soil may reach **groundwater**.","In an indoor environment, water containing pesticides can flow into **floor drains** and contaminate water systems.","A careless act, such as dumping a pesticide or rinsate down a sink or toilet, may contaminate an **entire sewage or water-treatment facility**.","Some pesticides can **leach indoors**. In a greenhouse, for example, pesticides may leach through the soil or other planting medium and contaminate other greenhouse surfaces.","Look for special instructions on the label that warn of pesticide hazards caused by the movement of pesticides in water.","Sometimes labels require **buffers or setbacks** from water and wells."]}],"figures":[{"id":"fig-7-2","title":"Figure 7.2: Movement of pesticides in the environment.","page":"p. 108","explain":["Spray can go up by evaporation or volatilization, or sideways as drift.","On the ground, pesticide can be taken up by plants, degraded in the soil, or carried down by percolation and leaching to groundwater below the water table.","Rain can carry it across the surface by runoff and erosion into surface water, and sunlight breaks it down by photodegradation."],"svg":"<svg viewBox=\"0 0 680 420\" role=\"img\" aria-label=\"Figure 7.2: Movement of pesticides in the environment, showing evaporation and volatilization, drift, plant uptake, degradation, percolation and leaching to groundwater, photodegradation, and surface runoff and erosion to surface water\"><defs><marker id=\"a72\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><g font-family=\"var(--f-body)\" font-size=\"14\" font-weight=\"700\"><path class=\"s-ink\" stroke-width=\"6\" d=\"M70 40 H250\"/><path class=\"s-ink\" stroke-width=\"3\" d=\"M120 40 V56 M200 40 V56\"/><g class=\"s-field\" stroke-width=\"1.5\" stroke-dasharray=\"3 4\"><path d=\"M120 58 L80 170 M120 58 L120 170 M120 58 L160 170 M200 58 L160 170 M200 58 L200 170 M200 58 L240 170\"/><\/g><text class=\"f-ink\" x=\"160\" y=\"28\" text-anchor=\"middle\" font-size=\"13\">Pesticide spray<\/text><g class=\"s-ink\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#a72)\"><path d=\"M40 160 q-8 -15 0 -30 q8 -15 0 -30\"/><path d=\"M60 160 q-8 -15 0 -30 q8 -15 0 -36\"/><\/g><text class=\"f-ink\" x=\"14\" y=\"62\">Evaporation/<\/text><text class=\"f-ink\" x=\"14\" y=\"78\">Volatilization<\/text><path class=\"s-ink\" stroke-width=\"2\" stroke-dasharray=\"5 4\" fill=\"none\" marker-end=\"url(#a72)\" d=\"M250 110 H320\"/><text class=\"f-ink\" x=\"330\" y=\"115\">Drift<\/text><path class=\"s-field\" stroke-width=\"4\" fill=\"none\" d=\"M290 172 V128 M290 150 l-14 -14 M290 140 l14 -14\"/><text class=\"f-ink\" x=\"250\" y=\"206\">Plant uptake (absorption)<\/text><path class=\"f-muted\" fill-opacity=\".55\" d=\"M420 40 q-30 0 -30 -18 q0 -18 30 -16 q10 -12 34 -6 q24 -8 38 8 q26 0 26 16 q0 18 -30 16 Z\"/><g class=\"s-field\" stroke-width=\"2.5\" stroke-dasharray=\"3 6\"><path d=\"M420 50 V110 M445 50 V120 M470 50 V110 M495 50 V120\"/><\/g><text class=\"f-ink\" x=\"460\" y=\"138\" text-anchor=\"middle\">Precipitation<\/text><circle class=\"f-hi\" cx=\"620\" cy=\"34\" r=\"20\"/><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#a72)\" d=\"M600 52 L560 100\"/><text class=\"f-ink\" x=\"560\" y=\"118\">Photo<\/text><text class=\"f-ink\" x=\"560\" y=\"134\">degradation<\/text><path class=\"f-field\" fill-opacity=\".3\" d=\"M10 172 H500 L600 300 H670 V400 H10 Z\"/><path class=\"s-ink\" stroke-width=\"2\" fill=\"none\" d=\"M10 172 H500 L600 300\"/><path class=\"f-field\" fill-opacity=\".7\" d=\"M600 300 H670 V340 H630 Z\"/><text class=\"f-ink\" x=\"560\" y=\"290\" text-anchor=\"end\">Surface water<\/text><path class=\"s-ink\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#a72)\" d=\"M440 166 Q520 170 590 280\"/><text class=\"f-ink\" x=\"520\" y=\"196\">Surface runoff/<\/text><text class=\"f-ink\" x=\"540\" y=\"212\">erosion → Runoff<\/text><path class=\"s-muted\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\" d=\"M10 230 H470\"/><text class=\"f-muted\" x=\"16\" y=\"196\">Soil surface<\/text><text class=\"f-muted\" x=\"16\" y=\"224\">Root zone<\/text><g class=\"s-ink\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#a72)\"><path d=\"M150 190 L100 210\"/><path d=\"M150 250 L90 270\"/><path d=\"M200 200 V330\"/><path d=\"M230 200 V330\"/><\/g><text class=\"f-ink\" x=\"40\" y=\"250\">Degradation<\/text><text class=\"f-ink\" x=\"40\" y=\"292\">Degradation<\/text><text class=\"f-ink\" x=\"250\" y=\"290\">Percolation/Leaching<\/text><path class=\"s-ink\" stroke-width=\"2.5\" d=\"M10 340 H630\"/><text class=\"f-ink\" x=\"16\" y=\"334\">Water table<\/text><text class=\"f-ink\" x=\"250\" y=\"378\">Groundwater<\/text><\/g><\/svg>"}],"questions":[{"id":"c07-s04-t1","src":"test","kind":"mc","q":"What is the downward movement of a pesticide through the soil called?","choices":["Leaching","Runoff","Drift","Adsorption"],"answer":0,"ref":"p. 107, 'Movement in Water'","why":"Runoff is surface movement off the site; leaching is downward movement through the soil."},{"id":"c07-s04-t2","src":"test","kind":"mc","style":"not","q":"Which of these is NOT listed as a condition under which runoff and leaching may occur?","choices":["Too much pesticide is applied or spilled","Too much rainwater or irrigation water","Highly water-soluble or persistent pesticides are used","A pesticide that binds tightly to soil is used"],"answer":3,"ref":"p. 107, 'Movement in Water'","why":"The three listed conditions are too much pesticide, too much water, and highly water-soluble or persistent pesticides."},{"id":"c07-s04-t3","src":"test","kind":"mc","style":"scenario","q":"After treating a kitchen, a technician pours leftover rinsate into the building's toilet. What does the manual warn this careless act may do?","choices":["Contaminate an entire sewage or water-treatment facility","Nothing, because sewage plants remove all pesticides","Only harm the toilet fixtures","Cause photodegradation"],"answer":0,"ref":"p. 107, 'Movement in Water'","why":"Dumping pesticide or rinsate down a sink or toilet may contaminate an entire sewage or water-treatment facility."},{"id":"c07-s04-t4","src":"test","kind":"tf","q":"Indoors, pesticides can move offsite in air currents created by ventilation systems and forced-air heating and cooling systems.","answer":true,"ref":"p. 107, 'Movement in Air'","why":"Indoor handlers may not realize how readily pesticides move in those air currents."},{"id":"c07-s04-t5","src":"test","kind":"short","q":"What is pesticide movement away from the application site by wind or air currents called?","answer":"drift","accept":["pesticide drift","drifting"],"ref":"p. 107, 'Movement in Air'","why":"Movement away from the site by wind or air currents is called drift."}]},{"id":"c07-s05","chapter":"Chapter 7 · Pesticides in the Environment","title":"Movement on objects, spray drift, and droplet size","pages":[108,109],"body":[{"h":"Movement on or in objects, plants, or animals"},{"p":["Pesticides can also move away from the application site when they are on or in objects or organisms that move, or are moved, offsite.","When pesticide handlers bring or wear home **contaminated personal protective equipment, work clothing, or other items**, pesticide residues may rub off on carpeting, furniture, and laundry items, and onto pets and people."]},{"h":"Preventing pesticide drift"},{"p":["Studies have shown that a **sizable percentage** of pesticides may never reach the intended target site because of drift.","Significant drift can damage or contaminate sensitive crops, poison bees, pose health risks to humans and animals, and contaminate soil and water in adjacent areas.","**It is impossible to eliminate drift**, but it is possible to **reduce it to a tolerable level**."]},{"h":"Spray drift"},{"p":["**Spray drift** refers to the off-target movement of a pesticide during a **liquid application**.","This is the result of small spray droplets traveling offsite on air currents.","Spray drift occurs **more frequently** than vapor drift or particle (dust) drift.","You can avoid most spray drift problems by paying close attention to **spray droplet size**, **wind direction**, and **wind speed**.","**Large** spray droplets are **less likely** to drift than smaller ones.","Selecting the proper nozzle and pressure is important to reduce drift.","**High pressure** and nozzles with **smaller orifices**, or openings, produce **small droplets** likely to drift.","Conversely, **large nozzle orifices** and **low pressures** produce **larger droplets**."]},{"h":"Classification of droplet size"},{"p":["Nozzles produce a range of droplet sizes, known as the **droplet size spectrum**.","Regardless of the type of nozzle used, a percentage of droplets created by a nozzle will be small enough to drift.","Modern nozzle designs are excellent options because they reduce the amount of droplets prone to drift during an application."]},{"p":["A droplet size classification system can help describe the droplet sizes produced by a nozzle.","This standard, **S-572.1, Spray Nozzle Classification by Droplet Size**, was established by the **American Society of Agricultural and Biological Engineers**.","It classifies nozzles into **eight categories**. See Table 7.1.","Using these categories, you can select a nozzle, orifice size, and operating pressure that produce a **label-recommended droplet size spectrum**.","Consult the label for the droplet size specifications that may be in place for a particular application."]},{"fig":"tab-7-1"}],"figures":[{"id":"tab-7-1","title":"Table 7.1: Spray Droplet Spectrum Categories.","page":"p. 109","explain":["From smallest to largest droplets: Extra Fine is purple, Very Fine is red, Fine is orange, Medium is yellow, Coarse is blue, Very Coarse is green, Extra Coarse is white, and Ultra Coarse is black.","The classification is primarily to indicate off-site spray drift potential, and secondarily for application efficacy.","The manual's table prints the seventh row as Extra Course; it means Extra Coarse, symbol X C."],"svg":"<svg viewBox=\"0 0 640 470\" role=\"img\" aria-label=\"Table 7.1: ASABE Standard S-572.1 spray droplet spectrum categories, from Extra Fine (XF, purple) to Ultra Coarse (UC, black)\"><g font-family=\"var(--f-body)\"><rect class=\"f-ink\" x=\"10\" y=\"10\" width=\"620\" height=\"60\" rx=\"6\"/><text x=\"320\" y=\"35\" text-anchor=\"middle\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"18\" style=\"fill:var(--card)\">ASABE STANDARD S-572.1 (a)<\/text><text x=\"320\" y=\"58\" text-anchor=\"middle\" font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"16\" style=\"fill:var(--card)\">SPRAY DROPLET SPECTRUM CATEGORIES<\/text><g font-weight=\"700\" font-size=\"16\" class=\"f-ink\"><text x=\"110\" y=\"96\" text-anchor=\"middle\">Category (b)<\/text><text x=\"320\" y=\"96\" text-anchor=\"middle\">Symbol<\/text><text x=\"530\" y=\"96\" text-anchor=\"middle\">Color Code (c)<\/text><\/g><path class=\"s-ink\" stroke-width=\"1.5\" d=\"M10 106 H630\"/><g font-size=\"16\" class=\"f-ink\"><rect class=\"f-line\" x=\"10\" y=\"106\" width=\"620\" height=\"30\"/><text x=\"110\" y=\"127\" text-anchor=\"middle\">Extra Fine<\/text><text x=\"320\" y=\"127\" text-anchor=\"middle\">(XF)<\/text><text x=\"530\" y=\"127\" text-anchor=\"middle\">Purple<\/text><text x=\"110\" y=\"157\" text-anchor=\"middle\">Very Fine<\/text><text x=\"320\" y=\"157\" text-anchor=\"middle\">(VF)<\/text><text x=\"530\" y=\"157\" text-anchor=\"middle\">Red<\/text><rect class=\"f-line\" x=\"10\" y=\"166\" width=\"620\" height=\"30\"/><text x=\"110\" y=\"187\" text-anchor=\"middle\">Fine<\/text><text x=\"320\" y=\"187\" text-anchor=\"middle\">(F)<\/text><text x=\"530\" y=\"187\" text-anchor=\"middle\">Orange<\/text><text x=\"110\" y=\"217\" text-anchor=\"middle\">Medium<\/text><text x=\"320\" y=\"217\" text-anchor=\"middle\">(M)<\/text><text x=\"530\" y=\"217\" text-anchor=\"middle\">Yellow<\/text><rect class=\"f-line\" x=\"10\" y=\"226\" width=\"620\" height=\"30\"/><text x=\"110\" y=\"247\" text-anchor=\"middle\">Coarse<\/text><text x=\"320\" y=\"247\" text-anchor=\"middle\">(C)<\/text><text x=\"530\" y=\"247\" text-anchor=\"middle\">Blue<\/text><text x=\"110\" y=\"277\" text-anchor=\"middle\">Very Coarse<\/text><text x=\"320\" y=\"277\" text-anchor=\"middle\">(VC)<\/text><text x=\"530\" y=\"277\" text-anchor=\"middle\">Green<\/text><rect class=\"f-line\" x=\"10\" y=\"286\" width=\"620\" height=\"30\"/><text x=\"110\" y=\"307\" text-anchor=\"middle\">Extra Coarse<\/text><text x=\"320\" y=\"307\" text-anchor=\"middle\">(XC)<\/text><text x=\"530\" y=\"307\" text-anchor=\"middle\">White<\/text><text x=\"110\" y=\"337\" text-anchor=\"middle\">Ultra Coarse<\/text><text x=\"320\" y=\"337\" text-anchor=\"middle\">(UC)<\/text><text x=\"530\" y=\"337\" text-anchor=\"middle\">Black<\/text><\/g><path class=\"s-ink\" stroke-width=\"1\" d=\"M215 76 V346 M425 76 V346 M10 346 H630\"/><g class=\"f-muted\" font-size=\"12.5\"><text x=\"14\" y=\"368\">(a) Revised 2009. Defines droplet spectrum categories for classifying spray nozzles relative to the<\/text><text x=\"30\" y=\"384\">specified reference fan nozzle. Purpose: droplet size information primarily to indicate off-site<\/text><text x=\"30\" y=\"400\">spray drift potential and secondarily for application efficacy.<\/text><text x=\"14\" y=\"420\">(b) Refer to the product label for the droplet spectrum category required for an application.<\/text><text x=\"14\" y=\"440\">(c) Nozzle manufacturers provide information to place nozzle types into a category, based at least<\/text><text x=\"30\" y=\"456\">on orifice size and pressure. The color code is also standard.<\/text><\/g><\/g><\/svg>"}],"questions":[{"id":"c07-s05-t1","src":"test","kind":"mc","q":"Which combination produces small spray droplets that are likely to drift?","choices":["High pressure and small nozzle orifices","Low pressure and large nozzle orifices","Low pressure and small nozzle orifices only","High pressure and large nozzle orifices only"],"answer":0,"ref":"p. 108, 'Spray Drift'","why":"High pressure and smaller orifices produce small droplets likely to drift."},{"id":"c07-s05-t2","src":"test","kind":"tf","q":"With the right equipment, it is possible to eliminate drift completely.","answer":false,"ref":"p. 108, 'Preventing Pesticide Drift'","why":"It is impossible to eliminate drift, but it can be reduced to a tolerable level."},{"id":"c07-s05-t3","src":"test","kind":"mc","style":"not","q":"You can avoid most spray drift by paying close attention to three things. Which of these is NOT one of them?","choices":["Spray droplet size","Wind direction","Wind speed","Soil texture"],"answer":3,"ref":"p. 108, 'Spray Drift'","why":"The three are spray droplet size, wind direction, and wind speed."},{"id":"c07-s05-t4","src":"test","kind":"mc","q":"Into how many droplet size categories does ASABE Standard S-572.1 classify nozzles?","choices":["Eight","Five","Six","Ten"],"answer":0,"ref":"p. 109, 'Classification of Droplet Size' and Table 7.1","why":"The standard classifies nozzles into eight categories."},{"id":"c07-s05-t5","src":"test","kind":"mc","q":"According to Table 7.1, what is the primary purpose of classifying nozzles by droplet size?","choices":["To indicate off-site spray drift potential","To set the price of nozzles","To measure pesticide toxicity","To measure the half-life of a pesticide"],"answer":0,"ref":"p. 109, Table 7.1 footnote a","why":"The purpose is primarily to indicate off-site spray drift potential and secondarily application efficacy."},{"id":"c07-s05-t6","src":"test","kind":"mc","style":"scenario","q":"A label requires a Coarse droplet spectrum. Using the standard color code, which nozzle color should you look for?","choices":["Blue","Yellow","Red","Green"],"answer":0,"ref":"p. 109, Table 7.1","why":"In Table 7.1, Coarse (C) is blue."}]},{"id":"c07-s06","chapter":"Chapter 7 · Pesticides in the Environment","title":"Other drift factors: thickness, additives, wind, time of day","pages":[109,110],"body":[{"h":"Other factors"},{"p":["The **thickness of the liquid** also affects droplet size.","As the thickness increases, so does droplet size, thus reducing the chance of off-target movement.","Fine spray droplets may begin to **evaporate** before reaching their target. These droplets become very small and light and may move offsite.","Modern **drift control additives** will decrease drift potential without dramatically shifting the droplets to a larger size.","Remember, however, to always follow the label directions about using a spray adjuvant intended to minimize drift.","Some drift control additives may actually **increase** the drift potential of an applied tank mix.","Also be aware that **large spray droplets may reduce coverage**, resulting in less pest control."]},{"p":["**Wind speed and direction** are the **most important environmental factors** influencing spray drift.","Labels may indicate maximum and minimum wind speeds for application.","Except in the case of temperature inversions, the **early morning and evening** are often the best times to apply pesticides.","This is because windy conditions are more likely to occur around **midday**, when the temperature near the ground increases.","This causes hot air to rise quickly and mix rapidly with the cooler air above it, favoring drift.","The best time to spray is when spray droplets **move slowly upward** in the absence of windy or inversion conditions."]}],"questions":[{"id":"c07-s06-t1","src":"test","kind":"mc","q":"What does the manual call the most important environmental factors influencing spray drift?","choices":["Wind speed and direction","Temperature and humidity","Soil texture and organic matter","Sunlight and rainfall"],"answer":0,"ref":"p. 109, 'Other Factors'","why":"Wind speed and direction are the most important environmental factors influencing spray drift."},{"id":"c07-s06-t2","src":"test","kind":"mc","style":"scenario","q":"There is no temperature inversion, and the applicator can choose any time of day. When are conditions often best for spraying, according to the manual?","choices":["Early morning or evening","Around midday","Early afternoon on a hot day","Any time; time of day does not matter"],"answer":0,"ref":"p. 109, 'Other Factors'","why":"Except with inversions, early morning and evening are often best because wind is more likely around midday."},{"id":"c07-s06-t3","src":"test","kind":"tf","q":"Every drift control additive reduces the drift potential of a tank mix.","answer":false,"ref":"p. 109, 'Other Factors'","why":"Some drift control additives may actually increase drift potential, so follow the label."},{"id":"c07-s06-t4","src":"test","kind":"mc","style":"not","q":"Which of these statements about droplet size is NOT true, according to the manual?","choices":["Large droplets always give better pest control","Thicker liquids produce larger droplets","Fine droplets may evaporate before reaching the target","Large droplets may reduce coverage"],"answer":0,"ref":"p. 109, 'Other Factors'","why":"Large spray droplets may reduce coverage, resulting in less pest control."},{"id":"c07-s06-t5","src":"test","kind":"mc","q":"Why are windy conditions more likely around midday?","choices":["The ground warms, so hot air rises quickly and mixes with cooler air above","Cool air settles near the ground","Humidity is highest at midday","Inversions always form at midday"],"answer":0,"ref":"pp. 109 to 110, 'Other Factors'","why":"Ground temperature rises, hot air rises quickly and mixes rapidly with cooler air above, favoring drift."}]},{"id":"c07-s07","chapter":"Chapter 7 · Pesticides in the Environment","title":"Humidity, release height, and ways to cut drift","pages":[110,110],"body":[{"p":["**Low relative humidity and/or high temperatures** also can increase the potential for spray drift.","Under these conditions, the evaporation rate of water increases, resulting in smaller spray droplets that drift more easily.","Avoid spraying during these times."]},{"p":["The **height** at which the pesticide is released above the ground or target may also affect drift.","Applications that use large droplets close to the ground often produce little drift.","**Aerial spraying** and **tall tree spraying**, on the other hand, are more likely to produce spray drift because they intersect large distances of air far from the ground.","Drift from boom sprayers can be reduced by lowering the boom height to within **20 to 24 inches** of the target crop."]},{"box":"Decrease outdoor drift by:","list":["Spraying when the wind speed is between **3 and 10 miles per hour**.","Spraying **downwind from sensitive areas**, such as residential properties, schools, crops, waterways, or beehives.","Using proper nozzles and pressures.","Using drift control additives, if appropriate.","Lowering boom height.","Leaving an **untreated border or buffer area** in the downwind target area."]},{"p":["To reduce **drift indoors**, pest control operators must consider the air circulation patterns inside buildings.","Turn fans and air conditioners off, and close vents where necessary to prevent pesticides from drifting to other parts of the building.","Use **low-volatile or nonvolatile** pesticides and **low-pressure** treatments to reduce indoor pesticide drift."]}],"questions":[{"id":"c07-s07-t1","src":"test","kind":"mc","q":"To decrease outdoor drift, the manual says to spray when the wind speed is between:","choices":["3 and 10 miles per hour","0 and 2 miles per hour","10 and 15 miles per hour","5 and 20 miles per hour"],"answer":0,"ref":"p. 110, list under 'Decrease outdoor drift by'","why":"Spray when wind speed is between 3 and 10 miles per hour."},{"id":"c07-s07-t2","src":"test","kind":"short","q":"To reduce boom sprayer drift, lower the boom to within how many inches of the target crop?","answer":"20 to 24 inches","accept":["20-24 inches","20 to 24","20-24"],"keys":[["20"],["24"]],"ref":"p. 110, paragraph on release height","why":"Lower the boom height to within 20 to 24 inches of the target crop."},{"id":"c07-s07-t3","src":"test","kind":"mc","style":"scenario","q":"A field borders a school on its east side. The wind is blowing from west to east. Following the manual, what is the problem?","choices":["The applicator would be spraying upwind of the school, so drift would blow toward it","There is no problem; wind direction does not matter","The applicator should speed up to finish faster","The applicator should raise the boom"],"answer":0,"ref":"p. 110, list under 'Decrease outdoor drift by'","why":"Spray downwind from sensitive areas; here the wind carries drift toward the school."},{"id":"c07-s07-t4","src":"test","kind":"mc","style":"not","q":"Which of these is NOT on the manual's list of ways to decrease outdoor drift?","choices":["Raising the boom for wider coverage","Using proper nozzles and pressures","Leaving an untreated buffer in the downwind target area","Using drift control additives, if appropriate"],"answer":0,"ref":"p. 110, list under 'Decrease outdoor drift by'","why":"The list says lowering boom height, not raising it."},{"id":"c07-s07-t5","src":"test","kind":"tf","q":"Aerial spraying and tall tree spraying are more likely to produce spray drift because they intersect large distances of air far from the ground.","answer":true,"ref":"p. 110, paragraph on release height","why":"That is the manual's stated reason."},{"id":"c07-s07-t6","src":"test","kind":"mc","q":"To reduce drift indoors, what should a pest control operator do?","choices":["Turn fans and air conditioners off, and close vents where necessary","Turn on fans to dilute the pesticide","Use high-pressure treatments","Use the most volatile product available"],"answer":0,"ref":"p. 110, paragraph on indoor drift","why":"Turn fans and air conditioners off, close vents, and use low-volatile products and low-pressure treatments."}]},{"id":"c07-s08","chapter":"Chapter 7 · Pesticides in the Environment","title":"Temperature inversions","pages":[110,111],"body":[{"h":"Temperature inversions"},{"p":["Applications made under **low-wind** conditions can sometimes produce **more extensive drift** than under high winds.","Drift that occurs over long distances, **more than a mile**, is most often the result of applications made during a **temperature inversion**, under stable atmospheric conditions.","A temperature inversion exists when the air at **ground level is cooler** than the air above it.","Under these conditions, the air is considered **stable** because there is little or no vertical air movement.","Almost all air movement during an inversion is **sideways**, or lateral.","This causes a high concentration of small spray droplets to be suspended in this layer of cool air near the ground.","These droplets can then be carried long distances, especially if wind speeds increase.","When the spray droplets settle out, they may still be concentrated enough to cause damage or harm."]},{"fig":"fig-7-3"},{"p":["Inversions may occur at any time of the day and at any height above the ground.","However, they most often develop during the **early evening hours** as the ground temperature begins to cool and the warm air has already risen.","Inversion conditions **intensify during the night** and may persist until **mid-morning**, when the ground has warmed enough to start the vertical mixing of air, that is, when the wind starts to blow.","This causes a dilution and separation of suspended spray droplets.","Consequently, applications made during early evening, night, or morning hours under seemingly ideal conditions may result in highly damaging drift that can move long distances.","This is especially true if the **humidity is high**.","Such movement could occur up to **one to three hours** after the application."]},{"p":["You can recognize these stable air conditions by observing the movement of **dust or smoke**.","If dust or smoke rises little from its source and tends to **hang in the air**, an inversion may be present or developing. See Figure 7.3.","Another way of detecting inversions is to place **one thermometer at ground level** and a **second thermometer high above the ground**, then compare the difference in temperature.","If the temperature at ground level is **below** that found at the elevated thermometer, a temperature inversion exists.","**Do not apply pesticides under such conditions.**"]}],"figures":[{"id":"fig-7-3","title":"Figure 7.3: Dispersion of smoke particles under normal and inversion conditions.","page":"p. 110","explain":["Normal condition: cool air sits above warm air, so smoke rises and disperses.","Inversion condition: warm air sits above cool air, so smoke flattens into a layer and concentrates near the ground."],"svg":"<svg viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"Figure 7.3: Dispersion of smoke particles. Normal condition: cool air above warm air, smoke rises and disperses. Inversion condition: warm air above cool air, smoke concentrates in a flat layer near the ground\"><g font-family=\"var(--f-body)\"><rect class=\"f-card\" x=\"8\" y=\"8\" width=\"300\" height=\"260\" rx=\"6\"/><rect class=\"f-card\" x=\"332\" y=\"8\" width=\"300\" height=\"260\" rx=\"6\"/><rect class=\"f-field\" x=\"9\" y=\"220\" width=\"298\" height=\"47\"/><rect class=\"f-field\" x=\"333\" y=\"220\" width=\"298\" height=\"47\"/><path class=\"s-ink\" stroke-width=\"3\" d=\"M60 220 V190\"/><path class=\"f-muted\" fill-opacity=\".55\" d=\"M56 192 C50 150 70 120 110 90 C140 66 170 40 230 22 L300 22 L300 40 C230 60 190 90 160 110 C110 140 80 170 66 192 Z\"/><text class=\"f-ink\" x=\"232\" y=\"76\" font-weight=\"700\" font-size=\"17\">Cool air<\/text><text class=\"f-ink\" x=\"200\" y=\"190\" font-weight=\"700\" font-size=\"17\">Warm air<\/text><path class=\"s-ink\" stroke-width=\"3\" d=\"M384 220 V190\"/><path class=\"f-muted\" fill-opacity=\".65\" d=\"M380 192 C376 160 384 130 400 112 C430 100 520 104 630 110 L630 136 C540 132 450 130 420 138 C400 150 392 170 390 192 Z\"/><text class=\"f-ink\" x=\"530\" y=\"50\" font-weight=\"700\" font-size=\"17\">Warm air<\/text><text class=\"f-ink\" x=\"530\" y=\"190\" font-weight=\"700\" font-size=\"17\">Cool air<\/text><text class=\"f-ink\" x=\"158\" y=\"292\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"15\">Normal Condition:<\/text><text class=\"f-ink\" x=\"158\" y=\"312\" text-anchor=\"middle\" font-size=\"15\">Smoke rises and disperses<\/text><text class=\"f-ink\" x=\"482\" y=\"292\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"15\">Inversion Condition:<\/text><text class=\"f-ink\" x=\"482\" y=\"312\" text-anchor=\"middle\" font-size=\"15\">Smoke concentrates<\/text><\/g><\/svg>"}],"questions":[{"id":"c07-s08-t1","src":"test","kind":"mc","q":"A temperature inversion exists when:","choices":["The air at ground level is cooler than the air above it","The air at ground level is warmer than the air above it","Wind speed is above 10 miles per hour","Relative humidity is very low"],"answer":0,"ref":"p. 110, 'Temperature Inversions'","why":"In an inversion, ground-level air is cooler than the air above it."},{"id":"c07-s08-t2","src":"test","kind":"mc","style":"scenario","q":"At dusk, the air is calm. Smoke from a nearby burn pile rises a little, then hangs flat in the air. What should the applicator conclude?","choices":["An inversion may be present or developing, so do not spray","Calm air is ideal, so spray now","The smoke means wind is too high","Spray only with fine droplets"],"answer":0,"ref":"p. 111, paragraph on recognizing inversions; Figure 7.3","why":"Smoke that rises little and hangs in the air signals an inversion."},{"id":"c07-s08-t3","src":"test","kind":"mc","q":"When do inversions most often develop?","choices":["During the early evening hours","At midday","Early afternoon","Only during rainstorms"],"answer":0,"ref":"p. 110, 'Temperature Inversions'","why":"They most often develop in early evening as the ground cools and warm air has already risen."},{"id":"c07-s08-t4","src":"test","kind":"tf","q":"Low-wind conditions always produce less drift than high winds.","answer":false,"ref":"p. 110, 'Temperature Inversions'","why":"Low-wind applications can sometimes produce more extensive drift, because of inversions."},{"id":"c07-s08-t5","src":"test","kind":"mc","style":"scenario","q":"An applicator places one thermometer at ground level and one high above the ground. Ground level reads 58 degrees. The high one reads 64 degrees. What should the applicator do?","choices":["Not apply, because an inversion exists","Apply, because the air is stable","Apply with smaller droplets","Apply only if humidity is high"],"answer":0,"ref":"p. 111, paragraph on detecting inversions","why":"Ground temperature below the elevated reading means an inversion exists. Do not apply."},{"id":"c07-s08-t6","src":"test","kind":"mc","style":"not","q":"Which of these statements about inversions is NOT true?","choices":["Inversions can only occur at night","Almost all air movement during an inversion is sideways","Inversions can persist until mid-morning","Drift damage could occur up to one to three hours after the application"],"answer":0,"ref":"pp. 110 to 111, 'Temperature Inversions'","why":"Inversions may occur at any time of the day and at any height above the ground."}]},{"id":"c07-s09","chapter":"Chapter 7 · Pesticides in the Environment","title":"Vapor drift and particle drift","pages":[111,111],"body":[{"h":"Vapor drift"},{"p":["**Vapor drift** refers to the movement of pesticides as **gaseous vapors** from the target area.","Some pesticides are volatile: they change readily from a solid or liquid form into a gas under the right conditions. This usually occurs in **hot weather**.","Pesticides that have volatilized into a vapor or gas may drift **farther and for a longer time** than they would have as spray droplets.","**Only those pesticides that are able to volatilize** are susceptible to vapor drift.","As air temperatures increase, the likelihood that these pesticides will volatilize and drift also increases."]},{"p":["Whenever possible, choose a pesticide formulated as a **low-volatility** product.","Do not apply volatile pesticides on hot days.","Some products may even volatilize **several hours after application**, so beware if high temperatures are predicted for later in the day. See Figure 7.4.","Many product labels advise against applying these products when temperatures are **at or above 85 degrees Fahrenheit**.","Remember to check label precautions for product-specific concerns about vapor drift."]},{"fig":"fig-7-4"},{"h":"Particle drift (dust drift)"},{"p":["**Particle drift** refers to the movement of **solid particles** from the target area in the air during or just after an application.","These solid particles may include pesticides formulated as **dust**, or **soil particles** to which pesticides are attached.","Some pesticides can remain active on soil particles long after they are applied.","If particles are blown off the target site, sensitive areas may be contaminated or damaged.","To prevent particle drift from outdoor pesticide applications from entering nearby buildings, be sure to **close all windows and vents**. Turn off all circulating fans, forced-air heating systems, and air-conditioning units.","For indoor pesticide applications, reduce particle drift by turning off fans, forced-air heating systems, and other air-circulating equipment.","Check pesticide labels for statements related to these concerns."]}],"figures":[{"id":"fig-7-4","title":"Figure 7.4: Vapor drift of pesticides is more likely as heat and wind increase and the relative humidity decreases.","page":"p. 111","explain":["Vapor rises from the treated plants, wind carries it as drift across a road, and it reaches a non-target sensitive crop.","The thermometer shows that heat drives the process."],"svg":"<svg viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Figure 7.4: Vapor drift. Under sun and wind, vapor rises from treated plants and drifts across a road to a non-target sensitive crop, with a thermometer near 80 degrees\"><defs><marker id=\"a74\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path class=\"f-ink\" d=\"M0 0 L10 5 L0 10 Z\"/><\/marker><\/defs><g font-family=\"var(--f-body)\" font-weight=\"700\" font-size=\"15\"><circle class=\"f-hi\" cx=\"44\" cy=\"40\" r=\"24\"/><g class=\"s-ink\" stroke-width=\"2\" marker-end=\"url(#a74)\"><path d=\"M20 90 H200\"/><path d=\"M20 120 H160\"/><path d=\"M20 150 H120\"/><\/g><text class=\"f-ink\" x=\"100\" y=\"82\">Wind<\/text><g class=\"s-field\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#a74)\"><path d=\"M90 210 q-8 -12 0 -24 q8 -12 0 -24\"/><path d=\"M150 210 q-8 -12 0 -24 q8 -12 0 -24 q-8 -12 0 -24\"/><path d=\"M210 210 q-8 -12 0 -24 q8 -12 0 -24 q-8 -12 0 -24 q8 -12 10 -24\"/><path d=\"M270 210 q-8 -12 0 -24 q8 -12 0 -24 q-8 -12 0 -24 q8 -12 0 -30 q8 -8 30 -8\"/><\/g><text class=\"f-ink\" x=\"30\" y=\"196\">Vapor<\/text><path class=\"s-ink\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#a74)\" d=\"M300 92 q20 -8 40 0 q20 8 40 0 q20 -8 40 0 q20 8 40 0 q20 -8 40 0\"/><text class=\"f-ink\" x=\"390\" y=\"78\">Drift<\/text><rect class=\"f-field\" fill-opacity=\".4\" x=\"10\" y=\"212\" width=\"620\" height=\"80\"/><g class=\"f-field\"><path d=\"M80 226 l10 -18 l10 18 Z M140 226 l10 -18 l10 18 Z M200 226 l10 -18 l10 18 Z M260 226 l10 -18 l10 18 Z M110 262 l10 -18 l10 18 Z M170 262 l10 -18 l10 18 Z M230 262 l10 -18 l10 18 Z\"/><\/g><path class=\"f-muted\" d=\"M360 292 L390 212 H430 L440 292 Z\"/><path class=\"s-ink\" stroke-width=\"2\" stroke-dasharray=\"8 8\" d=\"M410 216 L414 290\"/><g class=\"f-field\"><circle cx=\"490\" cy=\"190\" r=\"22\"/><circle cx=\"560\" cy=\"190\" r=\"22\"/><rect x=\"486\" y=\"200\" width=\"8\" height=\"30\"/><rect x=\"556\" y=\"200\" width=\"8\" height=\"30\"/><\/g><text class=\"f-ink\" x=\"525\" y=\"262\" text-anchor=\"middle\">Non-Target<\/text><text class=\"f-ink\" x=\"525\" y=\"280\" text-anchor=\"middle\">Sensitive Crop<\/text><rect class=\"f-card\" x=\"584\" y=\"20\" width=\"36\" height=\"140\" rx=\"6\"/><rect class=\"f-bad\" x=\"596\" y=\"70\" width=\"12\" height=\"80\"/><g class=\"f-ink\" font-size=\"11\" font-weight=\"400\"><text x=\"560\" y=\"40\">90<\/text><text x=\"560\" y=\"80\">80<\/text><text x=\"560\" y=\"120\">70<\/text><\/g><\/g><\/svg>"}],"questions":[{"id":"c07-s09-t1","src":"test","kind":"mc","q":"Many product labels advise against applying volatile products when temperatures are at or above:","choices":["85 degrees Fahrenheit","70 degrees Fahrenheit","95 degrees Fahrenheit","100 degrees Fahrenheit"],"answer":0,"ref":"p. 111, 'Vapor Drift'","why":"Many labels advise against applying at or above 85 degrees Fahrenheit."},{"id":"c07-s09-t2","src":"test","kind":"mc","style":"scenario","q":"It is 72 degrees at 8 a.m., but the forecast calls for 91 degrees by afternoon. You plan to apply a volatile herbicide in the morning. What is the risk?","choices":["The product may volatilize hours after application when it gets hot","None, because it was applied while cool","Only particle drift is possible","The heat will make it adsorb tightly to soil"],"answer":0,"ref":"p. 111, 'Vapor Drift'","why":"Some products volatilize several hours after application, so beware of high temperatures predicted later in the day."},{"id":"c07-s09-t3","src":"test","kind":"tf","q":"Any pesticide can undergo vapor drift.","answer":false,"ref":"p. 111, 'Vapor Drift'","why":"Only pesticides that are able to volatilize are susceptible to vapor drift."},{"id":"c07-s09-t4","src":"test","kind":"short","q":"What is the movement of solid particles, such as dusts or pesticide-coated soil, from the target area in the air called?","answer":"particle drift","accept":["dust drift","particle drift or dust drift"],"keys":[["particle","dust"],["drift"]],"ref":"p. 111, 'Particle Drift (Dust Drift)'","why":"Particle drift, also called dust drift, is the movement of solid particles in the air."},{"id":"c07-s09-t5","src":"test","kind":"mc","style":"not","q":"To keep particle drift from an outdoor application out of a nearby building, which of these is NOT a step the manual gives?","choices":["Open windows to let the dust clear","Close all windows and vents","Turn off all circulating fans","Turn off forced-air heating and air-conditioning units"],"answer":0,"ref":"p. 111, 'Particle Drift (Dust Drift)'","why":"Close all windows and vents, and turn off fans, forced-air heating, and air conditioning."}]},{"id":"c07-s10","chapter":"Chapter 7 · Pesticides in the Environment","title":"Applicator responsibility and sources of water contamination","pages":[111,112],"body":[{"h":"Applicator responsibility"},{"p":["As an applicator, **you are legally responsible** for any damages resulting from the off-target movement of pesticides.","Assess the vulnerability of neighboring properties and those areas downwind of the application site.","Evaluate weather conditions for **temperature inversions, wind direction, and wind speed** before making the all-important decision about whether to spray.","You may have to adjust your application equipment to reduce spray drift.","Consider using low-volatile formulations, or adding a drift control agent or thickener to help minimize drift.","For further discussion on equipment designed to minimize drift, see Chapter 11, Pesticide Application Procedures.","A good drift management program includes a **combination of all drift reducing techniques** available for a particular application."]},{"fig":"p112-particle"},{"p":["If you apply pesticides indoors, you are also responsible for preventing drift. Ensure that:"]},{"list":["Pesticides do not move beyond the target site.","All people and animals are kept out of the treatment area according to label instructions."]},{"h":"Sources of water contamination"},{"p":["Surface water or groundwater contamination results from either **point-source** or **nonpoint-source** pollution. See Figure 7.5.","Nonpoint-source pollution from pesticide applications is usually blamed for pesticide contamination of the outdoor environment.","However, studies show that water contamination may also result from point-source pollution.","**Point-source pollution** comes from a **specific, identifiable location**, such as:"]},{"list":["A pesticide spill entering a storm sewer.","Back-siphoning of pesticides into water supplies.","Contaminated surface water entering sinkholes.","Repeated spilling of pesticides at mixing and loading sites.","Careless spilling of wash water at equipment cleanup sites.","Improper handling of spills and leaks at storage sites.","Improper disposal of containers, rinsate from containers, and excess pesticides."]},{"p":["**Nonpoint-source pollution** comes from a **widespread area**.","An example is the movement of pesticides into streams or groundwater after **broadcast applications** to large agricultural fields, rights-of-way, or turf areas."]},{"fig":"fig-7-5"}],"f
