tate(29 571 233)\"><ellipse class=\"f-ink\" cx=\"571\" cy=\"233\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"582\" cy=\"233\" r=\"3.5\"/><\/g><g transform=\"rotate(30 597 240)\"><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"597\" cy=\"240\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"608\" cy=\"240\" r=\"3.5\"/><\/g><path class=\"s-ink\" stroke-width=\"1.5\" fill=\"none\" d=\"M597 231 L532 132\"/><text class=\"f-ink\" x=\"532\" y=\"126\" text-anchor=\"middle\" font-family=\"var(--f-body)\" font-size=\"13\" font-weight=\"700\">susceptible individual<\/text><g transform=\"rotate(-35 613 239)\"><ellipse class=\"f-ink\" cx=\"613\" cy=\"239\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"624\" cy=\"239\" r=\"3.5\"/><\/g><g transform=\"rotate(-29 454 264)\"><ellipse class=\"f-ink\" cx=\"454\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"465\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(-40 478 267)\"><ellipse class=\"f-ink\" cx=\"478\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"489\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-0 505 268)\"><ellipse class=\"f-ink\" cx=\"505\" cy=\"268\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"516\" cy=\"268\" r=\"3.5\"/><\/g><g transform=\"rotate(38 532 264)\"><ellipse class=\"f-ink\" cx=\"532\" cy=\"264\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"543\" cy=\"264\" r=\"3.5\"/><\/g><g transform=\"rotate(12 556 267)\"><ellipse class=\"f-ink\" cx=\"556\" cy=\"267\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"567\" cy=\"267\" r=\"3.5\"/><\/g><g transform=\"rotate(-21 582 270)\"><ellipse class=\"f-ink\" cx=\"582\" cy=\"270\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"593\" cy=\"270\" r=\"3.5\"/><\/g><g transform=\"rotate(32 614 269)\"><ellipse class=\"f-ink\" cx=\"614\" cy=\"269\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"625\" cy=\"269\" r=\"3.5\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"14\"><ellipse class=\"f-ink\" cx=\"200\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-ink\" cx=\"211\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"222\" y=\"323\">Resistant<\/text><ellipse class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"340\" cy=\"318\" rx=\"10\" ry=\"6.5\"/><circle class=\"f-field s-field\" fill-opacity=\".35\" stroke-width=\"1.5\" cx=\"351\" cy=\"318\" r=\"3.5\"/><text class=\"f-ink\" x=\"362\" y=\"323\">Susceptible<\/text><\/g><\/svg>"}],"questions":[{"id":"c01-s23-r1","src":"review","kind":"mc","q":"Which would increase the likelihood of pesticide resistance?","choices":["An insect that has one generation per year.","Continual use of pesticides from the same chemical class.","Applying a pesticide that has little or no residual effect."],"answer":1,"ref":"Review question 10, p. 18. Answer in the text: p. 14, 'Pesticide Resistance'","why":"Many generations and greater persistence raise the chances, so A and C lower them."},{"id":"c01-s23-t1","src":"test","kind":"mc","q":"What is pesticide resistance?","choices":["The ability of a pest to tolerate a pesticide that once controlled it","A pesticide that lasts a long time","A crop that tolerates herbicides","The time it takes a pesticide to break down"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Resistance is a pest's ability to tolerate a pesticide that once controlled it."},{"id":"c01-s23-t2","src":"test","kind":"mc","style":"not","q":"Which of these does NOT increase the chances of pesticide resistance?","choices":["Continual use of pesticides from the same chemical class","Frequent applications","Greater persistence of the chemical","Pests that have few generations per year and few offspring"],"answer":3,"ref":"p. 14, 'Pesticide Resistance'","why":"Many generations and many offspring speed resistance up. Few does not."},{"id":"c01-s23-t3","src":"test","kind":"mc","style":"scenario","q":"A turf manager uses only pyrethroid insecticides, year after year. What does the manual say this does?","choices":["Increases the likelihood that resistance will develop","Prevents resistance because pyrethroids are a single class","Has no effect on resistance","Makes the pests more susceptible"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Continual use of one chemical class, such as all pyrethroids, increases the likelihood of resistance."},{"id":"c01-s23-t4","src":"test","kind":"tf","q":"Resistance spreads much more rapidly in pests with many generations per year and many offspring per generation.","answer":true,"ref":"p. 14, 'Pesticide Resistance'","why":"Many insects, mites, fungi, and rodents fit this description."},{"id":"c01-s23-t5","src":"test","kind":"mc","q":"In the early stages of resistance, what happens?","choices":["Higher labeled rates and more frequent applications are needed to control the pests","The pesticide stops working completely right away","The pests die faster than before","Natural enemies take over"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"First it takes higher rates and more applications; eventually the pesticide has little or no effect."}]},{"id":"c01-s24","chapter":"Chapter 1 · Pest Management","title":"Delaying pesticide resistance","pages":[14,15],"body":[{"p":["Several pest management tactics help **prevent or delay** the occurrence of pesticide resistance.","One approach is the use of **new or altered pesticides**.","Using new compounds with **different modes of action** will lessen the likelihood of resistance developing in a population.","Most pesticides have a **code number at the top of the label** indicating the mode of action, for example, **Group 4A Insecticides, Neonicotinoids**, or **Group 2 Herbicides, ALS Inhibitors**.","Unfortunately, new replacement products are often quite complex, difficult to synthesize, and very costly to develop.","Moreover, they have very specific modes of action, which can rapidly lead to the development of resistant pest populations even after limited use in the field.","No longer can we expect to respond to pesticide resistance by merely substituting one pesticide for another."]},{"p":["**Changing pesticide use patterns** is an important step in preventing resistance.","When **dosages are reduced**, fewer pests are killed, so the pressure to develop resistant pest populations is decreased.","**Applying pesticides over limited areas** reduces the proportion of the total pest population exposed to the chemical.","The result is a large pool of individuals still susceptible to the pesticide.","This tactic tends to delay the development of a resistant population because pesticide-susceptible individuals continue to interbreed with resistant ones, thus **diluting the resistance** in the population.","Also, **treating alternate generations** of pests with pesticides that have different modes of action decreases the selection pressure for resistance."]},{"p":["Managing pesticide resistance is a critical aspect of integrated pest management.","Monitor pest populations carefully and **treat only when necessary instead of on a schedule**.","Good pesticide **application records** are another important part of resistance management.","Pesticides are more effectively managed when **treatment history** is known.","Resistance must be **detected when it is at a very low level**.","It should then be controlled by using all available pest management techniques to extend the useful life of our current pesticides."]}],"questions":[{"id":"c01-s24-t1","src":"test","kind":"mc","q":"Where do most pesticides show a code number for the mode of action?","choices":["At the top of the label","In the storage section","In the first aid section","On the container cap"],"answer":0,"ref":"p. 14, 'Pesticide Resistance'","why":"Examples: Group 4A Insecticides, Neonicotinoids, or Group 2 Herbicides, ALS Inhibitors."},{"id":"c01-s24-t2","src":"test","kind":"mc","style":"scenario","q":"A grower wants to slow resistance. Which plan follows the manual?","choices":["Treat alternate generations with pesticides that have different modes of action","Use the same pesticide at higher rates every week","Treat the whole area on a fixed schedule","Switch to a new product with the same mode of action"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"Treating alternate generations with different modes of action decreases selection pressure."},{"id":"c01-s24-t3","src":"test","kind":"mc","style":"not","q":"Which of these does NOT help delay resistance, according to the manual?","choices":["Reducing dosages","Applying pesticides over limited areas","Treating only when necessary","Treating on a calendar schedule"],"answer":3,"ref":"pp. 14–15, 'Pesticide Resistance'","why":"Treat only when necessary instead of on a schedule."},{"id":"c01-s24-t4","src":"test","kind":"mc","q":"Why does applying pesticides over limited areas delay resistance?","choices":["Susceptible individuals keep interbreeding with resistant ones, diluting the resistance","It kills every pest in the area","It makes pests resistant faster","It lowers the cost of pesticides"],"answer":0,"ref":"p. 15, 'Pesticide Resistance'","why":"A large pool of susceptible pests remains, and they dilute the resistance."},{"id":"c01-s24-t5","src":"test","kind":"short","q":"Using mode of action, what is one way to lessen the chance of resistance?","answer":"Use pesticides with different modes of action","keys":[["different","rotate","rotating","alternate","alternating","change","changing","switch","switching"],["mode of action","modes of action","moa","mode","modes"]],"ref":"p. 14, 'Pesticide Resistance'","why":"New compounds with different modes of action lessen the likelihood of resistance."}]},{"id":"c01-s25","chapter":"Chapter 1 · Pest Management","title":"Chapter 1 summary","pages":[15,15],"body":[{"h":"Summary"},{"p":["A successful pest management program begins with the **proper identification** of the pest.","Choosing the appropriate pest control method depends on recognizing and understanding the pest, its **life cycle, habits, and habitat**.","Integrated pest management programs attempt to balance the need for pest control with the desire to protect the environment from pesticide contamination.","**Monitoring** is critical to knowing where pests are located, when to act against growing pest populations, and what type of control measures to use.","Evaluation and recording results help to determine how well the IPM program is working and whether there are any harmful human or environmental effects."]},{"p":["Minimizing pesticide resistance is critical for sustaining the effectiveness of pest management programs.","Using a variety of tools and techniques will help prevent or delay the occurrence of pesticide resistance.","If the pest has not been properly identified, **even nonchemical control tactics will fail**.","It is your responsibility to consider the effects of pest control actions on the **entire treatment site**, whether an outdoor area or inside a structure.","Use good judgment, especially when pesticides are part of the control strategy, to avoid harmful effects to other living organisms and the environment."]}],"questions":[{"id":"c01-s25-t1","src":"test","kind":"mc","q":"According to the chapter summary, a successful pest management program begins with:","choices":["Proper identification of the pest","Choosing a pesticide","Eradication","Setting the economic injury level"],"answer":0,"ref":"p. 15, 'Summary'","why":"Everything else depends on knowing what the pest is."},{"id":"c01-s25-t2","src":"test","kind":"tf","q":"If a pest has not been properly identified, nonchemical control tactics will still work.","answer":false,"ref":"p. 15, 'Summary'","why":"Without proper identification, even nonchemical control tactics will fail."},{"id":"c01-s25-t3","src":"test","kind":"mc","style":"not","q":"Monitoring helps you know all of these EXCEPT:","choices":["Where pests are located","When to act against growing pest populations","What type of control measures to use","Which pesticide brand is cheapest"],"answer":3,"ref":"p. 15, 'Summary'","why":"Monitoring tells you where pests are, when to act, and what control to use."},{"id":"c01-s25-t4","src":"test","kind":"mc","style":"scenario","q":"You are treating a building for pests. Whose responsibility is it to consider the effects of the treatment on the entire treatment site?","choices":["Yours, as the applicator","Only the building owner's","The pesticide manufacturer's","EPA's"],"answer":0,"ref":"p. 15, 'Summary'","why":"It is your responsibility, outdoors or inside a structure."}]},{"id":"c06-s01","chapter":"Chapter 6 · Personal Protective Equipment","title":"What PPE is, and what it cannot do","pages":[89,90],"body":[{"box":"Learning objectives","p":["After studying this chapter, you should be able to do the following."],"list":["Identify where on the label to find the minimum clothing and personal protective equipment (PPE) required to handle a given pesticide product.","State the criteria to properly select skin, eye, and respiratory protection required by the pesticide label based upon your expected use and exposure.","List three work practices each for correct use of gloves, footwear, and eyewear that minimize pesticide exposure and contamination.","List the signs of wear and tear, damage, or other PPE failures that may expose you to pesticides.","Explain the importance of wearing respiratory protection devices approved by the National Institute for Occupational Safety and Health.","Tell when to replace particulate filters and chemical cartridges or canisters on your respirator.","Distinguish between a fit test and a seal check for tight-fitting respirators.","Describe how to clean and maintain pesticide-contaminated work clothes and PPE.","Describe how to dispose of PPE when necessary."]},{"h":"Personal protective equipment"},{"p":["The pesticide label prescribes handling precautions, **personal protective equipment (PPE)**, and other safety measures to minimize your exposure while handling pesticides.","PPE comprises the clothing and devices you wear to protect your body from contact with pesticides.","Wearing PPE can reduce exposure (**dermal, inhalation, ocular, or oral**) and thereby lower the chances of pesticide injury, illness, or poisoning."]},{"p":["**Basic protective work clothing** consists of a long-sleeved shirt, long pants, closed-toed shoes, and socks.","PPE, as defined by the U.S. Environmental Protection Agency (EPA), includes **coveralls, apron, gloves, footwear, headgear, eyewear, and respirators**."]},{"p":["It is important that all pesticide applicators and handlers understand the protections and limitations of PPE.","Although PPE may reduce your exposure to pesticides, it **does not necessarily eliminate it**.","Proper PPE selection, use, and care are essential.","The following are some good work practices that you should always follow when using pesticides."]}],"questions":[{"id":"c06-s01-t1","src":"test","kind":"mc","q":"Which of these is NOT on EPA's list of what PPE includes?","choices":["Coveralls","Headgear","Respirators","Sunscreen"],"answer":3,"ref":"p. 90, 'Personal Protective Equipment'","why":"EPA lists coveralls, apron, gloves, footwear, headgear, eyewear, and respirators.","style":"not"},{"id":"c06-s01-t2","src":"test","kind":"tf","q":"Wearing the right PPE eliminates your exposure to pesticides.","answer":false,"ref":"p. 90, 'Personal Protective Equipment'","why":"PPE may reduce exposure, but it does not necessarily eliminate it."},{"id":"c06-s01-t3","src":"test","kind":"short","q":"Name the four routes of exposure that wearing PPE can reduce.","answer":"Dermal, inhalation, ocular, and oral.","ref":"p. 89, 'Personal Protective Equipment'","why":"Skin, breathing, eyes, and mouth: dermal, inhalation, ocular, oral.","keys":[["dermal","skin"],["inhalation","inhaling","breathing","lungs"],["ocular","eye","eyes"],["oral","mouth","swallowing"]],"accept":["skin, lungs, eyes, mouth","dermal inhalation ocular oral"]},{"id":"c06-s01-t4","src":"test","kind":"mc","q":"Basic protective work clothing consists of:","choices":["A long-sleeved shirt, long pants, closed-toed shoes, and socks","Coveralls, chemical-resistant gloves, and goggles","A short-sleeved shirt, long pants, and boots","Any clean clothing plus a respirator"],"answer":0,"ref":"p. 89-90, 'Personal Protective Equipment'","why":"Basic work clothing is long sleeves, long pants, closed-toed shoes, and socks."},{"id":"c06-s01-t5","src":"test","kind":"mc","q":"A new crew member says, \"I have all the label PPE on, so I can't be exposed.\" What is the correct response?","choices":["Right. Label PPE makes exposure impossible.","PPE reduces exposure but does not necessarily eliminate it, so proper selection, use, and care still matter.","Only a respirator eliminates exposure.","PPE only matters for dermal exposure."],"answer":1,"ref":"p. 90, 'Personal Protective Equipment'","why":"PPE lowers exposure but does not necessarily eliminate it.","style":"scenario"}]},{"id":"c06-s02","chapter":"Chapter 6 · Personal Protective Equipment","title":"Good work practices for every job","pages":[90,90],"body":[{"h":"Good work practices"},{"p":["It is important to take basic steps to reduce exposure when you handle pesticides or work in pesticide-treated areas.","Remember to use common sense. No guidelines cover all situations."]},{"box":"Prevent oral exposure","list":["Never eat, drink, chew gum, use tobacco products, or handle cellphones while working with pesticides.","Contaminated hands are a source of oral exposure to pesticides."]},{"box":"Prevent dermal exposure","list":["Wash your hands before using the toilet. The **groin area readily absorbs pesticide**.","Wear a minimum of a long-sleeved shirt, long pants, and closed-toed shoes.","Do not wipe contaminated gloves on your clothing. The pesticide may seep through."]},{"box":"Prevent ocular exposure","list":["Wear protective eyewear to protect from splashes, sprays, mists, fogs and aerosols."]},{"box":"Prevent inhalation exposure","list":["Avoid breathing in dusts, spray droplets, or vapors.","Wear a respirator when needed, **even if the label does not require it**."]},{"box":"Decontaminate yourself and your PPE","list":["**Wash your gloves with soap and water before you take them off.** Remove them and wash your hands and face.","Immediately wash off any pesticide that gets directly on you.","Remove and replace damaged or contaminated clothing or PPE. Have spare clothing available.","At the end of the day, wash or replace contaminated PPE.","Shower at the end of the workday. Wash your hair and scalp and under your fingernails.","Put on a complete change of clothing after you shower.","Launder your work clothes separately from non-work and other clothes at the end of each workday."]}],"questions":[{"id":"c06-s02-t1","src":"test","kind":"mc","q":"Why should you wash your hands before using the toilet when working with pesticides?","choices":["Soap residue can react with pesticides","The groin area readily absorbs pesticide","Toilets are a common source of pesticide spills","It is required only for restricted use pesticides"],"answer":1,"ref":"p. 90, 'Good Work Practices', Prevent dermal exposure","why":"The groin area readily absorbs pesticide."},{"id":"c06-s02-t2","src":"test","kind":"mc","q":"Which of these is NOT on the manual's list of things to never do while working with pesticides?","choices":["Chew gum","Handle a cellphone","Use tobacco products","Wear protective eyewear"],"answer":3,"ref":"p. 90, 'Good Work Practices', Prevent oral exposure","why":"Never eat, drink, chew gum, use tobacco, or handle cellphones. Eyewear is protection.","style":"not"},{"id":"c06-s02-t3","src":"test","kind":"tf","q":"You only need to wear a respirator when the label requires one.","answer":false,"ref":"p. 90, 'Good Work Practices', Prevent inhalation exposure","why":"Wear a respirator when needed, even if the label does not require it."},{"id":"c06-s02-t4","src":"test","kind":"mc","q":"You finish mixing and are wearing contaminated gloves. What is the correct order?","choices":["Take gloves off, then wash the gloves and your hands","Wash gloves with soap and water, take them off, then wash your hands and face","Wipe gloves on your pants, take them off, then wash your hands","Take gloves off and put them straight into a bag"],"answer":1,"ref":"p. 90, 'Good Work Practices', Decontaminate yourself and your PPE","why":"Wash gloves before you take them off, then wash hands and face.","style":"scenario"},{"id":"c06-s02-t5","src":"test","kind":"mc","q":"Why should you never wipe contaminated gloves on your clothing?","choices":["It ruins the gloves","The pesticide may seep through","It voids the label","It spreads pesticide to the gloves"],"answer":1,"ref":"p. 90, 'Good Work Practices', Prevent dermal exposure","why":"Pesticide wiped on clothing may seep through to your skin."}]},{"id":"c06-s03","chapter":"Chapter 6 · Personal Protective Equipment","title":"The label sets the minimum PPE","pages":[90,91],"body":[{"h":"Protect yourself from pesticides"},{"p":["A pesticide label lists the **minimum PPE** that an applicator, handler, and early-entry worker must wear.","Wearing anything less is **illegal and dangerous**.","All pesticide handlers (for example, applicators, mixers and loaders, and flaggers) are responsible for following the pesticide label, including wearing PPE."]},{"p":["PPE requirements are typically listed under the **\"Precautionary Statements\"** section of the pesticide label.","If you work in or on a farm, forest, nursery, or greenhouse, look for additional PPE requirements listed in the **\"Agricultural Use Requirements\"** box on the label."]},{"p":["Also, always check to see if state regulations are more restrictive than label requirements.","For example, a label may allow you to wear less PPE when engineering controls (for example, an enclosed cab) are used, but the state, tribal, or territorial pesticide regulatory agency may prohibit this practice.","Additionally, some states have more restrictive occupational health and safety regulations specific to pesticide applicators or to protect commercial sector workers, such as landscapers or pest management professionals.","When a state, tribal, or local regulation is **more restrictive** than federal pesticide laws, it **must** be followed."]},{"p":["Under EPA's **Worker Protection Standard (WPS, 40 CFR Part 170)**, agricultural employers are legally required to provide PPE that is in good working order.","They also must train pesticide handlers on the proper use and maintenance of label-required PPE."]}],"questions":[{"id":"c06-s03-t1","src":"test","kind":"mc","q":"Where on a pesticide label are PPE requirements typically listed?","choices":["Directions for Use","Precautionary Statements","Storage and Disposal","Active ingredient statement"],"answer":1,"ref":"p. 90, 'Protect Yourself from Pesticides'","why":"PPE is typically under the Precautionary Statements section."},{"id":"c06-s03-t2","src":"test","kind":"mc","q":"You work in a greenhouse. Where on the label do you look for additional PPE requirements?","choices":["The \"Agricultural Use Requirements\" box","The signal word","The EPA registration number","The first aid statement"],"answer":0,"ref":"p. 90, 'Protect Yourself from Pesticides'","why":"Farms, forests, nurseries, and greenhouses: check the Agricultural Use Requirements box.","style":"scenario"},{"id":"c06-s03-t3","src":"test","kind":"mc","q":"The label lets you wear less PPE in an enclosed cab, but your state agency prohibits that. What do you do?","choices":["Follow the label, because federal law is the label","Follow the state rule, because a more restrictive state regulation must be followed","Choose whichever is more practical that day","Ask the dealer to decide"],"answer":1,"ref":"p. 91, 'Protect Yourself from Pesticides'","why":"When a state rule is more restrictive than federal law, it must be followed.","style":"scenario"},{"id":"c06-s03-t4","src":"test","kind":"mc","q":"Under the Worker Protection Standard (40 CFR Part 170), agricultural employers must:","choices":["Provide PPE in good working order and train handlers on its proper use and maintenance","Only recommend PPE to workers","Provide PPE only for restricted use pesticides","Have workers buy their own PPE"],"answer":0,"ref":"p. 91, 'Protect Yourself from Pesticides'","why":"WPS: employers must provide working PPE and train handlers on it."},{"id":"c06-s03-t5","src":"test","kind":"mc","q":"Which of these is NOT given as an example of a pesticide handler responsible for following the label?","choices":["Applicator","Mixer and loader","Flagger","The dealer who sold the product"],"answer":3,"ref":"p. 90, 'Protect Yourself from Pesticides'","why":"The manual names applicators, mixers and loaders, and flaggers.","style":"not"}]},{"id":"c06-s04","chapter":"Chapter 6 · Personal Protective Equipment","title":"Why PPE rules vary, and example label statements","pages":[91,91],"body":[{"p":["PPE label requirements vary, depending upon the **toxicity, formulation, dilution, and route of exposure** of the pesticide product and activity.","For example, a single label may have one set of PPE requirements for applicators and a **different set for agricultural early-entry workers** going into areas during the restricted-entry interval.","Even very low hazard pesticides require a long-sleeved shirt, long pants, shoes, and socks."]},{"fig":"p91-posted"},{"p":["Consider all work situations where using PPE may be hazardous.","Be careful around moving equipment parts (such as a **power takeoff unit**) that can catch **apron strings**.","Protective clothing can restrict evaporation of sweat, thus impeding the body's natural cooling system and causing heat-related illnesses, including **heat stress** (see Chapter 5, Pesticide Hazards and First Aid, for more information)."]},{"box":"Example PPE statements on a label: Personal Protective Equipment","p":["All mixers, loaders, applicators, and other handlers must wear:"],"list":["Long-sleeved shirt and long pants.","Shoes and socks.","Nitrile rubber, butyl rubber, barrier laminate, or Viton® gloves.","Protective eyewear (goggles or face shield).","Chemical-resistant apron when mixing or loading, cleaning up spills or equipment, or otherwise exposed to the concentrate."]},{"box":"Example PPE statements on a label: Agricultural Use Requirements","p":["PPE required for early entry to treated areas as permitted under the Worker Protection Standard and that involves contact with anything that has been treated (such as plants, soil, or water) includes:"],"list":["Coveralls over short-sleeved shirt and short pants.","Nitrile rubber, butyl rubber, barrier laminate, or Viton® gloves.","Shoes plus socks.","Protective eyewear."]},{"fig":"p91-ppe"}],"figures":[{"id":"p91-posted","title":"Posted field during the restricted-entry interval.","page":"p. 91","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEEAW8DASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAIBAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAehwuxb3vNboBxeneCDxUFXKy7GPgxmdDIs5KWQZ11UldV6jA5WED21WjShU12TFeqmo7XR8gV7SfMdfV3hO7BMUEwEwAEnF316cy4C2A5sm7jcyjnL6rHhZRh5litpgnHqpM5Fg0rIttYNoy2lsARMgQVE0zQFlbnQ7vk7j2c+b7/S2AboAASRKTI0J53K/j1xyze06bc0kkWI46Kw0JprNOioyF9UI1lQsWINakGmImhbYKiyRLFrizFfQCxI11MHrNvh/S6vTA60ACJ4uJl5KxyyxW1tmvFYaq5YmYYkiRtObTVL4rC8xMbLefrXVn2cetVnP1yWrhpOpXMFc1gsWkZk0hRRrqBLAR4Q9N0vFeq1dYHW5PM6+bwzCsott9xiNSijQFqXFVqSMy3Vnu2LWOdFZTpSw0c7fjWtb65K3FL8W7CXVvEK6g6rYUVaKzJZopFEUbdgc9w3G7PXXiapXjhrs+irCyVqGUYSwmCBpkF1Z9FbwNWKbfMRpy7M+ZVfXB2tPm+3WsidWON2uN  power takeoff unit","The apron blocks your view of the gauges","Aprons are not allowed near tractors"],"answer":1,"ref":"p. 91, 'Protect Yourself from Pesticides'","why":"Moving parts like a power takeoff unit can catch apron strings.","style":"scenario"},{"id":"c06-s04-t4","src":"test","kind":"mc","q":"Why can protective clothing lead to heat stress?","choices":["It absorbs sunlight","It restricts evaporation of sweat, impeding the body's natural cooling","It traps pesticide vapors against the skin","It reduces blood flow"],"answer":1,"ref":"p. 91, 'Protect Yourself from Pesticides'","why":"Clothing that restricts sweat evaporation impedes the body's cooling."},{"id":"c06-s04-t5","src":"test","kind":"mc","q":"In the example label box, which glove type is NOT listed?","choices":["Nitrile rubber","Barrier laminate","Viton®","Leather"],"answer":3,"ref":"p. 91, 'Example PPE Statements on a Label'","why":"The example lists nitrile rubber, butyl rubber, barrier laminate, or Viton® gloves.","style":"not"}]},{"id":"c06-s05","chapter":"Chapter 6 · Personal Protective Equipment","title":"Protect your body: what makes PPE protective","pages":[92,92],"body":[{"h":"Protect your body"},{"p":["Different types of clothing, aprons, hats, boots, and gloves are not equally protective against all pesticides and under all conditions.","For PPE to be protective, it must do three things."]},{"ol":["Shield your skin (head, face, neck, trunk, arms, legs, and feet) from exposure throughout the pesticide-handling activity.","Be durable and resist punctures and tears during normal use.","Be comfortable enough without restricting your movement so you will wear it."]},{"p":["To protect your skin, your normal work clothing must cover most of your body.","Depending on the product's toxicity and use, other PPE (such as coveralls, apron, hat, boots, and gloves) may also be required.","Protective clothing, gloves, and boots must provide a barrier **for the duration of the task** when you are exposed to a pesticide.","Labels may require **waterproof** gloves or boots.","Additionally, **chemical-resistant** gloves, aprons, hats, boots, or suits are required on some labels."]},{"box":"Chemical resistant","p":["EPA defines **\"chemical resistant\"** as preventing any measurable amount of material from moving through (**breaking through**) the fabric or material."]},{"p":["Things that can affect the extent of **breakthrough** are **contact time, concentration, temperature, and the product itself**.","When selected correctly, protective clothing reduces the risk of dermal exposure but does not eliminate it."]},{"fig":"p92-minimum"}],"figures":[{"id":"p92-minimum","title":"At a minimum wear a long-sleeved shirt, long pants, shoes, and socks when working around pesticides.","page":"p. 92","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAIwAMQDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECAwUEBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAHg+70+qte+YGc1U2MczXn6fVJznZ328Lf2oczf7Br2wAAEFQfLYBcpkenpZ+w07gAJQAgLAABLAo+QzmZm2ZR387KAEFBLAAAQqAAD49jtNnv5XaOxASiKCAAAQAAAgPj9khs7/B+nNoAAEsAAEQrGFQQEUfMXz+gv1nzf0YAAgACFmMLj5PnI70+UR9tu+C+wr2ooD5D05Yx1OzzujQCWABMRJUaPR89HK9ev6aXxc36XzV8j3vL1DoTKWRkPm8bsl73oKAgEYFliLKPk/quDGU7G4x5nq9C8TueL3FhYB896vN75euKAkuJAhBRGPg9/MOr5tm04/tzwXPfYiYqyYj53s8nvy+gUMSMaIJLRY1Rlz9W2PTjp21jnz/NH0U4qO28HR0wUcT6Hi9tRKYWEVIFNXm5+Hs8+TGcM5nbfL3+Z0uGzZvOXbOcx93i2HTbHW8/qeT1yiVgJFlGjdzI06t+nnnYqMfT42r3fF6OVu9D1cTOPPu1sZ2YbMTsOO6a6/oxy1UsTAxjK45GPG6fNxMtG/HEuOXmM9ujbXn9fO6Bqyw0Hp17MjTsz1GwHfJ21YGMqJQ8Hl2Yc5DVmY7bTDy7bV26dxqxuwyx1biCMUV9CO2wSY5YwKcfDPXzmG5cyR5jM2V5PXjma9ummO2bKwSmDsNX0jeiwSjCZ4Sckc5F05mOzLImvZoMfRjlS42Mehzevu5WTdoN6y0IASq0cX6LiYnn25ueYox0enzm1p9Bio1dzk9bpYt1cVG7G61zvP6AACOJ3PmMvc5O/nn3PnMbfo/Ny9CdyeDynX1Y6j6zO3rrG2AGQtCQAQfI/QcXE8PUuPPPl27o ":"mc","q":"For PPE to be protective, it must:","choices":["Shield your skin, be durable, and be comfortable enough that you will wear it","Be disposable, white, and loose","Be made of cotton, be washable, and be cheap","Cover only the hands and face"],"answer":0,"ref":"p. 92, 'Protect Your Body'","why":"The three musts: shield skin, durable, comfortable enough to wear."},{"id":"c06-s05-t4","src":"test","kind":"mc","q":"A suit is highly protective but so stiff and hot that the applicator takes it off by noon. Which requirement for protective PPE does it fail?","choices":["Shield your skin","Be durable","Be comfortable enough without restricting movement so you will wear it","Be chemical resistant"],"answer":2,"ref":"p. 92, 'Protect Your Body'","why":"PPE you will not keep on does not protect you.","style":"scenario"},{"id":"c06-s05-t5","src":"test","kind":"tf","q":"Protective clothing must provide a barrier for the duration of the task when you are exposed.","answer":true,"ref":"p. 92, 'Protect Your Body'","why":"Clothing, gloves, and boots must hold up for the whole task."}]},{"id":"c06-s06","chapter":"Chapter 6 · Personal Protective Equipment","title":"Work clothing and coveralls","pages":[92,93],"body":[{"h":"Work clothing"},{"p":["Your work clothes provide a basic barrier to minimize pesticide contact with your skin.","Always wear, at a minimum, a **long-sleeved shirt, long pants, closed-toed shoes, and socks** whenever you handle pesticides or work around pesticide residues.","Select work clothes made of **tightly woven fabrics** to reduce pesticide penetration.","Make sure they are free of holes and tears.","**Fasten the shirt collar completely** to protect the lower part of your neck."]},{"p":["Do not use these work clothes for anything other than handling pesticides.","Store and launder fabric work clothing **separately from all other clothing** after each day's use.","See \"Maintaining Clothing and Personal Protective Equipment\" at the end of this chapter for details on cleaning and disposing of pesticide-soiled work clothes."]},{"box":"Good work practices: basic work clothes","list":["Always wear at a minimum a long-sleeved shirt and long pants.","Make sure work clothes are sufficiently durable.","Wash work clothes at the end of the day, separate from other clothing."]},{"h":"Coveralls"},{"p":["Some pesticide labels require **coveralls** (a second layer of clothing) over work clothes.","According to regulations, coveralls must be **loose-fitting**, one- or two-piece garments that cover the **entire body except head, hands, and feet**.","A coverall can be made of woven (like cotton or twill) or nonwoven fabrics.","It should be either easy to clean and sturdy enough for laundering and repeated use, or disposable."]},{"p":["Wearing a disposable coverall reduces decontamination time and lowers the risk of contaminating yourself, your application equipment, and your vehicle.","Disposable coveralls **differ in their level of protection**.","**Most importantly**, wearing coveralls lessens the chance that you will **take pesticides home**.","Handle disposable coveralls carefully so as to not contaminate other people."]},{"p":["Very few pesticides require a chemical-resistant coverall.","If one is required, work with your PPE supplier to find a coverall that provides the necessary level of protection based on the tasks you perform, the product formulation, and exposure."]},{"fig":"p92-coverall"},{"box":"Good work practices: coveralls","list":["Make sure the coverall is durable and does not rip, tear, or puncture easily.","Wash before reuse. Do not wash with other laundry.","Protect from excess heat (conditioning, hydration, and cooling) when wearing additional layers of clothing."]}],"figures":[{"id":"p92-coverall","title":"A well-designed coverall makes it hard for pesticides to get through to your inner clothing or skin.","page":"p. 92","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPD ly woven fabric reduces pesticide penetration."},{"id":"c06-s06-t2","src":"test","kind":"mc","q":"Your pesticide work pants look clean, and you want to wear them to help a friend move on Saturday. What does the manual say?","choices":["Fine, if they look clean","Do not use these work clothes for anything other than handling pesticides","Fine, after one rinse","Fine, if you wear coveralls over them"],"answer":1,"ref":"p. 92, 'Work Clothing'","why":"Work clothes are for handling pesticides only.","style":"scenario"},{"id":"c06-s06-t3","src":"test","kind":"mc","q":"By regulation, coveralls must cover the entire body except:","choices":["Head, hands, and feet","Arms and legs","Neck and face only","Nothing. They cover everything."],"answer":0,"ref":"p. 92, 'Coveralls'","why":"Coveralls are loose-fitting and cover all but head, hands, and feet."},{"id":"c06-s06-t4","src":"test","kind":"mc","q":"According to the manual, the most important benefit of wearing coveralls is that it:","choices":["Keeps work clothes looking clean","Lessens the chance that you will take pesticides home","Replaces the need for gloves","Lets you skip the shower at the end of the day"],"answer":1,"ref":"p. 92, 'Coveralls'","why":"Most importantly, coveralls lessen the chance you take pesticides home."},{"id":"c06-s06-t5","src":"test","kind":"mc","q":"Which statement about disposable coveralls is NOT true?","choices":["They reduce decontamination time","They lower the risk of contaminating your equipment and vehicle","They must be handled carefully so you do not contaminate other people","They all give the same level of protection"],"answer":3,"ref":"p. 92, 'Coveralls'","why":"Disposable coveralls differ in their level of protection.","style":"not"}]},{"id":"c06-s07","chapter":"Chapter 6 · Personal Protective Equipment","title":"Aprons, headgear, and footwear","pages":[93,93],"body":[{"h":"Apron for mixing"},{"p":["Some pesticide labels require you to wear a **chemical-resistant apron** when **mixing or loading** a pesticide, or when **cleaning application equipment**.","Select aprons that cover the front of your body **from the middle of the chest to the knees**."]},{"fig":"p93-apron"},{"h":"Headgear for overhead applications"},{"p":["If an overhead application may result in exposure, a pesticide label may require **chemical-resistant headgear**.","This headgear must protect against sprays so that no liquid breaks through the hat or hood.","You may use either a **chemical-resistant hat with a wide brim** or a **hood**.","Hoods attached to jackets or suits protect your **neck and back** from pesticide sprays that might otherwise run down your back.","Wash headgear at the end of the day.","When making overhead applications, **do not use headgear made of absorbent material**, such as cotton, leather, or straw."]},{"box":"Good work practices: headgear for overhead exposures","list":["**Cotton ball caps absorb pesticides.** Do not wear them if overhead exposure is a concern."]},{"h":"Footwear"},{"p":["Many pesticide labels require you to wear shoes and socks.","Make sure the shoes have closed toes.","However, some product labels require you to wear **chemical-resistant footwear**.","A heavy-duty pair of **unlined rubber boots** or shoe covers provides protection from pesticides.","Wash them **inside and out** at the end of the day."]},{"p":["**Leather and canvas absorb pesticides and cannot be decontaminated.**","Regulations allow you to substitute leather for chemical-resistant boots **only** when the chemical-resistant footwear required by the pesticide label is **not durable enough for use in rough terrain**.","Do not use these boots for other purposes."]},{"fig":"p93-nocotton"},{"box":"Good work practices: footwear","list":["Never wear open-toed shoes or sandals when applying pesticides.","Wear heavy-duty rubber boots that extend **past your ankle and at least halfway up to your knee** if you will enter or walk through treated areas before spray has dried.","Put your **pant legs outside your boots** to prevent pesticides from running down your legs and becoming trapped in your footwear.","Do not use footwear used for applying pesticides for anything else.","Do not wear work footwear home."]}],"figures":[{"id":"p93-apron","title":"Choose a chemical-resistant apron that extends from your neck to at least your knees.","page":"p. 93","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGDAVADASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAem8tnbV2Dby8zmPI+c1PIzWZEbTEG8ywNpgDesQb3zg6EuajpnMZ0jm2G51WEjm1nXXJDrvjh2Djh2DjB2lxg7WzzOw6nQ53Q6au43Y4knKQYgDFn00kbmxzrsKgYhoAYgAHIT20EJ0VF0KrRAAgAAAATQWQtTp7+d2um3wvQedk54PEQwVV1ZMaFZGRWSBDCLYJSBAGmmuwrruzkNEZASQhghZjSYw1rKGq/FtTr9jndDpt+a9J5fMzpGZITHVOsuQEmmQaYAhiBoABkb6ZBXKApXVDQDrrpHEKBNABbduLbJ0u5yur02ec9F47Mvy1vMucLSMYMsHWWhWN1SJhYQvrrL55kb6s6JqrQJyiaqrsxRk7fNMQigAAAALd+DfJ2t/O6nTdfkfX+RzIOSzIFkSqQFc6bzc6mPPdEiJF+doUkD6uH0VuOG91jo6YcrD6PhRksocmevoYy3NbEjDodCvPOyBbuxb46/S52/pqvyPqfL4zByURYiIwVkEXlFhMQNKJMoiaXDoG/ZRbuzg0E4NXyenxpMLRmTiTMyUSGnNJOhzgW7oc/oHc2ZNXTWTyvpPMYzPRmtjTCLNBUF0IozbM7LnBE5QRY4BV2eX0rbdGHVVjRUogtfn+zwcyFme+QlWxZNWUmhkVOKX9HndJexsp0dNcnzfovOYyrqdMTshcCYRUwoLUDgyUZoTUizdl02x1Z9VTHGnGQYPP93hYlejPYW6KbC3ldflBKIgpRXR0ef0j0U6rOmuJ5/tcLnmevFpLLs+gGwUZRE4sYmQkBKIGu2uVtuzn9CrFFVOt1Rz+T1OXmUAjVdn1k8GjETraRia6ejzukehYdNeb43U5nPLvo0k7oSCamKOVmhABZAQrSLtCxTjbZvzaqaFbLPdlkzcbt8XLOCTRbitNWHdlKwEYg3dDn9Re0SOmvIYtmbnk25kdCmXNNlS2GRdSkyG2JjjfAzzrZs057zVCyq3bprsoG7ctE55lXG73KOZDbXJlL0VBMipQGDTX1uT2F7AR6a8hnsp55k4yIDSSElk4CdDCksiLOnbtz20vHukuhMt6TSqcSlaNGe+Svl9TmmKE4ZkrIRLFSqcSBocSLexx+vXarnRvXj6rIYzJ9PIZ67qQGCAAcRuM09Rh3826zdDDvgsp01sGWrLfnR6M+gr5nS50c6u2OZbaOsle3HCcoEloiHa43a06WXZh1fK1zjzz6HhKGqgIBoAAUkKcZnqOV1ORabcuuKN+HqVdCcbaM99MltpZVPM6 ":"Leather substitutes only when required chemical-resistant footwear cannot handle rough terrain."},{"id":"c06-s07-t4","src":"test","kind":"mc","q":"You must walk through a treated area before the spray has dried. How tall should your rubber boots be?","choices":["Ankle height is enough","Past your ankle and at least halfway up to your knee","Up to the hip","Height does not matter if they are rubber"],"answer":1,"ref":"p. 93, 'Good work practices: footwear'","why":"Past the ankle and at least halfway to the knee.","style":"scenario"},{"id":"c06-s07-t5","src":"test","kind":"mc","q":"Which of these is NOT a good work practice for footwear?","choices":["Never wear sandals when applying pesticides","Do not wear work footwear home","Wash rubber boots inside and out at the end of the day","Wear your spray boots for yard work on weekends to get more use from them"],"answer":3,"ref":"p. 93, 'Good work practices: footwear'","why":"Footwear used for applying pesticides is for nothing else.","style":"not"}]},{"id":"c06-s08","chapter":"Chapter 6 · Personal Protective Equipment","title":"Gloves: where the exposure is","pages":[94,94],"body":[{"h":"Gloves"},{"p":["Pesticide handlers get **by far the most exposure** from pesticides on their **hands and forearms**.","Research has shown that workers mixing pesticides received **85%** of the total exposure on their **hands** and **13%** on their **forearms** (see Figure 6.1).","The same study showed that wearing protective gloves **reduced exposure by 99%**.","Protective gloves are essential to dermal protection."]},{"fig":"fig-6-1"},{"p":["Pesticide labels often require **waterproof gloves** or one of the following glove types: **nitrile rubber, butyl rubber, neoprene rubber, barrier laminate, and Viton®**.","Each glove type varies significantly in how well it protects from the different solvents in formulated products.","For this reason, it is important to read each label to determine which glove type is appropriate.","The glove type varies from product to product, **even those with similar active ingredients**."]},{"box":"Follow the label carefully","p":["Know which particular gloves are required.","For most products, a waterproof glove is sufficient.","However, if the label requires a specific glove type and you wear the wrong one, the glove may degrade quickly from the solvents in the formulated product."]}],"figures":[{"id":"fig-6-1","title":"Figure 6.1: Farmers who wore gloves while applying pesticides reduced their risk of exposure (The Farm Family Exposure Study, John Acquavella).","page":"p. 94","explain":["The chart compares the amount of pesticide detected, in parts per billion, with gloves and without gloves, for glyphosate, chlorpyrifos, and 2,4-D.","For all three pesticides, the no-gloves bar is higher. The bar heights here are read off the manual's chart, which prints no exact values.","2,4-D uses a larger scale, up to 250, and shows the biggest gap."],"svg":"<svg viewBox=\"0 0 640 360\" role=\"img\" aria-label=\"Figure 6.1: bar chart of pesticide detected, with gloves and without gloves, for glyphosate, chlorpyrifos, and 2,4-D\"><g font-family=\"var(--f-display)\" font-weight=\"800\" font-size=\"17\" text-anchor=\"middle\"><text class=\"f-ink\" x=\"320\" y=\"22\">Added Protection from Exposure Provided by Wearing Gloves<\/text><\/g><g font-family=\"var(--f-body)\" font-size=\"13\"><rect class=\"f-field\" fill-opacity=\".3\" x=\"92\" y=\"56\" width=\"14\" height=\"14\"/><text class=\"f-ink\" x=\"112\" y=\"68\">gloves<\/text><rect class=\"f-field\" x=\"92\" y=\"78\" width=\"14\" height=\"14\"/><text class=\"f-ink\" x=\"112\" y=\"90\">no gloves<\/text><\/g><g class=\"s-muted\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M80 50 V270 H360\"/><path d=\"M440 50 V270 H560\"/><\/g><g class=\"s-muted\" stroke-width=\"1\" stroke-dasharray=\"3 4\" fill=\"none\" opacity=\".6\"><path d=\"M80 226 H360 M80 182 H360 M80 138 H360 M80 94 H360 M80 50 H360\"/><path d=\"M440 226 H560 M440 182 H560 M440 138 H560 M440 94 H560 M440 50 H560\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"12\" text-anchor=\"end\" class=\"f-muted\"><text x=\"74\" y=\"274\">0<\/text><text x=\"74\" y=\"230\">10<\/text><text x=\"74\" y=\"186\">20<\/text><text x=\"74\" y=\"142\">30<\/text><text x=\"74\" y=\"98\">40<\/text><text x=\"74\" y=\"54\">50<\/text><text x=\"434\" y=\"274\">0<\/text><text x=\"434\" y=\"230\">50<\/text><text x=\"434\" y=\"186\">100<\/text><text x=\"434\" y=\"142\">150<\/text><text x=\"434\" y=\"98\">200<\/text><text x=\"434\" y=\"54\">250<\/text><\/g><g><rect class=\"f-field\" fill-opacity=\".3\" x=\"110\" y=\"265.6\" width=\"36\" height=\"4.4\"/><rect class=\"f-field\" x=\"146\" y=\"226\" width=\"36\" height=\"44\"/><rect class=\"f-field\" fill-opacity=\".3\" x=\"230\" y=\"155.6\" width=\"36\" height=\"114.4\"/><rect class=\"f-field\" x=\"266\" y=\"98.4\" width=\"36\" height=\"171.6\"/><rect class=\"f-field\" fill-opacity=\".3\" x=\"462\" y=\"228.6\" width=\"36\" height=\"41.4\"/><rect class=\"f-field\" x=\"498\" y=\"63.2\" width=\"36\" height=\"206.8\"/><\/g><g font-family=\"var(--f-body)\" font-size=\"14\" text-anchor=\"middle\" class=\"f-ink\"><text x=\"146\" y=\"292\">glyphosate<\/text><text x=\"266\" y=\"292\">chlorpyrifos<\/text><text x=\"498\" y=\"292\">2,4-D<\/text><\/g><g font-family=\"var(--f-display)\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" class=\"f-ink\"><text x=\"320\" y=\"322\">Pesticide Type<\/text><text x=\"0\" y=\"0\" transform=\"translate(28 160) rotate(-90)\">Amount of Pesticide Detected (ppb)<\/text><\/g><g font-family=\"var(--f-body)\" font-size=\"12\" text-anchor=\"middle\" class=\"f-muted\"><text x=\"320\" y=\"348\">Left scale: 0 to 50 ppb. Right scale (2,4-D only): 0 to 250 ppb.<\/text><\/g><\/svg>"}],"questions":[{"id":"c06-s08-t1","src":"test","kind":"mc","q":"In the study the manual cites, workers mixing pesticides received what share of their total exposure on their hands?","choices":["13%","50%","85%","99%"],"answer":2,"ref":"p. 94, 'Gloves'","why":"85% on the hands, 13% on the forearms."},{"id":"c06-s08-t2","src":"test","kind":"mc","q":"Wearing protective gloves reduced exposure by how much in that study?","choices":["13%","50%","85%","99%"],"answer":3,"ref":"p. 94, 'Gloves'","why":"Gloves cut exposure by 99%."},{"id":"c06-s08-t3","src":"test","kind":"mc","q":"Which of these is NOT one of the glove types the manual lists that labels often require?","choices":["Nitrile rubber","Neoprene rubber","Viton®","Cotton"],"answer":3,"ref":"p. 94, 'Gloves'","why":"Listed: nitrile, butyl, neoprene, barrier laminate, and Viton®.","style":"not"},{"id":"c06-s08-t4","src":"test","kind":"tf","q":"Two products with similar active ingredients will always call for the same glove type.","answer":false,"ref":"p. 94, 'Gloves'","why":"Glove type varies from product to product, even with similar active ingredients."},{"id":"c06-s08-t5","src":"test","kind":"mc","q":"The label calls for butyl rubber gloves. You only have a different waterproof glove. What is the risk?","choices":["None, any waterproof glove works for every product","The wrong glove may degrade quickly from the solvents in the formulated product","The glove will be too thick to work in","Only a fine from the employer"],"answer":1,"ref":"p. 94, 'Follow the Label Carefully' box","why":"If the label names a glove type, the wrong one may break down fast.","style":"scenario"}]},{"id":"c06-s09","chapter":"Chapter 6 · Personal Protective Equipment","title":"Gloves: solvents, categories, and thickness","pages":[94,95],"body":[{"p":["**The solvent in a pesticide formulation determines the protective glove type.**","Pesticide labels require either **waterproof gloves** (for solid or water-based formulations) or **chemical-resistant gloves** for the various solvents (for example, alcohols, ketones, and petroleum distillates) used in different formulations.","For liquid products with a solvent other than water, EPA requires the label to specify particular glove materials that provide protection.","Note that labels that have not been recently updated may still refer to a **solvent category (A through H)** in the EPA Chemical Resistance Category Selection Chart for Gloves."]},{"box":"Reference chart for gloves (two or more hours contact)","list":["Category A: Any waterproof material.","Category B: ONLY butyl rubber or barrier laminate.","Category C: Butyl rubber, nitrile, neoprene, polyvinyl chloride, barrier laminate, or Viton®.","Category D: ONLY butyl rubber or barrier laminate.","Category E: Nitrile, neoprene, barrier laminate, or Viton®.","Category F: Butyl rubber, nitrile, barrier laminate, or Viton®.","Category G: ONLY barrier laminate or Viton®.","Category H: ONLY barrier laminate or Viton®."]},{"p":["Read the label carefully to make sure you have the correct protective glove material.","Explain to your supplier which glove types you need."]},{"p":["Some pesticide labels specify both the glove material and its thickness.","As a general rule, **the thicker the glove** (of the same material under identical conditions), **the longer the breakthrough time**.","A pesticide label's specification of glove type is generally based upon a thickness of **14 mils**, except for polyethylene and barrier laminate gloves.","Use the 14 mils thickness as a rule of thumb when selecting glove materials that appear on the pesticide label."]},{"p":["Glove durability is another important consideration.","Select a glove that is protective, does not tear or puncture easily, and protects you for the duration of the task.","Discard the gloves if there is any sign of wear or if the gloves leak."]}],"questions":[{"id":"c06-s09-r2","src":"review","kind":"mc","q":"Which part of the product formulation determines what glove type is needed?","choices":["Active ingredient.","Surfactants.","Solvents."],"answer":2,"ref":"p. 94, 'Gloves'","why":"The solvent in a formulation determines the protective glove type."},{"id":"c06-s09-t1","src":"test","kind":"mc","q":"For solid or water-based formulations, labels require:","choices":["Waterproof gloves","Only barrier laminate gloves","Leather gloves","No gloves"],"answer":0,"ref":"p. 94, 'Gloves'","why":"Solid or water-based: waterproof gloves. Other solvents: chemical-resistant gloves."},{"id":"c06-s09-t2","src":"test","kind":"mc","q":"An older label says to use gloves from Category A. What does that allow?","choices":["Only butyl rubber or barrier laminate","Any waterproof material","Only barrier laminate or Viton®","Only nitrile"],"answer":1,"ref":"p. 94, 'Reference Chart for Gloves'","why":"Category A means any waterproof material.","style":"scenario"},{"id":"c06-s09-t3","src":"test","kind":"mc","q":"A label's glove specification is generally based on what thickness?","choices":["4 mils","8 mils","14 mils","40 mils"],"answer":2,"ref":"p. 94, 'Gloves'","why":"14 mils, except polyethylene and barrier laminate gloves."},{"id":"c06-s09-t4","src":"test","kind":"tf","q":"For the same material under identical conditions, a thicker glove has a longer breakthrough time.","answer":true,"ref":"p. 94, 'Gloves'","why":"Thicker glove, longer breakthrough time."},{"id":"c06-s09-t5","src":"test","kind":"mc","q":"Which of these is NOT given as an example of a solvent that calls for chemical-resistant gloves?","choices":["Alcohols","Ketones","Petroleum distillates","Water"],"answer":3,"ref":"p. 94, 'Gloves'","why":"Water-based formulations need only waterproof gloves.","style":"not"}]},{"id":"c06-s10","chapter":"Chapter 6 · Personal Protective Equipment","title":"Gloves: what to avoid, fit, and good practices","pages":[95,95],"body":[{"p":["Do not use gloves made of any kind of **absorbent material, lining, or flocking**, including **leather or cloth** (exception: **cloth gloves are used with fumigants**).","These types of gloves absorb pesticide and trap it closely against your bare skin, greatly increasing skin absorption."]},{"p":["Choose a glove size that fits you comfortably.","Gloves that fit well provide increased dexterity for equipment maintenance or calibration.","Gloves that are **too tight** stretch the material, allowing pesticides to break through.","Gloves that are **too large** can get caught in equipment.","And gloves that are **too loose** may allow pesticides to run down the inside and be directly absorbed by your skin."]},{"p":["Select gloves designed to give you extra protection when needed for the job, such as **elbow-length gloves when mixing and loading**.","Wear gloves according to how you are applying the pesticide.","**Do not use a glove beyond the breakthrough time.**"]},{"p":["When using reusable gloves, **rinse them at each break** and **wash them thoroughly at the end of the workday**.","Absorbed pesticides will continue to permeate the material if not cleaned.","Make sure your gloves are in top condition.","Throw out any gloves showing wear.","Check glove integrity before each use.","Rinse disposable gloves before discarding them."]},{"fig":"p94-gloves"},{"box":"Good work practices: gloves","list":["Wear waterproof or chemical-resistant gloves when applying pesticides. Although pesticide labels do not always specifically require gloves, wearing them reduces your exposure (exception: when handling **fumigants**).","Check gloves closely for holes by **filling the gloves with clean water and gently squeezing**. Discard them if you find any leakage.","Wear gloves whenever you might get pesticides or residue on your hands, such as when cleaning sprayer nozzles or working around contaminated equipment or surfaces.","Wear gloves according to the type of arm movements you make when handling pesticides (see Figure 6.2).","Wash your gloves before taking them off between tasks.","If pesticide is spilled, splashed, or gets inside your gloves, take them off immediately. Wash your hands and put on a clean pair of gloves.","Replace your gloves immediately if they get cut, torn, or damaged.","If making several applications during the day, change out gloves between jobs to avoid contaminating yourself and your vehicle.","Rinse and slash used gloves before discarding."]},{"fig":"p95-fig62"}],"figures":[{"id":"p94-gloves","title":"Nitrile and butyl rubber gloves.","page":"p. 94","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGoAhYDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECBAUDBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAVu4m0gBqoRTRGHyz6OZcpW+0lXvItCLtaBBxYwACJJIAENxY0AAAAIAALeFe8SU78K8bEvPW61lDpqgMTTAAIyjSaDoAIcRg6AAAKGtmanOIFaJY8lzJ6W8zj2C0Uo2ikkQwQAAxEmQUkIkhKSE0wBiBggAAQACLWJhw7kZ1vryk0+nnr1agnqiaCLQpRlUxA4iJNOgAADherWecOSwiXScspAaomkYmDQNMIjYCkoAJSSCYKPREFKIPzoeiIyCmYR6Dr5wPSmLfLRy71FtACUE0OHdxR1qtOPQLI1tCMlapKVMaCMokmimDEASJYPKRt5vKNnnTddrGQzWOIPrjzNdc+lrK1RNSk6MR7cJG3X40a7280jdXPpTp2fKHoo+e3DCGo2NPz3oKxs29RGCJdOMo6+j8x6SuqFTFyWpXoOT0fTM06Q6iy5c7uZo9PPbFWJRluyECEibRTAAYZao3eGc9d+NsCXI7RALNUBpktHLnXGUSJIBTjKnCSBoNC1Q0Kq+b9J50hp5ds4QsV4fpfM7RRpXKYAUxMNrF6x6aEo1DNu4xXYGvqeagb2ARJ62RsF6hoI63vO6pfTN2KYNgAFMQeaSOM6wgE4zRDpzmRU4kJwR1jJVFSiDYRmgEwEB21cXqXsHazazHFxdpduI7dRlqn15iApiBpqN25h7tU8LUzBxcQTAkmHpMjcIszat0soy9jc8vv13Te6wAApiDzS7cuMjDpEmc2Pn0iMiwjJkhMEyoMYgiSaBDiMYLry7mIu/EYAKSIjBDVAME0T9H5m4KrFgAIAkjsbFmNQWOBJFw1eGhXjWli7WzYao0wAMqhqV+UoJEKcGMYDTBSREaBhSTBDQxACZJALty6HLL38U5ADExDZFSQlJUCABDaYgQMQa2XtjxXzCSR09FWvAVs6rmplrL0ajLpRooAKNS5V5M9xJJpANInFgODGgGgoAENBFoJRkMQE4BeydbOM0AAKYiJJFAAIAAAAEMQwJRBNA9CptnehVokmBY1uOgPS876CpAboAUoyXNlctPNhCJGxiJRAjIAAaKaGJNDTZBsFJAlJF6pa4GKpRE0wEUAxDBAAANACGAAACaDVp1wJJwapqUNFtPRrcZN4RusRVOMjmjSuhjFmvmJgJSQm0AMQFAAJgCYxACBoRajX7GMnEAKaAGIYgAATBMBMABDEwTBNziOr00KQ1aABQvUpN7pTu7qGVTEcyAI5mryjLGpBMENkWAhlIYIARJAIAYJOJBx4FdBQADTBNA0wQAmAAIGJoGIHJaRW2e3RYtqkMEMI1rXBO+ph7YxG7TTOZIYJooVtPKkk0Q0IYAAqYgYgAYRYAgIyiQrWaxXAoAAAAAEwAAAAAAB test","kind":"mc","q":"Which of these is NOT correct glove care?","choices":["Check glove integrity before each use","Throw out gloves showing wear","Rinse disposable gloves before discarding them","Keep using a glove past its breakthrough time if it looks fine"],"answer":3,"ref":"p. 95, 'Gloves'","why":"Do not use a glove beyond the breakthrough time.","style":"not"},{"id":"c06-s10-t4","src":"test","kind":"mc","q":"How does the manual say to check gloves for holes?","choices":["Hold them up to a light","Fill them with clean water and gently squeeze","Blow into them","Soak them in detergent overnight"],"answer":1,"ref":"p. 95, 'Good work practices: gloves'","why":"Fill with clean water and squeeze. Any leak means discard."},{"id":"c06-s10-t5","src":"test","kind":"mc","q":"You are spraying above your head. How should you wear your gloves?","choices":["Sleeves over gloves","Gloves outside your sleeves, with the cuff folded up 1 or 2 inches","No gloves, so you can grip better","Gloves inside the sleeves, taped shut"],"answer":1,"ref":"p. 95, Figure 6.2","why":"Overhead: gloves outside sleeves, cuff folded up 1 or 2 inches, so spray cannot run down your arm.","style":"scenario"}]},{"id":"c06-s11","chapter":"Chapter 6 · Personal Protective Equipment","title":"Protect your eyes","pages":[95,96],"body":[{"h":"Protect your eyes"},{"p":["**Eyes readily absorb pesticides.**","When a label says to wear protective eyewear, you may use **goggles; a face shield; safety glasses with shields at the front, brow, and temple; or a full-face respirator**.","Use common sense and select eyewear that protects you for the task at hand.","Eyewear made of impact-resistant material, such as **polycarbonate**, can protect you from flying objects, such as granular pesticides.","However, **safety glasses will not protect your eyes from pesticide splashes**."]},{"p":["Products that are corrosive to the eyes (for example, those with the signal word Danger) require a particular type of eyewear.","For example, goggles may be required when your eyes may be exposed to liquids or particulates during a certain application or use.","Wear **tightly fitting goggles** when you are in high-exposure situations, such as an **open cab during an air-blast application**; applying **mists, fogs, or aerosols indoors**; or in any other location where you will be enveloped in a spray, mist, or dust.","Make sure goggles are splash- and spray-proof and have an **air baffle system** for airflow and **no side vents**.","If fogging is a problem, use anti-fog lens treatments or purchase low-fog goggles."]},{"fig":"p95-goggles"},{"p":["If your eyewear has a headband that is made of pesticide-absorbent material, **change it often or use a rubber strap**.","If possible, wear the strap under your hat or hood to protect it from becoming contaminated.","Protective eyewear can be worn with a half-face respirator.","If you wear eyeglasses, you can buy an eyeglass insert for your full-face respirator that is fitted with your prescription.","People who wear **contact lenses** should consult an eye doctor or their medical professional before using pesticides or wearing respirators."]},{"box":"Good work practices: eyewear","list":["**Minimum eyewear** is safety glasses with shields at the front, brow, and temple.","If goggles are required, have an **eyewash dispenser** immediately available.","Consult an eye doctor if you wear contact lenses."]}],"figures":[{"id":"p95-goggles","title":"Tight-fitting goggles help protect your eyes from pesticide exposure.","page":"p. 95","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAEjAaQDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAHSC7VgDQAIpgxAxAyIZo0nMok7a4MY7kOPI6ccCN5hDfLmo69nDgeiXn513XxtFdApvtAVAAxFRnG f":"p. 96, 'Good work practices: eyewear'","why":"Goggles required means an eyewash dispenser on hand."},{"id":"c06-s11-t5","src":"test","kind":"mc","q":"What is the minimum eyewear according to the good work practices?","choices":["Safety glasses with shields at the front, brow, and temple","Goggles","A face shield","A full-face respirator"],"answer":0,"ref":"p. 96, 'Good work practices: eyewear'","why":"Minimum is safety glasses with front, brow, and temple shields."}]},{"id":"c06-s12","chapter":"Chapter 6 · Personal Protective Equipment","title":"Respirators and NIOSH approval","pages":[96,97],"body":[{"h":"Protect your respiratory system"},{"p":["When you use pesticides, you may be exposed to toxic gases, vapors, particulates (solids or liquids), or all of these.","A **respirator** is a safety device that protects you from inhaling contaminated air.","The pesticide label states whether you must use a respirator and, if so, which type.","The respirator type is based on the **pesticide formulation, application method, and environment** where the application is made."]},{"p":["The **National Institute for Occupational Safety and Health (NIOSH)** certifies that respirators have been tested according to certain standards.","The NIOSH approval of a respirator indicates that it protects the wearer against specified contaminants.","All respirator manufacturers issue **approval certificates** with a chart of all of the components considered part of the approved assembly.","Respirator approvals are **manufacturer-specific**: do not interchange parts, cartridges, or filters between different manufacturers' units.","These certificates are typically package inserts with new respirators, cartridges, and filters.","Find out if there are federal, state, tribal, or territorial health and safety regulations that stipulate proper respirator selection, care, and use."]},{"box":"Types of respirators","list":["**Atmosphere-supplying respirators:** supplied-air respirator, and self-contained breathing apparatus (SCBA).","**Air-purifying respirators:** non-powered particulate respirators, powered air-purifying respirators (PAPR), chemical cartridge respirators (half facemask and full facemask), and gas masks with canisters."]},{"p":["There are other respirators on the market that are **not NIOSH-approved**, such as **nuisance dust masks and some surgical masks**.","When a respirator is required for working with pesticides, wear a **NIOSH-approved device that is listed on the label**."]}],"questions":[{"id":"c06-s12-t1","src":"test","kind":"mc","q":"What does NIOSH stand for?","choices":["National Institute for Occupational Safety and Health","National Inspection Office for Safety Hazards","Northern Institute of Safety and Health","National Institute of Spraying Hygiene"],"answer":0,"ref":"p. 96, 'Protect Your Respiratory System'","why":"NIOSH certifies respirators."},{"id":"c06-s12-t2","src":"test","kind":"mc","q":"Your respirator is brand X. Brand Y cartridges fit the threads perfectly and are cheaper. What does the manual say?","choices":["Use them if they fit","Do not interchange parts, cartridges, or filters between manufacturers. Approvals are manufacturer-specific.","Use them only for dry formulations","Use them if the label allows organic vapor cartridges"],"answer":1,"ref":"p. 96, 'Protect Your Respiratory System'","why":"NIOSH approvals cover one manufacturer's whole assembly.","style":"scenario"},{"id":"c06-s12-t3","src":"test","kind":"mc","q":"Which of these is NOT something the respirator type is based on?","choices":["The pesticide formulation","The application method","The environment where the application is made","The price of the respirator"],"answer":3,"ref":"p. 96, 'Protect Your Respiratory System'","why":"Formulation, application method, and environment decide the type.","style":"not"},{"id":"c06-s12-t4","src":"test","kind":"tf","q":"A nuisance dust mask is acceptable when a label requires a respirator.","answer":false,"ref":"p. 97, 'Protect Your Respiratory System'","why":"Dust masks are not NIOSH-approved. Use a NIOSH-approved device listed on the label."},{"id":"c06-s12-t5","src":"test","kind":"mc","q":"Where are respirator approval certificates usually found?","choices":["On the pesticide label","As package inserts with new respirators, cartridges, and filters","Only on the NIOSH website","From the state agency on request"],"answer":1,"ref":"p. 96, 'Protect Your Respiratory System'","why":"Certificates are typically package inserts."}]},{"id":"c06-s13","chapter":"Chapter 6 · Personal Protective Equipment","title":"Types of respirators","pages":[97,97],"body":[{"h":"Types of respirators"},{"p":["The two classes of respirators most often required for protection from pesticide exposure are **atmosphere-supplying** and **air-purifying** respirators."]},{"p":["**Atmosphere-supplying respirators** provide clean, breathable air from an uncontaminated source.","Examples are airline respirators and self-contained breathing apparatus.","In very specific uses, such as using **phosphide fumigants in enclosed areas**, the environment may be **immediately dangerous to life and health**.","In these cases, the only kind of atmosphere-supplying respirators that may be used are either a **pressure-demand self-contained breathing apparatus (SCBA) with a full facepiece** or a **pressure-demand full facepiece air-line respirator with an SCBA escape bottle** for emergencies."]},{"gallery":["p96-scba","p96-suppliedair"]},{"p":["**Air-purifying respirators (APRs)** remove contaminants from the air that you breathe.","These respirators **do not supply oxygen** and should never be used in an environment that has limited oxygen or is immediately dangerous to life or health.","Air-purifying respirators may be either powered or nonpowered."]},{"list":["**Powered air-purifying respirators (PAPRs)** use a **blower** to pass contaminated air through purifying elements. PAPRs are available with a tight-fitting facepiece or a loose-fitting hood.","**Nonpowered air-purifying respirators** have tight-fitting facepieces that seal directly to your face. There are single-use particulate-filtering facepiece respirators, and half-masks and full facepiece masks with replaceable purifying elements.","**Gas masks**, which use **canisters instead of cartridges**, are one type of APR."]}],"figures":[{"id":"p96-scba","title":"Self-contained breathing apparatus (SCBA).","page":"p. 96","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGJAMkDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwUEBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH0BF0xAAhiYCBiBpMBFMQNAAADQkwakoUosaAGkNACcSQY8ndw8ksZ6LeJxsdHndzpq8DVAQCCaiRIjIYkSIgxA0I5Mnoo54AWYwAsrrX0pXZ32AERhIZCGCUggSCBYiBPmMWXBRzzrLIDWMmRpx5JSb2h4z0fTWgEdUSC4CAAAABAmghNnnsv0vnMyR6DzR13RlmK/k7qz/UYG/bOLN2tyCZEhiBiRIiEkgkkzPw9jkk6tPyXavbyToxnu5a1J1aeLrbvYI3piBiUSEDQAAC4POHr34brjes4uyReW9nTb5rSccYpV0suTqU9N0DrsEE0yEPlHmZy540p5XGq64el1cnN9UR471Gfn16O+vlHUySFVnDmX6XmbN69oRlugBMZCwt7zcnI658sKM9rWpWyVIAXmPT4NvRrYW8Z0u7mO3Hircg7bz0NgaDQWA4PK+q8lEe3i7yfZT0yNNQAkfn9/wA1bbp1cpuQhdJjJ8eru1aGfbrpuoqSLgIPH+w8ZF2hwd50X03ZgAEZc6X+U2/O2+hh3hGurQTzvL1+tt5efl2tVgAgLBkR8b6/wsaXXhaxtNPMAEWZ2+YtjGXoTl66cg0Ojzszq1sn2dvF2BoJoEwtAijw30Dx0c3os3bk5rnVHQU0pz4HVRbtdHUyFoRVz9tFUbcZbqjJAgBAWjIXj/Y+Ojq2cjXkQEhj7HCeb18neutICRiB021VqRZuxGgQCALXFweP9h46OzX83pSaQEACZOlT1rw9dBXQDiMZqu5o3SMoiAAAuAg8T7XBPPWThl6mzk7JEmHH5/1eJWTKNtsOzjibpg+mNkRoJxAAAC2MiI4e95wxNrL9NmW83RTE6leQV3Ocbu6KyOzvDM2ua6ugDVEwiAJgWjIMDeZ5nYDME1HOdHMXU9DK+fryU1HiapZNGr2gapGSENAmi9NQAzOlCeIJoARz9GVxJoZ48ZQ6K9NPG2em+wFqtIGJiGi1RImRRn20W4kkBW8Lmrs5Yo6Coxm2sVX+i89o73tLhv0ujOIwAQFkk4IyZk3V2Zg0481TZXqgA2tgxi2oYgfbw6Z6NOOgIGgLiMoEIzrK55jEo8wWQ1UIDUywsggYmGvkbhsxmtKySENF4iGBWPboU5c8pRQSjBVYiivrmZlG3SZcfUy1fIberEAjTQhiCcghNhEFQ0 ],"answer":1,"ref":"p. 97, 'Types of Respirators'","why":"In conditions immediately dangerous to life and health, only those two atmosphere-supplying options may be used.","style":"scenario"},{"id":"c06-s13-t2","src":"test","kind":"tf","q":"Air-purifying respirators supply oxygen, so they are safe in low-oxygen spaces.","answer":false,"ref":"p. 97, 'Types of Respirators'","why":"APRs do not supply oxygen. Never use them where oxygen is limited."},{"id":"c06-s13-t3","src":"test","kind":"mc","q":"Which of these is NOT an air-purifying respirator?","choices":["Powered air-purifying respirator (PAPR)","Chemical cartridge half-mask","Gas mask with canister","Self-contained breathing apparatus (SCBA)"],"answer":3,"ref":"p. 96-97, 'Types of Respirators'","why":"SCBA supplies its own air. It is atmosphere-supplying.","style":"not"},{"id":"c06-s13-t4","src":"test","kind":"mc","q":"What makes a PAPR \"powered\"?","choices":["A battery-heated facepiece","A blower that passes contaminated air through purifying elements","A compressed oxygen tank","An electric filter that destroys pesticide"],"answer":1,"ref":"p. 97, 'Types of Respirators'","why":"A blower moves air through the purifying elements."},{"id":"c06-s13-t5","src":"test","kind":"mc","q":"Gas masks are a type of APR that use:","choices":["Canisters instead of cartridges","Compressed air","Cloth filters only","No purifying element"],"answer":0,"ref":"p. 97, 'Types of Respirators'","why":"Gas masks use canisters instead of cartridges."}]},{"id":"c06-s14","chapter":"Chapter 6 · Personal Protective Equipment","title":"Particulate filters: HE, N, R, and P","pages":[97,98],"body":[{"h":"Purifying elements for air-purifying respirators"},{"p":["When selected and used appropriately, purifying elements for air-purifying respirators remove specific contaminants from the air passing through them.","The pesticide label specifies which type of purifying element is required.","Elements that remove particulates (for example, dusts or sprays) are called **filters**, while vapor- and gas-removing elements are called either **chemical cartridges** or **chemical canisters**."]},{"h":"Particulate filters"},{"p":["Particulate filters remove dusts, aerosols, or sprays suspended in the air that you breathe.","Particulate filters **DO NOT remove gases or vapors**.","The type of filter required on the pesticide label depends on whether the respirator is powered or nonpowered."]},{"list":["**PAPR particulate filters** are rated **\"High Efficiency.\"** When a PAPR with a particulate filter is required, the pesticide label will specify this by the acronym **\"HE.\"**","**Nonpowered APR particulate filters** are NIOSH-rated for three levels of oil degradation resistance (**N, R, and P**) and three levels of filter efficiency (**95, 99, and 100**). A higher efficiency rating means lower filter leakage."]},{"box":"Oil ratings","list":["**N**-series filters are **not oil-resistant**.","**R**-series filters are **oil-resistant for up to eight hours**.","**P**-series filters are **oil-proof**."]},{"p":["For a nonpowered APR, the pesticide label specifies an N, R, or P filter to be used with your respirator.","N-series filters must not be used with pesticide mixes that contain oil because the filter's efficiency may become degraded with use and fail to protect you.","If you add an **adjuvant** to a tank mix, **do not use an N-series filter**, as the adjuvant may either contain oil or act like an oil.","The pesticide label may also specify the filter efficiency (95, 99, or 100) needed.","For example, if the pesticide label specified a filter efficiency of 100 for all three oil degradation ratings, you could select an N100, R100, or P100 filter.","The class of the filter (such as N95) will be clearly marked on the filter, filter package, or respirator box."]},{"fig":"p98-papr"}],"figures":[{"id":"p98-papr","title":"Powered air-purifying respirator (PAPR) with particulate filter (TC-21C).","page":"p. 98","img":"data: "choices":["N-series","R-series","P-series","HE"],"answer":0,"ref":"p. 98, 'Particulate Filters'","why":"An adjuvant may contain oil or act like an oil, so no N-series.","style":"scenario"},{"id":"c06-s14-t4","src":"test","kind":"tf","q":"Particulate filters remove gases and vapors as well as dusts and sprays.","answer":false,"ref":"p. 97, 'Particulate Filters'","why":"Particulate filters DO NOT remove gases or vapors."},{"id":"c06-s14-t5","src":"test","kind":"mc","q":"Which of these is NOT one of the three NIOSH filter efficiency levels for nonpowered APR filters?","choices":["95","99","100","50"],"answer":3,"ref":"p. 97, 'Particulate Filters'","why":"The levels are 95, 99, and 100. A higher rating means lower filter leakage.","style":"not"}]},{"id":"c06-s15","chapter":"Chapter 6 · Personal Protective Equipment","title":"Changing filters, and chemical cartridges","pages":[98,98],"body":[{"h":"When to change particulate filters"},{"p":["Always change particulate filters (HE, N, R, and P) for PAPR or nonpowered APR respirators whenever they are **damaged, torn, soiled, or it becomes too difficult to breathe**.","As you use a particulate filter, pesticides load on its surface.","Use caution when handling soiled filters.","Once a particulate filter becomes dirty, **it cannot be cleaned**.","To avoid spreading pesticide contamination to you or your respirator, discard particulate filters when they become soiled.","EPA regulations require that you replace particulate filters according to respirator manufacturer recommendations or pesticide labeling (**whichever is more frequent**).","If there are no other use directions, dispose of particulate filters at the end of **eight hours of cumulative use**."]},{"h":"Chemical cartridges or canisters"},{"p":["Chemical cartridges or canisters use **sorbents** to remove contaminant-specific gases and vapors.","**They do not remove particulates!**","The most typical chemical cartridge or canister specified by the label for pesticide applications is an **organic vapor removing (OV)** cartridge or canister.","Always use the type of chemical cartridge or canister purifying element required by the pesticide label!","Keep purifying elements sealed until ready to use.","Although it is not a requirement, some respirator manufacturers stamp the expiration date of purifying elements on the outside of the product package.","Do not use a purifying element after the expiration date, **even if it was never opened**.","The service life of a chemical cartridge or canister depends on the **type and concentration of pesticide, the user's breathing rate, and humidity**."]},{"p":["Chemical cartridge respirators, when selected appropriately, are essentially 100% efficient until the gas or vapor breaks through.","**Any taste, smell, or irritation indicates that breakthrough of the pesticide has occurred.**","Cartridges should be changed immediately whenever you detect breakthrough in the mask.","And once used, an organic vapor cartridge must be **disposed of at the end of the day**.","The pesticide trapped by the sorbent in the cartridge may **desorb** very easily overnight.","If you were to use the cartridge the next day, you could breathe in the desorbed pesticide vapors.","Always dispose of chemical cartridges at the end of a workday unless the manufacturer directs otherwise."]},{"box":"Good working practice","p":["Make sure that the respirator protects you for the duration of use.","Replace cartridges if necessary.","Always dispose of chemical cartridges at the end of the workday unless the manufacturer directs otherwise and as allowed by state, tribe, or territory regulations."]},{"gallery":["p98-halfface","p98-gasmask"]}],"figures":[{"id":"p98-halfface","title":"Half face mask chemical cartridge and particulate filter (TC-84A).","page":"p. 98","explain":["The labels point to the OV cartridge and the particulate filter on the side of the mask."],"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAk
