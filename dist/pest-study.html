"ref":"p. 41, 'Restricted-Entry Intervals'","why":"When pesticides are mixed, follow the most restrictive, or longer, REI.","style":"scenario","src":"test"},{"id":"c03-s16-t3","kind":"mc","q":"A label has no REI or other restricted-entry statement. How long should people wait before reentering the treated area?","choices":["No wait is needed","At least until sprays have dried or dusts have settled","At least 12 hours","At least 48 hours"],"answer":1,"ref":"p. 41, 'Restricted-Entry Intervals'","why":"With no REI, wait at least until sprays have dried or dusts have settled.","src":"test"},{"id":"c03-s16-t4","kind":"mc","q":"Which of these sites is NOT covered by the Nonagricultural Use Requirements section?","choices":["Golf courses","Rights-of-way","Greenhouses","Aquatic areas"],"answer":2,"ref":"p. 41, 'Nonagricultural Use Requirements'","why":"Greenhouses are excluded from structures here because they fall under the WPS.","style":"not","src":"test"},{"id":"c03-s16-t5","kind":"tf","q":"If a label lists multiple REIs, you should look in the Directions for Use section for each crop.","answer":true,"ref":"p. 41, 'Restricted-Entry Intervals'","why":"Multiple REIs are explained crop by crop in Directions for Use.","src":"test"}]},{"id":"c03-s17","chapter":"Chapter 3 · Pesticide Labeling","title":"Storage and disposal, and directions for use","pages":[41,41],"body":[{"h":"Storage and disposal"},{"p":["All pesticide labels contain instructions for the appropriate storage and disposal of the pesticide, its **rinsate**, and its container.","State and local laws may vary considerably, so specific instructions usually are not included.","These statements typically appear in the **Storage and Disposal** section of the label or under headings such as Important, Note, or General Instructions.","Examples include the following."]},{"list":["Store herbicides away from fertilizers, insecticides, fungicides, seeds, and feed items.","Store at temperatures above **32°F (0°C)**.","Nonrefillable container. Do not reuse or refill this container.","Do not contaminate water, food, or feed by storage or disposal.","**Triple rinse** container promptly after emptying.","Offer for recycling if available or reconditioning if appropriate or puncture and dispose of in a sanitary landfill."]},{"p":["If necessary, seek sound advice to determine the best storage and disposal procedures for your operation and location."]},{"h":"Directions for use"},{"p":["The **Directions for Use** section provides instructions on how to use the product, as in Figure 3.1.","These instructions cover the following."]},{"list":["The pests that the manufacturer claims the product will control.","The crop, animal, or site the product is intended to protect.","The proper **mixing** instructions.","How much to use, the **rate**, and how often.","How close to harvest the product can be applied.","**Phytotoxicity**, meaning damage to plants, and other possible injury.","Where and when the material should be applied.","Plant-back, composting, grazing, and other restrictions.","How to minimize drift."]}],"figures":[],"questions":[{"id":"c03-s17-r7","src":"review","kind":"mc","q":"Directions for mixing and loading a pesticide are usually found under:","choices":["Directions for use.","Environmental hazards.","Precautionary statements."],"answer":0,"ref":"p. 41, 'Directions for Use'; p. 47, Review question 7","why":"Directions for Use covers the proper mixing instructions."},{"id":"c03-s17-t1","kind":"mc","q":"What does phytotoxicity mean?","choices":["Toxicity to fish","Damage to plants","Toxicity to humans by inhalation","Breakdown of a pesticide in sunlight"],"answer":1,"ref":"p. 41, 'Directions for Use'","why":"Phytotoxicity is damage to plants.","src":"test"},{"id":"c03-s17-t2","kind":"mc","q":"Why do labels usually NOT include specific disposal instructions?","choices":["EPA forbids them","State and local laws may vary considerably","Disposal is covered only on the SDS","Manufacturers do not know how to dispose of their products"],"answer":1,"ref":"p. 41, 'Storage and Disposal'","why":"State and local laws vary considerably, so specific instructions usually are not included.","src":"test"},{"id":"c03-s17-t3","kind":"mc","q":"You just emptied a nonrefillable container. Following the label examples, what should you do with it?","choices":["Reuse it for water","Triple rinse it promptly, then offer it for recycling or reconditioning, or puncture it and dispose of it in a sanitary landfill","Burn it on site","Return it full of rinsate to the dealer"],"answer":1,"ref":"p. 41, 'Storage and Disposal'","why":"Triple rinse promptly, then recycle, recondition, or puncture and landfill.","style":"scenario","src":"test"},{"id":"c03-s17-t4","kind":"mc","q":"Which of these is NOT listed as something the Directions for Use cover?","choices":["The pests the product will control","How close to harvest it can be applied","How to minimize drift","The name and address of the manufacturer"],"answer":3,"ref":"p. 41, 'Directions for Use'","why":"Name and address of the manufacturer is a separate label part.","style":"not","src":"test"}]},{"id":"c03-s18","chapter":"Chapter 3 · Pesticide Labeling","title":"Figure 3.1 sample label, part 1: the front panel","pages":[42,42],"body":[{"p":["Figure 3.1 is a sample pesticide label, adapted from the MSU Pesticide Applicator Core Training Manual.","The product is fictional. This card types out its center panel. Find each label part you have learned so far."]},{"box":"Restricted use pesticide","p":["Due to very high toxicity to humans and birds.","For retail sale to and use only by certified applicators or persons under their direct supervision and only for those uses covered by the certified applicator's certificate."]},{"box":"VIP No Pest Gel","list":["Active ingredient: galactothion (0,0-diethyl methyl phosphorothiate), 20.9%.","Related isomers, 1.1%.","Inert ingredients, 78.00%.","Total, 100.00%.","Net contents: 5 gallons.","EPA Reg. No. 12345-10.","EPA Est. 56787-CO-1.","VIP Chemical Company, 2527 VIP Drive, Biarspond, MI 22315."]},{"p":["When handlers use closed systems, enclosed cabs, or aircraft in a manner that meets the requirements listed in the Worker Protection Standard (WPS) for agricultural pesticides, 40 CFR 170.240(d)(4-6), the handler PPE requirements may be reduced or modified as specified in the WPS."]},{"box":"User safety recommendations","p":["Users should wash hands before eating, drinking, chewing gum, using tobacco, or using the toilet.","Remove clothing immediately if pesticide gets inside. Then wash thoroughly and put on clean clothing.","Remove PPE immediately after handling this product. Wash the outside of the gloves before removing."]},{"box":"Environmental hazards","p":["This pesticide is highly toxic to aquatic invertebrates and wildlife.","Birds in treated areas may be killed.","Shrimp and other aquatic organisms may be killed at recommended application rates.","Do not contaminate water by cleaning of equipment or disposal of wastes."]},{"box":"Physical and chemical hazards","p":["Do not use or store near heat or open flame. Not for use or storage in or around the home."]},{"box":"Keep out of reach of children","p":["DANGER. PELIGRO. POISON, with the skull and crossbones.","Si Usted no entiende la etiqueta, busque a alguien para se la explique a Usted en detalle. That means: if you do not understand this label, find someone to explain it to you in detail."]},{"box":"Storage and disposal","p":["Prohibitions: Do not contaminate water, food or feed by storage or disposal. Do not store under conditions which might adversely affect the container or its ability to function properly.","Storage: Do not store below temperature of 0°F.","Container disposal: Never reuse empty containers. Triple rinse (or equivalent). Then offer for recycling or reconditioning, or puncture and dispose of in a sanitary landfill, or by other procedure approved by state and local authorities."]}],"figures":[],"questions":[{"id":"c03-s18-t1","kind":"mc","q":"On the Figure 3.1 sample label, what is the common name of the active ingredient?","choices":["VIP No Pest Gel","Galactothion","0,0-diethyl methyl phosphorothiate","VIP Chemical Company"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, ingredient statement","why":"Galactothion is the common name; the name in parentheses is the chemical name; VIP No Pest Gel is the brand name.","src":"test"},{"id":"c03-s18-t2","kind":"mc","q":"Which signal word does the Figure 3.1 sample label carry?","choices":["CAUTION","WARNING","DANGER, POISON, with skull and crossbones, and PELIGRO","No signal word"],"answer":2,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Keep Out of Reach of Children' panel","why":"The sample label shows DANGER, PELIGRO, POISON, and the skull and crossbones.","src":"test"},{"id":"c03-s18-t3","kind":"mc","q":"On the sample label, which number identifies the facility that made the product?","choices":["EPA Reg. No. 12345-10","EPA Est. 56787-CO-1","40 CFR 170.240","22315"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42; p. 37, 'Establishment Number'","why":"The EPA establishment number identifies the production facility.","src":"test"},{"id":"c03-s18-t4","kind":"mc","q":"Which of these is NOT true of the sample label's restricted-use statement?","choices":["It gives the reason as very high toxicity to humans and birds","It limits sale and use to certified applicators or persons under their direct supervision","It limits use to uses covered by the applicator's certificate","It says any adult may buy the product"],"answer":3,"ref":"Figure 3.1, sample pesticide label, p. 42, restricted use box","why":"Restricted-use products are not for sale to anyone; that is the point of the statement.","style":"not","src":"test"},{"id":"c03-s18-t5","kind":"mc","q":"Your storage shed for this sample product drops to minus 5°F in winter. According to its label, is that a problem?","choices":["No, the label has no temperature limit","Yes, the label says do not store below 0°F","No, it only says to store above 32°F","Yes, the label says do not store below 50°F"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Storage and Disposal' panel","why":"The sample label says do not store below a temperature of 0°F.","style":"scenario","src":"test"}]},{"id":"c03-s19","chapter":"Chapter 3 · Pesticide Labeling","title":"Figure 3.1 sample label, part 2: first aid and note to physician","pages":[42,42],"body":[{"box":"Statement of practical treatment","p":["Contact a doctor (physician), clinic, or hospital immediately in cases of suspected poisoning. Explain that the victim has been exposed to galactothion and describe his or her condition.","After first aid is given take victim to clinic or hospital. If breathing has stopped, start artificial respiration immediately and maintain until doctor sees victim.","If swallowed: If patient is conscious and alert, give 2 or 3 glasses of water or milk to drink, and induce vomiting by touching back of throat with finger. Do not induce vomiting or give anything by mouth to an unconscious person. Get medical attention.","If on skin: Immediately flush the skin with plenty of water while removing contaminated clothing and shoes. See doctor immediately. Galactothion is an organophosphate pesticide that inhibits cholinesterase.","If inhaled: Remove to fresh air. If not breathing give artificial respiration. Get medical attention.","If in eyes: Hold eyelids open and flush with a steady stream of water for at least 15 minutes. Get medical attention."]},{"box":"Note to physician","p":["Antidote: administer **atropine** di-sulfate in large doses. Two to four mg intravenously or intramuscularly as soon as cyanosis is overcome. Repeat at 5 to 10 minute intervals until signs of atropinization appear.","**2-PAM chloride** is also antidotal and may be administered in conjunction with atropine. Do not give morphine or tranquilizers.","Galactothion is a strong cholinesterase inhibitor affecting the central and peripheral nervous system and producing cardiac and respiratory depression.","At first sign of pulmonary edema, the patient should be given supplemental oxygen and treated symptomatically.","Continued absorption of the poison may occur and fatal relapses have been reported after initial improvement. Very close supervision of the patient is indicated for at least **48 hours**."]}],"figures":[],"questions":[{"id":"c03-s19-t1","kind":"mc","q":"According to the sample label's note to physician, what is the antidote for galactothion poisoning?","choices":["Morphine","Atropine, with 2-PAM chloride also antidotal","Tranquilizers","Milk and egg whites"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Note to Physician'","why":"Atropine is the antidote; 2-PAM chloride may be given with it; morphine and tranquilizers must not be given.","src":"test"},{"id":"c03-s19-t2","kind":"mc","q":"A worker swallowed the sample product and is unconscious. What does the label say?","choices":["Give 2 or 3 glasses of milk and induce vomiting","Do not induce vomiting or give anything by mouth; get medical attention","Give water only","Wait 48 hours and watch for symptoms"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Statement of Practical Treatment'","why":"Never induce vomiting or give anything by mouth to an unconscious person.","style":"scenario","src":"test"},{"id":"c03-s19-t3","kind":"mc","q":"How long does the sample label say the poisoned patient needs very close supervision?","choices":["At least 12 hours","At least 24 hours","At least 48 hours","At least 72 hours"],"answer":2,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Note to Physician'","why":"Fatal relapses can occur, so close supervision is indicated for at least 48 hours.","src":"test"},{"id":"c03-s19-t4","kind":"mc","q":"Which of these is NOT allowed according to the sample label's note to physician?","choices":["Atropine","2-PAM chloride given with atropine","Supplemental oxygen at the first sign of pulmonary edema","Morphine or tranquilizers"],"answer":3,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Note to Physician'","why":"The note says do not give morphine or tranquilizers.","style":"not","src":"test"},{"id":"c03-s19-t5","kind":"tf","q":"On the sample label, flushing eyes for at least 15 minutes is the first aid for pesticide in the eyes.","answer":true,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Statement of Practical Treatment'","why":"Hold eyelids open and flush with a steady stream of water for at least 15 minutes.","src":"test"}]},{"id":"c03-s20","chapter":"Chapter 3 · Pesticide Labeling","title":"Figure 3.1 sample label, part 3: hazards to humans and PPE","pages":[42,42],"body":[{"box":"Precautionary statements: hazards to humans (and domestic animals)","p":["DANGER: Fatal if absorbed through skin, fatal if swallowed, and poisonous if inhaled. Do not breathe vapors or spray mist. Do not get on skin or clothing. May be irritating to eyes and may cause mild skin sensitization. Keep away from domestic animals. Discontinue use if allergic reaction occurs.","Signs and symptoms of overexposure: salivation, muscle tremors, nausea, watery eyes, difficulty breathing, vomiting, pinpoint eye pupils, excessive sweating, diarrhea, blurred vision, abdominal cramps, weakness, headache."]},{"box":"Personal protective equipment (PPE)","p":["Some materials that are chemical resistant to this product are listed below. If you want more options, follow the instructions for category G on an EPA chemical resistance category selection chart.","Applicators and other handlers must wear the following."],"list":["Coveralls over long-sleeve shirt and long pants.","Chemical-resistant gloves such as barrier laminate or vitron.","Chemical-resistant footwear plus socks.","Protective eyewear.","Chemical-resistant headgear for overhead exposures.","Chemical-resistant apron when cleaning equipment, mixing, or loading.","Respirator with either an organic vapor-removing cartridge with a prefilter approved for pesticides (MSHA/NIOSH approval prefix TC-23C) or a canister approved for pesticides (MSHA/NIOSH approval number prefix TC-14G).","Discard clothing and other absorbent materials that have been drenched or heavily contaminated with this product's concentrate. Do not reuse them. Follow manufacturer's instructions for cleaning and maintaining PPE. If no such instructions for washables, use detergent and hot water. Keep and wash PPE separately from other laundry."]}],"figures":[],"questions":[{"id":"c03-s20-t1","kind":"mc","q":"Which of these is NOT listed as a sign or symptom of overexposure on the sample label?","choices":["Pinpoint eye pupils","Excessive sweating","Salivation","Dilated eye pupils"],"answer":3,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Precautionary Statements'","why":"The label lists pinpoint pupils, not dilated pupils.","style":"not","src":"test"},{"id":"c03-s20-t2","kind":"mc","q":"According to the sample label, which applicators and handlers must wear a chemical-resistant apron?","choices":["Everyone at all times","Those cleaning equipment, mixing, or loading","Only aerial applicators","No one; aprons are optional"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Personal Protective Equipment'","why":"The apron is required when cleaning equipment, mixing, or loading.","src":"test"},{"id":"c03-s20-t3","kind":"mc","q":"A handler's cotton work gloves got drenched with this product's concentrate. What does the sample label say to do?","choices":["Wash them with detergent and hot water and reuse them","Discard them; do not reuse them","Rinse them in the spray tank","Let them dry in the sun and reuse them"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Personal Protective Equipment'","why":"Discard clothing and absorbent materials drenched or heavily contaminated with the concentrate.","style":"scenario","src":"test"},{"id":"c03-s20-t4","kind":"mc","q":"Which routes of entry does the DANGER statement on the sample label say are fatal or poisonous?","choices":["Skin only","Swallowing only","Skin, swallowing, and inhaling","Eyes only"],"answer":2,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Precautionary Statements'","why":"Fatal if absorbed through skin, fatal if swallowed, and poisonous if inhaled.","src":"test"},{"id":"c03-s20-t5","kind":"tf","q":"The sample label says to keep and wash PPE separately from other laundry.","answer":true,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Personal Protective Equipment'","why":"Keep and wash PPE separately from other laundry.","src":"test"}]},{"id":"c03-s21","chapter":"Chapter 3 · Pesticide Labeling","title":"Figure 3.1 sample label, part 4: directions and agricultural use","pages":[42,42],"body":[{"box":"Directions for use","p":["It is a violation of Federal law to use this product in a manner inconsistent with its labeling.","Do not apply this product in a way that will contact workers or other persons, either directly or through drift.","Only protected handlers may be in the area during application.","For any requirements specific to your State or Tribe, consult the agency responsible for pesticide regulation."]},{"box":"General directions","p":["Spray preparation: To assure a uniform product, agitate or shake all containers of this product prior to use. Use 50 mesh screens or equivalent slotted strainers in spray system.","To prepare for spraying, fill tank to one half the needed volume of water. Add the required amount of this insecticide and mix thoroughly by mechanical or hydraulic agitation. Finish filling tank with water to desired volume and thoroughly mix.","Do not store spray mixture for prolonged periods. If tank mixes are to be used, VIP Pest-No must be fully dispersed in water first, followed by addition of the intended tank-mix material. Do not use mixtures that curdle, precipitate or become greasy.","Note: Do not add VIP No Pest to water with pH values below 3.0 or above 8.5."]},{"box":"Directions for aerial or ground spray application","p":["Application timing: Begin application when insect populations reach economic threshold levels. Consult the Extension Service, professional consultants or other qualified authorities to determine appropriate threshold levels for treatment in your area.","Application instructions: Apply a minimum finished spray volume of 2 gallons per acre by air or 5 gallons per acre by ground unless otherwise directed under crop specific directions.","For best results, it is important to obtain thorough and uniform spray coverage of the plant. Use higher dosage rates for heavy infestations, large larvae, or dense foliage. The specific length of control depends on environmental factors, plant growth, dosage rate, and degree of insect infestation."]},{"box":"Agricultural use requirements","p":["Use this product only in accordance with its labeling and with the Worker Protection Standard, 40 CFR part 170. The requirements in this box only apply to uses of this product that are covered by the Worker Protection Standard.","Do not enter or allow worker entry into treated areas during the restricted-entry interval (REI) of **48 hours**. The REI is **72 hours** in outdoor areas where the average annual rainfall is less than 25 inches a year.","PPE required for early entry to treated areas that is permitted under the Worker Protection Standard and that involves contact with anything that has been treated, such as plants, soil, or water, is: coveralls over long-sleeved shirt and long pants; chemical-resistant footwear plus socks; protective eyewear; chemical-resistant headgear.","Notify workers of the application by warning them orally and by posting warning signs at entrances to treated area."]}],"figures":[],"questions":[{"id":"c03-s21-t1","kind":"mc","q":"What is the restricted-entry interval on the sample label, in an area that gets 40 inches of rain a year?","choices":["12 hours","24 hours","48 hours","72 hours"],"answer":2,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Agricultural Use Requirements'","why":"The REI is 48 hours; it rises to 72 hours only where annual rainfall is under 25 inches.","src":"test"},{"id":"c03-s21-t2","kind":"mc","q":"You are applying the sample product outdoors in a dry region with 15 inches of rain a year. What is the REI?","choices":["12 hours","48 hours","72 hours","No REI applies"],"answer":2,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Agricultural Use Requirements'","why":"The REI is 72 hours where average annual rainfall is less than 25 inches.","style":"scenario","src":"test"},{"id":"c03-s21-t3","kind":"mc","q":"How does the sample label say to fill the spray tank?","choices":["Add the insecticide to an empty tank, then add water","Fill the tank to one half the needed water, add the insecticide and mix, then finish filling with water","Fill the tank completely, then add the insecticide","Premix the insecticide with oil first"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'General Directions'","why":"Fill to half with water, add product and agitate, then finish filling and mix.","src":"test"},{"id":"c03-s21-t4","kind":"mc","q":"Which of these is NOT allowed by the sample label's directions?","choices":["Using 50 mesh screens in the spray system","Adding the product to water with a pH of 9.0","Beginning application when insects reach economic threshold levels","Applying at least 5 gallons per acre by ground"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'General Directions'","why":"Do not add the product to water with pH below 3.0 or above 8.5.","style":"not","src":"test"},{"id":"c03-s21-t5","kind":"mc","q":"What is the minimum finished spray volume by air on the sample label?","choices":["1 gallon per acre","2 gallons per acre","5 gallons per acre","10 gallons per acre"],"answer":1,"ref":"Figure 3.1, sample pesticide label, p. 42, 'Directions for Aerial or Ground Spray Application'","why":"2 gallons per acre by air, 5 gallons per acre by ground.","src":"test"}]},{"id":"c03-s22","chapter":"Chapter 3 · Pesticide Labeling","title":"Other label resources and web labeling","pages":[41,43],"body":[{"h":"Information resources"},{"p":["Many terms used on labels describe when and how to use pesticides.","Technical terms also appear in leaflets and bulletins from local Cooperative Extension offices, land-grant universities, state and federal pesticide regulatory agencies, pesticide manufacturers, and professional pest management associations.","Your understanding of these terms will help you get the best results from pesticide applications.","Refer to the glossary in this manual.","If you do not understand the directions on a label, check with any of these sources."]},{"h":"World Wide Web references on pesticide labels"},{"p":["A pesticide label may refer you to a **website** for additional use instructions or precautions.","This means that all of the information necessary to use the pesticide may no longer be found on the pesticide container.","This information is **binding**, so it is your responsibility as an applicator to seek and obtain it.","If the website address has changed or is no longer available, you must **contact the manufacturer** and acquire the referenced material **before making an application**."]},{"h":"Digital pesticide specimen labels"},{"p":["Many websites allow the downloading of sample or **specimen** pesticide labels.","Such sites include EPA; state, tribe, or territory regulatory agencies; Cooperative Extension Service; registrants; publishing firms; and consulting companies, among others.","While the information found on these sites can be useful and may help clarify use instructions, **you are still bound by the labeling found on and with your pesticide container**."]},{"h":"Electronic or web-distributed labeling"},{"p":["Regulatory agencies are considering significant changes to what constitutes the official pesticide label that an applicator must follow to comply with federal and state use laws.","The agencies recognize that it may be desirable and useful to provide a legally binding label on the container and refer applicators to an official Internet site for the most up-to-date and customizable use directions.","As a result, manufacturers are now able to develop **web-distributed labeling**.","However, concerns about liability, unfamiliarity with a new system of labeling, and quickly evolving technology mean that changes may occur slowly.","If you encounter web-distributed labeling, you must carefully follow the instructions on and with the container as well as the instructions obtained from an **EPA-approved website**."]}],"figures":[],"questions":[{"id":"c03-s22-t1","kind":"mc","q":"A label refers you to a website for more use instructions, but the web address no longer works. What must you do?","choices":["Apply using only what is on the container","Contact the manufacturer and get the referenced material before applying","Use a specimen label from any website","Skip the missing instructions since they are advisory"],"answer":1,"ref":"p. 43, 'World Wide Web References on Pesticide Labels'","why":"The web information is binding; contact the manufacturer and get it before applying.","style":"scenario","src":"test"},{"id":"c03-s22-t2","kind":"tf","q":"Information on a website that a label refers you to is binding.","answer":true,"ref":"p. 43, 'World Wide Web References on Pesticide Labels'","why":"It is binding, so it is your responsibility to seek and obtain it.","src":"test"},{"id":"c03-s22-t3","kind":"mc","q":"You download a specimen label that differs from the label on your container. Which one are you bound by?","choices":["The specimen label, because it is newer","The labeling found on and with your pesticide container","Whichever is less restrictive","Neither; EPA decides"],"answer":1,"ref":"p. 43, 'Digital Pesticide Specimen Labels'","why":"You are still bound by the labeling found on and with your container.","src":"test"},{"id":"c03-s22-t4","kind":"mc","q":"Which of these is NOT given as a reason web-distributed labeling changes may occur slowly?","choices":["Concerns about liability","Unfamiliarity with a new system of labeling","Quickly evolving technology","A federal ban on internet labels"],"answer":3,"ref":"p. 43, 'Electronic or Web-Distributed Labeling'","why":"The manual names liability, unfamiliarity, and evolving technology.","style":"not","src":"test"}]},{"id":"c03-s23","chapter":"Chapter 3 · Pesticide Labeling","title":"Mandatory and advisory statements","pages":[43,44],"body":[{"h":"Mandatory and advisory statements"},{"p":["Statements on pesticide labels may be either mandatory or advisory.","Label statements that you **must follow** in order to legally use the pesticide are **mandatory statements**.","Recommendations or best management practices that the manufacturer has determined may result in better product performance or improved safety are **advisory statements**."]},{"h":"Mandatory statements"},{"p":["Mandatory statements direct the user to take or avoid specific actions.","The directions and precautions specify where, when, and how a pesticide is to be applied.","Mandatory statements are generally written in **imperative or directive** sentences, for example, Do not use.","These statements are meant to ensure the proper use of a pesticide and prevent unreasonable harm to the environment.","Examples include the following."]},{"list":["Wear chemical-resistant gloves.","If swallowed, call a doctor.","Do not apply within 66 feet of wells.","Keep away from heat, sparks, and open flame.","Apply immediately after mixing."]},{"h":"Advisory statements"},{"p":["Advisory statements provide information on product characteristics and how to maximize safety and efficacy.","Such statements cannot conflict with mandatory statements, must not be false or misleading, or otherwise violate statutory or regulatory provisions.","Advisory statements are written in **descriptive or nondirective** terms."]},{"p":["The use of words such as **should, may, or recommend** in advisory statements is carefully screened by EPA to clarify that such statements do not have to be followed.","However, these words might also imply that a prohibited practice is still permitted.","In other words, users could infer that a particular use is permitted because a statement recommending against such a use does not have to be followed.","EPA allows the use of should, may, recommend, or similar terms on a case-by-case basis as long as they are unambiguous and do not appear to cause these kinds of problems.","A preferred advisory statement usually explains the **purpose or benefit** of doing something instead of asserting that it should be done without explanation."]},{"p":["These are examples of hypothetical advisory statements."]},{"list":["Latex gloves provide the best protection.","Opening aluminum phosphide containers near an exhaust fan or other ventilation helps to ensure that the gas will be rapidly dispersed if the product flashes.","If application is delayed after preparing a tank mix, agitation to re-mix the products ensures proper blending.","Treatment along one side of interior partition walls where there are cracks in the slab or plumbing entry points prevents further infestation.","Directing the spray mixture around the base of the cotton plants and using leaf lifters and shields on application equipment will help minimize foliage contact and plant injury.","If an emulsifiable formulation has been used, flushing the sprayer with a detergent solution at the end of the workday will help to ensure a clean sprayer and trouble-free operation."]}],"figures":[],"questions":[{"id":"c03-s23-r8","src":"review","kind":"mc","q":"\"If swallowed, call a doctor\" is an example of what kind of statement?","choices":["Routes of entry.","Advisory.","Mandatory."],"answer":2,"ref":"p. 43, 'Mandatory Statements'; p. 47, Review question 8","why":"It is listed as an example of a mandatory statement."},{"id":"c03-s23-t1","kind":"mc","q":"How are mandatory statements generally written?","choices":["In descriptive or nondirective terms","In imperative or directive sentences","Only in capital letters","As questions"],"answer":1,"ref":"p. 43, 'Mandatory Statements'","why":"Mandatory statements are imperative or directive, such as Do not use.","src":"test"},{"id":"c03-s23-t2","kind":"mc","q":"A label says, \"Do not apply within 66 feet of wells.\" Your well is 50 feet from the site. What is true?","choices":["It is advice, so you may apply","It is a mandatory statement, so applying there is illegal","It applies only to restricted-use products","It only matters if the well is used for drinking"],"answer":1,"ref":"p. 43, 'Mandatory Statements'","why":"It is listed as a mandatory statement; you must follow it to use the pesticide legally.","style":"scenario","src":"test"},{"id":"c03-s23-t3","kind":"mc","q":"Which of these is NOT a mandatory statement example from the manual?","choices":["Wear chemical-resistant gloves.","Keep away from heat, sparks, and open flame.","Apply immediately after mixing.","Latex gloves provide the best protection."],"answer":3,"ref":"pp. 43 to 44, 'Mandatory Statements' and 'Advisory Statements'","why":"Latex gloves provide the best protection is a hypothetical advisory statement.","style":"not","src":"test"},{"id":"c03-s23-t4","kind":"mc","q":"What does a preferred advisory statement usually do?","choices":["States that something should be done, with no reason","Explains the purpose or benefit of doing something","Overrides a mandatory statement","Uses the word must"],"answer":1,"ref":"p. 44, 'Advisory Statements'","why":"A preferred advisory statement explains the purpose or benefit.","src":"test"}]},{"id":"c03-s24","chapter":"Chapter 3 · Pesticide Labeling","title":"Understanding the difference, and your liability","pages":[44,44],"body":[{"h":"Understanding the difference"},{"p":["Because intermingling advisory and mandatory language may cause confusion and uncertainty, EPA directs manufacturers to **clearly separate** advisory and mandatory label statements.","Section headings must be appropriate for the information that follows.","For example, if a heading includes the term **recommended**, everything in that section must be **purely advisory**.","If separation is not practical, the manufacturer must make sure it is clear that the intent of each statement is either mandatory or advisory."]},{"p":["Until the separation of advisory and mandatory statements is fully implemented, you will find older products with seemingly contradictory statements.","When this occurs, consult with your **state lead regulatory agency**, or other pesticide regulatory body, for clarification."]},{"p":["The label provides a wealth of information.","As explained above, failure to follow the instructions on a pesticide label can cause a serious pesticide accident.","It may also constitute a legal violation subject to **civil or criminal prosecution**.","Always remember that **the label is a legal document**.","**You are liable** for any personal injury, crop or site damage, or pollution that occurs through the misuse of a pesticide."]}],"figures":[],"questions":[{"id":"c03-s24-t1","kind":"mc","q":"A label section heading includes the word recommended. What must be true of everything in that section?","choices":["It must be mandatory","It must be purely advisory","It must be about PPE","It must be approved by the state"],"answer":1,"ref":"p. 44, 'Understanding the Difference'","why":"If a heading includes recommended, everything in that section must be purely advisory.","src":"test"},{"id":"c03-s24-t2","kind":"mc","q":"An older product's label seems to contradict itself between advisory and mandatory statements. Who should you consult?","choices":["The store clerk","Your state lead regulatory agency or other pesticide regulatory body","A neighbor who used the product","Nobody; follow whichever statement is easier"],"answer":1,"ref":"p. 44, 'Understanding the Difference'","why":"Consult your state lead regulatory agency for clarification.","style":"scenario","src":"test"},{"id":"c03-s24-t3","kind":"mc","q":"Which of these is NOT something the manual says you are liable for through misuse of a pesticide?","choices":["Personal injury","Crop or site damage","Pollution","Pest resistance in another county"],"answer":3,"ref":"p. 44, 'Understanding the Difference'","why":"You are liable for personal injury, crop or site damage, or pollution caused by misuse.","style":"not","src":"test"},{"id":"c03-s24-t4","kind":"tf","q":"Failing to follow label instructions may be a legal violation subject to civil or criminal prosecution.","answer":true,"ref":"p. 44, 'Understanding the Difference'","why":"The manual says it may constitute a legal violation subject to civil or criminal prosecution.","src":"test"}]},{"id":"c03-s25","chapter":"Chapter 3 · Pesticide Labeling","title":"Safety Data Sheets and chapter summary","pages":[44,45],"body":[{"h":"Safety Data Sheets"},{"p":["**Safety Data Sheets**, formerly called **Material Safety Data Sheets**, provide more details about specific chemical and physical properties than do pesticide labels.","**Pesticide manufacturers** are required to develop and provide upon request an SDS for each product.","Commercial establishments are required to keep SDSs and make them available to workers or others who may contact the substance, its diluted end product, or its residues."]},{"p":["Unlike the FIFRA label, which is designed specifically for the pesticide end user, that is, the applicator, the SDS is a document regulated by the **Occupational Safety and Health Administration (OSHA)** and designed for use by multiple professionals, for example manufacturers, transporters, medical personnel, and firefighters.","Thus, the SDS contains more detailed and technical information than the label about the pesticide's chemical and physical properties, toxicological and ecological information, first aid procedures, and emergency response.","You should use the SDS in conjunction with the pesticide label to provide a better understanding of the product.","**Never use it in place of the label!**"]},{"p":["In **2012**, the naming and formatting of SDSs were radically changed to adhere to international treaties.","As a result, the SDS of a pesticide product **may have a different signal word** than the label and will include **pictograms** not found on the label.","**Section 15**, the regulatory section of the SDS, specifies what is on the pesticide label.","Appendix D describes the elements of an SDS."]},{"box":"Safety Data Sheet sections","ol":["Identification","Hazard(s) identification","Composition/information on ingredients","First aid measures","Firefighting measures","Accidental release measures","Handling and storage","Exposure controls/personal protection","Physical and chemical properties","Stability and reactivity","Toxicological information","Ecological information","Disposal considerations","Transport information","Regulatory information","Other information"]},{"h":"Summary"},{"p":["Pesticide label language is strictly regulated by EPA in coordination with state regulatory agencies.","It is your responsibility as an applicator to read, understand, and follow label directions.","Make sure the pesticide has both federal and state registration for its intended use.","Identify both the trade and common names of the chemical you are using, and be familiar with the product's active ingredients.","Signal words and symbols help you recognize how acutely toxic the pesticide is to humans.","Applicators are advised to follow best management practices that may not be on the label, such as leaving a **buffer zone** between the treated area and sensitive sites.","Pesticide labels in combination with Safety Data Sheets provide a wealth of information on the hazards associated with each pesticide. Carefully review these documents before applying any pesticide."]}],"figures":[],"questions":[{"id":"c03-s25-r9","src":"review","kind":"mc","q":"Who is responsible for developing SDSs for pesticides and providing them on request?","choices":["EPA.","OSHA.","The product manufacturer."],"answer":2,"ref":"p. 44, 'Safety Data Sheets'; p. 47, Review question 9","why":"Pesticide manufacturers must develop and provide an SDS for each product on request."},{"id":"c03-s25-t1","kind":"mc","q":"Which agency regulates the Safety Data Sheet?","choices":["EPA","OSHA","USDA","The state Department of Agriculture"],"answer":1,"ref":"p. 45, 'Safety Data Sheets'","why":"The SDS is regulated by the Occupational Safety and Health Administration.","src":"test"},{"id":"c03-s25-t2","kind":"mc","q":"The SDS for a product shows a different signal word than its label. What explains this?","choices":["One of them is a counterfeit","The 2012 changes to SDS naming and formatting to follow international treaties","The SDS is always out of date","The label must be wrong"],"answer":1,"ref":"p. 45, 'Safety Data Sheets'","why":"Since 2012, an SDS may have a different signal word than the label and include pictograms.","style":"scenario","src":"test"},{"id":"c03-s25-t3","kind":"mc","q":"Which SDS section specifies what is on the pesticide label?","choices":["Section 2, Hazard identification","Section 8, Exposure controls","Section 15, Regulatory information","Section 16, Other information"],"answer":2,"ref":"p. 45, 'Safety Data Sheets'","why":"Section 15, the regulatory section, specifies what is on the label.","src":"test"},{"id":"c03-s25-t4","kind":"mc","q":"Which of these is NOT true about the SDS?","choices":["It has more detailed technical information than the label","It should be used together with the label","It can be used in place of the label","It is designed for several kinds of professionals, such as firefighters"],"answer":2,"ref":"p. 45, 'Safety Data Sheets'","why":"Never use the SDS in place of the label.","style":"not","src":"test"}]},{"id":"practice","practice":true,"chapter":"Practice card","title":"How this study tool works","pages":null,"photos":[],"body":[{"p":["This card is practice. It is **not** from your manual, and it does not count toward your progress.","Press **Play** to hear it read in a Claude voice.","The **yellow highlight** follows the voice, word by word.","Tap any sentence to start reading from that spot."]},{"h":"How you pass"},{"p":["After each card, you get a quiz, one question at a time.","The manual's own review questions come first.","Then come new questions written like the real test, including scenario questions and **NOT** questions.","You pass a card only at **100 percent**."]},{"h":"How misses work"},{"p":["Every question you miss comes back later in the session.","It comes back again next session.","It stays on your weak list until you get it right **twice in a row**."]},{"h":"How a session runs"},{"list":["Each session starts with a **5-question rapid round** from old cards.","Then you study the next card and take its quiz.","Each session ends with what you mastered, what you are weak on, and what is next."]},{"fig":"loop"}],"figures":[{"id":"loop","title":"Figure: The study loop","photo":null,"svg":"<svg viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"Rapid round, then study card, then quiz, then pass at 100 percent or retake\"><g font-family=\"var(--f-display)\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\"><rect class=\"f-card\" x=\"6\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"71\" y=\"79\">RAPID ROUND<\/text><rect class=\"f-card\" x=\"170\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"235\" y=\"79\">STUDY CARD<\/text><rect class=\"f-card\" x=\"334\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\"/><text class=\"f-ink\" x=\"399\" y=\"79\">QUIZ<\/text><rect class=\"f-ok\" x=\"498\" y=\"18\" width=\"136\" height=\"50\" rx=\"8\"/><text class=\"f-on\" x=\"566\" y=\"50\">100% = PASS<\/text><rect class=\"f-bad\" x=\"498\" y=\"82\" width=\"136\" height=\"50\" rx=\"8\"/><text class=\"f-on\" x=\"566\" y=\"114\">MISS = RETAKE<\/text><\/g><g class=\"f-arrow\" stroke-width=\"3\" fill=\"none\"><path d=\"M138 72h26\"/><path d=\"M302 72h26\"/><path d=\"M466 64l26-20\"/><path d=\"M466 80l26 20\"/><\/g><\/svg>","explain":["The loop is simple: rapid round, study card, quiz.","A perfect quiz passes the card. Any miss means you retake it."]}],"terms":[{"term":"Weak list","def":"Questions you missed that you have not yet answered right twice in a row."},{"term":"Rapid round","def":"Five quick questions from old cards at the start of every session."}],"questions":[{"id":"practice-q1","src":"test","kind":"mc","q":"What score do you need to pass a card?","choices":["80 percent","90 percent","100 percent","70 percent"],"answer":2,"ref":"Practice card, 'How you pass'","why":"Anything under 100 percent is a fail."},{"id":"practice-q2","src":"test","kind":"tf","q":"A missed question leaves your weak list after you answer it right once.","answer":false,"ref":"Practice card, 'How misses work'","why":"You have to get it right twice in a row."},{"id":"practice-q3","src":"test","kind":"mc","style":"not","q":"Which of these is NOT part of a study session?","choices":["A 5-question rapid round from old cards","A quiz after each card","A timed two-hour mock exam","A summary of what you mastered and what is weak"],"answer":2,"ref":"Practice card, 'How a session runs'","why":"Sessions are rapid round, cards, quizzes, and a summary. There is no timed mock exam."},{"id":"practice-q4","src":"test","kind":"short","q":"Type it: how many times in a row must you get a missed question right to clear it?","answer":"twice","accept":["2","two","two times","2 times","twice in a row","two in a row"],"ref":"Practice card, 'How misses work'","why":"Twice in a row clears it."}]}]}</script>
<script>
(() => {
'use strict';

/* ================= content ================= */
const C = JSON.parse(document.getElementById('content').textContent);
const SECTIONS = C.sections || [];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const REAL = SECTIONS.filter(s => !s.practice);
const Q = {};
for (const s of SECTIONS) for (const q of (s.questions || [])) Q[q.id] = Object.assign({ sid: s.id }, q);
const DEADLINE = new Date((C.manual?.deadline || '2027-01-11') + 'T00:00:00');
const DAILY_GOAL = 25;
const RANKS = [[0,'Trainee'],[250,'Apprentice'],[750,'Technician'],[1600,'Field Tech'],[3000,'Lead Applicator'],[5000,'License Ready']];

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => String(s ?? '').replace(/\*\*/g, '');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Number(n || 0).toLocaleString('en-US');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LET = 'ABCDEF';
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const pagesLabel = s => !s.pages ? '' : (s.pages[0] === s.pages[1] || s.pages.length === 1 ? 'p. ' + s.pages[0] : 'pp. ' + s.pages[0] + '–' + s.pages[1]);

const ICON = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};

/* ================= profile + storage ================= */
const LS_KEY = 'pas-profile-v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function blank() { return { v: 1, updatedAt: 0, xp: 0, bestCombo: 0, days: {}, passed: {}, attempts: {}, q: {}, sessions: [], settings: { voice: 'buttery', rate: 1, sound: true } }; }
function normalize(p) {
  const b = blank();
  if (!p || typeof p !== 'object') return b;
  for (const k of Object.keys(b)) if (p[k] === undefined || p[k] === null) p[k] = b[k];
  p.settings = Object.assign(b.settings, p.settings || {});
  if (!Array.isArray(p.sessions)) p.sessions = [];
  return p;
}
let P = normalize(lsGet(LS_KEY));
let profRef = null, sync = 'local', dirty = false, saving = false, saveT = null;

function save() {
  P.updatedAt = Date.now();
  lsSet(LS_KEY, P);
  dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(flush, 700);
}
async function flush() {
  if (!profRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await profRef.set(JSON.parse(JSON.stringify(P))); sync = 'synced'; }
  catch (e) { dirty = true; sync = e && e.code === 'quota_exceeded' ? 'full' : 'error'; }
  saving = false;
  renderFoot();
  if (dirty && sync === 'synced') saveT = setTimeout(flush, 700);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

async function initDb() {
  if (!window.claude || !claude.use) return;
  sync = 'loading'; renderFoot();
  let slow = setTimeout(() => { if (sync === 'loading') { sync = 'slow'; renderFoot(); } }, 10000);
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(slow); sync = 'local'; renderFoot(); return; }
    profRef = db.doc('data/users/' + id + '/profile');
    const snap = await profRef.get();
    clearTimeout(slow);
    if (snap.exists) {
      const remote = normalize(JSON.parse(JSON.stringify(snap.data())));
      if ((remote.updatedAt || 0) >= (P.updatedAt || 0)) { P = remote; lsSet(LS_KEY, P); resumeSession(); }
      else { dirty = true; }
    } else if (P.updatedAt) { dirty = true; }
    sync = 'synced';
    if (dirty) flush();
    if (S.view === 'home') render(); else { renderChips(); renderFoot(); }
  } catch (e) { clearTimeout(slow); sync = 'error'; renderFoot(); }
}

/* ================= derived stats ================= */
const qs = id => P.q[id] || (P.q[id] = { seen: 0, right: 0, wrong: 0, run: 0, open: false, last: 0 });
const today = () => P.days[dayKey()] || (P.days[dayKey()] = { a: 0, c: 0, xp: 0 });
function dayStreak() {
  let n = 0; const d = new Date();
  if (!(P.days[dayKey(d)] && P.days[dayKey(d)].a)) d.setDate(d.getDate() - 1);
  while (P.days[dayKey(d)] && P.days[dayKey(d)].a) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const isReal = qid => Q[qid] && SEC[Q[qid].sid] && !SEC[Q[qid].sid].practice;
const openMisses = () => Object.keys(P.q).filter(id => P.q[id].open && isReal(id)).sort((a, b) => (P.q[a].last || 0) - (P.q[b].last || 0));
function rank(xp = P.xp) {
  let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k;
  const next = RANKS[i + 1];
  return { name: RANKS[i][1], next: next ? next[1] : null, frac: next ? (xp - RANKS[i][0]) / (next[0] - RANKS[i][0]) : 1, need: next ? next[0] - xp : 0 };
}
function daysLeft() { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.max(0, Math.round((DEADLINE - t) / 864e5)); }
function secStatus(s) {
  if (P.passed[s.id]) return 'pass';
  if (P.attempts[s.id] && P.attempts[s.id].n) return 'fail';
  return 'new';
}
const nextSection = () => REAL.find(s => !P.passed[s.id]) || null;
function manualProgress() {
  const total = C.manual && C.manual.totalPages;
  const passedN = REAL.filter(s => P.passed[s.id]).length;
  if (total) {
    const byPage = {};
    for (const s of REAL) if (s.pages) for (let p = s.pages[0]; p <= (s.pages[1] || s.pages[0]); p++) { (byPage[p] = byPage[p] || []).push(s.id); }
    const done = Object.keys(byPage).filter(p => byPage[p].every(id => P.passed[id])).length;
    return { frac: done / total, text: done + ' of ' + total + ' manual pages passed', passedN, pagesDone: done, total };
  }
  return { frac: REAL.length ? passedN / REAL.length : 0, text: passedN + ' of ' + REAL.length + ' cards passed', passedN, total: null };
}

/* ================= session ================= */
const S = { view: 'home', sid: null, quiz: null, result: null, combo: 0, sess: null };
function resumeSession() {
  const now = Date.now();
  for (const x of P.sessions) if (!x.end && now - (x.touch || x.start) > 3 * 3600e3) x.end = x.touch || x.start;
  S.sess = P.sessions.find(x => !x.end) || null;
}
resumeSession();
function touchSess() { if (S.sess) S.sess.touch = Date.now(); }
function startSession() {
  if (!REAL.length) { toast('No manual pages loaded yet. Try the practice card while you wait.'); openSection('practice'); return; }
  S.sess = { id: 's' + Date.now(), start: Date.now(), touch: Date.now(), end: null, a: 0, c: 0, xp: 0, best: 0, passed: [], cleared: [], failed: [], missed: [], studied: [], rapid: null };
  P.sessions.unshift(S.sess);
  P.sessions = P.sessions.slice(0, 60);
  save();
  const pool = rapidPool();
  if (pool.length) startQuiz('rapid', null, pool.slice(0, 5));
  else { toast('No old cards yet, so no rapid round. Straight to studying.'); goNext(); }
}
function endSession() {
  Reader.stop();
  if (!S.sess) { go('home'); return; }
  S.sess.end = Date.now();
  save(); flush();
  S.summary = S.sess; S.sess = null; S.quiz = null;
  go('summary');
}
function goNext() {
  const n = nextSection();
  if (n) openSection(n.id);
  else if (openMisses().length) startQuiz('drill', null, openMisses().slice(0, 15));
  else { toast(REAL.length ? 'Every loaded card is passed. Send Claude your next pages.' : 'No manual pages loaded yet. Send Claude photos of your pages.'); go('home'); }
}
function rapidPool() {
  const studied = REAL.filter(s => P.attempts[s.id] && P.attempts[s.id].n);
  const all = []; for (const s of studied) for (const q of s.questions) all.push(q.id);
  const last = id => (P.q[id] && P.q[id].last) || 0;
  const open = shuffle(all.filter(id => P.q[id] && P.q[id].open)).sort((a, b) => last(a) - last(b));
  const rest = shuffle(all.filter(id => !(P.q[id] && P.q[id].open))).sort((a, b) => last(a) - last(b));
  return [...open, ...rest];
}

/* ================= quiz engine ================= */
function startQuiz(mode, sid, ids) {
  Reader.stop();
  if (!ids.length) { toast('No questions here yet.'); return; }
  S.quiz = { mode, sid, items: ids.map(id => ({ id, retry: false })), i: 0, first: {}, reins: {}, cur: null };
  prepCur();
  go('quiz');
}
function sectionQuizIds(s) {
  const qsx = s.questions || [];
  return [...qsx.filter(q => q.src === 'review').map(q => q.id), ...shuffle(qsx.filter(q => q.src !== 'review')).map(q => q.id)];
}
function prepCur() {
  const it = S.quiz.items[S.quiz.i];
  const q = Q[it.id];
  let order = null;
  if (q.kind === 'mc') { order = q.choices.map((_, k) => k); if (!q.fixed) order = shuffle(order); }
  S.quiz.cur = { id: it.id, retry: it.retry, order, picked: null, typed: '', result: null, grading: false };
}
function record(ok, extra) {
  const quiz = S.quiz, cur = quiz.cur, q = Q[cur.id];
  const practice = !isReal(cur.id);
  const rBefore = rank().name;
  let gain = 0, cleared = false, broke = 0;
  if (ok) { S.combo++; gain = 10 + Math.min(S.combo - 1, 5) * 2; }
  else { broke = S.combo; S.combo = 0; }
  if (!practice) {
    const st = qs(cur.id); st.seen++; st.last = Date.now();
    if (ok) { st.right++; st.run++; if (st.open && st.run >= 2) { st.open = false; cleared = true; gain += 25; if (S.sess) S.sess.cleared.push(cur.id); } }
    else { st.wrong++; st.run = 0; st.open = true; if (S.sess && !S.sess.missed.includes(cur.id)) S.sess.missed.push(cur.id); }
    const d = today(); d.a++; if (ok) d.c++; d.xp += gain;
    P.xp += gain; P.bestCombo = Math.max(P.bestCombo, S.combo);
    if (S.sess) { S.sess.a++; if (ok) S.sess.c++; S.sess.xp += gain; S.sess.best = Math.max(S.sess.best, S.combo); touchSess(); }
    save();
  }
  if (!cur.retry && quiz.first[cur.id] === undefined) quiz.first[cur.id] = ok;
  if (!ok) {
    const n = quiz.reins[cur.id] || 0;
    if (n < 3) { quiz.reins[cur.id] = n + 1; const pos = Math.min(quiz.items.length, quiz.i + 4); quiz.items.splice(pos, 0, { id: cur.id, retry: true }); }
  }
  cur.result = Object.assign({ ok, gain, cleared, broke, practice }, extra || {});
  beep(ok ? 'ok' : 'bad');
  render();
  bumpChips();
  if (cleared) toast('Cleared from your weak list: right twice in a row. +25 XP');
  const rAfter = rank().name;
  if (!practice && rAfter !== rBefore) setTimeout(() => toast('Rank up: ' + rAfter), cleared ? 1800 : 0);
}
function pick(k) {
  const cur = S.quiz && S.quiz.cur; if (!cur || cur.result) return;
  const q = Q[cur.id];
  if (q.kind === 'mc') { cur.picked = k; record(k === q.answer); }
  else if (q.kind === 'tf') { cur.picked = k; record(k === q.answer); }
}
async function submitShort() {
  const cur = S.quiz && S.quiz.cur; if (!cur || cur.result || cur.grading) return;
  const inp = $('#short-in'); const text = (inp ? inp.value : '').trim();
  if (!text) { toast('Type an answer first.'); return; }
  cur.typed = text; cur.grading = true; render();
  const g = await gradeShort(Q[cur.id], text);
  if (S.quiz && S.quiz.cur === cur) { cur.grading = false; record(g.ok, { why2: g.why, by: g.by }); }
}
function nextQ() {
  const quiz = S.quiz; if (!quiz || !quiz.cur || !quiz.cur.result) return;
  quiz.i++;
  if (quiz.i >= quiz.items.length) return finishQuiz();
  prepCur(); render();
  const f = $('#short-in'); if (f) f.focus();
}
function finishQuiz() {
  const quiz = S.quiz;
  const ids = Object.keys(quiz.first);
  const right = ids.filter(id => quiz.first[id]).length, total = ids.length, score = pct(right, total);
  const missed = ids.filter(id => !quiz.first[id]);
  const res = { mode: quiz.mode, sid: quiz.sid, right, total, score, missed, firstPass: false };
  const practice = quiz.sid && SEC[quiz.sid] && SEC[quiz.sid].practice;
  if (quiz.mode === 'section' && !practice) {
    const sid = quiz.sid;
    const at = P.attempts[sid] || (P.attempts[sid] = { n: 0, best: 0, last: 0 });
    at.n++; at.best = Math.max(at.best, score); at.last = score;
    if (score === 100) {
      if (!P.passed[sid]) { P.passed[sid] = { at: Date.now(), tries: at.n }; P.xp += 50; today().xp += 50; if (S.sess) S.sess.xp += 50; res.firstPass = true; }
      if (S.sess && !S.sess.passed.includes(sid)) S.sess.passed.push(sid);
    } else if (S.sess && !S.sess.failed.includes(sid)) S.sess.failed.push(sid);
    save();
  }
